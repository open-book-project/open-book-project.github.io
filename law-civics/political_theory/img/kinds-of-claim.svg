<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Descriptive, explanatory and normative claims, and how a policy conclusion combines them" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<g text-anchor="middle">
<rect x="30" y="30" width="250" height="190" rx="12" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="155" y="62" font-size="20" font-weight="bold" fill="#2b4a73">Descriptive</text>
<text x="155" y="92" font-size="15" fill="#1f2a38">What is the case?</text>
<text x="155" y="130" font-size="13" fill="#1f2a38">"Turnout among young</text>
<text x="155" y="148" font-size="13" fill="#1f2a38">voters was low."</text>
<text x="155" y="196" font-size="13" font-style="italic" fill="#2b4a73">Tested by observation</text>
<rect x="325" y="30" width="250" height="190" rx="12" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="450" y="62" font-size="20" font-weight="bold" fill="#1f5a35">Explanatory</text>
<text x="450" y="92" font-size="15" fill="#1f2a38">Why is it the case?</text>
<text x="450" y="130" font-size="13" fill="#1f2a38">"Registration rules</text>
<text x="450" y="148" font-size="13" fill="#1f2a38">deter first-time voters."</text>
<text x="450" y="196" font-size="13" font-style="italic" fill="#1f5a35">Tested by evidence about causes</text>
<rect x="620" y="30" width="250" height="190" rx="12" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="745" y="62" font-size="20" font-weight="bold" fill="#6b4a05">Normative</text>
<text x="745" y="92" font-size="15" fill="#1f2a38">What ought to be?</text>
<text x="745" y="130" font-size="13" fill="#1f2a38">"Every adult should find</text>
<text x="745" y="148" font-size="13" fill="#1f2a38">it easy to vote."</text>
<text x="745" y="196" font-size="13" font-style="italic" fill="#6b4a05">Tested by argument about values</text>
<rect x="250" y="300" width="400" height="80" rx="12" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<text x="450" y="333" font-size="18" font-weight="bold" fill="#3f2a63">Policy conclusion</text>
<text x="450" y="358" font-size="13" fill="#1f2a38">"Registration rules should be simplified."</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M155 222L330 296"/>
<path d="M450 222L450 296"/>
<path d="M745 222L570 296"/>
</g>
<text x="450" y="408" font-size="12.5" fill="#5b6b7f" text-anchor="middle">A conclusion about what should be done needs facts and at least one normative premise.</text>
</svg>
