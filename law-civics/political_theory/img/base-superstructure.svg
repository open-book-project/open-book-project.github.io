<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Marx's base and superstructure" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<polygon points="200,170 700,170 640,40 260,40" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<text x="450" y="72" font-size="19" font-weight="bold" fill="#3f2a63" text-anchor="middle">Superstructure</text>
<text x="450" y="100" font-size="14" fill="#1f2a38" text-anchor="middle">law · the state · politics</text>
<text x="450" y="122" font-size="14" fill="#1f2a38" text-anchor="middle">religion · philosophy · art · ideas</text>
<rect x="120" y="250" width="660" height="120" rx="8" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="450" y="276" font-size="19" font-weight="bold" fill="#6b4a05" text-anchor="middle">Economic base (mode of production)</text>
<rect x="145" y="292" width="290" height="62" rx="8" fill="#ffffff" stroke="#a8730c"/>
<text x="290" y="316" font-size="14" font-weight="bold" fill="#1f2a38" text-anchor="middle">Forces of production</text>
<text x="290" y="337" font-size="12.5" fill="#1f2a38" text-anchor="middle">tools, machines, technology, labour</text>
<rect x="465" y="292" width="290" height="62" rx="8" fill="#ffffff" stroke="#a8730c"/>
<text x="610" y="316" font-size="14" font-weight="bold" fill="#1f2a38" text-anchor="middle">Relations of production</text>
<text x="610" y="337" font-size="12.5" fill="#1f2a38" text-anchor="middle">ownership; who works for whom</text>
<path d="M420 245V180" stroke="#5b6b7f" stroke-width="7" fill="none" marker-end="url(#ar)"/>
<path d="M500 180V240" stroke="#5b6b7f" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<text x="390" y="218" font-size="13" fill="#1f2a38" text-anchor="end">shapes</text>
<text x="520" y="218" font-size="13" fill="#1f2a38">reinforces</text>
<text x="450" y="392" font-size="12.5" fill="#5b6b7f" text-anchor="middle">For Engels the economic base was decisive only "in the last instance"; ideas and politics also act back on it.</text>
</svg>
