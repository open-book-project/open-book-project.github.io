<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Negative liberty as a protected sphere free of interference, and positive liberty as self-mastery supported by capacities" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker>
<marker id="stop" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0V10" stroke="#a33" stroke-width="3"/></marker></defs>
<line x1="450" y1="30" x2="450" y2="380" stroke="#d6d0c2" stroke-width="2"/>
<text x="225" y="40" font-size="20" font-weight="bold" fill="#2b4a73" text-anchor="middle">Negative liberty</text>
<text x="225" y="62" font-size="13.5" fill="#1f2a38" text-anchor="middle">freedom from interference</text>
<circle cx="225" cy="215" r="105" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2.5"/>
<circle cx="225" cy="190" r="16" fill="#2b2440"/>
<path d="M225 206V250M225 220L205 238M225 220L245 238M225 250L210 280M225 250L240 280" stroke="#2b2440" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="225" y="160" font-size="12.5" fill="#2b4a73" text-anchor="middle">protected private sphere</text>
<g font-size="13" fill="#1f2a38">
<rect x="30" y="92" width="80" height="30" rx="6" fill="#f4f4f4" stroke="#8a97a8"/><text x="70" y="112" text-anchor="middle">censor</text>
<rect x="340" y="92" width="80" height="30" rx="6" fill="#f4f4f4" stroke="#8a97a8"/><text x="380" y="112" text-anchor="middle">state</text>
<rect x="30" y="310" width="80" height="30" rx="6" fill="#f4f4f4" stroke="#8a97a8"/><text x="70" y="330" text-anchor="middle">others</text>
</g>
<g stroke="#a33" stroke-width="2.5" fill="none" marker-end="url(#stop)">
<path d="M100 124L140 150"/>
<path d="M350 124L310 150"/>
<path d="M100 310L140 285"/>
</g>
<text x="225" y="370" font-size="13" fill="#1f2a38" text-anchor="middle">Free to the extent that no one deliberately interferes</text>
<text x="675" y="40" font-size="20" font-weight="bold" fill="#6b4a05" text-anchor="middle">Positive liberty</text>
<text x="675" y="62" font-size="13.5" fill="#1f2a38" text-anchor="middle">freedom as self-mastery</text>
<g font-size="13" fill="#1f2a38" text-anchor="middle">
<rect x="490" y="100" width="110" height="34" rx="8" fill="#fdf1d6" stroke="#a8730c"/><text x="545" y="122">education</text>
<rect x="490" y="160" width="110" height="34" rx="8" fill="#fdf1d6" stroke="#a8730c"/><text x="545" y="182">health</text>
<rect x="490" y="220" width="110" height="34" rx="8" fill="#fdf1d6" stroke="#a8730c"/><text x="545" y="242">resources</text>
<rect x="490" y="280" width="110" height="34" rx="8" fill="#fdf1d6" stroke="#a8730c"/><text x="545" y="302">a voice in rule</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M602 117L690 190"/>
<path d="M602 177L686 200"/>
<path d="M602 237L686 220"/>
<path d="M602 297L690 232"/>
</g>
<circle cx="730" cy="210" r="42" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2.5"/>
<text x="730" y="206" font-size="13" font-weight="bold" fill="#1f5a35" text-anchor="middle">self-</text>
<text x="730" y="223" font-size="13" font-weight="bold" fill="#1f5a35" text-anchor="middle">direction</text>
<path d="M772 210H850" stroke="#2f7a4a" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="812" y="198" font-size="12" fill="#1f5a35" text-anchor="middle">own path</text>
<text x="675" y="370" font-size="13" fill="#1f2a38" text-anchor="middle">Free to the extent that one governs one's own life</text>
<text x="450" y="408" font-size="12.5" fill="#5b6b7f" text-anchor="middle">Republicans add a third idea: freedom as not living under another's arbitrary power.</text>
</svg>
