<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Rawls's original position: parties behind the veil of ignorance choose the principles of justice" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker>
<pattern id="veil" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e9e3f3"/><path d="M0 10L10 0" stroke="#cfc3e3" stroke-width="2"/></pattern></defs>
<text x="160" y="36" font-size="18" font-weight="bold" fill="#1f2a38" text-anchor="middle">The parties</text>
<g fill="#2b2440">
<circle cx="90" cy="110" r="15"/><rect x="77" y="128" width="26" height="55" rx="8"/>
<circle cx="160" cy="110" r="15"/><rect x="147" y="128" width="26" height="55" rx="8"/>
<circle cx="230" cy="110" r="15"/><rect x="217" y="128" width="26" height="55" rx="8"/>
</g>
<g font-size="13" fill="#1f2a38">
<text x="40" y="225" font-weight="bold">They know:</text>
<text x="40" y="246">general facts of economics,</text>
<text x="40" y="264">politics and psychology;</text>
<text x="40" y="282">that society is a scheme of</text>
<text x="40" y="300">cooperation under scarcity</text>
</g>
<rect x="300" y="50" width="200" height="330" rx="6" fill="url(#veil)" stroke="#5a3f86" stroke-width="2"/>
<text x="400" y="80" font-size="17" font-weight="bold" fill="#3f2a63" text-anchor="middle">Veil of ignorance</text>
<g font-size="13.5" fill="#1f2a38" text-anchor="middle">
<text x="400" y="110" font-style="italic">hides from them</text>
<text x="400" y="145">their class and status</text>
<text x="400" y="175">their natural talents</text>
<text x="400" y="205">their sex</text>
<text x="400" y="235">their race or caste</text>
<text x="400" y="265">their religion</text>
<text x="400" y="295">their idea of the</text>
<text x="400" y="313">good life</text>
<text x="400" y="350">their generation</text>
</g>
<path d="M505 215H560" stroke="#5b6b7f" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="725" y="36" font-size="18" font-weight="bold" fill="#1f2a38" text-anchor="middle">The principles chosen</text>
<g text-anchor="middle">
<rect x="575" y="60" width="300" height="80" rx="10" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="725" y="88" font-size="15" font-weight="bold" fill="#2b4a73">1. Equal basic liberties</text>
<text x="725" y="112" font-size="13" fill="#1f2a38">speech, conscience, vote, person,</text>
<text x="725" y="129" font-size="13" fill="#1f2a38">fair trial, personal property</text>
<rect x="575" y="170" width="300" height="80" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="725" y="198" font-size="15" font-weight="bold" fill="#1f5a35">2(a) Fair equality of opportunity</text>
<text x="725" y="222" font-size="13" fill="#1f2a38">positions open to all, with equal</text>
<text x="725" y="239" font-size="13" fill="#1f2a38">chances for equal talent and effort</text>
<rect x="575" y="280" width="300" height="80" rx="10" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="725" y="308" font-size="15" font-weight="bold" fill="#6b4a05">2(b) Difference principle</text>
<text x="725" y="332" font-size="13" fill="#1f2a38">inequalities only if they benefit</text>
<text x="725" y="349" font-size="13" fill="#1f2a38">the least advantaged</text>
</g>
<g stroke="#8a97a8" stroke-width="1.5" stroke-dasharray="4 3"><line x1="725" y1="142" x2="725" y2="168"/><line x1="725" y1="252" x2="725" y2="278"/></g>
<text x="450" y="415" font-size="12.5" fill="#5b6b7f" text-anchor="middle">The principles are ranked in lexical order: 1 before 2(a), and 2(a) before 2(b).</text>
</svg>
