<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="A timeline of Indian political thought from ancient times to the Constitution of 1950" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="380" fill="#ffffff"/>
<line x1="40" y1="190" x2="860" y2="190" stroke="#5b6b7f" stroke-width="3"/>
<line x1="250" y1="175" x2="250" y2="205" stroke="#ffffff" stroke-width="10"/>
<text x="250" y="196" font-size="16" fill="#5b6b7f" text-anchor="middle">//</text>
<g text-anchor="middle">
<rect x="40" y="40" width="190" height="120" rx="10" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="135" y="66" font-size="16" font-weight="bold" fill="#6b4a05">Ancient</text>
<text x="135" y="90" font-size="12.5" fill="#1f2a38">Vedic sabhā and samiti</text>
<text x="135" y="108" font-size="12.5" fill="#1f2a38">gaṇa-saṅghas; Buddhist texts</text>
<text x="135" y="126" font-size="12.5" fill="#1f2a38">dharmaśāstras</text>
<text x="135" y="144" font-size="12.5" fill="#1f2a38">Kauṭilya's Arthaśāstra</text>
<rect x="270" y="220" width="210" height="120" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="375" y="246" font-size="16" font-weight="bold" fill="#1f5a35">Nineteenth century</text>
<text x="375" y="270" font-size="12.5" fill="#1f2a38">Rammohun Roy (1772–1833)</text>
<text x="375" y="288" font-size="12.5" fill="#1f2a38">Jyotirao Phule (1827–1890)</text>
<text x="375" y="306" font-size="12.5" fill="#1f2a38">Savitribai Phule (1831–1897)</text>
<text x="375" y="324" font-size="12.5" fill="#1f2a38">Pandita Ramabai (1858–1922)</text>
</g>
<g font-size="13" fill="#1f2a38">
<rect x="520" y="30" width="330" height="140" rx="10" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="685" y="56" font-size="16" font-weight="bold" fill="#2b4a73" text-anchor="middle">Twentieth century</text>
<text x="540" y="82">Rabindranath Tagore (1861–1941)</text>
<text x="540" y="104">Mohandas K. Gandhi (1869–1948)</text>
<text x="540" y="126">Jawaharlal Nehru (1889–1964)</text>
<text x="540" y="148">B. R. Ambedkar (1891–1956)</text>
</g>
<g>
<circle cx="135" cy="190" r="8" fill="#a8730c"/>
<circle cx="375" cy="190" r="8" fill="#2f7a4a"/>
<circle cx="685" cy="190" r="8" fill="#2b4a73"/>
<circle cx="820" cy="190" r="10" fill="#2b2440"/>
</g>
<line x1="135" y1="160" x2="135" y2="182" stroke="#a8730c" stroke-width="2"/>
<line x1="375" y1="198" x2="375" y2="220" stroke="#2f7a4a" stroke-width="2"/>
<line x1="685" y1="170" x2="685" y2="182" stroke="#2b4a73" stroke-width="2"/>
<g text-anchor="middle" font-size="13" fill="#1f2a38">
<text x="135" y="215">to c. 300 CE</text>
<text x="685" y="215">national movement</text>
<text x="820" y="232" font-weight="bold">1950</text>
<text x="820" y="250">Constitution</text>
<text x="820" y="268">of India</text>
</g>
<text x="450" y="370" font-size="12.5" fill="#5b6b7f" text-anchor="middle">Not to scale: the break marks a gap of many centuries between ancient and modern thought.</text>
</svg>
