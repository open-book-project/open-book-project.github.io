<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="A spectrum of models of state and religion, from theocracy to laïcité" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<text x="450" y="32" font-size="17" font-weight="bold" fill="#1f2a38" text-anchor="middle">How closely is the state tied to religion?</text>
<line x1="40" y1="70" x2="860" y2="70" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<line x1="860" y1="70" x2="40" y2="70" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<text x="45" y="58" font-size="12.5" fill="#5b6b7f">state identified with religion</text>
<text x="855" y="58" font-size="12.5" fill="#5b6b7f" text-anchor="end">religion kept out of public institutions</text>
<g text-anchor="middle">
<rect x="20" y="95" width="160" height="160" rx="10" fill="#f6e8e8" stroke="#8a3b3b" stroke-width="2"/>
<text x="100" y="123" font-size="16" font-weight="bold" fill="#6b2a2a">Theocracy</text>
<text x="100" y="150" font-size="12.5" fill="#1f2a38">Religious authorities</text>
<text x="100" y="167" font-size="12.5" fill="#1f2a38">rule; religious law</text>
<text x="100" y="184" font-size="12.5" fill="#1f2a38">is state law</text>
<rect x="195" y="95" width="160" height="160" rx="10" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="275" y="123" font-size="16" font-weight="bold" fill="#6b4a05">Established</text>
<text x="275" y="141" font-size="16" font-weight="bold" fill="#6b4a05">religion</text>
<text x="275" y="167" font-size="12.5" fill="#1f2a38">One religion has official</text>
<text x="275" y="184" font-size="12.5" fill="#1f2a38">status; others may be</text>
<text x="275" y="201" font-size="12.5" fill="#1f2a38">free or tolerated</text>
<rect x="370" y="95" width="160" height="160" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="450" y="123" font-size="16" font-weight="bold" fill="#1f5a35">Principled</text>
<text x="450" y="141" font-size="16" font-weight="bold" fill="#1f5a35">distance</text>
<text x="450" y="167" font-size="12.5" fill="#1f2a38">No state religion; may</text>
<text x="450" y="184" font-size="12.5" fill="#1f2a38">engage with all and</text>
<text x="450" y="201" font-size="12.5" fill="#1f2a38">intervene for equality</text>
<rect x="545" y="95" width="160" height="160" rx="10" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="625" y="123" font-size="16" font-weight="bold" fill="#2b4a73">Strict</text>
<text x="625" y="141" font-size="16" font-weight="bold" fill="#2b4a73">separation</text>
<text x="625" y="167" font-size="12.5" fill="#1f2a38">A "wall": no support</text>
<text x="625" y="184" font-size="12.5" fill="#1f2a38">for and no interference</text>
<text x="625" y="201" font-size="12.5" fill="#1f2a38">in religion</text>
<rect x="720" y="95" width="160" height="160" rx="10" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<text x="800" y="123" font-size="16" font-weight="bold" fill="#3f2a63">Laïcité</text>
<text x="800" y="150" font-size="12.5" fill="#1f2a38">Religion excluded from</text>
<text x="800" y="167" font-size="12.5" fill="#1f2a38">public institutions;</text>
<text x="800" y="184" font-size="12.5" fill="#1f2a38">civic neutrality</text>
<text x="275" y="240" font-size="12" font-style="italic" fill="#6b4a05">e.g. England</text>
<text x="450" y="240" font-size="12" font-style="italic" fill="#1f5a35">India</text>
<text x="625" y="240" font-size="12" font-style="italic" fill="#2b4a73">United States</text>
<text x="800" y="240" font-size="12" font-style="italic" fill="#3f2a63">France</text>
</g>
<rect x="370" y="270" width="510" height="2" fill="#2f7a4a"/>
<text x="625" y="292" font-size="13" fill="#1f5a35" text-anchor="middle">secular states: no established religion</text>
<text x="450" y="320" font-size="12" fill="#5b6b7f" text-anchor="middle">The order is simplified: the secular models differ in kind as well as in degree.</text>
</svg>
