<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="The international human rights framework from the UN Charter to the specialised conventions" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<g text-anchor="middle">
<rect x="330" y="20" width="240" height="56" rx="10" fill="#2b2440"/>
<text x="450" y="45" font-size="16" font-weight="bold" fill="#f6f1e7">UN Charter (1945)</text>
<text x="450" y="65" font-size="12.5" fill="#e0a84f">promote human rights for all</text>
<rect x="290" y="110" width="320" height="60" rx="10" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="450" y="136" font-size="16" font-weight="bold" fill="#6b4a05">Universal Declaration (1948)</text>
<text x="450" y="157" font-size="12.5" fill="#1f2a38">30 articles; not a treaty in itself</text>
<rect x="80" y="210" width="330" height="70" rx="10" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="245" y="238" font-size="15" font-weight="bold" fill="#2b4a73">Covenant on Civil and Political</text>
<text x="245" y="258" font-size="15" font-weight="bold" fill="#2b4a73">Rights (1966; in force 1976)</text>
<rect x="490" y="210" width="330" height="70" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="655" y="238" font-size="15" font-weight="bold" fill="#1f5a35">Covenant on Economic, Social and</text>
<text x="655" y="258" font-size="15" font-weight="bold" fill="#1f5a35">Cultural Rights (1966; in force 1976)</text>
</g>
<text x="450" y="300" font-size="12" fill="#5b6b7f" text-anchor="middle">with the Declaration: the International Bill of Human Rights</text>
<g stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M450 78V106"/>
<path d="M400 172L270 206"/>
<path d="M500 172L630 206"/>
<path d="M450 305V318"/>
</g>
<rect x="60" y="322" width="780" height="92" rx="10" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<text x="450" y="346" font-size="15" font-weight="bold" fill="#3f2a63" text-anchor="middle">Specialised conventions and institutions</text>
<g font-size="12.5" fill="#1f2a38" text-anchor="middle">
<text x="190" y="372">Genocide (1948)</text>
<text x="450" y="372">Racial Discrimination (1965)</text>
<text x="710" y="372">Women, CEDAW (1979)</text>
<text x="190" y="396">Torture (1984)</text>
<text x="450" y="396">Children (1989) · Disability (2006)</text>
<text x="710" y="396">International Criminal Court (1998/2002)</text>
</g>
<text x="450" y="450" font-size="12.5" fill="#5b6b7f" text-anchor="middle">Vienna Declaration (1993): all human rights are universal, indivisible, interdependent and interrelated.</text>
</svg>
