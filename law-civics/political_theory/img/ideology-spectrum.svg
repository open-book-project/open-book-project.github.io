<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The left-right spectrum of ideologies and a second libertarian-authoritarian axis" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
<linearGradient id="lr" x1="0" x2="1"><stop offset="0" stop-color="#c84b4b"/><stop offset="0.5" stop-color="#d9cfe6"/><stop offset="1" stop-color="#2b4a73"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker>
</defs>
<text x="450" y="30" font-size="17" font-weight="bold" fill="#1f2a38" text-anchor="middle">The left–right spectrum</text>
<rect x="50" y="70" width="800" height="22" rx="11" fill="url(#lr)"/>
<g font-size="13.5" fill="#1f2a38" text-anchor="middle">
<text x="90" y="62" font-weight="bold">Communism</text>
<text x="230" y="62" font-weight="bold">Socialism</text>
<text x="370" y="62" font-weight="bold">Social democracy</text>
<text x="510" y="62" font-weight="bold">Liberalism</text>
<text x="660" y="62" font-weight="bold">Conservatism</text>
<text x="800" y="62" font-weight="bold">New Right</text>
</g>
<g font-size="12.5" fill="#5b6b7f">
<text x="50" y="114">Left: equality, collective action,</text>
<text x="50" y="130">change of existing hierarchies</text>
<text x="850" y="114" text-anchor="end">Right: tradition, order, property,</text>
<text x="850" y="130" text-anchor="end">acceptance of some hierarchy</text>
</g>
<line x1="450" y1="160" x2="450" y2="380" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<line x1="450" y1="380" x2="450" y2="160" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<line x1="230" y1="270" x2="670" y2="270" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<line x1="670" y1="270" x2="230" y2="270" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<g font-size="13" fill="#1f2a38" text-anchor="middle">
<text x="450" y="152" font-weight="bold">Libertarian</text>
<text x="450" y="396" font-weight="bold">Authoritarian</text>
<text x="200" y="274" text-anchor="end">economic left</text>
<text x="700" y="274" text-anchor="start">economic right</text>
</g>
<g font-size="12.5" text-anchor="middle">
<circle cx="330" cy="200" r="6" fill="#c84b4b"/><text x="330" y="190" fill="#1f2a38">libertarian socialism</text>
<circle cx="580" cy="200" r="6" fill="#2b4a73"/><text x="580" y="190" fill="#1f2a38">libertarianism</text>
<circle cx="330" cy="345" r="6" fill="#c84b4b"/><text x="330" y="335" fill="#1f2a38">state socialism</text>
<circle cx="580" cy="345" r="6" fill="#2b4a73"/><text x="580" y="335" fill="#1f2a38">authoritarian nationalism</text>
</g>
<text x="760" y="330" font-size="12" fill="#5b6b7f" text-anchor="middle">A second axis separates</text>
<text x="760" y="346" font-size="12" fill="#5b6b7f" text-anchor="middle">attitudes to personal freedom</text>
<text x="760" y="362" font-size="12" fill="#5b6b7f" text-anchor="middle">from economic views.</text>
</svg>
