<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Marshall's three elements of citizenship on a timeline from 1700 to 2000" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<line x1="60" y1="290" x2="860" y2="290" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<g font-size="13" fill="#1f2a38" text-anchor="middle">
<line x1="100" y1="284" x2="100" y2="296" stroke="#5b6b7f" stroke-width="2"/><text x="100" y="314">1700</text>
<line x1="350" y1="284" x2="350" y2="296" stroke="#5b6b7f" stroke-width="2"/><text x="350" y="314">1800</text>
<line x1="600" y1="284" x2="600" y2="296" stroke="#5b6b7f" stroke-width="2"/><text x="600" y="314">1900</text>
<line x1="850" y1="284" x2="850" y2="296" stroke="#5b6b7f" stroke-width="2"/><text x="850" y="314">2000</text>
</g>
<rect x="100" y="60" width="290" height="56" rx="10" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="245" y="84" font-size="16" font-weight="bold" fill="#2b4a73" text-anchor="middle">Civil rights</text>
<text x="245" y="104" font-size="12.5" fill="#1f2a38" text-anchor="middle">liberty, property, contract, justice: the courts</text>
<rect x="330" y="135" width="330" height="56" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="495" y="159" font-size="16" font-weight="bold" fill="#1f5a35" text-anchor="middle">Political rights</text>
<text x="495" y="179" font-size="12.5" fill="#1f2a38" text-anchor="middle">vote and office: parliament, councils</text>
<rect x="580" y="210" width="270" height="56" rx="10" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="715" y="234" font-size="16" font-weight="bold" fill="#6b4a05" text-anchor="middle">Social rights</text>
<text x="715" y="254" font-size="12.5" fill="#1f2a38" text-anchor="middle">welfare, education: social services</text>
<text x="450" y="34" font-size="15" fill="#1f2a38" text-anchor="middle">Marshall's account of England: each element is added to the earlier ones</text>
<text x="450" y="345" font-size="12.5" fill="#5b6b7f" text-anchor="middle">The bars show the main period of development, not exact dates; women gained many of these rights later than men.</text>
</svg>
