<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="The four elements of the state: population, territory, government and sovereignty" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="470" fill="#ffffff"/>
<g stroke="#8a97a8" stroke-width="2">
<line x1="450" y1="225" x2="200" y2="95"/>
<line x1="450" y1="225" x2="700" y2="95"/>
<line x1="450" y1="225" x2="200" y2="345"/>
<line x1="450" y1="225" x2="700" y2="345"/>
</g>
<g text-anchor="middle">
<circle cx="450" cy="225" r="78" fill="#2b2440"/>
<text x="450" y="221" font-size="24" font-weight="bold" fill="#f6f1e7">The</text>
<text x="450" y="249" font-size="24" font-weight="bold" fill="#f6f1e7">state</text>
<rect x="60" y="40" width="280" height="110" rx="12" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="200" y="76" font-size="20" font-weight="bold" fill="#2b4a73">Population</text>
<text x="200" y="102" font-size="13.5" fill="#1f2a38">A permanent body of people;</text>
<text x="200" y="121" font-size="13.5" fill="#1f2a38">no minimum size</text>
<rect x="560" y="40" width="280" height="110" rx="12" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="700" y="76" font-size="20" font-weight="bold" fill="#1f5a35">Territory</text>
<text x="700" y="102" font-size="13.5" fill="#1f2a38">Land, air space and</text>
<text x="700" y="121" font-size="13.5" fill="#1f2a38">territorial waters</text>
<rect x="60" y="290" width="280" height="110" rx="12" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="200" y="326" font-size="20" font-weight="bold" fill="#6b4a05">Government</text>
<text x="200" y="352" font-size="13.5" fill="#1f2a38">The agency that makes, carries</text>
<text x="200" y="371" font-size="13.5" fill="#1f2a38">out and enforces the law</text>
<rect x="560" y="290" width="280" height="110" rx="12" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<text x="700" y="326" font-size="20" font-weight="bold" fill="#3f2a63">Sovereignty</text>
<text x="700" y="352" font-size="13.5" fill="#1f2a38">Internal: supreme within</text>
<text x="700" y="371" font-size="13.5" fill="#1f2a38">External: independent of others</text>
</g>
<text x="450" y="445" font-size="12.5" fill="#5b6b7f" text-anchor="middle">A province has the first three elements but not sovereignty; that is what makes it not a state.</text>
</svg>
