<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Weber's three types of authority at the corners of a triangle" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="440" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<polygon points="450,105 175,330 725,330" fill="#faf8f3" stroke="#c9c2b0" stroke-width="2"/>
<g text-anchor="middle">
<rect x="330" y="20" width="240" height="90" rx="12" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="450" y="52" font-size="19" font-weight="bold" fill="#6b4a05">Charismatic</text>
<text x="450" y="76" font-size="13" fill="#1f2a38">Devotion to a leader's</text>
<text x="450" y="94" font-size="13" fill="#1f2a38">exceptional qualities</text>
<rect x="40" y="310" width="260" height="90" rx="12" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="170" y="342" font-size="19" font-weight="bold" fill="#1f5a35">Traditional</text>
<text x="170" y="366" font-size="13" fill="#1f2a38">Sanctity of custom and</text>
<text x="170" y="384" font-size="13" fill="#1f2a38">inherited status</text>
<rect x="600" y="310" width="260" height="90" rx="12" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="730" y="342" font-size="19" font-weight="bold" fill="#2b4a73">Legal-rational</text>
<text x="730" y="366" font-size="13" fill="#1f2a38">Legality of rules; obedience</text>
<text x="730" y="384" font-size="13" fill="#1f2a38">owed to the office</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="6 4">
<path d="M380 115L230 300"/>
<path d="M520 115L670 300"/>
</g>
<g font-size="13" fill="#1f2a38">
<text x="200" y="200" text-anchor="end">routinised into</text>
<text x="200" y="217" text-anchor="end">hereditary succession</text>
<text x="700" y="200">routinised into</text>
<text x="700" y="217">offices and rules</text>
</g>
<text x="450" y="270" font-size="13" fill="#5b6b7f" text-anchor="middle">Real cases mix the types:</text>
<text x="450" y="288" font-size="13" fill="#5b6b7f" text-anchor="middle">they are ideal types</text>
<text x="450" y="428" font-size="12.5" fill="#5b6b7f" text-anchor="middle">Weber classified authority by the ground on which those who obey accept it as rightful.</text>
</svg>
