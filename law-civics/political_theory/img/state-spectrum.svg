<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="A spectrum of views on how much the state should do, from no state to a fully planned economy" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="300" fill="#ffffff"/>
<defs>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#e8f0fa"/><stop offset="1" stop-color="#2b4a73"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker>
</defs>
<text x="450" y="34" font-size="18" font-weight="bold" fill="#1f2a38" text-anchor="middle">How much should the state do?</text>
<rect x="50" y="120" width="800" height="26" rx="13" fill="url(#g)"/>
<line x1="60" y1="175" x2="840" y2="175" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<line x1="840" y1="175" x2="60" y2="175" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)"/>
<text x="60" y="198" font-size="13" fill="#5b6b7f">less</text>
<text x="840" y="198" font-size="13" fill="#5b6b7f" text-anchor="end">more</text>
<g fill="#2b2440"><circle cx="70" cy="133" r="8"/><circle cx="235" cy="133" r="8"/><circle cx="400" cy="133" r="8"/><circle cx="600" cy="133" r="8"/><circle cx="830" cy="133" r="8" fill="#e0a84f"/></g>
<g font-size="14" fill="#1f2a38" text-anchor="middle">
<text x="80" y="80" font-weight="bold">No state</text>
<text x="80" y="100">anarchism</text>
<text x="235" y="80" font-weight="bold">Nightwatchman</text>
<text x="235" y="100">libertarianism</text>
<text x="400" y="80" font-weight="bold">Limited state</text>
<text x="400" y="100">classical liberalism</text>
<text x="600" y="80" font-weight="bold">Welfare state</text>
<text x="600" y="100">social liberalism, social democracy</text>
<text x="805" y="80" font-weight="bold">Planned economy</text>
<text x="805" y="100">state socialism</text>
</g>
<g font-size="12.5" fill="#1f2a38" text-anchor="middle">
<text x="235" y="236">Defence, police, courts,</text>
<text x="235" y="253">contracts only</text>
<text x="400" y="236">Adds public goods such as</text>
<text x="400" y="253">roads and basic schooling</text>
<text x="600" y="236">Adds social insurance, health</text>
<text x="600" y="253">care, redistribution</text>
<text x="790" y="236">State owns and directs</text>
<text x="790" y="253">most production</text>
</g>
<text x="450" y="288" font-size="12" fill="#5b6b7f" text-anchor="middle">The positions are simplified; real views combine elements, and the scale says nothing about how democratic a state is.</text>
</svg>
