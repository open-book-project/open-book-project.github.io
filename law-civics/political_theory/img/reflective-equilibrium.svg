<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The cycle of reflective equilibrium between principles and considered judgements" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<g text-anchor="middle">
<rect x="40" y="140" width="240" height="100" rx="14" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="160" y="180" font-size="19" font-weight="bold" fill="#2b4a73">General principles</text>
<text x="160" y="206" font-size="13" fill="#1f2a38">"Maximise total happiness"</text>
<rect x="620" y="140" width="240" height="100" rx="14" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="740" y="180" font-size="19" font-weight="bold" fill="#6b4a05">Considered judgements</text>
<text x="740" y="206" font-size="13" fill="#1f2a38">"Punishing the innocent is wrong"</text>
<circle cx="450" cy="190" r="62" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<text x="450" y="186" font-size="16" font-weight="bold" fill="#3f2a63">Compare:</text>
<text x="450" y="206" font-size="14" fill="#3f2a63">do they fit?</text>
<text x="450" y="60" font-size="14" fill="#1f2a38">If they conflict, revise the principle ...</text>
<text x="450" y="340" font-size="14" fill="#1f2a38">... or revise the judgement</text>
<rect x="335" y="355" width="230" height="34" rx="8" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="1.5"/>
<text x="450" y="377" font-size="14" fill="#1f5a35">Repeat until they cohere</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M282 190H384"/>
<path d="M618 190H516"/>
<path d="M440 126C400 70 250 70 175 136"/>
<path d="M460 254C500 310 650 310 725 244"/>
</g>
</svg>
