<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="The seven limbs of the state in the Arthaśāstra" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="520" fill="#ffffff"/>
<circle cx="450" cy="265" r="175" fill="none" stroke="#d6d0c2" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="450" cy="265" r="70" fill="#2b2440"/>
<text x="450" y="260" font-size="18" font-weight="bold" fill="#f6f1e7" text-anchor="middle">The state</text>
<text x="450" y="284" font-size="14" fill="#e0a84f" text-anchor="middle">saptāṅga</text>
<g text-anchor="middle">
<!-- 7 nodes at angles -90 + k*360/7, radius 175 ; centre 450,265 -->
<rect x="370" y="52" width="160" height="72" rx="10" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="450" y="80" font-size="17" font-weight="bold" fill="#6b4a05">Svāmin</text>
<text x="450" y="103" font-size="12.5" fill="#1f2a38">the ruler</text>
<rect x="557" y="134" width="170" height="72" rx="10" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<text x="642" y="162" font-size="17" font-weight="bold" fill="#2b4a73">Amātya</text>
<text x="642" y="185" font-size="12.5" fill="#1f2a38">ministers, officials</text>
<rect x="604" y="284" width="180" height="72" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="694" y="312" font-size="17" font-weight="bold" fill="#1f5a35">Janapada</text>
<text x="694" y="335" font-size="12.5" fill="#1f2a38">territory and people</text>
<rect x="455" y="400" width="170" height="72" rx="10" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<text x="540" y="428" font-size="17" font-weight="bold" fill="#3f2a63">Durga</text>
<text x="540" y="451" font-size="12.5" fill="#1f2a38">fortified city</text>
<rect x="275" y="400" width="170" height="72" rx="10" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<text x="360" y="428" font-size="17" font-weight="bold" fill="#6b4a05">Kośa</text>
<text x="360" y="451" font-size="12.5" fill="#1f2a38">treasury</text>
<rect x="116" y="284" width="180" height="72" rx="10" fill="#f6e8e8" stroke="#8a3b3b" stroke-width="2"/>
<text x="206" y="312" font-size="17" font-weight="bold" fill="#6b2a2a">Daṇḍa</text>
<text x="206" y="335" font-size="12.5" fill="#1f2a38">army, coercive force</text>
<rect x="173" y="134" width="170" height="72" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="258" y="162" font-size="17" font-weight="bold" fill="#1f5a35">Mitra</text>
<text x="258" y="185" font-size="12.5" fill="#1f2a38">ally</text>
</g>
<text x="450" y="505" font-size="12.5" fill="#5b6b7f" text-anchor="middle">The limbs are listed in the text in this order, from the ruler to the ally; the health of the state depends on all of them.</text>
</svg>
