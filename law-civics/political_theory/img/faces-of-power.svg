<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Three nested dimensions of power: decision-making, agenda-setting and shaping preferences" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="460" fill="#ffffff"/>
<ellipse cx="300" cy="235" rx="270" ry="200" fill="#f3eef8" stroke="#5a3f86" stroke-width="2"/>
<ellipse cx="300" cy="260" rx="190" ry="140" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<ellipse cx="300" cy="285" rx="105" ry="75" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<g text-anchor="middle">
<text x="300" y="72" font-size="16" font-weight="bold" fill="#3f2a63">Third dimension</text>
<text x="300" y="92" font-size="13" fill="#3f2a63">shaping preferences</text>
<text x="300" y="152" font-size="16" font-weight="bold" fill="#6b4a05">Second dimension</text>
<text x="300" y="172" font-size="13" fill="#6b4a05">agenda-setting</text>
<text x="300" y="280" font-size="16" font-weight="bold" fill="#2b4a73">First dimension</text>
<text x="300" y="300" font-size="13" fill="#2b4a73">decision-making</text>
</g>
<g font-size="13.5" fill="#1f2a38">
<rect x="600" y="40" width="280" height="110" rx="10" fill="#ffffff" stroke="#5a3f86" stroke-width="1.5"/>
<text x="614" y="64" font-weight="bold" fill="#3f2a63">Lukes (1974)</text>
<text x="614" y="86">People are led not to want what</text>
<text x="614" y="104">is in their interests. No conflict</text>
<text x="614" y="122">appears at all.</text>
<rect x="600" y="170" width="280" height="110" rx="10" fill="#ffffff" stroke="#a8730c" stroke-width="1.5"/>
<text x="614" y="194" font-weight="bold" fill="#6b4a05">Bachrach and Baratz (1962)</text>
<text x="614" y="216">Issues are kept from being</text>
<text x="614" y="234">decided. Grievances exist but</text>
<text x="614" y="252">are hidden.</text>
<rect x="600" y="300" width="280" height="110" rx="10" fill="#ffffff" stroke="#2b4a73" stroke-width="1.5"/>
<text x="614" y="324" font-weight="bold" fill="#2b4a73">Dahl (1957, 1961)</text>
<text x="614" y="346">Who wins when preferences</text>
<text x="614" y="364">conflict over a decision?</text>
<text x="614" y="382">Conflict is visible.</text>
</g>
<text x="450" y="448" font-size="12.5" fill="#5b6b7f" text-anchor="middle">Each wider view includes the narrower ones and adds a less visible way of exercising power.</text>
</svg>
