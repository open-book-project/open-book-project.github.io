<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Vasak's three generations of human rights" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="400" fill="#ffffff"/>
<g text-anchor="middle">
<rect x="30" y="30" width="260" height="300" rx="12" fill="#e8f0fa" stroke="#2b4a73" stroke-width="2"/>
<rect x="30" y="30" width="260" height="70" rx="12" fill="#2b4a73"/>
<text x="160" y="60" font-size="18" font-weight="bold" fill="#ffffff">First generation</text>
<text x="160" y="84" font-size="14" fill="#ffffff">Liberty</text>
<text x="160" y="128" font-size="15" font-weight="bold" fill="#2b4a73">Civil and political</text>
<rect x="320" y="30" width="260" height="300" rx="12" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<rect x="320" y="30" width="260" height="70" rx="12" fill="#2f7a4a"/>
<text x="450" y="60" font-size="18" font-weight="bold" fill="#ffffff">Second generation</text>
<text x="450" y="84" font-size="14" fill="#ffffff">Equality</text>
<text x="450" y="128" font-size="15" font-weight="bold" fill="#1f5a35">Economic, social, cultural</text>
<rect x="610" y="30" width="260" height="300" rx="12" fill="#fdf1d6" stroke="#a8730c" stroke-width="2"/>
<rect x="610" y="30" width="260" height="70" rx="12" fill="#a8730c"/>
<text x="740" y="60" font-size="18" font-weight="bold" fill="#ffffff">Third generation</text>
<text x="740" y="84" font-size="14" fill="#ffffff">Fraternity (solidarity)</text>
<text x="740" y="128" font-size="15" font-weight="bold" fill="#6b4a05">Collective</text>
</g>
<g font-size="13.5" fill="#1f2a38">
<text x="55" y="162">• life and security</text>
<text x="55" y="187">• freedom from torture</text>
<text x="55" y="212">• fair trial</text>
<text x="55" y="237">• thought, religion, speech</text>
<text x="55" y="262">• assembly and association</text>
<text x="55" y="287">• the vote</text>
<text x="345" y="162">• work and fair wages</text>
<text x="345" y="187">• social security</text>
<text x="345" y="212">• adequate standard of living</text>
<text x="345" y="237">• health</text>
<text x="345" y="262">• education</text>
<text x="345" y="287">• cultural life</text>
<text x="635" y="162">• development</text>
<text x="635" y="187">• peace</text>
<text x="635" y="212">• a healthy environment</text>
<text x="635" y="237">• self-determination of peoples</text>
</g>
<g font-size="12.5" font-style="italic" text-anchor="middle">
<text x="160" y="318" fill="#2b4a73">ICCPR (1966)</text>
<text x="450" y="318" fill="#1f5a35">ICESCR (1966)</text>
<text x="740" y="318" fill="#6b4a05">later declarations</text>
</g>
<text x="450" y="365" font-size="13" fill="#1f2a38" text-anchor="middle">Since the Vienna Declaration (1993): all human rights are universal, indivisible,</text>
<text x="450" y="384" font-size="13" fill="#1f2a38" text-anchor="middle">interdependent and interrelated.</text>
</svg>
