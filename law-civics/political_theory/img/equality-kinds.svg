<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Formal equality of opportunity, fair equality of opportunity and equality of outcome shown as three races" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="380" fill="#ffffff"/>
<g font-size="17" font-weight="bold" text-anchor="middle">
<text x="150" y="36" fill="#2b4a73">Formal equality</text>
<text x="150" y="56" fill="#2b4a73">of opportunity</text>
<text x="450" y="36" fill="#1f5a35">Fair equality</text>
<text x="450" y="56" fill="#1f5a35">of opportunity</text>
<text x="750" y="36" fill="#6b4a05">Equality</text>
<text x="750" y="56" fill="#6b4a05">of outcome</text>
</g>
<g stroke="#d6d0c2" stroke-width="2"><line x1="300" y1="20" x2="300" y2="330"/><line x1="600" y1="20" x2="600" y2="330"/></g>
<!-- panel 1 -->
<g>
<rect x="30" y="80" width="240" height="210" fill="#f6f8fb" stroke="#c7d0db"/>
<line x1="250" y1="80" x2="250" y2="290" stroke="#2b2440" stroke-width="3" stroke-dasharray="6 4"/>
<text x="250" y="305" font-size="11.5" fill="#5b6b7f" text-anchor="middle">finish</text>
<line x1="40" y1="150" x2="250" y2="150" stroke="#c7d0db"/><line x1="40" y1="220" x2="250" y2="220" stroke="#c7d0db"/>
<rect x="150" y="96" width="14" height="40" rx="4" fill="#2b4a73"/><circle cx="157" cy="90" r="8" fill="#2b4a73"/>
<rect x="105" y="166" width="14" height="40" rx="4" fill="#2b4a73"/><circle cx="112" cy="160" r="8" fill="#2b4a73"/>
<rect x="50" y="236" width="14" height="40" rx="4" fill="#2b4a73"/><circle cx="57" cy="230" r="8" fill="#2b4a73"/>
</g>
<!-- panel 2 -->
<g>
<rect x="330" y="80" width="240" height="210" fill="#f4faf6" stroke="#c4dfcc"/>
<line x1="550" y1="80" x2="550" y2="290" stroke="#2b2440" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="365" y1="80" x2="365" y2="290" stroke="#2f7a4a" stroke-width="3"/>
<text x="365" y="305" font-size="11.5" fill="#1f5a35" text-anchor="middle">same start</text>
<text x="550" y="305" font-size="11.5" fill="#5b6b7f" text-anchor="middle">finish</text>
<line x1="340" y1="150" x2="550" y2="150" stroke="#c4dfcc"/><line x1="340" y1="220" x2="550" y2="220" stroke="#c4dfcc"/>
<rect x="375" y="96" width="14" height="40" rx="4" fill="#2f7a4a"/><circle cx="382" cy="90" r="8" fill="#2f7a4a"/>
<rect x="375" y="166" width="14" height="40" rx="4" fill="#2f7a4a"/><circle cx="382" cy="160" r="8" fill="#2f7a4a"/>
<rect x="375" y="236" width="14" height="40" rx="4" fill="#2f7a4a"/><circle cx="382" cy="230" r="8" fill="#2f7a4a"/>
</g>
<!-- panel 3 -->
<g>
<rect x="630" y="80" width="240" height="210" fill="#fffaf0" stroke="#ead9b0"/>
<line x1="850" y1="80" x2="850" y2="290" stroke="#2b2440" stroke-width="3" stroke-dasharray="6 4"/>
<text x="850" y="305" font-size="11.5" fill="#5b6b7f" text-anchor="middle">finish</text>
<line x1="640" y1="150" x2="850" y2="150" stroke="#ead9b0"/><line x1="640" y1="220" x2="850" y2="220" stroke="#ead9b0"/>
<rect x="828" y="96" width="14" height="40" rx="4" fill="#a8730c"/><circle cx="835" cy="90" r="8" fill="#a8730c"/>
<rect x="828" y="166" width="14" height="40" rx="4" fill="#a8730c"/><circle cx="835" cy="160" r="8" fill="#a8730c"/>
<rect x="828" y="236" width="14" height="40" rx="4" fill="#a8730c"/><circle cx="835" cy="230" r="8" fill="#a8730c"/>
</g>
<g font-size="13" fill="#1f2a38" text-anchor="middle">
<text x="150" y="330">No one is barred, but</text>
<text x="150" y="348">starting points differ</text>
<text x="450" y="330">Background advantages are</text>
<text x="450" y="348">offset; talent and effort decide</text>
<text x="750" y="330">Results are made equal,</text>
<text x="750" y="348">whatever the starting point</text>
</g>
</svg>
