<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Timeline of the relationship between Fundamental Rights and Directive Principles, 1951 to 1980" font-family="Georgia,'Times New Roman',serif">
<rect width="960" height="330" fill="#ffffff"/>
<line x1="40" y1="165" x2="920" y2="165" stroke="#33445a" stroke-width="3"/>
<g text-anchor="middle" font-size="14">
<circle cx="90" cy="165" r="8" fill="#1f3a5f"/>
<line x1="90" y1="157" x2="90" y2="120" stroke="#8a97a8" stroke-width="1.5"/>
<text x="90" y="62" font-weight="bold" fill="#1f3a5f">1951</text>
<text x="90" y="82" fill="#1f2a38">Champakam</text>
<text x="90" y="100" fill="#1f2a38">Rights prevail</text>
<circle cx="250" cy="165" r="8" fill="#b07a10"/>
<line x1="250" y1="173" x2="250" y2="210" stroke="#8a97a8" stroke-width="1.5"/>
<text x="250" y="232" font-weight="bold" fill="#6b4a05">1951</text>
<text x="250" y="252" fill="#1f2a38">1st Amendment:</text>
<text x="250" y="270" fill="#1f2a38">Art 31A, 31B,</text>
<text x="250" y="288" fill="#1f2a38">Ninth Schedule</text>
<circle cx="410" cy="165" r="8" fill="#1f3a5f"/>
<line x1="410" y1="157" x2="410" y2="120" stroke="#8a97a8" stroke-width="1.5"/>
<text x="410" y="62" font-weight="bold" fill="#1f3a5f">1967</text>
<text x="410" y="82" fill="#1f2a38">Golaknath</text>
<text x="410" y="100" fill="#1f2a38">Rights unamendable</text>
<circle cx="560" cy="165" r="8" fill="#b07a10"/>
<line x1="560" y1="173" x2="560" y2="210" stroke="#8a97a8" stroke-width="1.5"/>
<text x="560" y="232" font-weight="bold" fill="#6b4a05">1971</text>
<text x="560" y="252" fill="#1f2a38">24th and 25th</text>
<text x="560" y="270" fill="#1f2a38">Amendments:</text>
<text x="560" y="288" fill="#1f2a38">Art 31C for 39(b),(c)</text>
<circle cx="700" cy="165" r="8" fill="#1f3a5f"/>
<line x1="700" y1="157" x2="700" y2="120" stroke="#8a97a8" stroke-width="1.5"/>
<text x="700" y="44" font-weight="bold" fill="#1f3a5f">1973</text>
<text x="700" y="64" fill="#1f2a38">Kesavananda Bharati</text>
<text x="700" y="82" fill="#1f2a38">Amendable, but not</text>
<text x="700" y="100" fill="#1f2a38">the basic structure</text>
<circle cx="800" cy="165" r="8" fill="#b07a10"/>
<line x1="800" y1="173" x2="800" y2="210" stroke="#8a97a8" stroke-width="1.5"/>
<text x="800" y="232" font-weight="bold" fill="#6b4a05">1976</text>
<text x="800" y="252" fill="#1f2a38">42nd Amendment:</text>
<text x="800" y="270" fill="#1f2a38">31C for all</text>
<text x="800" y="288" fill="#1f2a38">Directives</text>
<circle cx="890" cy="165" r="9" fill="#b0451c"/>
<line x1="890" y1="156" x2="890" y2="120" stroke="#8a97a8" stroke-width="1.5"/>
<text x="880" y="62" font-weight="bold" fill="#b0451c">1980</text>
<text x="880" y="82" fill="#b0451c">Minerva Mills</text>
<text x="880" y="100" fill="#b0451c">Balance is basic</text>
</g>
<g font-size="12" fill="#5b6b7f">
<text x="40" y="320">Blue: court decisions</text>
<text x="230" y="320">Gold: amendments by Parliament</text>
</g>
</svg>
