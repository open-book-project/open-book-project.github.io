<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="The six groups of Fundamental Rights with their articles" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="380" fill="#ffffff"/>
<g text-anchor="middle">
<rect x="300" y="14" width="300" height="56" rx="10" fill="#14324a"/>
<text x="450" y="40" font-size="19" font-weight="bold" fill="#ffffff">Fundamental Rights</text>
<text x="450" y="60" font-size="14" fill="#e8eef5">Part III, Articles 12–35</text>
</g>
<g stroke="#8a97a8" stroke-width="2" fill="none">
<path d="M450 70V95M85 95H825M85 95V115M245 95V115M405 95V115M545 95V115M685 95V115M825 95V115"/>
</g>
<g text-anchor="middle" font-size="13">
<rect x="15" y="115" width="140" height="250" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="85" y="142" font-weight="bold" fill="#1f3a5f">Equality</text>
<text x="85" y="162" fill="#1f3a5f">Arts 14–18</text>
<text x="85" y="198" fill="#1f2a38">14 Equality before</text>
<text x="85" y="216" fill="#1f2a38">law</text>
<text x="85" y="240" fill="#1f2a38">15 No discrimination</text>
<text x="85" y="264" fill="#1f2a38">16 Public</text>
<text x="85" y="282" fill="#1f2a38">employment</text>
<text x="85" y="306" fill="#1f2a38">17 Untouchability</text>
<text x="85" y="330" fill="#1f2a38">18 Titles</text>
<rect x="170" y="115" width="150" height="250" rx="10" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="245" y="142" font-weight="bold" fill="#6b4a05">Freedom</text>
<text x="245" y="162" fill="#6b4a05">Arts 19–22</text>
<text x="245" y="198" fill="#1f2a38">19 Six freedoms</text>
<text x="245" y="222" fill="#1f2a38">20 Conviction for</text>
<text x="245" y="240" fill="#1f2a38">offences</text>
<text x="245" y="264" fill="#1f2a38">21 Life and personal</text>
<text x="245" y="282" fill="#1f2a38">liberty</text>
<text x="245" y="306" fill="#1f2a38">21A Education</text>
<text x="245" y="330" fill="#1f2a38">22 Arrest and</text>
<text x="245" y="348" fill="#1f2a38">detention</text>
<rect x="335" y="115" width="140" height="250" rx="10" fill="#f6e6ea" stroke="#8a2c46" stroke-width="2"/>
<text x="405" y="142" font-weight="bold" fill="#8a2c46">Against</text>
<text x="405" y="160" font-weight="bold" fill="#8a2c46">exploitation</text>
<text x="405" y="180" fill="#8a2c46">Arts 23–24</text>
<text x="405" y="216" fill="#1f2a38">23 Trafficking,</text>
<text x="405" y="234" fill="#1f2a38">forced labour</text>
<text x="405" y="264" fill="#1f2a38">24 Child labour</text>
<text x="405" y="282" fill="#1f2a38">in hazardous work</text>
<rect x="485" y="115" width="120" height="250" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="545" y="142" font-weight="bold" fill="#1f5a35">Religion</text>
<text x="545" y="162" fill="#1f5a35">Arts 25–28</text>
<text x="545" y="198" fill="#1f2a38">25 Conscience,</text>
<text x="545" y="216" fill="#1f2a38">practice</text>
<text x="545" y="240" fill="#1f2a38">26 Religious</text>
<text x="545" y="258" fill="#1f2a38">affairs</text>
<text x="545" y="282" fill="#1f2a38">27 No tax for</text>
<text x="545" y="300" fill="#1f2a38">a religion</text>
<text x="545" y="324" fill="#1f2a38">28 Religious</text>
<text x="545" y="342" fill="#1f2a38">instruction</text>
<rect x="615" y="115" width="140" height="250" rx="10" fill="#efe8f7" stroke="#5a3d8a" stroke-width="2"/>
<text x="685" y="142" font-weight="bold" fill="#5a3d8a">Cultural and</text>
<text x="685" y="160" font-weight="bold" fill="#5a3d8a">educational</text>
<text x="685" y="180" fill="#5a3d8a">Arts 29–30</text>
<text x="685" y="216" fill="#1f2a38">29 Language, script,</text>
<text x="685" y="234" fill="#1f2a38">culture</text>
<text x="685" y="264" fill="#1f2a38">30 Minority</text>
<text x="685" y="282" fill="#1f2a38">institutions</text>
<rect x="765" y="115" width="120" height="250" rx="10" fill="#e6f2f3" stroke="#1e6a70" stroke-width="2"/>
<text x="825" y="142" font-weight="bold" fill="#1e6a70">Remedies</text>
<text x="825" y="162" fill="#1e6a70">Art 32</text>
<text x="825" y="198" fill="#1f2a38">Move the</text>
<text x="825" y="216" fill="#1f2a38">Supreme Court</text>
<text x="825" y="246" fill="#1f2a38">Five writs</text>
</g>
</svg>
