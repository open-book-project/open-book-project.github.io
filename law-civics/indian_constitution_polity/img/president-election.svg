<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Electoral colleges for the President and the Vice-President" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<g text-anchor="middle">
<text x="225" y="28" font-size="18" font-weight="bold" fill="#14324a">President (Articles 54, 55)</text>
<rect x="20" y="50" width="190" height="80" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="115" y="80" font-size="15" fill="#1f2a38">Elected members of</text>
<text x="115" y="100" font-size="15" fill="#1f2a38">Lok Sabha and</text>
<text x="115" y="120" font-size="15" fill="#1f2a38">Rajya Sabha</text>
<rect x="240" y="50" width="190" height="80" rx="10" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="335" y="76" font-size="15" fill="#1f2a38">Elected members of</text>
<text x="335" y="96" font-size="15" fill="#1f2a38">State Assemblies,</text>
<text x="335" y="116" font-size="15" fill="#1f2a38">Delhi and Puducherry</text>
<rect x="105" y="200" width="240" height="70" rx="10" fill="#14324a"/>
<text x="225" y="230" font-size="17" font-weight="bold" fill="#ffffff">Electoral college</text>
<text x="225" y="252" font-size="14" fill="#e8eef5">single transferable vote, secret ballot</text>
<text x="225" y="300" font-size="13" fill="#33445a">Votes weighted by population (1971 census);</text>
<text x="225" y="318" font-size="13" fill="#33445a">MPs' total weight equals MLAs' total weight.</text>
<text x="225" y="336" font-size="13" fill="#33445a">Nominated members do not vote.</text>
<text x="675" y="28" font-size="18" font-weight="bold" fill="#14324a">Vice-President (Article 66)</text>
<rect x="490" y="50" width="170" height="80" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="575" y="80" font-size="15" fill="#1f2a38">All members of</text>
<text x="575" y="100" font-size="15" fill="#1f2a38">Lok Sabha</text>
<text x="575" y="120" font-size="13" fill="#33445a">(elected and nominated)</text>
<rect x="690" y="50" width="190" height="80" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="785" y="80" font-size="15" fill="#1f2a38">All members of</text>
<text x="785" y="100" font-size="15" fill="#1f2a38">Rajya Sabha</text>
<text x="785" y="120" font-size="13" fill="#33445a">(elected and nominated)</text>
<rect x="555" y="200" width="240" height="70" rx="10" fill="#14324a"/>
<text x="675" y="230" font-size="17" font-weight="bold" fill="#ffffff">Electoral college</text>
<text x="675" y="252" font-size="14" fill="#e8eef5">single transferable vote, secret ballot</text>
<text x="675" y="300" font-size="13" fill="#33445a">Each member's vote has equal value.</text>
<text x="675" y="318" font-size="13" fill="#33445a">State legislators do not vote.</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)">
<line x1="115" y1="132" x2="185" y2="196"/>
<line x1="335" y1="132" x2="265" y2="196"/>
<line x1="575" y1="132" x2="645" y2="196"/>
<line x1="785" y1="132" x2="705" y2="196"/>
</g>
<line x1="460" y1="20" x2="460" y2="345" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="6 5"/>
</svg>
