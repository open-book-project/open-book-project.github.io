<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The four parts of the Preamble: source of authority, nature of the State, objectives, date of adoption" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="300" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<g text-anchor="middle">
<rect x="15" y="40" width="190" height="220" rx="12" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="110" y="72" font-size="17" font-weight="bold" fill="#1f3a5f">1. Source of</text>
<text x="110" y="94" font-size="17" font-weight="bold" fill="#1f3a5f">authority</text>
<text x="110" y="140" font-size="15" fill="#1f2a38">"We, the people</text>
<text x="110" y="162" font-size="15" fill="#1f2a38">of India"</text>
<text x="110" y="210" font-size="13" fill="#33445a">Power comes from</text>
<text x="110" y="228" font-size="13" fill="#33445a">the people</text>
<rect x="235" y="40" width="190" height="220" rx="12" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="330" y="72" font-size="17" font-weight="bold" fill="#6b4a05">2. Nature of</text>
<text x="330" y="94" font-size="17" font-weight="bold" fill="#6b4a05">the State</text>
<text x="330" y="132" font-size="15" fill="#1f2a38">Sovereign</text>
<text x="330" y="154" font-size="15" fill="#1f2a38">Socialist</text>
<text x="330" y="176" font-size="15" fill="#1f2a38">Secular</text>
<text x="330" y="198" font-size="15" fill="#1f2a38">Democratic</text>
<text x="330" y="220" font-size="15" fill="#1f2a38">Republic</text>
<rect x="455" y="40" width="210" height="220" rx="12" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="560" y="72" font-size="17" font-weight="bold" fill="#1f5a35">3. Objectives</text>
<text x="560" y="112" font-size="15" fill="#1f2a38">Justice: social,</text>
<text x="560" y="132" font-size="15" fill="#1f2a38">economic, political</text>
<text x="560" y="160" font-size="15" fill="#1f2a38">Liberty of thought ...</text>
<text x="560" y="188" font-size="15" fill="#1f2a38">Equality of status</text>
<text x="560" y="208" font-size="15" fill="#1f2a38">and opportunity</text>
<text x="560" y="236" font-size="15" fill="#1f2a38">Fraternity</text>
<rect x="695" y="40" width="190" height="220" rx="12" fill="#f6e6ea" stroke="#8a2c46" stroke-width="2"/>
<text x="790" y="72" font-size="17" font-weight="bold" fill="#8a2c46">4. Date of</text>
<text x="790" y="94" font-size="17" font-weight="bold" fill="#8a2c46">adoption</text>
<text x="790" y="140" font-size="15" fill="#1f2a38">26 November</text>
<text x="790" y="162" font-size="15" fill="#1f2a38">1949</text>
<text x="790" y="210" font-size="13" fill="#33445a">"adopt, enact and</text>
<text x="790" y="228" font-size="13" fill="#33445a">give to ourselves"</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)">
<line x1="207" y1="150" x2="231" y2="150"/>
<line x1="427" y1="150" x2="451" y2="150"/>
<line x1="667" y1="150" x2="691" y2="150"/>
</g>
</svg>
