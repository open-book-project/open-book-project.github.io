<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Checks and balances among the legislature, the executive and the judiciary" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<g text-anchor="middle">
<rect x="340" y="20" width="220" height="70" rx="12" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="450" y="50" font-size="19" font-weight="bold" fill="#1f3a5f">Legislature</text>
<text x="450" y="73" font-size="13" fill="#1f2a38">Parliament, State legislatures</text>
<rect x="40" y="340" width="230" height="70" rx="12" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="155" y="370" font-size="19" font-weight="bold" fill="#6b4a05">Executive</text>
<text x="155" y="393" font-size="13" fill="#1f2a38">President, Council of Ministers</text>
<rect x="630" y="340" width="230" height="70" rx="12" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="745" y="370" font-size="19" font-weight="bold" fill="#1f5a35">Judiciary</text>
<text x="745" y="393" font-size="13" fill="#1f2a38">Supreme Court, High Courts</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#ar)">
<path d="M360 92L190 336"/>
<path d="M230 336L400 92"/>
<path d="M540 92L710 336"/>
<path d="M670 336L500 92"/>
<path d="M274 365H626"/>
<path d="M626 390H274"/>
</g>
<g font-size="12.5" fill="#1f2a38">
<text x="40" y="150">No-confidence motions,</text>
<text x="40" y="166">questions, committees,</text>
<text x="40" y="182">budget approval,</text>
<text x="40" y="198">impeachment of President</text>
<text x="290" y="270">Ordinances, dissolution</text>
<text x="290" y="286">of Lok Sabha, summoning,</text>
<text x="290" y="302">veto over bills</text>
<text x="612" y="270" text-anchor="end">Judicial review of laws</text>
<text x="612" y="286" text-anchor="end">and amendments</text>
<text x="612" y="302" text-anchor="end">(basic structure)</text>
<text x="690" y="150">Removal of judges,</text>
<text x="690" y="166">changing the law after</text>
<text x="690" y="182">a judgment, number of</text>
<text x="690" y="198">judges, jurisdiction</text>
<text x="450" y="352" text-anchor="middle">Appointment of judges (with the collegium), pardons</text>
<text x="450" y="412" text-anchor="middle">Judicial review of executive action, writs</text>
</g>
<text x="450" y="452" font-size="12" fill="#5b6b7f" text-anchor="middle">Each arrow points from the organ that checks to the organ checked.</text>
</svg>
