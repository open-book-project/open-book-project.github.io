<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" aria-label="The three lists of the Seventh Schedule with examples of subjects" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="412" fill="#ffffff"/>
<g text-anchor="middle">
<rect x="20" y="20" width="270" height="360" rx="12" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="155" y="52" font-size="19" font-weight="bold" fill="#1f3a5f">List I: Union</text>
<text x="155" y="74" font-size="13" fill="#33445a">Parliament alone</text>
<text x="155" y="92" font-size="13" fill="#33445a">(97 entries originally)</text>
<g font-size="15" fill="#1f2a38">
<text x="155" y="130">Defence and armed forces</text>
<text x="155" y="158">Foreign affairs</text>
<text x="155" y="186">Atomic energy</text>
<text x="155" y="214">Railways, airways</text>
<text x="155" y="242">Currency and banking</text>
<text x="155" y="270">Citizenship, census</text>
<text x="155" y="298">Posts, telecommunications</text>
<text x="155" y="326">Inter-State trade</text>
<text x="155" y="354">Customs, income tax</text>
</g>
<rect x="315" y="20" width="270" height="360" rx="12" fill="#efe8f7" stroke="#5a3d8a" stroke-width="2"/>
<text x="450" y="52" font-size="19" font-weight="bold" fill="#5a3d8a">List III: Concurrent</text>
<text x="450" y="74" font-size="13" fill="#33445a">Both; Union law prevails</text>
<text x="450" y="92" font-size="13" fill="#33445a">(47 entries originally)</text>
<g font-size="15" fill="#1f2a38">
<text x="450" y="130">Criminal law and procedure</text>
<text x="450" y="158">Marriage, divorce, adoption</text>
<text x="450" y="186">Education*</text>
<text x="450" y="214">Forests*</text>
<text x="450" y="242">Wild animals and birds*</text>
<text x="450" y="270">Trade unions</text>
<text x="450" y="298">Electricity</text>
<text x="450" y="326">Economic and social planning</text>
<text x="450" y="354">Population control</text>
</g>
<rect x="610" y="20" width="270" height="360" rx="12" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="745" y="52" font-size="19" font-weight="bold" fill="#6b4a05">List II: State</text>
<text x="745" y="74" font-size="13" fill="#33445a">State legislatures normally</text>
<text x="745" y="92" font-size="13" fill="#33445a">(66 entries originally)</text>
<g font-size="15" fill="#1f2a38">
<text x="745" y="130">Public order</text>
<text x="745" y="158">Police</text>
<text x="745" y="186">Public health, sanitation</text>
<text x="745" y="214">Agriculture</text>
<text x="745" y="242">Local government</text>
<text x="745" y="270">Land</text>
<text x="745" y="298">Prisons</text>
<text x="745" y="326">Markets and fairs</text>
<text x="745" y="354">Land revenue</text>
</g>
</g>
<text x="450" y="401" font-size="12" fill="#5b6b7f" text-anchor="middle">* moved from the State List to the Concurrent List by the 42nd Amendment (1976). Residuary powers: Parliament (Article 248).</text>
</svg>
