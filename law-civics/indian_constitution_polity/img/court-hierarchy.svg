<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The integrated hierarchy of courts in India" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<g text-anchor="middle">
<rect x="300" y="18" width="300" height="70" rx="10" fill="#14324a"/>
<text x="450" y="47" font-size="19" font-weight="bold" fill="#ffffff">Supreme Court</text>
<text x="450" y="70" font-size="14" fill="#e8eef5">Articles 124–147 · CJI and up to 33 judges</text>
<rect x="250" y="128" width="400" height="66" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="450" y="156" font-size="18" font-weight="bold" fill="#1f3a5f">High Courts</text>
<text x="450" y="178" font-size="14" fill="#1f2a38">Articles 214–231 · one for a State or shared by several</text>
<rect x="150" y="236" width="280" height="66" rx="10" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="290" y="262" font-size="16" font-weight="bold" fill="#6b4a05">District Judge</text>
<text x="290" y="284" font-size="14" fill="#1f2a38">civil appeals and suits</text>
<rect x="470" y="236" width="280" height="66" rx="10" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="610" y="262" font-size="16" font-weight="bold" fill="#6b4a05">Sessions Judge</text>
<text x="610" y="284" font-size="14" fill="#1f2a38">serious criminal cases</text>
<rect x="150" y="326" width="280" height="60" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="290" y="352" font-size="15" font-weight="bold" fill="#1f5a35">Civil Judges</text>
<text x="290" y="372" font-size="13" fill="#1f2a38">senior and junior division</text>
<rect x="470" y="326" width="280" height="60" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="610" y="352" font-size="15" font-weight="bold" fill="#1f5a35">Judicial Magistrates</text>
<text x="610" y="372" font-size="13" fill="#1f2a38">Chief Judicial Magistrate and others</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar)">
<line x1="450" y1="126" x2="450" y2="92"/>
<line x1="320" y1="234" x2="370" y2="198"/>
<line x1="580" y1="234" x2="530" y2="198"/>
<line x1="290" y1="324" x2="290" y2="306"/>
<line x1="610" y1="324" x2="610" y2="306"/>
</g>
<g font-size="13" fill="#33445a">
<text x="680" y="110">appeals go upwards;</text>
<text x="680" y="128">law declared by the</text>
<text x="680" y="146">Supreme Court binds all</text>
<text x="680" y="164">courts (Article 141)</text>
<text x="12" y="250">Subordinate</text>
<text x="12" y="268">courts</text>
<text x="12" y="286">(Articles 233–237)</text>
</g>
</svg>
