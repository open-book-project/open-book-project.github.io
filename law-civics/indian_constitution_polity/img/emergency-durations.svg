<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Approval and duration rules for the three emergencies" font-family="Georgia,'Times New Roman',serif">
<rect width="960" height="360" fill="#ffffff"/>
<g font-size="15" font-weight="bold" fill="#14324a">
<text x="20" y="40">National emergency (Art 352)</text>
<text x="20" y="150">President's rule (Art 356)</text>
<text x="20" y="260">Financial emergency (Art 360)</text>
</g>
<g font-size="13">
<rect x="20" y="54" width="90" height="34" fill="#b0451c"/>
<text x="65" y="76" text-anchor="middle" fill="#ffffff">1 month</text>
<rect x="110" y="54" width="180" height="34" fill="#e8f0fa" stroke="#1f3a5f"/>
<text x="200" y="76" text-anchor="middle" fill="#1f2a38">6 months</text>
<rect x="290" y="54" width="180" height="34" fill="#e8f0fa" stroke="#1f3a5f"/>
<text x="380" y="76" text-anchor="middle" fill="#1f2a38">6 months</text>
<rect x="470" y="54" width="180" height="34" fill="#e8f0fa" stroke="#1f3a5f"/>
<text x="560" y="76" text-anchor="middle" fill="#1f2a38">6 months</text>
<text x="665" y="76" fill="#1f2a38">... no maximum</text>
<text x="20" y="108" fill="#33445a">Approval by special majority of each House within one month; renewed every six months by special majority.</text>
<rect x="20" y="164" width="150" height="34" fill="#b0451c"/>
<text x="95" y="186" text-anchor="middle" fill="#ffffff">2 months</text>
<rect x="170" y="164" width="120" height="34" fill="#fdf1d6" stroke="#b07a10"/>
<text x="230" y="186" text-anchor="middle" fill="#1f2a38">6 months</text>
<rect x="290" y="164" width="120" height="34" fill="#fdf1d6" stroke="#b07a10"/>
<text x="350" y="186" text-anchor="middle" fill="#1f2a38">6 months</text>
<rect x="410" y="164" width="360" height="34" fill="#fdf1d6" stroke="#b07a10" stroke-dasharray="5 4"/>
<text x="590" y="186" text-anchor="middle" fill="#1f2a38">beyond one year: only with conditions</text>
<line x1="770" y1="156" x2="770" y2="206" stroke="#b0451c" stroke-width="3"/>
<text x="780" y="186" fill="#b0451c">3 years maximum</text>
<text x="20" y="218" fill="#33445a">Approval by simple majority of each House within two months; renewed every six months.</text>
<rect x="20" y="274" width="150" height="34" fill="#b0451c"/>
<text x="95" y="296" text-anchor="middle" fill="#ffffff">2 months</text>
<rect x="170" y="274" width="480" height="34" fill="#e3f3e8" stroke="#2f7a4a"/>
<text x="410" y="296" text-anchor="middle" fill="#1f2a38">continues until revoked; no renewal needed</text>
<text x="20" y="328" fill="#33445a">Approval by simple majority of each House within two months. Never proclaimed so far.</text>
</g>
<text x="940" y="350" font-size="12" fill="#5b6b7f" text-anchor="end">Red: period within which Parliament must approve. Bars not to scale.</text>
</svg>
