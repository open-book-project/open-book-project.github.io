<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Three ways of amending the Constitution" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="380" fill="#ffffff"/>
<g text-anchor="middle">
<rect x="20" y="20" width="270" height="70" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="155" y="48" font-size="17" font-weight="bold" fill="#1f5a35">1. Simple majority</text>
<text x="155" y="72" font-size="13" fill="#1f2a38">of each House (outside Article 368)</text>
<rect x="315" y="20" width="270" height="70" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="450" y="48" font-size="17" font-weight="bold" fill="#1f3a5f">2. Special majority</text>
<text x="450" y="72" font-size="13" fill="#1f2a38">of each House (Article 368)</text>
<rect x="610" y="20" width="270" height="70" rx="10" fill="#f6e6ea" stroke="#8a2c46" stroke-width="2"/>
<text x="745" y="40" font-size="17" font-weight="bold" fill="#8a2c46">3. Special majority</text>
<text x="745" y="62" font-size="13" fill="#1f2a38">of each House + ratification by</text>
<text x="745" y="80" font-size="13" fill="#1f2a38">half the State legislatures</text>
</g>
<g font-size="14" fill="#1f2a38">
<text x="30" y="124" font-weight="bold" fill="#1f5a35">Examples</text>
<text x="30" y="150">New States and boundaries (Arts 2–4)</text>
<text x="30" y="174">Creating or abolishing Councils (169)</text>
<text x="30" y="198">Citizenship law (Art 11)</text>
<text x="30" y="222">Quorum, salaries of MPs</text>
<text x="30" y="246">Number of Supreme Court judges</text>
<text x="30" y="270">Second, Fifth and Sixth Schedules</text>
<text x="30" y="294">Elections and delimitation</text>
<text x="325" y="124" font-weight="bold" fill="#1f3a5f">Examples</text>
<text x="325" y="150">Fundamental Rights</text>
<text x="325" y="174">Directive Principles</text>
<text x="325" y="198">Most other provisions not</text>
<text x="325" y="218">listed in columns 1 or 3</text>
<text x="325" y="250" font-weight="bold" fill="#1f3a5f">Majority needed</text>
<text x="325" y="274">majority of total membership</text>
<text x="325" y="294">and two-thirds of members</text>
<text x="325" y="314">present and voting</text>
<text x="620" y="124" font-weight="bold" fill="#8a2c46">Federal provisions</text>
<text x="620" y="150">Election of the President (54, 55)</text>
<text x="620" y="174">Executive power of Union, States</text>
<text x="620" y="198">Supreme Court and High Courts</text>
<text x="620" y="222">Distribution of legislative powers</text>
<text x="620" y="246">Any List of the Seventh Schedule</text>
<text x="620" y="270">Representation of States in Parliament</text>
<text x="620" y="294">GST Council (279A)</text>
<text x="620" y="318">Article 368 itself</text>
</g>
<line x1="302" y1="104" x2="302" y2="360" stroke="#c9d1db" stroke-width="1.5"/>
<line x1="598" y1="104" x2="598" y2="360" stroke="#c9d1db" stroke-width="1.5"/>
<text x="450" y="372" font-size="12" fill="#5b6b7f" text-anchor="middle">Column 1 changes are made by ordinary laws and are not "amendments" for the purposes of Article 368.</text>
</svg>
