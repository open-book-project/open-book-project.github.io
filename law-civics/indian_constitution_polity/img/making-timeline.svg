<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Timeline of the making of the Constitution, 1946 to 1950" font-family="Georgia,'Times New Roman',serif">
<rect width="960" height="360" fill="#ffffff"/>
<line x1="40" y1="180" x2="920" y2="180" stroke="#33445a" stroke-width="3"/>
<g fill="#1f3a5f">
<circle cx="70" cy="180" r="7"/>
<circle cx="180" cy="180" r="7"/>
<circle cx="290" cy="180" r="7"/>
<circle cx="400" cy="180" r="7"/>
<circle cx="510" cy="180" r="7"/>
<circle cx="620" cy="180" r="7"/>
<circle cx="730" cy="180" r="7"/>
<circle cx="830" cy="180" r="7"/>
<circle cx="900" cy="180" r="9" fill="#b0451c"/>
</g>
<g stroke="#8a97a8" stroke-width="1.5">
<line x1="70" y1="180" x2="70" y2="120"/>
<line x1="180" y1="180" x2="180" y2="240"/>
<line x1="290" y1="180" x2="290" y2="120"/>
<line x1="400" y1="180" x2="400" y2="240"/>
<line x1="510" y1="180" x2="510" y2="120"/>
<line x1="620" y1="180" x2="620" y2="240"/>
<line x1="730" y1="180" x2="730" y2="120"/>
<line x1="830" y1="180" x2="830" y2="240"/>
<line x1="900" y1="180" x2="900" y2="120"/>
</g>
<g font-size="14" fill="#1f2a38" text-anchor="middle">
<text x="70" y="70" font-weight="bold">May 1946</text>
<text x="70" y="90">Cabinet Mission</text>
<text x="70" y="108">plan</text>
<text x="180" y="262" font-weight="bold">Jul–Aug 1946</text>
<text x="180" y="282">Assembly elected by</text>
<text x="180" y="300">provincial assemblies</text>
<text x="290" y="70" font-weight="bold">9 Dec 1946</text>
<text x="290" y="90">First sitting of the</text>
<text x="290" y="108">Constituent Assembly</text>
<text x="400" y="262" font-weight="bold">13 Dec 1946</text>
<text x="400" y="282">Objectives Resolution</text>
<text x="400" y="300">moved (adopted Jan 1947)</text>
<text x="510" y="70" font-weight="bold">15 Aug 1947</text>
<text x="510" y="90">Independence;</text>
<text x="510" y="108">Assembly also legislature</text>
<text x="620" y="262" font-weight="bold">29 Aug 1947</text>
<text x="620" y="282">Drafting Committee</text>
<text x="620" y="300">set up</text>
<text x="730" y="70" font-weight="bold">Feb 1948</text>
<text x="730" y="90">Draft Constitution</text>
<text x="730" y="108">published</text>
<text x="830" y="262" font-weight="bold">26 Nov 1949</text>
<text x="830" y="282">Constitution</text>
<text x="830" y="300">adopted</text>
<text x="880" y="70" font-weight="bold" fill="#b0451c">26 Jan 1950</text>
<text x="880" y="90" fill="#b0451c">Comes into</text>
<text x="880" y="108" fill="#b0451c">force</text>
</g>
</svg>
