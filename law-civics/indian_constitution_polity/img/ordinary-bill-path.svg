<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="The path of an ordinary bill through Parliament" font-family="Georgia,'Times New Roman',serif">
<rect width="960" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker></defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#14324a">House where the bill is introduced (either House)</text>
<g text-anchor="middle">
<rect x="20" y="48" width="200" height="110" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="120" y="78" font-size="16" font-weight="bold" fill="#1f3a5f">First reading</text>
<text x="120" y="104" font-size="14" fill="#1f2a38">Leave to introduce;</text>
<text x="120" y="124" font-size="14" fill="#1f2a38">bill published in</text>
<text x="120" y="144" font-size="14" fill="#1f2a38">the Gazette</text>
<rect x="260" y="48" width="320" height="110" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="420" y="78" font-size="16" font-weight="bold" fill="#1f3a5f">Second reading</text>
<text x="420" y="102" font-size="14" fill="#1f2a38">1. General discussion of principles</text>
<text x="420" y="122" font-size="14" fill="#1f2a38">2. Committee stage (if referred)</text>
<text x="420" y="142" font-size="14" fill="#1f2a38">3. Clause-by-clause consideration</text>
<rect x="620" y="48" width="200" height="110" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="720" y="78" font-size="16" font-weight="bold" fill="#1f3a5f">Third reading</text>
<text x="720" y="104" font-size="14" fill="#1f2a38">Bill passed or</text>
<text x="720" y="124" font-size="14" fill="#1f2a38">rejected as a whole</text>
</g>
<text x="20" y="214" font-size="16" font-weight="bold" fill="#14324a">Other House</text>
<g text-anchor="middle">
<rect x="560" y="226" width="260" height="96" rx="10" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="690" y="254" font-size="16" font-weight="bold" fill="#6b4a05">Same three readings</text>
<text x="690" y="278" font-size="14" fill="#1f2a38">passes / amends / rejects /</text>
<text x="690" y="298" font-size="14" fill="#1f2a38">no action for six months</text>
<rect x="300" y="226" width="210" height="96" rx="10" fill="#f6e6ea" stroke="#8a2c46" stroke-width="2"/>
<text x="405" y="254" font-size="16" font-weight="bold" fill="#8a2c46">Deadlock?</text>
<text x="405" y="278" font-size="14" fill="#1f2a38">Joint sitting under</text>
<text x="405" y="298" font-size="14" fill="#1f2a38">Article 108</text>
<rect x="40" y="226" width="210" height="96" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="145" y="254" font-size="16" font-weight="bold" fill="#1f5a35">President</text>
<text x="145" y="278" font-size="14" fill="#1f2a38">assents, withholds, or</text>
<text x="145" y="298" font-size="14" fill="#1f2a38">returns once (Art 111)</text>
<rect x="40" y="346" width="210" height="40" rx="10" fill="#14324a"/>
<text x="145" y="372" font-size="16" font-weight="bold" fill="#ffffff">Act of Parliament</text>
</g>
<g stroke="#5b6b7f" stroke-width="2" fill="none" marker-end="url(#ar)">
<line x1="222" y1="103" x2="256" y2="103"/>
<line x1="582" y1="103" x2="616" y2="103"/>
<path d="M822 103H880V274H824"/>
<line x1="556" y1="274" x2="514" y2="274"/>
<path d="M690 324V340H200V326"/>
<line x1="296" y1="274" x2="254" y2="274"/>
<line x1="145" y1="324" x2="145" y2="342"/>
</g>
<text x="440" y="356" font-size="13" fill="#33445a" text-anchor="middle">if passed without disagreement</text>
</svg>
