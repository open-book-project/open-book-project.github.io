<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-label="Rural and urban local government under the 73rd and 74th Amendments" font-family="Georgia,'Times New Roman',serif">
<rect width="900" height="396" fill="#ffffff"/>
<g text-anchor="middle">
<text x="220" y="30" font-size="18" font-weight="bold" fill="#14324a">Rural: Panchayats (Part IX)</text>
<text x="680" y="30" font-size="18" font-weight="bold" fill="#14324a">Urban: Municipalities (Part IXA)</text>
<rect x="60" y="50" width="320" height="62" rx="10" fill="#14324a"/>
<text x="220" y="77" font-size="17" font-weight="bold" fill="#ffffff">Zila Parishad</text>
<text x="220" y="98" font-size="13" fill="#e8eef5">district level</text>
<rect x="60" y="130" width="320" height="62" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="220" y="157" font-size="17" font-weight="bold" fill="#1f3a5f">Panchayat Samiti</text>
<text x="220" y="178" font-size="13" fill="#1f2a38">intermediate (block) level*</text>
<rect x="60" y="210" width="320" height="62" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="220" y="237" font-size="17" font-weight="bold" fill="#1f5a35">Gram Panchayat</text>
<text x="220" y="258" font-size="13" fill="#1f2a38">village level</text>
<rect x="60" y="290" width="320" height="52" rx="10" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="220" y="313" font-size="16" font-weight="bold" fill="#6b4a05">Gram Sabha</text>
<text x="220" y="332" font-size="13" fill="#1f2a38">all registered voters of the village</text>
<rect x="520" y="50" width="320" height="62" rx="10" fill="#14324a"/>
<text x="680" y="77" font-size="17" font-weight="bold" fill="#ffffff">Municipal Corporation</text>
<text x="680" y="98" font-size="13" fill="#e8eef5">larger urban area</text>
<rect x="520" y="130" width="320" height="62" rx="10" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
<text x="680" y="157" font-size="17" font-weight="bold" fill="#1f3a5f">Municipal Council</text>
<text x="680" y="178" font-size="13" fill="#1f2a38">smaller urban area</text>
<rect x="520" y="210" width="320" height="62" rx="10" fill="#e3f3e8" stroke="#2f7a4a" stroke-width="2"/>
<text x="680" y="237" font-size="17" font-weight="bold" fill="#1f5a35">Nagar Panchayat</text>
<text x="680" y="258" font-size="13" fill="#1f2a38">area in transition from rural to urban</text>
<rect x="520" y="290" width="320" height="52" rx="10" fill="#fdf1d6" stroke="#b07a10" stroke-width="2"/>
<text x="680" y="313" font-size="16" font-weight="bold" fill="#6b4a05">Ward Committees</text>
<text x="680" y="332" font-size="13" fill="#1f2a38">where population is 3 lakh or more</text>
</g>
<g stroke="#8a97a8" stroke-width="2">
<line x1="220" y1="112" x2="220" y2="130"/>
<line x1="220" y1="192" x2="220" y2="210"/>
<line x1="220" y1="272" x2="220" y2="290"/>
</g>
<line x1="450" y1="44" x2="450" y2="350" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="368" font-size="12" fill="#5b6b7f">* The intermediate level may be omitted in States with a population not exceeding 20 lakh.</text>
<text x="60" y="386" font-size="12" fill="#5b6b7f">The three urban bodies are alternatives chosen by the size of the area, not tiers one above another.</text>
</svg>
