<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="720" height="400" rx="12" fill="#fbfaf6"/>
  <text x="360" y="34" text-anchor="middle" fill="#1d2a30" font-size="17" font-weight="bold">Assets = Liabilities + Capital</text>
  <!-- left bar: assets total 170000 scaled to 300 px -->
  <g stroke="#ffffff" stroke-width="2">
    <rect x="120" y="60" width="180" height="204.7" fill="#2f6f86"/>
    <rect x="120" y="264.7" width="180" height="12.4" fill="#4d8ea5"/>
    <rect x="120" y="277.1" width="180" height="17.6" fill="#6aa7bc"/>
    <rect x="120" y="294.7" width="180" height="21.2" fill="#88bfd1"/>
    <rect x="120" y="315.9" width="180" height="44.1" fill="#a9d4e2"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="210" y="160">Cash</text>
    <text x="210" y="180">1,16,000</text>
  </g>
  <g fill="#1d2a30" font-size="12">
    <text x="310" y="275">Bank 7,000</text>
    <text x="310" y="291">Inventory 10,000</text>
    <text x="310" y="309">Debtors 12,000</text>
    <text x="310" y="342">Furniture 25,000</text>
  </g>
  <!-- right bar -->
  <g stroke="#ffffff" stroke-width="2">
    <rect x="450" y="60" width="180" height="35.3" fill="#c9733a"/>
    <rect x="450" y="95.3" width="180" height="264.7" fill="#8a4b12"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="540" y="83">Creditors 20,000</text>
    <text x="540" y="220">Capital</text>
    <text x="540" y="240">1,50,000</text>
  </g>
  <text x="375" y="215" text-anchor="middle" fill="#1d2a30" font-size="30" font-weight="bold">=</text>
  <g fill="#1d2a30" text-anchor="middle" font-weight="bold">
    <text x="210" y="384">Assets ₹1,70,000</text>
    <text x="540" y="384">Liabilities + Capital ₹1,70,000</text>
  </g>
</svg>
