<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="320" rx="12" fill="#fbfaf6"/>
  <g stroke-width="1.5">
    <rect x="20" y="40" width="200" height="100" rx="10" fill="#e3eef2" stroke="#1f4e5f"/>
    <rect x="20" y="170" width="200" height="110" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
  </g>
  <g fill="#1d2a30">
    <text x="36" y="66" font-weight="bold">Masters (set up once)</text>
    <text x="36" y="88" font-size="12">company, financial year</text>
    <text x="36" y="106" font-size="12">groups and ledgers</text>
    <text x="36" y="124" font-size="12">inventory items, tax rates</text>
    <text x="36" y="196" font-weight="bold">Vouchers (every day)</text>
    <text x="36" y="218" font-size="12">receipt, payment, contra</text>
    <text x="36" y="236" font-size="12">sales, purchase, journal</text>
    <text x="36" y="254" font-size="12">debit note, credit note</text>
    <text x="36" y="272" font-size="12">each must balance</text>
  </g>
  <rect x="300" y="110" width="160" height="100" rx="10" fill="#1f4e5f"/>
  <text x="380" y="148" text-anchor="middle" fill="#ffffff" font-weight="bold">Database</text>
  <text x="380" y="170" text-anchor="middle" fill="#ffffff" font-size="12">posted automatically,</text>
  <text x="380" y="186" text-anchor="middle" fill="#ffffff" font-size="12">with audit trail</text>
  <rect x="540" y="30" width="200" height="260" rx="10" fill="#eef0e2" stroke="#5a6b2a" stroke-width="1.5"/>
  <g fill="#1d2a30">
    <text x="556" y="56" font-weight="bold">Reports (on demand)</text>
    <text x="556" y="82" font-size="12">day book, cash and bank book</text>
    <text x="556" y="104" font-size="12">ledger accounts</text>
    <text x="556" y="126" font-size="12">trial balance</text>
    <text x="556" y="148" font-size="12">profit and loss, balance sheet</text>
    <text x="556" y="170" font-size="12">cash flow statement</text>
    <text x="556" y="192" font-size="12">receivables ageing</text>
    <text x="556" y="214" font-size="12">bank reconciliation</text>
    <text x="556" y="236" font-size="12">tax returns</text>
    <text x="556" y="258" font-size="12">ratios, budgets, MIS</text>
  </g>
  <g stroke="#4a5a60" stroke-width="2" fill="none" marker-end="url(#ah8)">
    <path d="M220,90 C260,90 260,140 296,145"/>
    <path d="M220,225 C260,225 260,180 296,175"/>
    <line x1="460" y1="160" x2="536" y2="160"/>
  </g>
</svg>
