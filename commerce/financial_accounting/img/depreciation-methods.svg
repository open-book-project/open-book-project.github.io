<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="720" height="400" rx="12" fill="#fbfaf6"/>
  <text x="375" y="30" text-anchor="middle" fill="#1d2a30" font-size="15" font-weight="bold">Book value of a machine costing ₹2,00,000</text>
  <!-- grid: y = 330 - v/200000*280 -->
  <g stroke="#d8dcd6" stroke-width="1">
    <line x1="100" y1="50" x2="650" y2="50"/>
    <line x1="100" y1="120" x2="650" y2="120"/>
    <line x1="100" y1="190" x2="650" y2="190"/>
    <line x1="100" y1="260" x2="650" y2="260"/>
  </g>
  <g stroke="#4a5a60" stroke-width="1.5">
    <line x1="100" y1="330" x2="660" y2="330"/>
    <line x1="100" y1="330" x2="100" y2="45"/>
  </g>
  <g fill="#4a5a60" text-anchor="end" font-size="12">
    <text x="92" y="54">2,00,000</text>
    <text x="92" y="124">1,50,000</text>
    <text x="92" y="194">1,00,000</text>
    <text x="92" y="264">50,000</text>
    <text x="92" y="334">0</text>
  </g>
  <g fill="#4a5a60" text-anchor="middle" font-size="12">
    <text x="100" y="350">0</text>
    <text x="210" y="350">1</text>
    <text x="320" y="350">2</text>
    <text x="430" y="350">3</text>
    <text x="540" y="350">4</text>
    <text x="650" y="350">5</text>
    <text x="375" y="372">End of year</text>
  </g>
  <polyline fill="none" stroke="#1f4e5f" stroke-width="3" points="100,50 210,100.4 320,150.8 430,201.2 540,251.6 650,302"/>
  <polyline fill="none" stroke="#c0601e" stroke-width="3" stroke-dasharray="8 5" points="100,50 210,106 320,150.8 430,186.6 540,215.3 650,238.2"/>
  <g fill="#1f4e5f"><circle cx="100" cy="50" r="4"/><circle cx="210" cy="100.4" r="4"/><circle cx="320" cy="150.8" r="4"/><circle cx="430" cy="201.2" r="4"/><circle cx="540" cy="251.6" r="4"/><circle cx="650" cy="302" r="4"/></g>
  <g fill="#c0601e"><rect x="206" y="102" width="8" height="8"/><rect x="426" y="182.6" width="8" height="8"/><rect x="536" y="211.3" width="8" height="8"/><rect x="646" y="234.2" width="8" height="8"/></g>
  <text x="656" y="306" fill="#1f4e5f" font-size="12">20,000</text>
  <text x="656" y="236" fill="#c0601e" font-size="12">65,536</text>
  <g font-size="13">
    <line x1="420" y1="70" x2="460" y2="70" stroke="#1f4e5f" stroke-width="3"/>
    <text x="468" y="74" fill="#1d2a30">Straight line, ₹36,000 a year</text>
    <line x1="420" y1="94" x2="460" y2="94" stroke="#c0601e" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="468" y="98" fill="#1d2a30">Written down value, 20% a year</text>
  </g>
</svg>
