<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="720" height="360" rx="12" fill="#fbfaf6"/>
  <text x="360" y="30" text-anchor="middle" fill="#1d2a30" font-size="15" font-weight="bold">Layers of share capital (each layer is part of the one above)</text>
  <rect x="60" y="50" width="600" height="56" rx="8" fill="#dbe8ee" stroke="#1f4e5f"/>
  <rect x="110" y="114" width="500" height="50" rx="8" fill="#bcd6e1" stroke="#1f4e5f"/>
  <rect x="150" y="172" width="420" height="50" rx="8" fill="#9cc3d3" stroke="#1f4e5f"/>
  <rect x="190" y="230" width="340" height="50" rx="8" fill="#6aa7bc" stroke="#1f4e5f"/>
  <rect x="230" y="288" width="260" height="50" rx="8" fill="#2f6f86" stroke="#1f4e5f"/>
  <g text-anchor="middle" fill="#1d2a30">
    <text x="360" y="75" font-weight="bold">Authorised capital</text>
    <text x="360" y="94" font-size="12">the maximum the company may issue</text>
    <text x="360" y="136" font-weight="bold">Issued capital</text>
    <text x="360" y="153" font-size="12">offered to the public or others</text>
    <text x="360" y="194" font-weight="bold">Subscribed capital</text>
    <text x="360" y="211" font-size="12">actually taken up by subscribers</text>
    <text x="360" y="252" font-weight="bold" fill="#ffffff">Called-up capital</text>
    <text x="360" y="269" font-size="12" fill="#ffffff">amount demanded so far</text>
    <text x="360" y="310" font-weight="bold" fill="#ffffff">Paid-up capital</text>
    <text x="360" y="327" font-size="12" fill="#ffffff">called-up less calls in arrears</text>
  </g>
</svg>
