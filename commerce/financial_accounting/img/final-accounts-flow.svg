<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#fbfaf6"/>
  <rect x="20" y="110" width="170" height="140" rx="10" fill="#1f4e5f"/>
  <text x="105" y="160" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">Trial balance</text>
  <text x="105" y="184" text-anchor="middle" fill="#ffffff">plus adjustments</text>
  <text x="105" y="204" text-anchor="middle" fill="#ffffff">(closing stock, accruals,</text>
  <text x="105" y="222" text-anchor="middle" fill="#ffffff">depreciation, provisions)</text>
  <g stroke="#1f4e5f" stroke-width="1.5">
    <rect x="290" y="30" width="200" height="80" rx="10" fill="#e3eef2"/>
    <rect x="290" y="140" width="200" height="80" rx="10" fill="#e3eef2"/>
    <rect x="290" y="250" width="200" height="80" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
  </g>
  <g text-anchor="middle" fill="#1d2a30">
    <text x="390" y="62" font-weight="bold">Trading account</text>
    <text x="390" y="84" font-size="12">sales, purchases, direct expenses,</text>
    <text x="390" y="100" font-size="12">opening and closing stock</text>
    <text x="390" y="172" font-weight="bold">Profit and loss account</text>
    <text x="390" y="194" font-size="12">indirect expenses, other incomes,</text>
    <text x="390" y="210" font-size="12">depreciation, provisions</text>
    <text x="390" y="282" font-weight="bold">Balance sheet</text>
    <text x="390" y="304" font-size="12">assets, liabilities, capital</text>
    <text x="390" y="320" font-size="12">at the year end</text>
  </g>
  <g stroke="#4a5a60" stroke-width="2" fill="none" marker-end="url(#ah4)">
    <path d="M190,150 C240,120 250,75 286,70"/>
    <path d="M190,180 L286,180"/>
    <path d="M190,210 C240,240 250,285 286,290"/>
    <line x1="390" y1="110" x2="390" y2="136"/>
    <line x1="390" y1="220" x2="390" y2="246"/>
  </g>
  <g fill="#4a5a60" font-size="12">
    <text x="398" y="128">gross profit</text>
    <text x="398" y="238">net profit to capital</text>
  </g>
  <g fill="#1d2a30" font-size="12">
    <text x="520" y="66">Revenue items:</text>
    <text x="520" y="82">performance over</text>
    <text x="520" y="98">the year</text>
    <text x="520" y="186">Revenue items</text>
    <text x="520" y="286">Capital items:</text>
    <text x="520" y="302">position on the</text>
    <text x="520" y="318">last day</text>
  </g>
