<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="330" rx="12" fill="#fbfaf6"/>
  <rect x="280" y="20" width="200" height="44" rx="10" fill="#1f4e5f"/>
  <text x="380" y="47" text-anchor="middle" fill="#ffffff" font-weight="bold">Accounting ratios</text>
  <g stroke="#4a5a60" stroke-width="1.5">
    <line x1="380" y1="64" x2="105" y2="100"/>
    <line x1="380" y1="64" x2="290" y2="100"/>
    <line x1="380" y1="64" x2="475" y2="100"/>
    <line x1="380" y1="64" x2="660" y2="100"/>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="100" width="170" height="210" rx="10" fill="#e3eef2" stroke="#1f4e5f"/>
    <rect x="205" y="100" width="170" height="210" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
    <rect x="390" y="100" width="170" height="210" rx="10" fill="#eef0e2" stroke="#5a6b2a"/>
    <rect x="575" y="100" width="170" height="210" rx="10" fill="#efe4ee" stroke="#6b3a66"/>
  </g>
  <g fill="#1d2a30" text-anchor="middle">
    <text x="105" y="126" font-weight="bold">Liquidity</text>
    <text x="105" y="144" font-size="12">Can it pay its</text>
    <text x="105" y="158" font-size="12">short-term debts?</text>
    <text x="290" y="126" font-weight="bold">Solvency</text>
    <text x="290" y="144" font-size="12">Is it safe in the</text>
    <text x="290" y="158" font-size="12">long run?</text>
    <text x="475" y="126" font-weight="bold">Activity</text>
    <text x="475" y="144" font-size="12">How well does it</text>
    <text x="475" y="158" font-size="12">use its assets?</text>
    <text x="660" y="126" font-weight="bold">Profitability</text>
    <text x="660" y="144" font-size="12">How much does it</text>
    <text x="660" y="158" font-size="12">earn?</text>
  </g>
  <g fill="#1d2a30" font-size="12">
    <text x="34" y="192">• Current ratio</text>
    <text x="34" y="214">• Quick ratio</text>
    <text x="219" y="192">• Debt-equity</text>
    <text x="219" y="214">• Proprietary ratio</text>
    <text x="219" y="236">• Interest coverage</text>
    <text x="404" y="192">• Inventory turnover</text>
    <text x="404" y="214">• Receivables turnover</text>
    <text x="404" y="236">• Payables turnover</text>
    <text x="404" y="258">• Asset turnover</text>
    <text x="589" y="192">• Gross profit ratio</text>
    <text x="589" y="214">• Net profit ratio</text>
    <text x="589" y="236">• Operating ratio</text>
    <text x="589" y="258">• ROCE, ROE</text>
    <text x="589" y="280">• EPS, P/E</text>
  </g>
</svg>
