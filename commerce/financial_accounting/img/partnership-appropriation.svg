<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah6" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" rx="12" fill="#fbfaf6"/>
  <g stroke="#1f4e5f" stroke-width="1.5">
    <rect x="20" y="110" width="140" height="70" rx="10" fill="#1f4e5f"/>
    <rect x="200" y="110" width="150" height="70" rx="10" fill="#e3eef2"/>
    <rect x="390" y="110" width="160" height="70" rx="10" fill="#e3eef2"/>
    <rect x="590" y="110" width="150" height="70" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
  </g>
  <g text-anchor="middle">
    <text x="90" y="140" fill="#ffffff" font-weight="bold">Net profit</text>
    <text x="90" y="160" fill="#ffffff" font-size="12">from P&amp;L account</text>
    <text x="275" y="140" fill="#1d2a30" font-weight="bold">Add: interest</text>
    <text x="275" y="160" fill="#1d2a30" font-size="12">on drawings</text>
    <text x="470" y="134" fill="#1d2a30" font-weight="bold">Less: interest on</text>
    <text x="470" y="152" fill="#1d2a30" font-size="12">capital, salaries,</text>
    <text x="470" y="168" fill="#1d2a30" font-size="12">commission, reserve</text>
    <text x="665" y="140" fill="#1d2a30" font-weight="bold">Divisible profit</text>
    <text x="665" y="160" fill="#1d2a30" font-size="12">shared in the ratio</text>
  </g>
  <g stroke="#4a5a60" stroke-width="2" fill="none" marker-end="url(#ah6)">
    <line x1="160" y1="145" x2="196" y2="145"/>
    <line x1="350" y1="145" x2="386" y2="145"/>
    <line x1="550" y1="145" x2="586" y2="145"/>
    <path d="M470,180 L470,236"/>
    <path d="M665,180 L665,236"/>
  </g>
  <rect x="390" y="240" width="350" height="44" rx="10" fill="#eef0e2" stroke="#5a6b2a" stroke-width="1.5"/>
  <text x="565" y="267" text-anchor="middle" fill="#1d2a30" font-weight="bold">Credited to partners' current (or capital) accounts</text>
  <text x="380" y="50" text-anchor="middle" fill="#1d2a30" font-size="15" font-weight="bold">Profit and loss appropriation account</text>
  <text x="380" y="74" text-anchor="middle" fill="#4a5a60" font-size="12">Everything here is a division of profit among partners, not an expense of the firm</text>
</svg>
