<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" rx="12" fill="#fbfaf6"/>
  <rect x="20" y="60" width="200" height="220" rx="10" fill="#1f4e5f"/>
  <text x="120" y="96" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">Receipts and</text>
  <text x="120" y="116" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">payments account</text>
  <text x="120" y="150" text-anchor="middle" fill="#ffffff">all cash received and paid,</text>
  <text x="120" y="168" text-anchor="middle" fill="#ffffff">capital or revenue,</text>
  <text x="120" y="186" text-anchor="middle" fill="#ffffff">of any year</text>
  <text x="120" y="230" text-anchor="middle" fill="#ffffff">opening and closing</text>
  <text x="120" y="248" text-anchor="middle" fill="#ffffff">cash and bank balances</text>
  <g stroke="#1f4e5f" stroke-width="1.5">
    <rect x="460" y="30" width="280" height="80" rx="10" fill="#e3eef2"/>
    <rect x="460" y="130" width="280" height="80" rx="10" fill="#eef0e2" stroke="#5a6b2a"/>
    <rect x="460" y="230" width="280" height="80" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
  </g>
  <g text-anchor="middle" fill="#1d2a30">
    <text x="600" y="60" font-weight="bold">Income and expenditure account</text>
    <text x="600" y="80" font-size="12">revenue items of this year only,</text>
    <text x="600" y="96" font-size="12">adjusted for accruals; surplus or deficit</text>
    <text x="600" y="160" font-weight="bold">Specific funds</text>
    <text x="600" y="180" font-size="12">donations for a stated purpose,</text>
    <text x="600" y="196" font-size="12">less expenses met from them</text>
    <text x="600" y="260" font-weight="bold">Balance sheet</text>
    <text x="600" y="280" font-size="12">capital fund, funds, assets,</text>
    <text x="600" y="296" font-size="12">liabilities, accruals and advances</text>
  </g>
  <g stroke="#4a5a60" stroke-width="2" fill="none" marker-end="url(#ah5)">
    <path d="M220,120 C320,110 360,70 456,70"/>
    <path d="M220,170 L456,170"/>
    <path d="M220,230 C320,240 360,270 456,270"/>
  </g>
  <g fill="#4a5a60" font-size="12">
    <text x="236" y="58">revenue receipts and payments</text>
    <text x="270" y="162">specific donations</text>
    <text x="250" y="306">capital items and balances</text>
  </g>
</svg>
