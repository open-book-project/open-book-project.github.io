<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" rx="12" fill="#fbfaf6"/>
  <rect x="40" y="40" width="200" height="80" rx="10" fill="#e3eef2" stroke="#1f4e5f" stroke-width="1.5"/>
  <text x="140" y="72" text-anchor="middle" font-weight="bold" fill="#1d2a30">Drawer (seller)</text>
  <text x="140" y="94" text-anchor="middle" fill="#1d2a30">writes the bill;</text>
  <text x="140" y="110" text-anchor="middle" fill="#1d2a30">holds it as bills receivable</text>
  <rect x="520" y="40" width="200" height="80" rx="10" fill="#f7ead9" stroke="#8a4b12" stroke-width="1.5"/>
  <text x="620" y="72" text-anchor="middle" font-weight="bold" fill="#1d2a30">Drawee (buyer)</text>
  <text x="620" y="94" text-anchor="middle" fill="#1d2a30">accepts the bill;</text>
  <text x="620" y="110" text-anchor="middle" fill="#1d2a30">records it as bills payable</text>
  <rect x="280" y="210" width="200" height="80" rx="10" fill="#eef0e2" stroke="#5a6b2a" stroke-width="1.5"/>
  <text x="380" y="242" text-anchor="middle" font-weight="bold" fill="#1d2a30">Payee</text>
  <text x="380" y="264" text-anchor="middle" fill="#1d2a30">receives payment at maturity:</text>
  <text x="380" y="280" text-anchor="middle" fill="#1d2a30">drawer, bank or endorsee</text>
  <g stroke="#4a5a60" stroke-width="2" fill="none" marker-end="url(#ah3)">
    <line x1="240" y1="62" x2="516" y2="62"/>
    <line x1="520" y1="100" x2="244" y2="100"/>
    <path d="M620,120 C620,200 560,250 484,250"/>
    <path d="M140,120 C140,200 200,240 276,240"/>
  </g>
  <rect x="300" y="44" width="160" height="22" fill="#fbfaf6"/>
  <text x="380" y="58" text-anchor="middle" fill="#4a5a60">1. goods and the bill</text>
  <rect x="300" y="90" width="160" height="22" fill="#fbfaf6"/>
  <text x="380" y="105" text-anchor="middle" fill="#4a5a60">2. bill returned, accepted</text>
  <text x="650" y="200" fill="#4a5a60">4. pays on</text>
  <text x="650" y="216" fill="#4a5a60">due date</text>
  <text x="40" y="190" fill="#4a5a60">3. keeps, discounts</text>
  <text x="40" y="206" fill="#4a5a60">or endorses it</text>
</svg>
