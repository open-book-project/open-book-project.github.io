<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a5a60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" rx="12" fill="#fbfaf6"/>
  <g stroke="#1f4e5f" stroke-width="1.5">
    <rect x="20" y="40" width="160" height="70" rx="10" fill="#e3eef2"/>
    <rect x="300" y="40" width="160" height="70" rx="10" fill="#e3eef2"/>
    <rect x="580" y="40" width="160" height="70" rx="10" fill="#e3eef2"/>
    <rect x="580" y="190" width="160" height="70" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
    <rect x="300" y="190" width="160" height="70" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
    <rect x="20" y="190" width="160" height="70" rx="10" fill="#f7ead9" stroke="#8a4b12"/>
  </g>
  <g text-anchor="middle" fill="#1d2a30">
    <text x="100" y="70" font-weight="bold">1. Transaction</text>
    <text x="100" y="92" font-size="12">and source document</text>
    <text x="380" y="70" font-weight="bold">2. Journal</text>
    <text x="380" y="92" font-size="12">book of original entry</text>
    <text x="660" y="70" font-weight="bold">3. Ledger</text>
    <text x="660" y="92" font-size="12">posting to accounts</text>
    <text x="660" y="220" font-weight="bold">4. Trial balance</text>
    <text x="660" y="242" font-size="12">check of arithmetic</text>
    <text x="380" y="220" font-weight="bold">5. Adjustments</text>
    <text x="380" y="242" font-size="12">errors, accruals, depreciation</text>
    <text x="100" y="220" font-weight="bold">6. Final accounts</text>
    <text x="100" y="242" font-size="12">profit and loss, balance sheet</text>
  </g>
  <g stroke="#4a5a60" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="180" y1="75" x2="296" y2="75"/>
    <line x1="460" y1="75" x2="576" y2="75"/>
    <line x1="660" y1="110" x2="660" y2="186"/>
    <line x1="580" y1="225" x2="464" y2="225"/>
    <line x1="300" y1="225" x2="184" y2="225"/>
    <path d="M100,190 L100,114"/>
  </g>
  <text x="112" y="156" fill="#4a5a60" font-size="12">next period</text>
  <text x="380" y="150" text-anchor="middle" fill="#1f4e5f" font-size="13">Recording (top row) and reporting (bottom row)</text>
</svg>
