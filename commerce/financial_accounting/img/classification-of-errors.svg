<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="330" rx="12" fill="#fbfaf6"/>
  <rect x="300" y="20" width="160" height="40" rx="8" fill="#1f4e5f"/>
  <text x="380" y="45" text-anchor="middle" fill="#ffffff" font-weight="bold">Accounting errors</text>
  <rect x="120" y="100" width="180" height="40" rx="8" fill="#e3eef2" stroke="#1f4e5f"/>
  <text x="210" y="125" text-anchor="middle" fill="#1d2a30" font-weight="bold">Clerical errors</text>
  <rect x="460" y="100" width="180" height="40" rx="8" fill="#e3eef2" stroke="#1f4e5f"/>
  <text x="550" y="125" text-anchor="middle" fill="#1d2a30" font-weight="bold">Errors of principle</text>
  <g fill="#f7ead9" stroke="#8a4b12">
    <rect x="20" y="180" width="170" height="40" rx="8"/>
    <rect x="200" y="180" width="170" height="40" rx="8"/>
    <rect x="380" y="180" width="170" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1d2a30">
    <text x="105" y="205">Omission</text>
    <text x="285" y="205">Commission</text>
    <text x="465" y="205">Compensating</text>
  </g>
  <g stroke="#4a5a60" stroke-width="1.5" fill="none">
    <line x1="380" y1="60" x2="210" y2="100"/>
    <line x1="380" y1="60" x2="550" y2="100"/>
    <line x1="210" y1="140" x2="105" y2="180"/>
    <line x1="210" y1="140" x2="285" y2="180"/>
    <line x1="210" y1="140" x2="465" y2="180"/>
  </g>
  <g font-size="12" fill="#1d2a30">
    <text x="22" y="240">complete: TB agrees</text>
    <text x="22" y="256">partial: TB disagrees</text>
    <text x="202" y="240">wrong amount, side,</text>
    <text x="202" y="256">account or casting:</text>
    <text x="202" y="272">usually TB disagrees</text>
    <text x="382" y="240">errors cancel out:</text>
    <text x="382" y="256">TB agrees</text>
    <text x="560" y="160">capital and revenue</text>
    <text x="560" y="176">items confused:</text>
    <text x="560" y="192">TB agrees</text>
  </g>
  <text x="380" y="312" text-anchor="middle" fill="#4a5a60" font-size="12">One-sided errors upset the trial balance; two-sided errors do not.</text>
</svg>
