<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-label="Series, parallel and feedback interconnections of systems" font-family="Georgia,'Times New Roman',serif">
<defs><marker id="ah33445a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33445a"/></marker></defs>
