<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4521a"/></marker></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="30" y="30" font-size="12" fill="#6b7280" font-weight="600">TIMING SIGNALS</text>
<rect x="150" y="14" width="50" height="24" rx="5" fill="#ffffff" stroke="#c9ced6"/>
<text x="175" y="31" text-anchor="middle" font-weight="700" fill="#6b7280">T0</text>
<rect x="208" y="14" width="50" height="24" rx="5" fill="#ffffff" stroke="#c9ced6"/>
<text x="233" y="31" text-anchor="middle" font-weight="700" fill="#6b7280">T1</text>
<rect x="266" y="14" width="50" height="24" rx="5" fill="#ffffff" stroke="#c9ced6"/>
<text x="291" y="31" text-anchor="middle" font-weight="700" fill="#6b7280">T2</text>
<rect x="324" y="14" width="50" height="24" rx="5" fill="#ffffff" stroke="#c9ced6"/>
<text x="349" y="31" text-anchor="middle" font-weight="700" fill="#6b7280">T3</text>
<rect x="382" y="14" width="50" height="24" rx="5" fill="#ffffff" stroke="#c9ced6"/>
<text x="407" y="31" text-anchor="middle" font-weight="700" fill="#6b7280">T4</text>
<rect x="440" y="14" width="50" height="24" rx="5" fill="#ffffff" stroke="#c9ced6"/>
<text x="465" y="31" text-anchor="middle" font-weight="700" fill="#6b7280">T5</text>
<text x="30" y="72" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#1f2933">Before T0: the instruction at 021 is next</text>
<text x="30" y="100" font-size="12" font-weight="600" fill="#6b7280">MEMORY (ADDRESS, CONTENT)</text>
<rect x="30" y="108" width="230" height="140" rx="6" fill="#ffffff" stroke="#c9ced6"/>
<text x="44" y="137" font-family="ui-monospace,Consolas,Menlo,monospace" fill="#6b7280">021</text>
<text x="100" y="137" font-family="ui-monospace,Consolas,Menlo,monospace" font-weight="700" fill="#1f2933">2350</text>
<text x="158" y="137" font-size="11" fill="#6b7280">LDA 350</text>
<text x="44" y="173" font-family="ui-monospace,Consolas,Menlo,monospace" fill="#6b7280">022</text>
<text x="100" y="173" font-family="ui-monospace,Consolas,Menlo,monospace" font-weight="700" fill="#1f2933">....</text>
<text x="158" y="173" font-size="11" fill="#6b7280">next</text>
<text x="44" y="209" font-family="ui-monospace,Consolas,Menlo,monospace" fill="#6b7280">...</text>
<text x="100" y="209" font-family="ui-monospace,Consolas,Menlo,monospace" font-weight="700" fill="#1f2933"></text>
<text x="158" y="209" font-size="11" fill="#6b7280"></text>
<text x="44" y="245" font-family="ui-monospace,Consolas,Menlo,monospace" fill="#6b7280">350</text>
<text x="100" y="245" font-family="ui-monospace,Consolas,Menlo,monospace" font-weight="700" fill="#1f2933">07B0</text>
<text x="158" y="245" font-size="11" fill="#6b7280">operand</text>
<line x1="340" y1="104" x2="340" y2="360" stroke="#9aa3af" stroke-width="6" stroke-linecap="round"/>
<text transform="translate(360,232) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="1.5">COMMON BUS</text>
<line x1="260" y1="178" x2="340" y2="178" stroke="#9aa3af" stroke-width="3"/>
<line x1="340" y1="132" x2="450" y2="132" stroke="#9aa3af" stroke-width="3"/>
<line x1="340" y1="188" x2="450" y2="188" stroke="#9aa3af" stroke-width="3"/>
<line x1="340" y1="244" x2="450" y2="244" stroke="#9aa3af" stroke-width="3"/>
<line x1="340" y1="300" x2="450" y2="300" stroke="#9aa3af" stroke-width="3"/>
<line x1="340" y1="356" x2="450" y2="356" stroke="#9aa3af" stroke-width="3"/>
<rect x="450" y="112" width="290" height="40" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
<text x="464" y="138" font-weight="700" fill="#1f2933">PC</text>
<text x="726" y="139" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#1f2933" text-anchor="end">021</text>
<rect x="450" y="168" width="290" height="40" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
<text x="464" y="194" font-weight="700" fill="#1f2933">AR</text>
<text x="726" y="195" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#6b7280" text-anchor="end">—</text>
<rect x="450" y="224" width="290" height="40" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
<text x="464" y="250" font-weight="700" fill="#1f2933">IR</text>
<text x="726" y="251" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#6b7280" text-anchor="end">—</text>
<rect x="450" y="280" width="290" height="40" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
<text x="464" y="306" font-weight="700" fill="#1f2933">DR</text>
<text x="726" y="307" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#6b7280" text-anchor="end">—</text>
<rect x="450" y="336" width="290" height="40" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
<text x="464" y="362" font-weight="700" fill="#1f2933">AC</text>
<text x="726" y="363" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#1f2933" text-anchor="end">0000</text>
<text x="30" y="404" font-size="14" fill="#1f2933">PC holds the address of the next instruction, 021.</text>
<text x="30" y="424" font-size="14" fill="#1f2933">The word there, 2350, is LDA 350: load the content of 350 into AC.</text>
</svg>
