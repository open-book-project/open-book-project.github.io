<svg viewBox="0 0 660 300" role="img" aria-label="Pronoun order before the verb: slot 1 me te se nous vous, slot 2 le la les, slot 3 lui leur, slot 4 y, slot 5 en, then the verb." xmlns="http://www.w3.org/2000/svg"><title>Read the slots left to right. The negative ne goes before slot 1; pas goes after the verb (or the auxiliary).</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .po-s { fill: var(--sheet); stroke: var(--accent); stroke-width: 2.5; }
        .po-v { fill: var(--accent-soft); stroke: var(--role-verb); stroke-width: 2.5; }
        .po-n { font: 800 13px var(--font); fill: var(--text-soft); }
        .po-w { font: 700 16px var(--font); fill: var(--text); }
        .po-vt { font: 800 17px var(--font); fill: var(--role-verb); }
        .po-ex { font: 600 14px var(--font); fill: var(--text); }
        .po-ln { fill: none; stroke: var(--line-strong); stroke-width: 2; }
      </style></defs>
      <text class="po-n" x="64" y="26" text-anchor="middle">1</text>
      <text class="po-n" x="176" y="26" text-anchor="middle">2</text>
      <text class="po-n" x="288" y="26" text-anchor="middle">3</text>
      <text class="po-n" x="388" y="26" text-anchor="middle">4</text>
      <text class="po-n" x="476" y="26" text-anchor="middle">5</text>
      <rect class="po-s" x="14" y="36" width="100" height="150" rx="14"/>
      <text class="po-w" x="64" y="66" text-anchor="middle">me</text>
      <text class="po-w" x="64" y="94" text-anchor="middle">te</text>
      <text class="po-w" x="64" y="122" text-anchor="middle">se</text>
      <text class="po-w" x="64" y="150" text-anchor="middle">nous</text>
      <text class="po-w" x="64" y="178" text-anchor="middle">vous</text>
      <rect class="po-s" x="126" y="56" width="100" height="110" rx="14"/>
      <text class="po-w" x="176" y="88" text-anchor="middle">le</text>
      <text class="po-w" x="176" y="116" text-anchor="middle">la</text>
      <text class="po-w" x="176" y="144" text-anchor="middle">les</text>
      <rect class="po-s" x="238" y="76" width="100" height="70" rx="14"/>
      <text class="po-w" x="288" y="106" text-anchor="middle">lui</text>
      <text class="po-w" x="288" y="132" text-anchor="middle">leur</text>
      <rect class="po-s" x="350" y="90" width="76" height="44" rx="14"/>
      <text class="po-w" x="388" y="118" text-anchor="middle">y</text>
      <rect class="po-s" x="438" y="90" width="76" height="44" rx="14"/>
      <text class="po-w" x="476" y="118" text-anchor="middle">en</text>
      <rect class="po-v" x="530" y="80" width="116" height="64" rx="14"/>
      <text class="po-vt" x="588" y="118" text-anchor="middle">VERB</text>
      <path class="po-ln" d="M14 214 L646 214"/>
      <text class="po-ex" x="20" y="242">Il <tspan font-weight="800">me le</tspan> donne. · Je <tspan font-weight="800">le lui</tspan> dis. · Elle <tspan font-weight="800">nous en</tspan> parle.</text>
      <text class="po-ex" x="20" y="270">Il <tspan font-weight="800">y en</tspan> a. · Je <tspan font-weight="800">t’y</tspan> emmène. · Je <tspan font-weight="800">leur en</tspan> ai donné.</text>
    </svg>