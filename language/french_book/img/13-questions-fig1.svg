<svg viewBox="0 0 640 300" role="img" aria-label="Register ladder. Bottom step, everyday speech: intonation, Tu parles français? Middle step, neutral and always safe: est-ce que, Est-ce que tu parles français? Top step, formal and written: inversion, Parles-tu français?" xmlns="http://www.w3.org/2000/svg"><title>All three mean “Do you speak French?”. At A1, speak with the bottom two, and learn to read the top one.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .st1 { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .st2 { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .sh { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
          .sx { font: 700 16px var(--font); fill: var(--text); }
          .sv2 { fill: var(--role-verb); }
          .sn { font: 500 12px var(--font); fill: var(--text-soft); }
          .ar2 { stroke: var(--text-soft); stroke-width: 2; fill: none; }
        </style></defs>
        <rect class="st1" x="20" y="208" width="400" height="74" rx="14"/>
        <text class="sh" x="40" y="232">EVERYDAY SPEECH · INTONATION</text>
        <text class="sx" x="40" y="258">Tu <tspan class="sv2">parles</tspan> français ? ↗</text>
        <text class="sn" x="40" y="275">same words as a statement, voice rises at the end</text>
        <rect class="st2" x="110" y="114" width="400" height="74" rx="14"/>
        <text class="sh" x="130" y="138">NEUTRAL · ALWAYS SAFE · EST-CE QUE</text>
        <text class="sx" x="130" y="164">Est-ce que tu <tspan class="sv2">parles</tspan> français ?</text>
        <text class="sn" x="130" y="181">add est-ce que in front — no change to word order</text>
        <rect class="st1" x="200" y="20" width="420" height="74" rx="14"/>
        <text class="sh" x="220" y="44">FORMAL · WRITING · INVERSION</text>
        <text class="sx" x="220" y="70"><tspan class="sv2">Parles</tspan>-tu français ?</text>
        <text class="sn" x="220" y="87">verb first, hyphen, then the subject pronoun</text>
        <path class="ar2" d="M560 270 V120 M552 130 L560 118 L568 130"/>
        <text class="sn" x="575" y="200" transform="rotate(-90 575 200)">more formal</text>
      </svg>