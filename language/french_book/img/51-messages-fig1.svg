<svg viewBox="0 0 680 380" role="img" aria-label="Register ladder: five levels from intimate to very formal, with the matching greetings on the left and closings on the right" xmlns="http://www.w3.org/2000/svg"><title>The register ladder. Greeting and closing always come from the same row . The dashed line is the tu/vous border.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.rl-row { fill: var(--canvas); stroke: var(--line); stroke-width: 1; }
.rl-pill { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.rl-lvl { font: 700 13px var(--font); fill: var(--text); }
.rl-fr { font: 600 13px var(--font); fill: var(--text); }
.rl-head { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
.rl-axis { fill: none; stroke: var(--accent); stroke-width: 3; }
.rl-dash { fill: none; stroke: var(--g-f); stroke-width: 2; stroke-dasharray: 6 5; }
.rl-tv { font: 800 12px var(--font); fill: var(--g-f); }
.rl-soft { font: 600 12px var(--font); fill: var(--text-soft); }
</style>
</defs>
<text class="rl-head" x="235" y="26" text-anchor="end">GREETING</text>
<text class="rl-head" x="310" y="26" text-anchor="middle">REGISTER</text>
<text class="rl-head" x="385" y="26">CLOSING</text>

<path class="rl-axis" d="M28 50 L28 350"/>
<path class="rl-axis" d="M20 338 L28 354 L36 338"/>
<text class="rl-soft" x="16" y="200" text-anchor="middle" transform="rotate(-90 16 200)">more formal</text>

<g>
<rect class="rl-row" x="48" y="44" width="624" height="52" rx="10"/>
<rect class="rl-pill" x="245" y="52" width="130" height="36" rx="18"/>
<text class="rl-lvl" x="310" y="75" text-anchor="middle">Intime · tu</text>
<text class="rl-fr" x="235" y="75" text-anchor="end">Coucou ! · Mon chéri,</text>
<text class="rl-fr" x="385" y="75">Bisous · Je t’embrasse</text>
</g>
<g>
<rect class="rl-row" x="48" y="104" width="624" height="52" rx="10"/>
<rect class="rl-pill" x="245" y="112" width="130" height="36" rx="18"/>
<text class="rl-lvl" x="310" y="135" text-anchor="middle">Amical · tu</text>
<text class="rl-fr" x="235" y="135" text-anchor="end">Salut Léa ! · Cher Paul,</text>
<text class="rl-fr" x="385" y="135">Bises · À bientôt · Amitiés</text>
</g>

<path class="rl-dash" d="M48 165 L672 165"/>

<g>
<rect class="rl-row" x="48" y="174" width="624" height="52" rx="10"/>
<rect class="rl-pill" x="245" y="182" width="130" height="36" rx="18"/>
<text class="rl-lvl" x="310" y="205" text-anchor="middle">Courant · vous</text>
<text class="rl-fr" x="235" y="205" text-anchor="end">Bonjour Madame Dupont,</text>
<text class="rl-fr" x="385" y="205">Bonne journée · Bien cordialement</text>
</g>
<g>
<rect class="rl-row" x="48" y="234" width="624" height="52" rx="10"/>
<rect class="rl-pill" x="245" y="242" width="130" height="36" rx="18"/>
<text class="rl-lvl" x="310" y="265" text-anchor="middle">Formel · vous</text>
<text class="rl-fr" x="235" y="265" text-anchor="end">Madame, · Monsieur,</text>
<text class="rl-fr" x="385" y="265">Cordialement · Bien à vous</text>
</g>
<g>
<rect class="rl-row" x="48" y="294" width="624" height="62" rx="10"/>
<rect class="rl-pill" x="245" y="307" width="130" height="36" rx="18"/>
<text class="rl-lvl" x="310" y="330" text-anchor="middle">Très formel</text>
<text class="rl-fr" x="235" y="330" text-anchor="end">Madame, Monsieur,</text>
<text class="rl-fr" x="385" y="320">Veuillez agréer… l’expression</text>
<text class="rl-fr" x="385" y="340">de mes salutations distinguées.</text>
</g>
<rect x="582" y="157" width="86" height="17" rx="8" fill="var(--sheet)"/>
<text class="rl-tv" x="625" y="170" text-anchor="middle">tu ↑ · vous ↓</text>
</svg>