<text class="bz-n" x="122" y="119" text-anchor="middle">4</text>
<text class="bz-n" x="172" y="163" text-anchor="middle">4</text>
<text class="bz-n" x="216" y="47" text-anchor="middle">4</text>
<text class="bz-n" x="262" y="281" text-anchor="middle">3</text>
