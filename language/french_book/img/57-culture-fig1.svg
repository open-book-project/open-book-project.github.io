<text class="bz-h" x="416" y="40">How many bises?</text>
<text class="bz-s" x="416" y="58">approximate — it varies a lot</text>
<rect class="bz-1 bz-k" x="416" y="78" width="22" height="22" rx="5"/>
<text class="bz-t" x="446" y="88">1 — Finistère</text><text class="bz-s" x="446" y="103">(western Brittany)</text>
