<text class="bz-t" x="446" y="128">2 — most of France</text><text class="bz-s" x="446" y="143">incl. Paris — safe default</text>
<rect class="bz-3 bz-k" x="416" y="158" width="22" height="22" rx="5"/>
<text class="bz-t" x="446" y="168">3 — parts of the south</text><text class="bz-s" x="446" y="183">Montpellier, Provence,</text><text class="bz-s" x="446" y="197">Drôme, Ardèche</text>
<rect class="bz-4 bz-k" x="416" y="212" width="22" height="22" rx="5"/>
