<svg viewBox="0 0 640 360" role="img" aria-label="Schematic map of France showing the approximate number of bises by region: one in Finistère, two in most of France including Paris, three in parts of the south around Montpellier, Provence, Drôme and Ardèche, and four in parts of the north and west such as Normandy, the Loire area and the Nord." xmlns="http://www.w3.org/2000/svg"><title>A schematic sketch of la bise in France. Borders are fuzzy: two neighbouring towns, or two families, may do it differently.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs><style>
.bz-land { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.bz-1 { fill: var(--g-pl); opacity: .5; }
.bz-3 { fill: var(--g-f); opacity: .42; }
.bz-4 { fill: var(--g-m); opacity: .42; }
.bz-n { font: 800 20px var(--font); fill: var(--text); }
.bz-city { fill: var(--text); }
.bz-c { font: 600 12px var(--font); fill: var(--text-soft); }
.bz-h { font: 800 16px var(--font); fill: var(--text); }
.bz-t { font: 600 13px var(--font); fill: var(--text); }
.bz-s { font: 500 12px var(--font); fill: var(--text-soft); }
.bz-k { stroke: var(--line-strong); stroke-width: 1; }
</style></defs>
<path class="bz-land" d="M205 18 L222 30 L248 40 L268 50 L280 66 L299 74 L330 82 L356 94 L346 120 L340 148 L322 168 L310 190 L302 200 L321 210 L314 240 L326 262 L338 290 L318 302 L297 317 L282 312 L262 306 L243 302 L228 315 L226 343 L190 335 L150 328 L120 318 L100 308 L112 280 L114 250 L114 224 L112 202 L100 182 L96 164 L86 152 L60 145 L32 138 L20 130 L24 116 L40 106 L70 108 L92 112 L104 108 L98 70 L112 74 L133 87 L145 76 L165 62 L172 58 L182 40 L191 22 Z"/>
