<text class="bz-s" x="416" y="270">Since Covid, a handshake, a wave</text>
<text class="bz-s" x="416" y="286">or no bise is widely accepted.</text>
<text class="bz-s" x="416" y="312">Rule of thumb: let the other</text>
<text class="bz-s" x="416" y="328">person lead — and count.</text>
