<svg viewBox="0 0 660 330" role="img" aria-label="Adverb position slots. Simple tense: subject, verb, then the adverb slot: Il parle bien. Compound tense: subject, auxiliary, then a slot for short adverbs such as bien, mal, déjà, souvent, beaucoup, trop, toujours, vraiment, then the past participle, then a slot for long -ment adverbs and time and place words: Il a parlé lentement hier. Time and place adverbs can also open the sentence." xmlns="http://www.w3.org/2000/svg"><title>The dashed boxes are the adverb slots. Short adverbs squeeze in before the participle; long and time/place adverbs wait at the end.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .sbj { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .vb { fill: var(--role-verb); }
          .adb { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
          .w1 { font: 800 15px var(--font); fill: var(--text); }
          .w2 { font: 800 15px var(--font); fill: var(--sheet); }
          .w3 { font: 800 14px var(--font); fill: var(--accent-ink); }
          .sm { font: 500 12px var(--font); fill: var(--text-soft); }
          .hd { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
        </style></defs>
        <text class="hd" x="20" y="26">SIMPLE TENSE (présent, imparfait, futur…)</text>
        <rect class="sbj" x="20" y="38" width="90" height="48" rx="10"/><text class="w1" x="65" y="68" text-anchor="middle">il</text>
        <rect class="vb" x="120" y="38" width="120" height="48" rx="10"/><text class="w2" x="180" y="68" text-anchor="middle">parle</text>
        <rect class="adb" x="250" y="38" width="190" height="48" rx="10"/><text class="w3" x="345" y="68" text-anchor="middle">bien · souvent · vite</text>
        <rect class="sbj" x="450" y="38" width="190" height="48" rx="10"/><text class="w1" x="545" y="68" text-anchor="middle">français</text>
        <text class="sm" x="20" y="108">Il parle souvent français. — never “il souvent parle”</text>

        <text class="hd" x="20" y="150">COMPOUND TENSE (passé composé…)</text>
        <rect class="sbj" x="20" y="162" width="60" height="48" rx="10"/><text class="w1" x="50" y="192" text-anchor="middle">il</text>
        <rect class="vb" x="88" y="162" width="60" height="48" rx="10"/><text class="w2" x="118" y="192" text-anchor="middle">a</text>
        <rect class="adb" x="156" y="162" width="190" height="48" rx="10"/><text class="w3" x="251" y="184" text-anchor="middle">SHORT</text><text class="sm" x="251" y="201" text-anchor="middle">bien, déjà, beaucoup, trop…</text>
        <rect class="vb" x="354" y="162" width="100" height="48" rx="10"/><text class="w2" x="404" y="192" text-anchor="middle">parlé</text>
        <rect class="adb" x="462" y="162" width="178" height="48" rx="10"/><text class="w3" x="551" y="184" text-anchor="middle">LONG / TIME / PLACE</text><text class="sm" x="551" y="201" text-anchor="middle">lentement, hier, ici</text>
        <text class="sm" x="20" y="232">Il a bien parlé. · Il a déjà mangé. · Il a parlé lentement. · Il a mangé ici hier.</text>

        <text class="hd" x="20" y="274">TIME &amp; PLACE ALSO OPEN THE SENTENCE</text>
        <rect class="adb" x="20" y="286" width="190" height="34" rx="10"/><text class="w3" x="115" y="308" text-anchor="middle">Hier, · Ici,</text>
        <text class="sm" x="222" y="308">Hier, j’ai vu Paul. · Demain, on part tôt.</text>
      </svg>