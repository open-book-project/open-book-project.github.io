<svg viewBox="0 0 640 300" role="img" aria-label="A boot shape around je, tu, il and ils: these forms get the spelling change, for example j'achète and ils achètent. Nous achetons and vous achetez, outside the boot, keep the infinitive spelling." xmlns="http://www.w3.org/2000/svg"><title>The same boot works for acheter (è), appeler (ll), préférer (è) and payer (i).</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .bt { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
          .cel { font: 700 16px var(--font); fill: var(--text); }
          .chg { fill: var(--g-f); font-weight: 800; }
          .out { font: 700 16px var(--font); fill: var(--text-soft); }
          .ttl { font: 800 14px var(--font); fill: var(--text); }
          .nt { font: 500 12.5px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="ttl" x="320" y="26" text-anchor="middle">acheter (to buy)</text>
        <path class="bt" d="M60 46 H200 V176 H330 V270 H60 Z"/>
        <text class="cel" x="80" y="84">j’ach<tspan class="chg">è</tspan>te</text>
        <text class="cel" x="80" y="130">tu ach<tspan class="chg">è</tspan>tes</text>
        <text class="cel" x="80" y="176">il ach<tspan class="chg">è</tspan>te</text>
        <text class="cel" x="80" y="244">ils ach<tspan class="chg">è</tspan>tent</text>
        <text class="out" x="240" y="84">nous achetons</text>
        <text class="out" x="240" y="130">vous achetez</text>
        <text class="nt" x="380" y="210">Inside the boot: the ending is</text>
        <text class="nt" x="380" y="228">silent, so the stem changes.</text>
        <text class="nt" x="380" y="254">Outside: -ons / -ez are heard,</text>
        <text class="nt" x="380" y="272">so the stem stays as in acheter.</text>
      </svg>