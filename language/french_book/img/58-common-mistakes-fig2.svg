<svg viewBox="0 0 640 250" role="img" aria-label="Five-step check: one, verb — avoir or être, and which tense; two, article — le, un, du or de; three, agreement — add e or s; four, preposition — à, en, de or chez; five, pronoun — before the verb, in the right order." xmlns="http://www.w3.org/2000/svg"><title>The five-second check: verb, article, agreement, preposition, pronoun.</title><style>svg{--accent:#ea580c;--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .rf-box { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
        .rf-num { fill: var(--bad); }
        .rf-nt { font: 800 15px var(--font); fill: var(--sheet); }
        .rf-t { font: 800 14px var(--font); fill: var(--text); }
        .rf-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .rf-ar { fill: none; stroke: var(--accent); stroke-width: 2.5; }
        .rf-h { font: 800 16px var(--font); fill: var(--text); }
      </style></defs>
      <text class="rf-h" x="20" y="30">Five checks before you hit “send”</text>
      <rect class="rf-box" x="12" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="67" cy="86" r="15"/><text class="rf-nt" x="67" y="91" text-anchor="middle">1</text>
      <text class="rf-t" x="67" y="128" text-anchor="middle">Verb</text>
      <text class="rf-s" x="67" y="150" text-anchor="middle">avoir or être?</text>
      <text class="rf-s" x="67" y="168" text-anchor="middle">which tense</text>
      <text class="rf-s" x="67" y="186" text-anchor="middle">after si/quand?</text>
      <path class="rf-ar" d="M124 135 L136 135"/>
      <rect class="rf-box" x="138" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="193" cy="86" r="15"/><text class="rf-nt" x="193" y="91" text-anchor="middle">2</text>
      <text class="rf-t" x="193" y="128" text-anchor="middle">Article</text>
      <text class="rf-s" x="193" y="150" text-anchor="middle">le / un / du?</text>
      <text class="rf-s" x="193" y="168" text-anchor="middle">de after pas</text>
      <text class="rf-s" x="193" y="186" text-anchor="middle">and beaucoup</text>
      <path class="rf-ar" d="M250 135 L262 135"/>
      <rect class="rf-box" x="264" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="319" cy="86" r="15"/><text class="rf-nt" x="319" y="91" text-anchor="middle">3</text>
      <text class="rf-t" x="319" y="128" text-anchor="middle">Agreement</text>
      <text class="rf-s" x="319" y="150" text-anchor="middle">-e for feminine</text>
      <text class="rf-s" x="319" y="168" text-anchor="middle">-s for plural</text>
      <text class="rf-s" x="319" y="186" text-anchor="middle">être participles</text>
      <path class="rf-ar" d="M376 135 L388 135"/>
      <rect class="rf-box" x="390" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="445" cy="86" r="15"/><text class="rf-nt" x="445" y="91" text-anchor="middle">4</text>
      <text class="rf-t" x="445" y="128" text-anchor="middle">Preposition</text>
      <text class="rf-s" x="445" y="150" text-anchor="middle">à / en / au</text>
      <text class="rf-s" x="445" y="168" text-anchor="middle">chez a person</text>
      <text class="rf-s" x="445" y="186" text-anchor="middle">verb + its prep</text>
      <path class="rf-ar" d="M502 135 L514 135"/>
      <rect class="rf-box" x="516" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="571" cy="86" r="15"/><text class="rf-nt" x="571" y="91" text-anchor="middle">5</text>
      <text class="rf-t" x="571" y="128" text-anchor="middle">Pronoun</text>
      <text class="rf-s" x="571" y="150" text-anchor="middle">le or lui?</text>
      <text class="rf-s" x="571" y="168" text-anchor="middle">y / en needed?</text>
      <text class="rf-s" x="571" y="186" text-anchor="middle">right order</text>
      <text class="rf-s" x="20" y="238">Calques and false friends are easier: if a phrase feels “too English”, look it up.</text>
    </svg>