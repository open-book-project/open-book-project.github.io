<svg viewBox="0 0 640 260" role="img" aria-label="A timeline of the day from 6 am to midnight. Bonjour from morning until about 6 pm, bonsoir from about 6 pm, bonne nuit only when going to bed. When leaving: bonne journée in the day, bonne soirée in the evening. Salut at any time with friends." xmlns="http://www.w3.org/2000/svg"><title>Bonne nuit is only for going to bed — never a greeting. When you leave, wish people a good rest of the day or evening.</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-pl:#7c3aed;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .day { fill: var(--accent-soft); }
        .eve { fill: var(--g-pl); opacity: .25; }
        .night { fill: var(--g-pl); opacity: .5; }
        .axis { fill: none; stroke: var(--line-strong); stroke-width: 2; }
        .tick { font: 600 12px var(--font); fill: var(--text-soft); }
        .gr { font: 800 16px var(--font); fill: var(--text); }
        .gs { font: 500 12px var(--font); fill: var(--text-soft); }
        .sal { fill: var(--g-f); opacity: .22; }
        .sl2 { font: 700 13px var(--font); fill: var(--g-f); }
      </style></defs>
      <rect class="day" x="20" y="40" width="400" height="60" rx="8"/>
      <rect class="eve" x="420" y="40" width="140" height="60" rx="8"/>
      <rect class="night" x="560" y="40" width="60" height="60" rx="8"/>
      <text class="gr" x="220" y="70" text-anchor="middle">Bonjour</text>
      <text class="gs" x="220" y="90" text-anchor="middle">arriving, all day</text>
      <text class="gr" x="490" y="70" text-anchor="middle">Bonsoir</text>
      <text class="gs" x="490" y="90" text-anchor="middle">from ~18 h</text>
      <text class="gr" x="590" y="66" text-anchor="middle">Bonne</text>
      <text class="gr" x="590" y="86" text-anchor="middle">nuit</text>
      <line class="axis" x1="20" y1="120" x2="620" y2="120"/>
      <text class="tick" x="20" y="140">6 h</text>
      <text class="tick" x="153" y="140" text-anchor="middle">10 h</text>
      <text class="tick" x="220" y="140" text-anchor="middle">12 h</text>
      <text class="tick" x="420" y="140" text-anchor="middle">18 h</text>
      <text class="tick" x="560" y="140" text-anchor="middle">22 h</text>
      <text class="tick" x="620" y="140" text-anchor="end">24 h</text>
      <text class="gs" x="20" y="172">Leaving:</text>
      <text class="gr" x="220" y="176" text-anchor="middle">Bonne journée !</text>
      <text class="gr" x="490" y="176" text-anchor="middle">Bonne soirée !</text>
      <rect class="sal" x="20" y="200" width="600" height="40" rx="8"/>
      <text class="sl2" x="320" y="225" text-anchor="middle">Salut ! — friends, any time, hello AND goodbye</text>
    </svg>