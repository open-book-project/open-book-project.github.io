<svg viewBox="0 0 660 380" role="img" aria-label="Decision tree: infinitive, indicative or subjunctive" xmlns="http://www.w3.org/2000/svg"><title>Two questions: same subject? (→ infinitive). Fact or belief? (→ indicative). Otherwise, subjunctive.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-pl:#7c3aed;--line:#e3e7ef;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sd-q { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
              .sd-inf { fill: var(--sheet); stroke: var(--g-pl); stroke-width: 2.5; }
              .sd-ind { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2.5; }
              .sd-sub { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
              .sd-ln { fill: none; stroke: var(--text-soft); stroke-width: 2; }
              .sd-t { font: 700 14px var(--font); fill: var(--text); }
              .sd-y { font: 800 12px var(--font); fill: var(--text-soft); }
              .sd-a1 { font: 800 15px var(--font); fill: var(--g-pl); }
              .sd-a2 { font: 800 15px var(--font); fill: var(--role-noun); }
              .sd-a3 { font: 800 15px var(--font); fill: var(--accent); }
              .sd-e { font: 500 12px var(--font); fill: var(--text-soft); font-style: italic; }
            </style>
          </defs>
          <rect class="sd-q" x="150" y="10" width="360" height="52" rx="12"/>
          <text class="sd-t" x="330" y="33" text-anchor="middle">Same subject in both parts?</text>
          <text class="sd-e" x="330" y="52" text-anchor="middle">je veux / je pars</text>
          <path class="sd-ln" d="M150 36 H100 V96 M510 36 H560 V96"/>
          <text class="sd-y" x="110" y="28">YES</text>
          <text class="sd-y" x="520" y="28">NO</text>
          <rect class="sd-inf" x="12" y="96" width="176" height="78" rx="12"/>
          <text class="sd-a1" x="100" y="124" text-anchor="middle">INFINITIVE</text>
          <text class="sd-e" x="100" y="146" text-anchor="middle">Je veux partir.</text>
          <text class="sd-e" x="100" y="164" text-anchor="middle">pour / avant de + inf.</text>

          <rect class="sd-q" x="370" y="96" width="280" height="96" rx="12"/>
          <text class="sd-t" x="510" y="122" text-anchor="middle">Is the main clause a fact,</text>
          <text class="sd-t" x="510" y="142" text-anchor="middle">a firm belief, espérer,</text>
          <text class="sd-t" x="510" y="162" text-anchor="middle">or "probable"?</text>
          <text class="sd-e" x="510" y="182" text-anchor="middle">savoir, dire, penser, être sûr…</text>
          <path class="sd-ln" d="M420 192 V240 M600 192 V240"/>
          <text class="sd-y" x="430" y="222">YES</text>
          <text class="sd-y" x="610" y="222">NO</text>

          <rect class="sd-ind" x="250" y="240" width="200" height="110" rx="12"/>
          <text class="sd-a2" x="350" y="268" text-anchor="middle">INDICATIVE</text>
          <text class="sd-e" x="350" y="292" text-anchor="middle">Je pense qu’il est là.</text>
          <text class="sd-e" x="350" y="312" text-anchor="middle">J’espère qu’il viendra.</text>
          <text class="sd-e" x="350" y="332" text-anchor="middle">après que + indicative</text>

          <rect class="sd-sub" x="464" y="240" width="186" height="110" rx="12"/>
          <text class="sd-a3" x="557" y="268" text-anchor="middle">SUBJUNCTIVE</text>
          <text class="sd-e" x="557" y="292" text-anchor="middle">WEIRDO trigger</text>
          <text class="sd-e" x="557" y="312" text-anchor="middle">or bien que, pour que,</text>
          <text class="sd-e" x="557" y="332" text-anchor="middle">avant que, à moins que…</text>
          <text class="sd-e" x="100" y="250" text-anchor="middle">Je suis content</text>
          <text class="sd-e" x="100" y="268" text-anchor="middle">d’être ici.</text>
          <path class="sd-ln" d="M100 174 V230"/>
        </svg>