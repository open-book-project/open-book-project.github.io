<svg viewBox="0 0 640 300" role="img" aria-label="Conversation flow: open with something shared, then loop through answer, add a detail, ask back and react, then close with a polite exit." xmlns="http://www.w3.org/2000/svg"><title>Open once, close once — and in between, go round the loop as many times as you like. Reactions are the oil that keeps it turning.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .cf-n { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
          .cf-l { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .cf-t { font: 800 14px var(--font); fill: var(--text); }
          .cf-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .cf-a { fill: none; stroke: var(--text-soft); stroke-width: 2; }
          .cf-loop { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 5; }
          .cf-h { font: 700 12px var(--font); fill: var(--accent-ink); letter-spacing: .06em; }
        </style></defs>
        <rect class="cf-n" x="10" y="110" width="130" height="80" rx="14"/>
        <text class="cf-t" x="75" y="140" text-anchor="middle">1. OPEN</text>
        <text class="cf-s" x="75" y="160" text-anchor="middle">something shared:</text>
        <text class="cf-s" x="75" y="176" text-anchor="middle">Vous êtes d’ici ?</text>
        <path class="cf-a" d="M142 150 L172 150"/>
        <path class="cf-a" d="M166 144 L174 150 L166 156"/>
        <ellipse class="cf-loop" cx="320" cy="150" rx="140" ry="128"/>
        <text class="cf-h" x="320" y="16" text-anchor="middle">2. THE LOOP — REPEAT</text>
        <rect class="cf-l" x="250" y="34" width="140" height="54" rx="12"/>
        <text class="cf-t" x="320" y="58" text-anchor="middle">answer</text>
        <text class="cf-s" x="320" y="76" text-anchor="middle">Oui, depuis 2 ans.</text>
        <rect class="cf-l" x="370" y="124" width="140" height="54" rx="12"/>
        <text class="cf-t" x="440" y="148" text-anchor="middle">+ add a detail</text>
        <text class="cf-s" x="440" y="166" text-anchor="middle">Je suis de Pune.</text>
        <rect class="cf-l" x="250" y="214" width="140" height="54" rx="12"/>
        <text class="cf-t" x="320" y="238" text-anchor="middle">+ ask back</text>
        <text class="cf-s" x="320" y="256" text-anchor="middle">Et vous ?</text>
        <rect class="cf-l" x="180" y="124" width="120" height="54" rx="12"/>
        <text class="cf-t" x="240" y="148" text-anchor="middle">react</text>
        <text class="cf-s" x="240" y="166" text-anchor="middle">Ah bon ? Génial !</text>
        <path class="cf-a" d="M512 150 L522 150"/>
        <path class="cf-a" d="M516 144 L524 150 L516 156"/>
        <rect class="cf-n" x="526" y="110" width="110" height="80" rx="14"/>
        <text class="cf-t" x="581" y="140" text-anchor="middle">3. CLOSE</text>
        <text class="cf-s" x="581" y="160" text-anchor="middle">Bon, je vais</text>
        <text class="cf-s" x="581" y="176" text-anchor="middle">vous laisser…</text>
      </svg>