<svg viewBox="0 0 640 300" role="img" aria-label="Wheel of the eight French question words around a central question mark: qui who, que or quoi what, où where, quand when, comment how, combien how much, pourquoi why, quel which." xmlns="http://www.w3.org/2000/svg"><title>Eight words open almost every question. Each one works with all three registers: + est-ce que, + inversion, or at the end in speech.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .spk { stroke: var(--line-strong); stroke-width: 2; fill: none; }
          .nd { fill: var(--sheet-2); stroke: var(--accent); stroke-width: 1.8; }
          .nf { font: 800 15px var(--font); fill: var(--accent-ink); }
          .ne { font: 500 12px var(--font); fill: var(--text-soft); }
          .hub { fill: var(--accent); }
          .hq { font: 800 34px var(--font); fill: var(--sheet); }
        </style></defs>
        <path class="spk" d="M320 150 L320 40"/>
        <path class="spk" d="M320 150 L497 72"/>
        <path class="spk" d="M320 150 L570 150"/>
        <path class="spk" d="M320 150 L497 228"/>
        <path class="spk" d="M320 150 L320 262"/>
        <path class="spk" d="M320 150 L143 228"/>
        <path class="spk" d="M320 150 L70 150"/>
        <path class="spk" d="M320 150 L143 72"/>
        <rect class="nd" x="258" y="16" width="124" height="48" rx="14"/><text class="nf" x="320" y="38" text-anchor="middle">qui</text><text class="ne" x="320" y="55" text-anchor="middle">who</text>
        <rect class="nd" x="435" y="48" width="124" height="48" rx="14"/><text class="nf" x="497" y="70" text-anchor="middle">que / quoi</text><text class="ne" x="497" y="87" text-anchor="middle">what</text>
        <rect class="nd" x="508" y="126" width="124" height="48" rx="14"/><text class="nf" x="570" y="148" text-anchor="middle">où</text><text class="ne" x="570" y="165" text-anchor="middle">where</text>
        <rect class="nd" x="435" y="204" width="124" height="48" rx="14"/><text class="nf" x="497" y="226" text-anchor="middle">quand</text><text class="ne" x="497" y="243" text-anchor="middle">when</text>
        <rect class="nd" x="258" y="238" width="124" height="48" rx="14"/><text class="nf" x="320" y="260" text-anchor="middle">comment</text><text class="ne" x="320" y="277" text-anchor="middle">how</text>
        <rect class="nd" x="81" y="204" width="124" height="48" rx="14"/><text class="nf" x="143" y="226" text-anchor="middle">combien</text><text class="ne" x="143" y="243" text-anchor="middle">how much / many</text>
        <rect class="nd" x="8" y="126" width="124" height="48" rx="14"/><text class="nf" x="70" y="148" text-anchor="middle">pourquoi</text><text class="ne" x="70" y="165" text-anchor="middle">why</text>
        <rect class="nd" x="81" y="48" width="124" height="48" rx="14"/><text class="nf" x="143" y="70" text-anchor="middle">quel(le)</text><text class="ne" x="143" y="87" text-anchor="middle">which, what</text>
        <circle class="hub" cx="320" cy="150" r="34"/>
        <text class="hq" x="320" y="162" text-anchor="middle">?</text>
      </svg>