<svg viewBox="0 0 640 330" role="img" aria-label="Before and after the noun. mon ancien professeur means my former teacher; une maison ancienne means an old house. ma chère amie means my dear friend; une robe chère means an expensive dress. ma propre chambre means my own room; une chambre propre means a clean room. un grand homme means a great man; un homme grand means a tall man. un pauvre homme means an unfortunate man; un homme pauvre means a man without money." xmlns="http://www.w3.org/2000/svg"><title>Before = how you feel about it; after = what it objectively is. Also: le seul ami (the only friend) / un homme seul (a man alone).</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-adj:#9333ea;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .cb { fill: var(--accent-soft); } .ca { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.2; }
          .hh2 { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
          .fr2 { font: 700 14px var(--font); fill: var(--text); }
          .ad2 { fill: var(--role-adj); font-weight: 800; }
          .en2 { font: 500 12px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="hh2" x="165" y="22" text-anchor="middle">BEFORE · figurative</text>
        <text class="hh2" x="475" y="22" text-anchor="middle">AFTER · literal</text>
        <rect class="cb" x="20" y="34" width="290" height="50" rx="10"/><text class="fr2" x="34" y="56">mon <tspan class="ad2">ancien</tspan> professeur</text><text class="en2" x="34" y="74">my former teacher</text>
        <rect class="ca" x="330" y="34" width="290" height="50" rx="10"/><text class="fr2" x="344" y="56">une maison <tspan class="ad2">ancienne</tspan></text><text class="en2" x="344" y="74">an old (historic) house</text>
        <rect class="cb" x="20" y="92" width="290" height="50" rx="10"/><text class="fr2" x="34" y="114">ma <tspan class="ad2">chère</tspan> amie</text><text class="en2" x="34" y="132">my dear friend</text>
        <rect class="ca" x="330" y="92" width="290" height="50" rx="10"/><text class="fr2" x="344" y="114">une robe <tspan class="ad2">chère</tspan></text><text class="en2" x="344" y="132">an expensive dress</text>
        <rect class="cb" x="20" y="150" width="290" height="50" rx="10"/><text class="fr2" x="34" y="172">ma <tspan class="ad2">propre</tspan> chambre</text><text class="en2" x="34" y="190">my own room</text>
        <rect class="ca" x="330" y="150" width="290" height="50" rx="10"/><text class="fr2" x="344" y="172">une chambre <tspan class="ad2">propre</tspan></text><text class="en2" x="344" y="190">a clean room</text>
        <rect class="cb" x="20" y="208" width="290" height="50" rx="10"/><text class="fr2" x="34" y="230">un <tspan class="ad2">grand</tspan> homme</text><text class="en2" x="34" y="248">a great man</text>
        <rect class="ca" x="330" y="208" width="290" height="50" rx="10"/><text class="fr2" x="344" y="230">un homme <tspan class="ad2">grand</tspan></text><text class="en2" x="344" y="248">a tall man</text>
        <rect class="cb" x="20" y="266" width="290" height="50" rx="10"/><text class="fr2" x="34" y="288">un <tspan class="ad2">pauvre</tspan> homme</text><text class="en2" x="34" y="306">a poor (unfortunate) man</text>
        <rect class="ca" x="330" y="266" width="290" height="50" rx="10"/><text class="fr2" x="344" y="288">un homme <tspan class="ad2">pauvre</tspan></text><text class="en2" x="344" y="306">a poor (penniless) man</text>
      </svg>