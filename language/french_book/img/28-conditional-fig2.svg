<svg viewBox="0 0 660 400" role="img" aria-label="The three si clause patterns: present, imparfait and plus-que-parfait" xmlns="http://www.w3.org/2000/svg"><title>The si side (left) is always present, imparfait or plus-que-parfait. The conditional lives only on the result side.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line:#e3e7ef;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .si-row { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
              .si-si { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .si-res { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2; }
              .si-arr { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
              .si-lab { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .04em; }
              .si-k { font: 800 15px var(--font); fill: var(--accent); }
              .si-r { font: 800 15px var(--font); fill: var(--role-verb); }
              .si-ex { font: 500 12.5px var(--font); fill: var(--text); font-style: italic; }
              .si-no { fill: none; stroke: var(--g-f); stroke-width: 2; stroke-dasharray: 6 4; }
              .si-not { font: 800 14px var(--font); fill: var(--g-f); }
            </style>
          </defs>
          <text class="si-lab" x="12" y="24">1 · REAL / LIKELY</text>
          <rect class="si-si" x="12" y="34" width="200" height="50" rx="10"/>
          <text class="si-k" x="112" y="64" text-anchor="middle">si + présent</text>
          <path class="si-arr" d="M220 59 H262 M254 52 L264 59 L254 66"/>
          <rect class="si-res" x="270" y="34" width="378" height="50" rx="10"/>
          <text class="si-r" x="459" y="64" text-anchor="middle">présent · futur · impératif</text>
          <text class="si-ex" x="12" y="104">S’il fait beau demain, on ira à la plage.</text>

          <text class="si-lab" x="12" y="144">2 · UNREAL NOW / UNLIKELY</text>
          <rect class="si-si" x="12" y="154" width="200" height="50" rx="10"/>
          <text class="si-k" x="112" y="184" text-anchor="middle">si + imparfait</text>
          <path class="si-arr" d="M220 179 H262 M254 172 L264 179 L254 186"/>
          <rect class="si-res" x="270" y="154" width="378" height="50" rx="10"/>
          <text class="si-r" x="459" y="184" text-anchor="middle">conditionnel présent</text>
          <text class="si-ex" x="12" y="224">Si j’avais le temps, je voyagerais.</text>

          <text class="si-lab" x="12" y="264">3 · UNREAL PAST / REGRET</text>
          <rect class="si-si" x="12" y="274" width="200" height="50" rx="10"/>
          <text class="si-k" x="112" y="304" text-anchor="middle">si + plus-que-parfait</text>
          <path class="si-arr" d="M220 299 H262 M254 292 L264 299 L254 306"/>
          <rect class="si-res" x="270" y="274" width="378" height="50" rx="10"/>
          <text class="si-r" x="459" y="304" text-anchor="middle">conditionnel passé</text>
          <text class="si-ex" x="12" y="344">Si tu m’avais appelé, je serais venu.</text>

          <rect class="si-no" x="12" y="358" width="636" height="34" rx="8"/>
          <text class="si-not" x="330" y="380" text-anchor="middle">✗ NEVER a conditional or a future right after si (if)</text>
        </svg>