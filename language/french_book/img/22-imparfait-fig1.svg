<svg viewBox="0 0 660 260" role="img" aria-label="Timeline: a long wavy band labelled imparfait, je regardais la télé, is cut by a single lightning point labelled passé composé, le téléphone a sonné." xmlns="http://www.w3.org/2000/svg"><title>The wave keeps going; the lightning bolt happens once. Imparfait is the wave, passé composé is the bolt.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .ip-ax { fill: none; stroke: var(--line-strong); stroke-width: 2; }
        .ip-wave { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
        .ip-bolt { fill: var(--role-verb); }
        .ip-h { font: 800 14px var(--font); fill: var(--accent); }
        .ip-h2 { font: 800 14px var(--font); fill: var(--role-verb); }
        .ip-t { font: 600 14px var(--font); fill: var(--text); }
        .ip-s { font: 500 12px var(--font); fill: var(--text-soft); }
      </style></defs>
      <path class="ip-ax" d="M20 170 L630 170 M620 163 L632 170 L620 177"/>
      <text class="ip-s" x="20" y="196">past</text>
      <text class="ip-s" x="640" y="196" text-anchor="end">now</text>
      <path class="ip-wave" d="M60 130 q 20 -16 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
      <text class="ip-h" x="60" y="40">IMPARFAIT — the background, still going on</text>
      <text class="ip-t" x="60" y="64">Je regardais la télé…</text>
      <text class="ip-s" x="60" y="84">I was watching TV (no start, no end in view)</text>
      <path class="ip-bolt" d="M318 92 L300 134 L314 134 L302 170 L332 122 L317 122 L330 92 Z"/>
      <text class="ip-h2" x="350" y="222">PASSÉ COMPOSÉ — one event</text>
      <text class="ip-t" x="350" y="244">… quand le téléphone a sonné.</text>
      <path class="ip-ax" d="M316 176 L316 206"/>
    </svg>