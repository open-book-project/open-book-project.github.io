<svg viewBox="0 0 620 230" role="img" aria-label="Left: one person with an arrow looping back to himself, il se regarde. Right: two people with arrows pointing at each other, ils se regardent." xmlns="http://www.w3.org/2000/svg"><title>One form, two meanings. With a plural subject, se usually means “each other” when that makes sense.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .rc-p { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
        .rc-a { fill: none; stroke: var(--role-verb); stroke-width: 3; }
        .rc-t { font: 800 16px var(--font); fill: var(--text); }
        .rc-g { font: 500 13px var(--font); fill: var(--text-soft); }
        .rc-h { font: 800 13px var(--font); fill: var(--accent); }
      </style></defs>
      <text class="rc-h" x="150" y="24" text-anchor="middle">REFLEXIVE — himself</text>
      <circle class="rc-p" cx="150" cy="96" r="30"/>
      <path class="rc-a" d="M180 90 C 250 40, 250 150, 182 108"/>
      <path class="rc-a" d="M192 116 L182 108 L194 100"/>
      <text class="rc-t" x="150" y="170" text-anchor="middle">Il se regarde.</text>
      <text class="rc-g" x="150" y="192" text-anchor="middle">He looks at himself.</text>
      <text class="rc-h" x="460" y="24" text-anchor="middle">RECIPROCAL — each other</text>
      <circle class="rc-p" cx="390" cy="96" r="30"/>
      <circle class="rc-p" cx="530" cy="96" r="30"/>
      <path class="rc-a" d="M424 84 L496 84"/>
      <path class="rc-a" d="M486 76 L497 84 L486 92"/>
      <path class="rc-a" d="M496 108 L424 108"/>
      <path class="rc-a" d="M434 100 L423 108 L434 116"/>
      <text class="rc-t" x="460" y="170" text-anchor="middle">Ils se regardent.</text>
      <text class="rc-g" x="460" y="192" text-anchor="middle">They look at each other (or at themselves).</text>
    </svg>