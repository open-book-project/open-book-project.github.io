<svg viewBox="0 0 640 360" role="img" aria-label="Decision tree for tu or vous. More than one person: vous. One person who is family, a friend, a child or a classmate, or who offered tu: tu. Otherwise, or if unsure: vous." xmlns="http://www.w3.org/2000/svg"><title>The tu/vous decision. Switching from vous to tu is called tutoyer ; the offer is On peut se tutoyer ? (“Shall we say tu?”).</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .q { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 2; }
        .rv { fill: var(--g-m); }
        .rt { fill: var(--g-f); }
        .ln { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
        .ar { fill: var(--text-soft); }
        .qt { font: 700 14px var(--font); fill: var(--text); }
        .yn { font: 800 13px var(--font); fill: var(--accent); }
        .rtx { font: 800 20px var(--font); fill: var(--sheet); }
        .rsm { font: 600 12px var(--font); fill: var(--sheet); }
        .nt { font: 600 13px var(--font); fill: var(--text-soft); }
      </style></defs>
      <rect class="q" x="150" y="16" width="320" height="56" rx="10"/>
      <text class="qt" x="310" y="50" text-anchor="middle">Talking to more than one person?</text>
      <line class="ln" x1="470" y1="44" x2="506" y2="44"/><polygon class="ar" points="518,44 504,37 504,51"/>
      <text class="yn" x="488" y="34" text-anchor="middle">yes</text>
      <rect class="rv" x="520" y="18" width="110" height="52" rx="10"/>
      <text class="rtx" x="575" y="46" text-anchor="middle">VOUS</text>
      <text class="rsm" x="575" y="62" text-anchor="middle">plural</text>

      <line class="ln" x1="310" y1="72" x2="310" y2="112"/><polygon class="ar" points="310,124 303,110 317,110"/>
      <text class="yn" x="326" y="100">no</text>
      <rect class="q" x="150" y="126" width="320" height="84" rx="10"/>
      <text class="qt" x="310" y="152" text-anchor="middle">Is it family, a friend, a child,</text>
      <text class="qt" x="310" y="172" text-anchor="middle">a classmate or colleague your age —</text>
      <text class="qt" x="310" y="192" text-anchor="middle">or did they say “on se tutoie” ?</text>
      <line class="ln" x1="150" y1="168" x2="122" y2="168"/><polygon class="ar" points="110,168 124,161 124,175"/>
      <text class="yn" x="136" y="158" text-anchor="middle">yes</text>
      <rect class="rt" x="10" y="142" width="98" height="52" rx="10"/>
      <text class="rtx" x="59" y="174" text-anchor="middle">TU</text>

      <line class="ln" x1="310" y1="210" x2="310" y2="248"/><polygon class="ar" points="310,260 303,246 317,246"/>
      <text class="yn" x="326" y="238">no / not sure</text>
      <rect class="rv" x="190" y="262" width="240" height="62" rx="10"/>
      <text class="rtx" x="310" y="290" text-anchor="middle">VOUS</text>
      <text class="rsm" x="310" y="310" text-anchor="middle">strangers · shops · work · elders</text>
      <text class="nt" x="320" y="350" text-anchor="middle">When in doubt, say vous — and let the other person offer tu.</text>
    </svg>