<svg viewBox="0 0 640 330" role="img" aria-label="Horizontal bar chart: number of test questions per Part of the book. Commencer 5, Les bases 10, Construire 12, Parler 4, Vocabulaire 5, Écrire 3, Maîtriser 1." xmlns="http://www.w3.org/2000/svg"><title>Each bar is one Part of the book. Several questions test two chapters at once (for example Q23 tests both the subjunctive and linking words), so every chapter is covered.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .pt { font: 700 14px var(--font); fill: var(--text); }
          .pe { font: 500 11px var(--font); fill: var(--text-soft); }
          .bar { fill: var(--accent); }
          .bar2 { fill: var(--accent); opacity: .6; }
          .num { font: 700 13px var(--font); fill: var(--text); }
          .ax { stroke: var(--line); stroke-width: 2; fill: none; }
          .ttl { font: 700 13px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="ttl" x="20" y="22">Questions per Part (40 in total)</text>
        <path class="ax" d="M178 34 L178 318"/>
        <text class="pt" x="20" y="60">Commencer</text><text class="pe" x="20" y="74">Getting started</text>
        <rect class="bar" x="180" y="48" width="140" height="24" rx="5"/><text class="num" x="328" y="65">5 · Q1–5</text>
        <text class="pt" x="20" y="100">Les bases</text><text class="pe" x="20" y="114">The foundations</text>
        <rect class="bar2" x="180" y="88" width="280" height="24" rx="5"/><text class="num" x="468" y="105">10 · Q6–15</text>
        <text class="pt" x="20" y="140">Construire</text><text class="pe" x="20" y="154">Building sentences</text>
        <rect class="bar" x="180" y="128" width="336" height="24" rx="5"/><text class="num" x="524" y="145">12 · Q16–27</text>
        <text class="pt" x="20" y="180">Parler</text><text class="pe" x="20" y="194">Learn to speak</text>
        <rect class="bar2" x="180" y="168" width="112" height="24" rx="5"/><text class="num" x="300" y="185">4 · Q28–31</text>
        <text class="pt" x="20" y="220">Vocabulaire</text><text class="pe" x="20" y="234">Vocabulary</text>
        <rect class="bar" x="180" y="208" width="140" height="24" rx="5"/><text class="num" x="328" y="225">5 · Q32–36</text>
        <text class="pt" x="20" y="260">Écrire</text><text class="pe" x="20" y="274">Learn to write</text>
        <rect class="bar2" x="180" y="248" width="84" height="24" rx="5"/><text class="num" x="272" y="265">3 · Q37–39</text>
        <text class="pt" x="20" y="300">Maîtriser</text><text class="pe" x="20" y="314">Mastery</text>
        <rect class="bar" x="180" y="288" width="28" height="24" rx="5"/><text class="num" x="216" y="305">1 · Q40 (+ mistakes everywhere)</text>
      </svg>