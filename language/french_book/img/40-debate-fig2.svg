<svg viewBox="0 0 640 330" role="img" aria-label="Argument map: a thesis at the top supported by two arguments, each with an example; on the right, a counter-argument is conceded with certes, then answered with mais, which leads back to the thesis." xmlns="http://www.w3.org/2000/svg"><title>Green = your arguments, dashed = examples, red = the other side. Naming the counter-argument yourself (with certes ) and answering it is what turns B1 opinion into B2 argument.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .am-th { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
          .am-ar { fill: var(--sheet); stroke: var(--good); stroke-width: 2; }
          .am-ex { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 5 4; }
          .am-co { fill: var(--sheet); stroke: var(--bad); stroke-width: 2; }
          .am-t { font: 800 13px var(--font); fill: var(--text); }
          .am-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
          .am-g { font: 700 11.5px var(--font); fill: var(--accent-ink); }
          .am-a { fill: none; stroke: var(--text-soft); stroke-width: 2; }
        </style></defs>
        <rect class="am-th" x="170" y="10" width="300" height="56" rx="12"/>
        <text class="am-t" x="320" y="34" text-anchor="middle">THÈSE : Il faut limiter les écrans</text>
        <text class="am-s" x="320" y="54" text-anchor="middle">à l’école.</text>
        <path class="am-a" d="M230 66 L110 106"/>
        <path class="am-a" d="M300 66 L290 106"/>
        <path class="am-a" d="M420 66 L520 106"/>
        <rect class="am-ar" x="10" y="108" width="190" height="56" rx="10"/>
        <text class="am-g" x="22" y="128">Tout d’abord,</text>
        <text class="am-t" x="22" y="148">ils nuisent à l’attention.</text>
        <rect class="am-ar" x="210" y="108" width="190" height="56" rx="10"/>
        <text class="am-g" x="222" y="128">De plus,</text>
        <text class="am-t" x="222" y="148">ils isolent les élèves.</text>
        <path class="am-a" d="M105 164 L105 196"/>
        <path class="am-a" d="M305 164 L305 196"/>
        <rect class="am-ex" x="10" y="198" width="190" height="52" rx="10"/>
        <text class="am-g" x="22" y="218">Par exemple,</text>
        <text class="am-s" x="22" y="236">notifications en plein cours</text>
        <rect class="am-ex" x="210" y="198" width="190" height="52" rx="10"/>
        <text class="am-g" x="222" y="218">Prenons le cas de</text>
        <text class="am-s" x="222" y="236">la cour où plus personne ne joue</text>
        <rect class="am-co" x="420" y="108" width="210" height="56" rx="10"/>
        <text class="am-g" x="432" y="128" style="fill: var(--bad)">Certes,</text>
        <text class="am-t" x="432" y="148">ils servent à apprendre…</text>
        <path class="am-a" d="M525 164 L525 196"/>
        <rect class="am-ar" x="420" y="198" width="210" height="52" rx="10"/>
        <text class="am-g" x="432" y="218">mais</text>
        <text class="am-s" x="432" y="236">un usage encadré suffit.</text>
        <path class="am-a" d="M525 250 Q525 300 320 300 Q170 300 170 260"/>
        <text class="am-s" x="330" y="318" text-anchor="middle">the rebuttal brings you back to the thesis — stronger than before</text>
      </svg>