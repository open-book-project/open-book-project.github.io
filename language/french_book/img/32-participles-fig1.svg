<svg viewBox="0 0 640 260" role="img" aria-label="Gérondif versus participe présent: who is coming out of the cinema?" xmlns="http://www.w3.org/2000/svg"><title>One little word changes who does the action: with en, the subject of the sentence; without en, the noun just before.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line:#e3e7ef;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .gp-bx { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
              .gp-me { fill: var(--role-noun); }
              .gp-ma { fill: var(--g-f); }
              .gp-door { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
              .gp-arr { fill: none; stroke: var(--accent); stroke-width: 2.5; }
              .gp-t { font: 800 14px var(--font); fill: var(--text); }
              .gp-e { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .gp-l { font: 700 12px var(--font); fill: var(--text); }
            </style>
          </defs>
          <rect class="gp-bx" x="10" y="10" width="300" height="240" rx="14"/>
          <text class="gp-t" x="160" y="36" text-anchor="middle">J’ai vu Marie EN sortant</text>
          <text class="gp-e" x="160" y="54" text-anchor="middle">gérondif → I am the one leaving</text>
          <path class="gp-door" d="M40 200 V100 H110 V200"/>
          <text class="gp-l" x="75" y="92" text-anchor="middle">CINÉMA</text>
          <circle class="gp-me" cx="140" cy="160" r="14"/>
          <text class="gp-l" x="140" y="196" text-anchor="middle">moi</text>
          <path class="gp-arr" d="M118 160 H100 M160 160 H200 M192 153 L202 160 L192 167"/>
          <circle class="gp-ma" cx="250" cy="160" r="14"/>
          <text class="gp-l" x="250" y="196" text-anchor="middle">Marie</text>
          <text class="gp-e" x="160" y="232" text-anchor="middle">= quand je sortais du cinéma</text>

          <rect class="gp-bx" x="330" y="10" width="300" height="240" rx="14"/>
          <text class="gp-t" x="480" y="36" text-anchor="middle">J’ai vu Marie sortant</text>
          <text class="gp-e" x="480" y="54" text-anchor="middle">participe → Marie is the one leaving</text>
          <path class="gp-door" d="M360 200 V100 H430 V200"/>
          <text class="gp-l" x="395" y="92" text-anchor="middle">CINÉMA</text>
          <circle class="gp-ma" cx="460" cy="160" r="14"/>
          <text class="gp-l" x="460" y="196" text-anchor="middle">Marie</text>
          <path class="gp-arr" d="M480 160 H520 M512 153 L522 160 L512 167"/>
          <circle class="gp-me" cx="590" cy="160" r="14"/>
          <text class="gp-l" x="590" y="196" text-anchor="middle">moi</text>
          <text class="gp-e" x="480" y="232" text-anchor="middle">= Marie, qui sortait du cinéma</text>
        </svg>