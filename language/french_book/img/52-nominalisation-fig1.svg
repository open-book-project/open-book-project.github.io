<svg viewBox="0 0 660 320" role="img" aria-label="Suffix gender chart. Masculine: -ment as in le développement, -age as in le recyclage (exceptions la plage, la page, l'image), -isme as in le réalisme, and -eur for people, le chercheur. Feminine: -tion and -sion as in la décision, -ure as in la fermeture, -ée as in l'arrivée, -ance and -ence as in la croissance (exception le silence), -té and -ité as in l'efficacité (exceptions l'été, le comité), -esse as in la jeunesse, -eur for qualities, la chaleur (exceptions le bonheur, le malheur, l'honneur)." xmlns="http://www.w3.org/2000/svg"><title>Masculine: -ment, -age, -isme. Feminine: almost everything else. Watch -eur: a person (le chercheur) is masculine, a quality (la chaleur) feminine.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .mb { fill: var(--g-m); opacity: .16; }
          .fb { fill: var(--g-f); opacity: .16; }
          .mh { font: 800 15px var(--font); fill: var(--g-m); letter-spacing: .05em; }
          .fh { font: 800 15px var(--font); fill: var(--g-f); letter-spacing: .05em; }
          .sx { font: 800 15px var(--font); fill: var(--text); }
          .se { font: 500 12px var(--font); fill: var(--text-soft); }
          .xx { font: 600 11.5px var(--font); fill: var(--text-soft); font-style: italic; }
        </style></defs>
        <rect class="mb" x="14" y="14" width="300" height="292" rx="16"/>
        <rect class="fb" x="330" y="14" width="316" height="292" rx="16"/>
        <text class="mh" x="164" y="42" text-anchor="middle">MASCULINE · le</text>
        <text class="fh" x="488" y="42" text-anchor="middle">FEMININE · la</text>

        <text class="sx" x="32" y="80">-ment</text><text class="se" x="110" y="80">le développement</text>
        <text class="sx" x="32" y="122">-age</text><text class="se" x="110" y="122">le recyclage</text>
        <text class="xx" x="110" y="139">but: la plage, la page, l’image</text>
        <text class="sx" x="32" y="180">-isme</text><text class="se" x="110" y="180">le réalisme</text>
        <text class="sx" x="32" y="222">-eur (person)</text><text class="se" x="140" y="222">le chercheur</text>
        <text class="sx" x="32" y="264">no suffix</text><text class="se" x="120" y="264">le départ, le choix…</text>
        <text class="xx" x="120" y="281">but: la vente, la baisse</text>

        <text class="sx" x="348" y="80">-tion / -sion</text><text class="se" x="470" y="80">la décision</text>
        <text class="sx" x="348" y="112">-ure</text><text class="se" x="470" y="112">la fermeture</text>
        <text class="sx" x="348" y="144">-ée</text><text class="se" x="470" y="144">l’arrivée</text>
        <text class="sx" x="348" y="176">-ance / -ence</text><text class="se" x="470" y="176">la croissance</text>
        <text class="xx" x="470" y="191">but: le silence</text>
        <text class="sx" x="348" y="222">-té / -ité</text><text class="se" x="470" y="222">l’efficacité</text>
        <text class="xx" x="470" y="237">but: l’été, le comité</text>
        <text class="sx" x="348" y="266">-esse · -eur (quality)</text><text class="se" x="348" y="284">la jeunesse · la chaleur</text>
        <text class="xx" x="348" y="300">but: le bonheur, le malheur, l’honneur</text>
      </svg>