<svg viewBox="0 0 640 505" role="img" aria-label="Essay structure: an introduction funnel narrowing from hook to plan, three development blocks linked by transitions, and a conclusion funnel widening from summary to opening" xmlns="http://www.w3.org/2000/svg"><title>Two funnels and a body. The question (pink) closes the introduction; the answer (pink) opens the conclusion.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.es-fun { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.es-blk { fill: var(--canvas); stroke: var(--g-m); stroke-width: 2; }
.es-t { font: 600 13px var(--font); fill: var(--text); }
.es-q { font: 800 13px var(--font); fill: var(--g-f); }
.es-h { font: 800 13px var(--font); fill: var(--accent); letter-spacing: .05em; }
.es-s { font: 500 12px var(--font); fill: var(--text-soft); }
.es-arr { fill: none; stroke: var(--text-soft); stroke-width: 2; }
.es-tr { font: italic 600 12px var(--font); fill: var(--text-soft); }
</style>
</defs>
<path class="es-fun" d="M20 20 L420 20 L320 140 L120 140 Z"/>
<text class="es-t" x="220" y="46" text-anchor="middle">Amorce (hook)</text>
<text class="es-t" x="220" y="74" text-anchor="middle">Présentation du sujet</text>
<text class="es-q" x="220" y="102" text-anchor="middle">Problématique ?</text>
<text class="es-t" x="220" y="130" text-anchor="middle">Annonce du plan</text>
<text class="es-h" x="456" y="56">INTRODUCTION</text>
<text class="es-s" x="456" y="76">general → specific</text>
<text class="es-s" x="456" y="94">ends on the question</text>
<text class="es-s" x="456" y="112">and the plan</text>

<rect class="es-blk" x="60" y="165" width="320" height="48" rx="10"/>
<text class="es-t" x="220" y="194" text-anchor="middle">I. Thèse — first answer</text>
<path class="es-arr" d="M220 215 L220 238 M213 230 L220 240 L227 230"/>
<text class="es-tr" x="232" y="232">transition</text>
<rect class="es-blk" x="60" y="242" width="320" height="48" rx="10"/>
<text class="es-t" x="220" y="271" text-anchor="middle">II. Antithèse — the other side</text>
<path class="es-arr" d="M220 292 L220 315 M213 307 L220 317 L227 307"/>
<text class="es-tr" x="232" y="309">transition</text>
<rect class="es-blk" x="60" y="319" width="320" height="48" rx="10"/>
<text class="es-t" x="220" y="348" text-anchor="middle">III. Synthèse — going beyond</text>
<text class="es-h" x="456" y="240">DÉVELOPPEMENT</text>
<text class="es-s" x="456" y="260">2 or 3 parts</text>
<text class="es-s" x="456" y="278">each paragraph: idea →</text>
<text class="es-s" x="456" y="296">argument → example</text>
<text class="es-s" x="456" y="314">transitions link the parts</text>

<path class="es-fun" d="M120 390 L320 390 L420 495 L20 495 Z"/>
<text class="es-t" x="220" y="416" text-anchor="middle">Bilan</text>
<text class="es-q" x="220" y="446" text-anchor="middle">Réponse à la problématique</text>
<text class="es-t" x="220" y="478" text-anchor="middle">Ouverture</text>
<text class="es-h" x="456" y="420">CONCLUSION</text>
<text class="es-s" x="456" y="440">specific → general</text>
<text class="es-s" x="456" y="458">answers the question</text>
<text class="es-s" x="456" y="476">no new argument</text>
</svg>