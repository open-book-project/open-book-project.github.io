<svg viewBox="0 0 640 230" role="img" aria-label="Active to passive: the object becomes the subject, the subject becomes par plus agent" xmlns="http://www.w3.org/2000/svg"><title>The object moves to the front; the agent moves behind par. The tense lives in être.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pv-s { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2.5; }
              .pv-v { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
              .pv-o { fill: var(--sheet); stroke: var(--g-f); stroke-width: 2.5; }
              .pv-a { fill: none; stroke: var(--text-soft); stroke-width: 2; }
              .pv-w { font: 700 15px var(--font); fill: var(--text); }
              .pv-h { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
              .pv-e { font: 500 12px var(--font); fill: var(--text-soft); font-style: italic; }
            </style>
          </defs>
          <text class="pv-h" x="20" y="22">ACTIVE</text>
          <rect class="pv-s" x="20" y="32" width="170" height="44" rx="10"/>
          <text class="pv-w" x="105" y="60" text-anchor="middle">La police</text>
          <rect class="pv-v" x="205" y="32" width="150" height="44" rx="10"/>
          <text class="pv-w" x="280" y="60" text-anchor="middle">a arrêté</text>
          <rect class="pv-o" x="370" y="32" width="250" height="44" rx="10"/>
          <text class="pv-w" x="495" y="60" text-anchor="middle">les voleurs.</text>

          <path class="pv-a" d="M495 78 C495 120 120 110 105 150 M98 140 L105 152 L113 141"/>
          <path class="pv-a" d="M105 78 C105 112 520 112 530 150 M522 141 L530 152 L537 140"/>

          <text class="pv-h" x="20" y="146">PASSIVE</text>
          <rect class="pv-o" x="20" y="156" width="170" height="44" rx="10"/>
          <text class="pv-w" x="105" y="184" text-anchor="middle">Les voleurs</text>
          <rect class="pv-v" x="205" y="156" width="230" height="44" rx="10"/>
          <text class="pv-w" x="320" y="184" text-anchor="middle">ont été arrêtés</text>
          <rect class="pv-s" x="450" y="156" width="170" height="44" rx="10"/>
          <text class="pv-w" x="535" y="184" text-anchor="middle">par la police.</text>
          <text class="pv-e" x="320" y="222" text-anchor="middle">arrêtés agrees with les voleurs (masc. plural) · été never changes</text>
        </svg>