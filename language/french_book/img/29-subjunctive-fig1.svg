<svg viewBox="0 0 640 220" role="img" aria-label="Subjunctive formation: ils form minus ent plus subjunctive endings" xmlns="http://www.w3.org/2000/svg"><title>Three steps. For -er verbs, je / tu / il / ils sound exactly like the present.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sj-bx { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
              .sj-hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .sj-t { font: 700 12.5px var(--font); fill: var(--text-soft); }
              .sj-w { font: 800 20px var(--font); fill: var(--text); }
              .sj-st { fill: var(--role-verb); }
              .sj-cut { fill: var(--text-soft); text-decoration: line-through; }
              .sj-en { fill: var(--accent); }
              .sj-arr { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
              .sj-s { font: 500 13px var(--font); fill: var(--text); }
            </style>
          </defs>
          <rect class="sj-bx" x="10" y="20" width="180" height="96" rx="12"/>
          <text class="sj-t" x="100" y="46" text-anchor="middle">1 · ils form (present)</text>
          <text class="sj-w" x="100" y="86" text-anchor="middle">ils <tspan class="sj-st">finiss</tspan><tspan class="sj-cut">ent</tspan></text>
          <path class="sj-arr" d="M196 68 H226 M218 61 L228 68 L218 75"/>
          <rect class="sj-bx" x="232" y="20" width="160" height="96" rx="12"/>
          <text class="sj-t" x="312" y="46" text-anchor="middle">2 · keep the stem</text>
          <text class="sj-w" x="312" y="86" text-anchor="middle"><tspan class="sj-st">finiss-</tspan></text>
          <path class="sj-arr" d="M398 68 H428 M420 61 L430 68 L420 75"/>
          <rect class="sj-hi" x="434" y="20" width="196" height="96" rx="12"/>
          <text class="sj-t" x="532" y="46" text-anchor="middle">3 · add the endings</text>
          <text class="sj-w" x="532" y="86" text-anchor="middle">que je <tspan class="sj-st">finiss</tspan><tspan class="sj-en">e</tspan></text>
          <text class="sj-s" x="320" y="150" text-anchor="middle">Endings:  -e  ·  -es  ·  -e  ·  -ions  ·  -iez  ·  -ent</text>
          <text class="sj-s" x="320" y="180" text-anchor="middle">ils parlent → que je parle · ils vendent → que je vende</text>
          <text class="sj-s" x="320" y="204" text-anchor="middle">ils prennent → que je prenne · ils viennent → que je vienne</text>
        </svg>