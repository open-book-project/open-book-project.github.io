<svg viewBox="0 0 640 300" role="img" aria-label="Four liaison examples with arcs: les amis with a z sound, ils ont with a z sound, grand homme with a t sound, neuf ans with a v sound." xmlns="http://www.w3.org/2000/svg"><title>The silent letter (blue) jumps across the gap and starts the next word. Notice the sound can change: s and x become [z], d becomes [t], f becomes [v] (only in neuf ans , neuf heures ).</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .w1 { font: 800 24px var(--font); fill: var(--text); }
        .ws { font: 800 24px var(--font); fill: var(--accent); }
        .arc { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
        .snd { font: 800 15px var(--font); fill: var(--accent); }
        .rs { font: 600 13px var(--font); fill: var(--text-soft); }
        .box2 { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1.5; }
      </style></defs>
      <rect class="box2" x="10" y="10" width="300" height="130" rx="12"/>
      <rect class="box2" x="330" y="10" width="300" height="130" rx="12"/>
      <rect class="box2" x="10" y="160" width="300" height="130" rx="12"/>
      <rect class="box2" x="330" y="160" width="300" height="130" rx="12"/>

      <text class="w1" x="148" y="60" text-anchor="end">le<tspan class="ws">s</tspan></text>
      <text class="w1" x="172" y="60">amis</text>
      <path class="arc" d="M138 70 Q158 92 178 70"/>
      <text class="snd" x="158" y="108" text-anchor="middle">s → [z]</text>
      <text class="rs" x="160" y="130" text-anchor="middle">[lay-za-MEE]</text>

      <text class="w1" x="468" y="60" text-anchor="end">il<tspan class="ws">s</tspan></text>
      <text class="w1" x="492" y="60">ont</text>
      <path class="arc" d="M458 70 Q478 92 498 70"/>
      <text class="snd" x="478" y="108" text-anchor="middle">s → [z]</text>
      <text class="rs" x="480" y="130" text-anchor="middle">[eel-ZÕ] “they have”</text>

      <text class="w1" x="158" y="210" text-anchor="end">gran<tspan class="ws">d</tspan></text>
      <text class="w1" x="182" y="210">homme</text>
      <path class="arc" d="M146 220 Q166 242 188 220"/>
      <text class="snd" x="166" y="258" text-anchor="middle">d → [t]</text>
      <text class="rs" x="160" y="280" text-anchor="middle">[grã-TOM]</text>

      <text class="w1" x="474" y="210" text-anchor="end">neu<tspan class="ws">f</tspan></text>
      <text class="w1" x="498" y="210">ans</text>
      <path class="arc" d="M462 220 Q482 242 504 220"/>
      <text class="snd" x="482" y="258" text-anchor="middle">f → [v]</text>
      <text class="rs" x="480" y="280" text-anchor="middle">[nö-VÃ] “nine years”</text>
    </svg>