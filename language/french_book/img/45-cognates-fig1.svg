<svg viewBox="0 0 640 380" role="img" aria-label="Nine French suffixes with arrows to their English equivalents and one example each" xmlns="http://www.w3.org/2000/svg"><title>Nine endings that translate almost automatically. Swap the ending and you usually have the English word.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.sx-pill { fill: var(--accent-soft); }
.sx-fr { font: 800 14px var(--font); fill: var(--accent-ink); text-anchor: middle; }
.sx-en { font: 800 15px var(--font); fill: var(--good); text-anchor: middle; }
.sx-ex { font: 500 13px var(--font); fill: var(--text); }
.sx-hd { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .08em; }
.sx-arr { fill: none; stroke: var(--accent); stroke-width: 2; }
</style>
</defs>
<text class="sx-hd" x="80" y="22" text-anchor="middle">FRENCH</text>
<text class="sx-hd" x="320" y="22" text-anchor="middle">ENGLISH</text>
<text class="sx-hd" x="400" y="22">EXAMPLE</text>
<g transform="translate(0 36)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-tion</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-tion</text><text class="sx-ex" x="400" y="19">nation → nation</text></g>
<g transform="translate(0 72)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-ité</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ty</text><text class="sx-ex" x="400" y="19">liberté → liberty</text></g>
<g transform="translate(0 108)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-ique</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ic / -ical</text><text class="sx-ex" x="400" y="19">électrique → electric</text></g>
<g transform="translate(0 144)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-eux / -euse</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ous</text><text class="sx-ex" x="400" y="19">dangereux → dangerous</text></g>
<g transform="translate(0 180)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-ment</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ly</text><text class="sx-ex" x="400" y="19">rapidement → rapidly</text></g>
<g transform="translate(0 216)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-isme</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ism</text><text class="sx-ex" x="400" y="19">tourisme → tourism</text></g>
<g transform="translate(0 252)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-iste</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ist</text><text class="sx-ex" x="400" y="19">artiste → artist</text></g>
<g transform="translate(0 288)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-aire</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ary</text><text class="sx-ex" x="400" y="19">nécessaire → necessary</text></g>
<g transform="translate(0 324)"><rect class="sx-pill" x="20" width="120" height="28" rx="14"/><text class="sx-fr" x="80" y="19">-oire</text><path class="sx-arr" d="M150 14H250M242 8l8 6-8 6"/><text class="sx-en" x="320" y="19">-ory</text><text class="sx-ex" x="400" y="19">victoire → victory</text></g>
</svg>