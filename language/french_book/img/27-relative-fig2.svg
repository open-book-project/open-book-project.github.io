<svg viewBox="0 0 660 400" role="img" aria-label="Decision tree for choosing qui, que, où, dont, lequel or ce qui" xmlns="http://www.w3.org/2000/svg"><title>The job inside the relative clause decides everything — not whether the noun is a person or a thing.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-pl:#7c3aed;--line:#e3e7ef;--role-pron:#0891b2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .rl-ln { fill: none; stroke: var(--line); stroke-width: 2; }
              .rl-top { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .rl-bx { fill: var(--sheet); stroke: var(--role-pron); stroke-width: 2; }
              .rl-bx2 { fill: var(--sheet); stroke: var(--g-pl); stroke-width: 2; }
              .rl-q { font: 700 15px var(--font); fill: var(--text); }
              .rl-h { font: 600 12.5px var(--font); fill: var(--text-soft); }
              .rl-a { font: 800 17px var(--font); fill: var(--role-pron); }
              .rl-a2 { font: 800 15px var(--font); fill: var(--g-pl); }
              .rl-e { font: 500 12px var(--font); fill: var(--text-soft); font-style: italic; }
            </style>
          </defs>
          <rect class="rl-top" x="150" y="12" width="360" height="54" rx="12"/>
          <text class="rl-q" x="330" y="36" text-anchor="middle">What job does the pronoun do</text>
          <text class="rl-q" x="330" y="56" text-anchor="middle">inside its own clause?</text>

          <path class="rl-ln" d="M330 66 V88 M61 88 H607 M61 88 V108 M171 88 V108 M281 88 V108 M391 88 V108 M501 88 V108 M607 88 V108"/>

          <rect class="rl-bx" x="12" y="108" width="98" height="110" rx="10"/>
          <text class="rl-h" x="61" y="130" text-anchor="middle">subject</text>
          <text class="rl-h" x="61" y="146" text-anchor="middle">(verb next)</text>
          <text class="rl-a" x="61" y="178" text-anchor="middle">qui</text>
          <text class="rl-e" x="61" y="204" text-anchor="middle">qui chante</text>

          <rect class="rl-bx" x="122" y="108" width="98" height="110" rx="10"/>
          <text class="rl-h" x="171" y="130" text-anchor="middle">direct object</text>
          <text class="rl-h" x="171" y="146" text-anchor="middle">(subject next)</text>
          <text class="rl-a" x="171" y="178" text-anchor="middle">que</text>
          <text class="rl-e" x="171" y="204" text-anchor="middle">que j’aime</text>

          <rect class="rl-bx" x="232" y="108" width="98" height="110" rx="10"/>
          <text class="rl-h" x="281" y="130" text-anchor="middle">place or</text>
          <text class="rl-h" x="281" y="146" text-anchor="middle">time</text>
          <text class="rl-a" x="281" y="178" text-anchor="middle">où</text>
          <text class="rl-e" x="281" y="204" text-anchor="middle">le jour où</text>

          <rect class="rl-bx" x="342" y="108" width="98" height="110" rx="10"/>
          <text class="rl-h" x="391" y="130" text-anchor="middle">after de</text>
          <text class="rl-h" x="391" y="146" text-anchor="middle">/ whose</text>
          <text class="rl-a" x="391" y="178" text-anchor="middle">dont</text>
          <text class="rl-e" x="391" y="204" text-anchor="middle">dont je parle</text>

          <rect class="rl-bx" x="452" y="108" width="98" height="110" rx="10"/>
          <text class="rl-h" x="501" y="130" text-anchor="middle">other prep.</text>
          <text class="rl-h" x="501" y="146" text-anchor="middle">(avec, sur, à…)</text>
          <text class="rl-a" x="501" y="178" text-anchor="middle">lequel</text>
          <text class="rl-e" x="501" y="204" text-anchor="middle">avec laquelle</text>

          <rect class="rl-bx2" x="562" y="108" width="90" height="110" rx="10"/>
          <text class="rl-h" x="607" y="130" text-anchor="middle">no noun</text>
          <text class="rl-h" x="607" y="146" text-anchor="middle">("what")</text>
          <text class="rl-a2" x="607" y="178" text-anchor="middle">ce + …</text>
          <text class="rl-e" x="607" y="204" text-anchor="middle">ce que</text>

          <path class="rl-ln" d="M501 218 V250 M440 250 H585 M440 250 V270 M585 250 V270"/>
          <rect class="rl-bx" x="372" y="270" width="136" height="78" rx="10"/>
          <text class="rl-h" x="440" y="292" text-anchor="middle">a person</text>
          <text class="rl-a" x="440" y="318" text-anchor="middle">prép. + qui</text>
          <text class="rl-e" x="440" y="338" text-anchor="middle">avec qui, à qui</text>
          <rect class="rl-bx" x="518" y="270" width="134" height="78" rx="10"/>
          <text class="rl-h" x="585" y="290" text-anchor="middle">à / près de + le</text>
          <text class="rl-a" x="585" y="314" text-anchor="middle">auquel</text>
          <text class="rl-a" x="585" y="338" text-anchor="middle">duquel</text>

          <rect class="rl-bx2" x="12" y="270" width="350" height="78" rx="10"/>
          <text class="rl-h" x="187" y="292" text-anchor="middle">No noun before it? Add ce:</text>
          <text class="rl-a2" x="187" y="320" text-anchor="middle">ce qui · ce que · ce dont · ce à quoi</text>
          <text class="rl-e" x="187" y="340" text-anchor="middle">Ce qui compte, c’est ce que tu fais.</text>
          <text class="rl-h" x="330" y="384" text-anchor="middle">Remember: qui and que both work for people and things.</text>
        </svg>