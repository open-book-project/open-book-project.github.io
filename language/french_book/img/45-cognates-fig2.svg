<svg viewBox="0 0 640 330" role="img" aria-label="Traffic light: green true friends, amber partial friends, red false friends, with seven examples each" xmlns="http://www.w3.org/2000/svg"><title>The traffic-light test: most look-alikes are green; amber ones need context; red ones must be learned by heart.</title><style>svg{--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line-strong:#cfd6e2;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.tl-box { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
.tl-h { font: 800 15px var(--font); fill: var(--text); }
.tl-s { font: 500 12px var(--font); fill: var(--text-soft); }
.tl-w { font: 600 13px var(--font); fill: var(--text); }
</style>
</defs>
<g transform="translate(16 12)">
<rect class="tl-box" x="0" y="0" width="192" height="306" rx="14"/>
<circle cx="96" cy="38" r="20" fill="var(--good)"/>
<text class="tl-h" x="96" y="82" text-anchor="middle">True friends</text>
<text class="tl-s" x="96" y="100" text-anchor="middle">same meaning — go!</text>
<text class="tl-w" x="96" y="132" text-anchor="middle">université → university</text>
<text class="tl-w" x="96" y="156" text-anchor="middle">nation → nation</text>
<text class="tl-w" x="96" y="180" text-anchor="middle">important → important</text>
<text class="tl-w" x="96" y="204" text-anchor="middle">dangereux → dangerous</text>
<text class="tl-w" x="96" y="228" text-anchor="middle">hôpital → hospital</text>
<text class="tl-w" x="96" y="252" text-anchor="middle">liberté → liberty</text>
<text class="tl-w" x="96" y="276" text-anchor="middle">possible → possible</text>
</g>
<g transform="translate(224 12)">
<rect class="tl-box" x="0" y="0" width="192" height="306" rx="14"/>
<circle cx="96" cy="38" r="20" fill="var(--warn)"/>
<text class="tl-h" x="96" y="82" text-anchor="middle">Partial friends</text>
<text class="tl-s" x="96" y="100" text-anchor="middle">main meaning differs — slow</text>
<text class="tl-w" x="96" y="132" text-anchor="middle">chance → luck</text>
<text class="tl-w" x="96" y="156" text-anchor="middle">figure → face</text>
<text class="tl-w" x="96" y="180" text-anchor="middle">histoire → story</text>
<text class="tl-w" x="96" y="204" text-anchor="middle">réaliser → carry out</text>
<text class="tl-w" x="96" y="228" text-anchor="middle">ignorer → not know</text>
<text class="tl-w" x="96" y="252" text-anchor="middle">supporter → put up with</text>
<text class="tl-w" x="96" y="276" text-anchor="middle">expérience → experiment</text>
</g>
<g transform="translate(432 12)">
<rect class="tl-box" x="0" y="0" width="192" height="306" rx="14"/>
<circle cx="96" cy="38" r="20" fill="var(--bad)"/>
<text class="tl-h" x="96" y="82" text-anchor="middle">False friends</text>
<text class="tl-s" x="96" y="100" text-anchor="middle">different meaning — stop!</text>
<text class="tl-w" x="96" y="132" text-anchor="middle">librairie → bookshop</text>
<text class="tl-w" x="96" y="156" text-anchor="middle">actuellement → now</text>
<text class="tl-w" x="96" y="180" text-anchor="middle">sensible → sensitive</text>
<text class="tl-w" x="96" y="204" text-anchor="middle">coin → corner</text>
<text class="tl-w" x="96" y="228" text-anchor="middle">pain → bread</text>
<text class="tl-w" x="96" y="252" text-anchor="middle">blesser → hurt</text>
<text class="tl-w" x="96" y="276" text-anchor="middle">rester → stay</text>
</g>
</svg>