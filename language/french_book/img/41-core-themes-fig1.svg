<svg viewBox="0 0 640 360" role="img" aria-label="Concept map: eight vocabulary themes around a centre — la famille, la maison, la nourriture, le corps, les vêtements, les couleurs, le temps, la ville" xmlns="http://www.w3.org/2000/svg"><title>Eight themes, about 150 words. Even the theme names are colour-coded: la famille, le corps, les couleurs.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .ct-l { fill: none; stroke: var(--line-strong); stroke-width: 2; }
       .ct-c { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
       .ct-ct { font: 800 15px var(--font); fill: var(--text); }
       .ct-n { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; }
       .ct-t { font: 700 14px var(--font); }
       .ct-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .ct-m { fill: var(--g-m); } .ct-f { fill: var(--g-f); } .ct-p { fill: var(--g-pl); }
      </style>
     </defs>
     <path class="ct-l" d="M320 180 L320 42 M320 180 L505 88 M320 180 L545 180 M320 180 L505 272 M320 180 L320 318 M320 180 L135 272 M320 180 L95 180 M320 180 L135 88"/>
     <ellipse class="ct-c" cx="320" cy="180" rx="95" ry="40"/>
     <text class="ct-ct" x="320" y="176" text-anchor="middle">Le vocabulaire</text>
     <text class="ct-ct" x="320" y="195" text-anchor="middle">de base</text>
     <g text-anchor="middle">
      <rect class="ct-n" x="240" y="18" width="160" height="48" rx="12"/>
      <text class="ct-t ct-f" x="320" y="39">la famille</text><text class="ct-s" x="320" y="57">la mère · le frère</text>
      <rect class="ct-n" x="425" y="64" width="160" height="48" rx="12"/>
      <text class="ct-t ct-f" x="505" y="85">la maison</text><text class="ct-s" x="505" y="103">la cuisine · le lit</text>
      <rect class="ct-n" x="465" y="156" width="160" height="48" rx="12"/>
      <text class="ct-t ct-f" x="545" y="177">la nourriture</text><text class="ct-s" x="545" y="195">le pain · l’eau</text>
      <rect class="ct-n" x="425" y="248" width="160" height="48" rx="12"/>
      <text class="ct-t ct-m" x="505" y="269">le corps</text><text class="ct-s" x="505" y="287">la tête · le bras</text>
      <rect class="ct-n" x="240" y="294" width="160" height="48" rx="12"/>
      <text class="ct-t ct-p" x="320" y="315">les vêtements</text><text class="ct-s" x="320" y="333">la robe · le pull</text>
      <rect class="ct-n" x="55" y="248" width="160" height="48" rx="12"/>
      <text class="ct-t ct-p" x="135" y="269">les couleurs</text><text class="ct-s" x="135" y="287">rouge · bleu · vert</text>
      <rect class="ct-n" x="15" y="156" width="160" height="48" rx="12"/>
      <text class="ct-t ct-m" x="95" y="177">le temps</text><text class="ct-s" x="95" y="195">il pleut · il fait beau</text>
      <rect class="ct-n" x="55" y="64" width="160" height="48" rx="12"/>
      <text class="ct-t ct-f" x="135" y="85">la ville</text><text class="ct-s" x="135" y="103">la gare · le marché</text>
     </g>
    </svg>