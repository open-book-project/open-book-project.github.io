<svg viewBox="0 0 640 320" role="img" aria-label="Decision tree for -ment adverbs. Start with the masculine adjective. Does it end in a vowel? Yes: add -ment, vrai gives vraiment, poli gives poliment. Does it end in -ant or -ent? Yes: -amment or -emment, constant gives constamment, évident gives évidemment, both pronounced a-mã. Otherwise: take the feminine and add -ment, lent, lente, lentement; heureux, heureuse, heureusement." xmlns="http://www.w3.org/2000/svg"><title>Three questions, three spellings. Then learn the handful of irregulars in section 3.</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-adj:#9333ea;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .q1 { fill: var(--accent-soft); }
          .r1 { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .st { fill: var(--role-adj); }
          .tq { font: 700 14px var(--font); fill: var(--accent-ink); }
          .tr { font: 700 14px var(--font); fill: var(--text); }
          .ts { font: 500 12px var(--font); fill: var(--text-soft); }
          .tw2 { font: 800 14px var(--font); fill: var(--sheet); }
          .yn { font: 800 12px var(--font); fill: var(--text-soft); }
          .ln { stroke: var(--text-soft); stroke-width: 2; fill: none; }
        </style></defs>
        <rect class="st" x="20" y="132" width="130" height="56" rx="12"/>
        <text class="tw2" x="85" y="156" text-anchor="middle">masculine</text>
        <text class="tw2" x="85" y="174" text-anchor="middle">adjective</text>
        <path class="ln" d="M150 160 H170 V50 H190"/>
        <path class="ln" d="M170 160 H190"/>
        <path class="ln" d="M170 160 V270 H190"/>
        <rect class="q1" x="190" y="24" width="190" height="52" rx="10"/>
        <text class="tq" x="204" y="46">ends in a vowel?</text>
        <text class="ts" x="204" y="64">-ai, -i, -u, -é</text>
        <rect class="q1" x="190" y="134" width="190" height="52" rx="10"/>
        <text class="tq" x="204" y="156">ends in -ant / -ent?</text>
        <text class="ts" x="204" y="174">(two syllables or more)</text>
        <rect class="q1" x="190" y="244" width="190" height="52" rx="10"/>
        <text class="tq" x="204" y="266">everything else</text>
        <text class="ts" x="204" y="284">the usual case</text>
        <path class="ln" d="M380 50 H410"/><text class="yn" x="384" y="42">yes</text>
        <path class="ln" d="M380 160 H410"/><text class="yn" x="384" y="152">yes</text>
        <path class="ln" d="M380 270 H410"/>
        <rect class="r1" x="410" y="18" width="215" height="64" rx="10"/>
        <text class="tr" x="424" y="40">+ ment</text>
        <text class="ts" x="424" y="58">vrai → vraiment</text>
        <text class="ts" x="424" y="74">poli → poliment</text>
        <rect class="r1" x="410" y="128" width="215" height="64" rx="10"/>
        <text class="tr" x="424" y="150">-amment / -emment</text>
        <text class="ts" x="424" y="168">constant → constamment</text>
        <text class="ts" x="424" y="184">évident → évidemment · both [a-MÃ]</text>
        <rect class="r1" x="410" y="238" width="215" height="64" rx="10"/>
        <text class="tr" x="424" y="260">feminine + ment</text>
        <text class="ts" x="424" y="278">lent → lente → lentement</text>
        <text class="ts" x="424" y="294">heureux → heureuse → heureusement</text>
      </svg>