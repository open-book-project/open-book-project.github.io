<svg viewBox="0 0 640 330" role="img" aria-label="The 26 French letters on tiles with their names. The trap letters E, G, H, I, J, R, U, W and Y are highlighted." xmlns="http://www.w3.org/2000/svg"><title>Highlighted tiles are the traps. Above all: French G sounds like English “J” and French J like English “G” — they are swapped, with a soft “zh”.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .tile { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1.5; }
        .trap { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
        .L { font: 800 22px var(--font); fill: var(--text); }
        .N { font: 600 12px var(--font); fill: var(--text-soft); }
        .Nt { font: 700 12px var(--font); fill: var(--accent); }
      </style></defs>
      <g transform="translate(22 14)">
        <rect class="tile" x="0" y="0" width="78" height="64" rx="8"/><text class="L" x="39" y="30" text-anchor="middle">A</text><text class="N" x="39" y="52" text-anchor="middle">a</text>
        <rect class="tile" x="86" y="0" width="78" height="64" rx="8"/><text class="L" x="125" y="30" text-anchor="middle">B</text><text class="N" x="125" y="52" text-anchor="middle">bé</text>
        <rect class="tile" x="172" y="0" width="78" height="64" rx="8"/><text class="L" x="211" y="30" text-anchor="middle">C</text><text class="N" x="211" y="52" text-anchor="middle">cé</text>
        <rect class="tile" x="258" y="0" width="78" height="64" rx="8"/><text class="L" x="297" y="30" text-anchor="middle">D</text><text class="N" x="297" y="52" text-anchor="middle">dé</text>
        <rect class="trap" x="344" y="0" width="78" height="64" rx="8"/><text class="L" x="383" y="30" text-anchor="middle">E</text><text class="Nt" x="383" y="52" text-anchor="middle">e [uh]</text>
        <rect class="tile" x="430" y="0" width="78" height="64" rx="8"/><text class="L" x="469" y="30" text-anchor="middle">F</text><text class="N" x="469" y="52" text-anchor="middle">effe</text>
        <rect class="trap" x="516" y="0" width="78" height="64" rx="8"/><text class="L" x="555" y="30" text-anchor="middle">G</text><text class="Nt" x="555" y="52" text-anchor="middle">gé [zhay]</text>

        <rect class="trap" x="0" y="78" width="78" height="64" rx="8"/><text class="L" x="39" y="108" text-anchor="middle">H</text><text class="Nt" x="39" y="130" text-anchor="middle">ache</text>
        <rect class="trap" x="86" y="78" width="78" height="64" rx="8"/><text class="L" x="125" y="108" text-anchor="middle">I</text><text class="Nt" x="125" y="130" text-anchor="middle">i [ee]</text>
        <rect class="trap" x="172" y="78" width="78" height="64" rx="8"/><text class="L" x="211" y="108" text-anchor="middle">J</text><text class="Nt" x="211" y="130" text-anchor="middle">ji [zhee]</text>
        <rect class="tile" x="258" y="78" width="78" height="64" rx="8"/><text class="L" x="297" y="108" text-anchor="middle">K</text><text class="N" x="297" y="130" text-anchor="middle">ka</text>
        <rect class="tile" x="344" y="78" width="78" height="64" rx="8"/><text class="L" x="383" y="108" text-anchor="middle">L</text><text class="N" x="383" y="130" text-anchor="middle">elle</text>
        <rect class="tile" x="430" y="78" width="78" height="64" rx="8"/><text class="L" x="469" y="108" text-anchor="middle">M</text><text class="N" x="469" y="130" text-anchor="middle">emme</text>
        <rect class="tile" x="516" y="78" width="78" height="64" rx="8"/><text class="L" x="555" y="108" text-anchor="middle">N</text><text class="N" x="555" y="130" text-anchor="middle">enne</text>

        <rect class="tile" x="0" y="156" width="78" height="64" rx="8"/><text class="L" x="39" y="186" text-anchor="middle">O</text><text class="N" x="39" y="208" text-anchor="middle">o</text>
        <rect class="tile" x="86" y="156" width="78" height="64" rx="8"/><text class="L" x="125" y="186" text-anchor="middle">P</text><text class="N" x="125" y="208" text-anchor="middle">pé</text>
        <rect class="tile" x="172" y="156" width="78" height="64" rx="8"/><text class="L" x="211" y="186" text-anchor="middle">Q</text><text class="N" x="211" y="208" text-anchor="middle">qu</text>
        <rect class="trap" x="258" y="156" width="78" height="64" rx="8"/><text class="L" x="297" y="186" text-anchor="middle">R</text><text class="Nt" x="297" y="208" text-anchor="middle">erre</text>
        <rect class="tile" x="344" y="156" width="78" height="64" rx="8"/><text class="L" x="383" y="186" text-anchor="middle">S</text><text class="N" x="383" y="208" text-anchor="middle">esse</text>
        <rect class="tile" x="430" y="156" width="78" height="64" rx="8"/><text class="L" x="469" y="186" text-anchor="middle">T</text><text class="N" x="469" y="208" text-anchor="middle">té</text>
        <rect class="trap" x="516" y="156" width="78" height="64" rx="8"/><text class="L" x="555" y="186" text-anchor="middle">U</text><text class="Nt" x="555" y="208" text-anchor="middle">u [ew]</text>

        <rect class="tile" x="86" y="234" width="78" height="64" rx="8"/><text class="L" x="125" y="264" text-anchor="middle">V</text><text class="N" x="125" y="286" text-anchor="middle">vé</text>
        <rect class="trap" x="172" y="234" width="78" height="64" rx="8"/><text class="L" x="211" y="264" text-anchor="middle">W</text><text class="Nt" x="211" y="286" text-anchor="middle">double vé</text>
        <rect class="tile" x="258" y="234" width="78" height="64" rx="8"/><text class="L" x="297" y="264" text-anchor="middle">X</text><text class="N" x="297" y="286" text-anchor="middle">ixe</text>
        <rect class="trap" x="344" y="234" width="78" height="64" rx="8"/><text class="L" x="383" y="264" text-anchor="middle">Y</text><text class="Nt" x="383" y="286" text-anchor="middle">i grec</text>
        <rect class="tile" x="430" y="234" width="78" height="64" rx="8"/><text class="L" x="469" y="264" text-anchor="middle">Z</text><text class="N" x="469" y="286" text-anchor="middle">zède</text>
      </g>
    </svg>