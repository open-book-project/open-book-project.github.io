<svg viewBox="0 0 640 300" role="img" aria-label="How a French law is made: a projet de loi from the government or a proposition de loi from members of parliament goes to le Parlement, where l'Assemblée nationale and le Sénat pass it back and forth (la navette); then l'adoption, an optional check by le Conseil constitutionnel, and la promulgation by the president" xmlns="http://www.w3.org/2000/svg"><title>How a French law is made. The government proposes and applies laws; Parliament debates and votes them. If the two houses keep disagreeing, the government can give the Assemblée the last word.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .lw-b { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.6; }
       .lw-p { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
       .lw-a { fill: none; stroke: var(--text-soft); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
       .lw-h { font: 800 12px var(--font); fill: var(--text-soft); }
       .lw-t { font: 700 13px var(--font); }
       .lw-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .lw-x { font: 800 12px var(--font); fill: var(--accent); }
       .lw-m { fill: var(--g-m); } .lw-f { fill: var(--g-f); }
      </style>
     </defs>
     <g text-anchor="middle">
      <rect class="lw-b" x="10" y="20" width="190" height="110" rx="12"/>
      <text class="lw-h" x="105" y="42">1 · LE TEXTE</text>
      <text class="lw-t lw-m" x="105" y="66">le projet de loi</text>
      <text class="lw-s" x="105" y="82">from le gouvernement</text>
      <text class="lw-t lw-f" x="105" y="104">la proposition de loi</text>
      <text class="lw-s" x="105" y="120">from MPs or senators</text>

      <rect class="lw-p" x="225" y="10" width="405" height="130" rx="14"/>
      <text class="lw-x" x="427" y="30">LE PARLEMENT</text>
      <rect class="lw-b" x="240" y="42" width="160" height="66" rx="10"/>
      <text class="lw-t lw-f" x="320" y="68">l’Assemblée</text>
      <text class="lw-s" x="320" y="88">577 députés</text>
      <rect class="lw-b" x="455" y="42" width="160" height="66" rx="10"/>
      <text class="lw-t lw-m" x="535" y="68">le Sénat</text>
      <text class="lw-s" x="535" y="88">348 sénateurs</text>
      <text class="lw-s" x="427" y="130">la navette (back and forth)</text>
     </g>
     <path class="lw-a" d="M200 75 H236 M230 69 L236 75 L230 81"/>
     <path class="lw-a" d="M404 66 H451 M445 60 L451 66 L445 72"/>
     <path class="lw-a" d="M451 86 H404 M410 80 L404 86 L410 92"/>
     <path class="lw-a" d="M330 140 C330 165 110 160 110 186 M104 180 L110 186 L116 180"/>
     <g text-anchor="middle">
      <rect class="lw-b" x="10" y="190" width="190" height="80" rx="12"/>
      <text class="lw-h" x="105" y="212">2 · LE VOTE</text>
      <text class="lw-t lw-f" x="105" y="236">l’adoption</text>
      <text class="lw-s" x="105" y="254">the law is passed</text>

      <rect class="lw-b" x="225" y="190" width="190" height="80" rx="12"/>
      <text class="lw-h" x="320" y="212">3 · LE CONTRÔLE</text>
      <text class="lw-t lw-m" x="320" y="236">le Conseil</text>
      <text class="lw-t lw-m" x="320" y="254">constitutionnel</text>

      <rect class="lw-b" x="440" y="190" width="190" height="80" rx="12"/>
      <text class="lw-h" x="535" y="212">4 · LA SIGNATURE</text>
      <text class="lw-t lw-f" x="535" y="236">la promulgation</text>
      <text class="lw-s" x="535" y="254">by the president</text>
     </g>
     <path class="lw-a" d="M200 230 H221 M215 224 L221 230 L215 236"/>
     <path class="lw-a" d="M415 230 H436 M430 224 L436 230 L430 236"/>
     <text class="lw-s" x="320" y="292" text-anchor="middle">step 3 only if the Council is asked to check the text</text>
    </svg>