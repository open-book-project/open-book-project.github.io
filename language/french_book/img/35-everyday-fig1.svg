<svg viewBox="0 0 640 170" role="img" aria-label="The politeness sandwich: Bonjour, then je voudrais plus the thing, then s'il vous plaît, then merci, then bonne journée." xmlns="http://www.w3.org/2000/svg"><title>Learn the outside of the sandwich once, then swap the filling: un café, une baguette, un ticket…</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .gf-b { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
          .gf-m { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .gf-t { font: 800 15px var(--font); fill: var(--text); }
          .gf-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .gf-a { fill: none; stroke: var(--text-soft); stroke-width: 2; }
          .gf-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .08em; }
        </style></defs>
        <text class="gf-h" x="4" y="20">THE POLITENESS SANDWICH</text>
        <rect class="gf-b" x="4" y="40" width="118" height="70" rx="12"/>
        <text class="gf-t" x="63" y="72" text-anchor="middle">Bonjour</text>
        <text class="gf-s" x="63" y="94" text-anchor="middle">evening: Bonsoir</text>
        <path class="gf-a" d="M124 75 L134 75"/>
        <rect class="gf-m" x="136" y="40" width="150" height="70" rx="12"/>
        <text class="gf-t" x="211" y="72" text-anchor="middle">je voudrais…</text>
        <text class="gf-s" x="211" y="94" text-anchor="middle">+ the thing you want</text>
        <path class="gf-a" d="M288 75 L298 75"/>
        <rect class="gf-b" x="300" y="40" width="120" height="70" rx="12"/>
        <text class="gf-t" x="360" y="72" text-anchor="middle">s’il vous plaît</text>
        <text class="gf-s" x="360" y="94" text-anchor="middle">please</text>
        <path class="gf-a" d="M422 75 L432 75"/>
        <rect class="gf-b" x="434" y="40" width="80" height="70" rx="12"/>
        <text class="gf-t" x="474" y="72" text-anchor="middle">Merci</text>
        <text class="gf-s" x="474" y="94" text-anchor="middle">thanks</text>
        <path class="gf-a" d="M516 75 L526 75"/>
        <rect class="gf-b" x="528" y="40" width="108" height="70" rx="12"/>
        <text class="gf-t" x="582" y="64" text-anchor="middle">Bonne</text>
        <text class="gf-t" x="582" y="82" text-anchor="middle">journée</text>
        <text class="gf-s" x="582" y="101" text-anchor="middle">good day!</text>
        <text class="gf-s" x="4" y="146">The middle changes in every shop. The bread around it never does.</text>
      </svg>