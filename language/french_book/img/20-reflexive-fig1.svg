<svg viewBox="0 0 660 300" role="img" aria-label="A day as a timeline: se réveiller at 6:30, se lever 6:45, se doucher 7:00, s'habiller 7:20, se dépêcher 8:00, se reposer 18:00, se coucher 23:00, s'endormir 23:15." xmlns="http://www.w3.org/2000/svg"><title>A whole day of reflexive verbs. Say each one with je me / je m’ as you do it tomorrow morning.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--line-strong:#cfd6e2;--role-verb:#0d9488;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .rf-ln { fill: none; stroke: var(--line-strong); stroke-width: 3; }
        .rf-dot { fill: var(--accent); }
        .rf-tm { font: 800 13px var(--font); fill: var(--accent); }
        .rf-v { font: 700 14px var(--font); fill: var(--role-verb); }
        .rf-g { font: 500 12px var(--font); fill: var(--text-soft); }
        .rf-tk { fill: none; stroke: var(--line); stroke-width: 1.5; }
      </style></defs>
      <path class="rf-ln" d="M20 150 L640 150"/>
      <circle class="rf-dot" cx="50" cy="150" r="7"/>
      <path class="rf-tk" d="M50 142 L50 100"/>
      <text class="rf-tm" x="50" y="40" text-anchor="middle">6h30</text>
      <text class="rf-v" x="50" y="64" text-anchor="middle">se réveiller</text>
      <text class="rf-g" x="50" y="82" text-anchor="middle">wake up</text>
      <circle class="rf-dot" cx="130" cy="150" r="7"/>
      <path class="rf-tk" d="M130 158 L130 196"/>
      <text class="rf-tm" x="130" y="216" text-anchor="middle">6h45</text>
      <text class="rf-v" x="130" y="240" text-anchor="middle">se lever</text>
      <text class="rf-g" x="130" y="258" text-anchor="middle">get up</text>
      <circle class="rf-dot" cx="210" cy="150" r="7"/>
      <path class="rf-tk" d="M210 142 L210 100"/>
      <text class="rf-tm" x="210" y="40" text-anchor="middle">7h00</text>
      <text class="rf-v" x="210" y="64" text-anchor="middle">se doucher</text>
      <text class="rf-g" x="210" y="82" text-anchor="middle">shower</text>
      <circle class="rf-dot" cx="290" cy="150" r="7"/>
      <path class="rf-tk" d="M290 158 L290 196"/>
      <text class="rf-tm" x="290" y="216" text-anchor="middle">7h20</text>
      <text class="rf-v" x="290" y="240" text-anchor="middle">s’habiller</text>
      <text class="rf-g" x="290" y="258" text-anchor="middle">get dressed</text>
      <circle class="rf-dot" cx="370" cy="150" r="7"/>
      <path class="rf-tk" d="M370 142 L370 100"/>
      <text class="rf-tm" x="370" y="40" text-anchor="middle">8h00</text>
      <text class="rf-v" x="370" y="64" text-anchor="middle">se dépêcher</text>
      <text class="rf-g" x="370" y="82" text-anchor="middle">hurry</text>
      <circle class="rf-dot" cx="450" cy="150" r="7"/>
      <path class="rf-tk" d="M450 158 L450 196"/>
      <text class="rf-tm" x="450" y="216" text-anchor="middle">18h00</text>
      <text class="rf-v" x="450" y="240" text-anchor="middle">se reposer</text>
      <text class="rf-g" x="450" y="258" text-anchor="middle">rest</text>
      <circle class="rf-dot" cx="530" cy="150" r="7"/>
      <path class="rf-tk" d="M530 142 L530 100"/>
      <text class="rf-tm" x="530" y="40" text-anchor="middle">23h00</text>
      <text class="rf-v" x="530" y="64" text-anchor="middle">se coucher</text>
      <text class="rf-g" x="530" y="82" text-anchor="middle">go to bed</text>
      <circle class="rf-dot" cx="610" cy="150" r="7"/>
      <path class="rf-tk" d="M610 158 L610 196"/>
      <text class="rf-tm" x="610" y="216" text-anchor="middle">23h15</text>
      <text class="rf-v" x="610" y="240" text-anchor="middle">s’endormir</text>
      <text class="rf-g" x="610" y="258" text-anchor="middle">fall asleep</text>
      <text class="rf-g" x="330" y="292" text-anchor="middle">French uses the 24-hour clock: 18h00 = 6 pm, 23h00 = 11 pm.</text>
    </svg>