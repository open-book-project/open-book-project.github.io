<svg viewBox="0 0 640 300" role="img" aria-label="Three-stage listening strategy. Before: situation, speaker, purpose, predicted words. During: key words, numbers and names, connectors, ignore the rest. After: check your answers, listen again, read the transcript, note new words. An arrow loops back from after to before for the next recording." xmlns="http://www.w3.org/2000/svg"><title>The three stages. Spending 30 seconds on “avant” can double what you understand.</title><style>svg{--accent:#ea580c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .st-col { fill: var(--canvas); stroke: var(--line); stroke-width: 1.5; }
          .st-hd { fill: var(--accent); }
          .st-ht { font: 800 15px var(--font); fill: var(--sheet); }
          .st-t { font: 600 13px var(--font); fill: var(--text); }
          .st-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .st-a { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
          .st-h { fill: var(--accent); }
        </style></defs>
        <rect class="st-col" x="15" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="15" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="110" y="46" text-anchor="middle">AVANT · before</text>
        <text class="st-t" x="30" y="88">• What situation?</text>
        <text class="st-t" x="30" y="116">• Who speaks? Why?</text>
        <text class="st-t" x="30" y="144">• Predict 5 words</text>
        <text class="st-s" x="30" y="176">voicemail → name,</text>
        <text class="st-s" x="30" y="194">reason, request,</text>
        <text class="st-s" x="30" y="212">phone number</text>
        <rect class="st-col" x="225" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="225" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="320" y="46" text-anchor="middle">PENDANT · during</text>
        <text class="st-t" x="240" y="88">• Key nouns &amp; verbs</text>
        <text class="st-t" x="240" y="116">• Numbers, names</text>
        <text class="st-t" x="240" y="144">• Connectors</text>
        <text class="st-s" x="240" y="176">mais, par contre →</text>
        <text class="st-s" x="240" y="194">the important part</text>
        <text class="st-s" x="240" y="212">is coming!</text>
        <rect class="st-col" x="435" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="435" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="530" y="46" text-anchor="middle">APRÈS · after</text>
        <text class="st-t" x="450" y="88">• Check guesses</text>
        <text class="st-t" x="450" y="116">• Listen once more</text>
        <text class="st-t" x="450" y="144">• Read transcript</text>
        <text class="st-s" x="450" y="176">note 3–5 new words</text>
        <text class="st-s" x="450" y="194">and one useful</text>
        <text class="st-s" x="450" y="212">sentence to reuse</text>
        <path class="st-a" d="M205 130 L222 130"/>
        <path class="st-a" d="M415 130 L432 130"/>
        <path class="st-a" d="M530 244 Q530 285 320 285 Q110 285 110 250"/>
        <polygon class="st-h" points="110,243 104,254 116,254"/>
        <text class="st-s" x="320" y="278" text-anchor="middle">next recording</text>
      </svg>