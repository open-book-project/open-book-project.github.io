<svg viewBox="0 0 640 300" role="img" aria-label="Six written forms of parler collapse into three sounds: parle, parles, parle and parlent all sound like parl; parlons sounds like par-lon; parlez sounds like par-lay, the same as the infinitive parler." xmlns="http://www.w3.org/2000/svg"><title>Grey letters are written but never spoken. The -ent of ils parlent is silent — never say “parl-ENT”.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-faint:#6b7385;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .fm { font: 700 16px var(--font); fill: var(--text); }
          .end2 { fill: var(--text-faint); }
          .snd2 { font: 800 20px ui-monospace, Menlo, Consolas, monospace; fill: var(--accent-ink); }
          .bub { fill: var(--accent-soft); }
          .bub2 { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .lk { stroke: var(--accent); stroke-width: 2; fill: none; }
          .lk2 { stroke: var(--role-verb); stroke-width: 2; fill: none; }
          .cap2 { font: 600 13px var(--font); fill: var(--text-soft); }
          .vv { fill: var(--role-verb); }
        </style></defs>
        <text class="fm" x="40" y="44">je parl<tspan class="end2">e</tspan></text>
        <text class="fm" x="40" y="84">tu parl<tspan class="end2">es</tspan></text>
        <text class="fm" x="40" y="124">il / elle / on parl<tspan class="end2">e</tspan></text>
        <text class="fm" x="40" y="164">ils / elles parl<tspan class="end2">ent</tspan></text>
        <text class="fm" x="40" y="214">nous parl<tspan class="vv">ons</tspan></text>
        <text class="fm" x="40" y="264">vous parl<tspan class="vv">ez</tspan> · parl<tspan class="vv">er</tspan></text>
        <path class="lk" d="M150 39 C300 39 330 100 400 100"/>
        <path class="lk" d="M150 79 C300 79 330 100 400 100"/>
        <path class="lk" d="M225 119 C300 119 330 100 400 100"/>
        <path class="lk" d="M235 159 C300 159 330 100 400 100"/>
        <path class="lk2" d="M190 209 H400"/>
        <path class="lk2" d="M250 259 H400"/>
        <rect class="bub" x="400" y="72" width="200" height="56" rx="28"/>
        <text class="snd2" x="500" y="108" text-anchor="middle">[PARL]</text>
        <rect class="bub2" x="400" y="186" width="200" height="46" rx="23"/>
        <text class="snd2" x="500" y="216" text-anchor="middle">[par-LÕ]</text>
        <rect class="bub2" x="400" y="236" width="200" height="46" rx="23"/>
        <text class="snd2" x="500" y="266" text-anchor="middle">[par-LAY]</text>
        <text class="cap2" x="500" y="152" text-anchor="middle">7 pronouns, 1 sound</text>
      </svg>