<svg viewBox="0 0 640 400" role="img" aria-label="Body map linking parts of the body to French idioms: tête, yeux, nez, main, pieds, oreilles, langue, gorge, cœur, bras" xmlns="http://www.w3.org/2000/svg"><title>The idiom body: ten body parts, ten everyday expressions.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.bd { fill: none; stroke: var(--text-soft); stroke-width: 3; stroke-linecap: round; }
.bd-l { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 3; }
.bd-w { font: 800 13px var(--font); fill: var(--accent-ink); }
.bd-i { font: 500 12px var(--font); fill: var(--text); }
.bd-e { text-anchor: end; }
</style>
</defs>
<circle cx="320" cy="72" r="38" fill="var(--accent-soft)" stroke="var(--text-soft)" stroke-width="3"/>
<circle cx="307" cy="66" r="4" fill="var(--text)"/><circle cx="333" cy="66" r="4" fill="var(--text)"/>
<path class="bd" d="M320 72 v10 M310 94 q10 7 20 0"/>
<path class="bd" d="M283 72 q-7 0 -6 9 M357 72 q7 0 6 9"/>
<path class="bd" d="M320 110 V240 M290 132 H350 M290 132 L262 222 M350 132 L378 222 M320 240 L292 352 M320 240 L348 352 M292 352 H272 M348 352 H368"/>
