<svg viewBox="0 0 640 260" role="img" aria-label="Spoken versus written narration: passé composé and passé simple, both with the imparfait for background" xmlns="http://www.w3.org/2000/svg"><title>Swap the passé composé for the passé simple and you move from conversation to literature. The imparfait does not change.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-pl:#7c3aed;--line:#e3e7ef;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .lt-sp { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2.5; }
              .lt-wr { fill: var(--sheet); stroke: var(--g-pl); stroke-width: 2.5; }
              .lt-sh { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
              .lt-h { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
              .lt-t { font: 800 16px var(--font); fill: var(--text); }
              .lt-e { font: 500 12.5px var(--font); fill: var(--text-soft); font-style: italic; }
              .lt-ln { fill: none; stroke: var(--line); stroke-width: 2; }
            </style>
          </defs>
          <text class="lt-h" x="160" y="22" text-anchor="middle">SPOKEN · E-MAILS · LETTERS</text>
          <text class="lt-h" x="480" y="22" text-anchor="middle">NOVELS · TALES · HISTORY</text>
          <rect class="lt-sp" x="20" y="34" width="280" height="84" rx="12"/>
          <text class="lt-t" x="160" y="64" text-anchor="middle">passé composé</text>
          <text class="lt-e" x="160" y="86" text-anchor="middle">Il est entré et il a souri.</text>
          <text class="lt-e" x="160" y="104" text-anchor="middle">events, the plot</text>
          <rect class="lt-wr" x="340" y="34" width="280" height="84" rx="12"/>
          <text class="lt-t" x="480" y="64" text-anchor="middle">passé simple</text>
          <text class="lt-e" x="480" y="86" text-anchor="middle">Il entra et il sourit.</text>
          <text class="lt-e" x="480" y="104" text-anchor="middle">events, the plot</text>
          <path class="lt-ln" d="M160 118 V160 M480 118 V160"/>
          <rect class="lt-sh" x="20" y="160" width="600" height="84" rx="12"/>
          <text class="lt-t" x="320" y="190" text-anchor="middle">imparfait (+ plus-que-parfait) — shared by both</text>
          <text class="lt-e" x="320" y="212" text-anchor="middle">Il pleuvait. La maison était silencieuse. Elle avait longtemps attendu.</text>
          <text class="lt-e" x="320" y="230" text-anchor="middle">the scene, the background, what had happened before</text>
        </svg>