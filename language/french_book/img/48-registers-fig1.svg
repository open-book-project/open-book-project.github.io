<svg viewBox="0 0 640 380" role="img" aria-label="Register ladder: soutenu, courant, familier and argotique, with the words for car, money and work on each step" xmlns="http://www.w3.org/2000/svg"><title>Same meaning, four social signals. The highlighted middle step — courant — is the one to use when you are not sure.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .rg-step { fill: var(--accent-soft); stroke: var(--line); stroke-width: 1.5; }
              .rg-mid { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
              .rg-name { font: 800 15px var(--font); fill: var(--text); }
              .rg-sub { font: 500 12px var(--font); fill: var(--text-soft); }
              .rg-head { font: 700 13px var(--font); fill: var(--accent); }
              .rg-word { font: 600 14px var(--font); fill: var(--text); }
              .rg-arrow { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
              .rg-tiny { font: 600 12px var(--font); fill: var(--accent); }
            </style>
          </defs>
          <text class="rg-head" x="340" y="26" text-anchor="middle">a car</text>
          <text class="rg-head" x="460" y="26" text-anchor="middle">money</text>
          <text class="rg-head" x="575" y="26" text-anchor="middle">work / a job</text>

          <rect class="rg-step" x="40" y="40" width="590" height="70" rx="12"/>
          <text class="rg-name" x="58" y="70">Soutenu</text>
          <text class="rg-sub" x="58" y="90">formal letters, speeches</text>
          <text class="rg-word" x="340" y="80" text-anchor="middle">un véhicule</text>
          <text class="rg-word" x="460" y="80" text-anchor="middle">des fonds</text>
          <text class="rg-word" x="575" y="80" text-anchor="middle">un emploi</text>

          <rect class="rg-mid" x="40" y="120" width="590" height="70" rx="12"/>
          <text class="rg-name" x="58" y="150">Courant</text>
          <text class="rg-sub" x="58" y="170">standard — safe everywhere</text>
          <text class="rg-word" x="340" y="160" text-anchor="middle">une voiture</text>
          <text class="rg-word" x="460" y="160" text-anchor="middle">l’argent</text>
          <text class="rg-word" x="575" y="160" text-anchor="middle">le travail</text>

          <rect class="rg-step" x="40" y="200" width="590" height="70" rx="12"/>
          <text class="rg-name" x="58" y="230">Familier</text>
          <text class="rg-sub" x="58" y="250">friends, family, colleagues</text>
          <text class="rg-word" x="340" y="240" text-anchor="middle">une bagnole</text>
          <text class="rg-word" x="460" y="240" text-anchor="middle">le fric</text>
          <text class="rg-word" x="575" y="240" text-anchor="middle">le boulot</text>

          <rect class="rg-step" x="40" y="280" width="590" height="70" rx="12"/>
          <text class="rg-name" x="58" y="310">Argotique</text>
          <text class="rg-sub" x="58" y="330">slang, in-groups, youth</text>
          <text class="rg-word" x="340" y="320" text-anchor="middle">une caisse</text>
          <text class="rg-word" x="460" y="320" text-anchor="middle">la thune</text>
          <text class="rg-word" x="575" y="320" text-anchor="middle">le taf</text>

          <path class="rg-arrow" d="M20 340 L20 52"/>
          <path class="rg-arrow" d="M12 64 L20 50 L28 64"/>
          <text class="rg-tiny" x="4" y="370" text-anchor="start">formality</text>
        </svg>