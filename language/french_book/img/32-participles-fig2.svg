<svg viewBox="0 0 640 230" role="img" aria-label="Causative: I cause, the mechanic does, the car receives the action" xmlns="http://www.w3.org/2000/svg"><title>With faire + infinitive, the subject causes the action and someone else carries it out. Pronouns go before faire; fait never agrees.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cs-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
              .cs-b { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
              .cs-c { fill: var(--sheet); stroke: var(--g-f); stroke-width: 2.5; }
              .cs-ar { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
              .cs-t { font: 800 15px var(--font); fill: var(--text); }
              .cs-r { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .04em; }
              .cs-e { font: 500 13px var(--font); fill: var(--text); font-style: italic; }
            </style>
          </defs>
          <rect class="cs-a" x="12" y="30" width="170" height="70" rx="12"/>
          <text class="cs-r" x="97" y="54" text-anchor="middle">CAUSE</text>
          <text class="cs-t" x="97" y="82" text-anchor="middle">Je fais…</text>
          <path class="cs-ar" d="M188 65 H228 M220 58 L230 65 L220 72"/>
          <rect class="cs-b" x="236" y="30" width="170" height="70" rx="12"/>
          <text class="cs-r" x="321" y="54" text-anchor="middle">DOES THE ACTION</text>
          <text class="cs-t" x="321" y="82" text-anchor="middle">(le garagiste)</text>
          <path class="cs-ar" d="M412 65 H452 M444 58 L454 65 L444 72"/>
          <rect class="cs-c" x="460" y="30" width="170" height="70" rx="12"/>
          <text class="cs-r" x="545" y="54" text-anchor="middle">RECEIVES IT</text>
          <text class="cs-t" x="545" y="82" text-anchor="middle">ma voiture</text>
          <text class="cs-e" x="320" y="134" text-anchor="middle">Je fais réparer ma voiture (par le garagiste).</text>
          <text class="cs-e" x="320" y="160" text-anchor="middle">→ Je la fais réparer. · La voiture que j’ai fait réparer.</text>
          <path class="cs-ar" d="M545 178 C545 214 97 214 97 186 M90 194 L97 184 L104 194"/>
          <text class="cs-r" x="320" y="226" text-anchor="middle">SE FAIRE: THE ACTION COMES BACK TO ME — Je me suis fait couper les cheveux.</text>
        </svg>