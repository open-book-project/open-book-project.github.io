<svg viewBox="0 0 640 250" role="img" aria-label="Concordance of tenses: present to imparfait, passé composé to plus-que-parfait, future to conditional" xmlns="http://www.w3.org/2000/svg"><title>After a past reporting verb, each tense takes one step back. Tenses already &quot;in the past&quot; (imparfait, plus-que-parfait, conditional) stay as they are.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cc-d { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
              .cc-r { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .cc-a { fill: none; stroke: var(--accent); stroke-width: 2.5; }
              .cc-h { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
              .cc-t { font: 800 14px var(--font); fill: var(--text); }
              .cc-e { font: 500 12.5px var(--font); fill: var(--text-soft); font-style: italic; }
            </style>
          </defs>
          <text class="cc-h" x="140" y="20" text-anchor="middle">DIRECT  « … »</text>
          <text class="cc-h" x="500" y="20" text-anchor="middle">REPORTED — Il a dit que…</text>

          <rect class="cc-d" x="20" y="34" width="240" height="56" rx="10"/>
          <text class="cc-t" x="140" y="58" text-anchor="middle">présent</text>
          <text class="cc-e" x="140" y="78" text-anchor="middle">« Je pars. »</text>
          <path class="cc-a" d="M268 62 H370 M360 54 L372 62 L360 70"/>
          <rect class="cc-r" x="380" y="34" width="240" height="56" rx="10"/>
          <text class="cc-t" x="500" y="58" text-anchor="middle">imparfait</text>
          <text class="cc-e" x="500" y="78" text-anchor="middle">… qu’il partait.</text>

          <rect class="cc-d" x="20" y="106" width="240" height="56" rx="10"/>
          <text class="cc-t" x="140" y="130" text-anchor="middle">passé composé</text>
          <text class="cc-e" x="140" y="150" text-anchor="middle">« Je suis parti. »</text>
          <path class="cc-a" d="M268 134 H370 M360 126 L372 134 L360 142"/>
          <rect class="cc-r" x="380" y="106" width="240" height="56" rx="10"/>
          <text class="cc-t" x="500" y="130" text-anchor="middle">plus-que-parfait</text>
          <text class="cc-e" x="500" y="150" text-anchor="middle">… qu’il était parti.</text>

          <rect class="cc-d" x="20" y="178" width="240" height="56" rx="10"/>
          <text class="cc-t" x="140" y="202" text-anchor="middle">futur</text>
          <text class="cc-e" x="140" y="222" text-anchor="middle">« Je partirai. »</text>
          <path class="cc-a" d="M268 206 H370 M360 198 L372 206 L360 214"/>
          <rect class="cc-r" x="380" y="178" width="240" height="56" rx="10"/>
          <text class="cc-t" x="500" y="202" text-anchor="middle">conditionnel</text>
          <text class="cc-e" x="500" y="222" text-anchor="middle">… qu’il partirait.</text>
        </svg>