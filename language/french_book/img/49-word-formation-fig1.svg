<svg viewBox="0 0 640 250" role="img" aria-label="Prefix plus root plus suffix: in plus croy plus able gives incroyable; mé plus content plus ement gives mécontentement; sous plus estim plus ation gives sous-estimation" xmlns="http://www.w3.org/2000/svg"><title>Read long words from the inside out: find the root you know, then add the meaning of each block.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .wf-pre { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
              .wf-root { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; }
              .wf-suf { fill: var(--accent-soft); stroke: var(--role-noun); stroke-width: 1.5; }
              .wf-t { font: 700 15px var(--font); fill: var(--text); }
              .wf-s { font: 500 12px var(--font); fill: var(--text-soft); }
              .wf-op { font: 800 20px var(--font); fill: var(--text-soft); }
              .wf-res { font: 800 15px var(--font); fill: var(--accent); }
              .wf-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
            </style>
          </defs>
          <text class="wf-h" x="90" y="22" text-anchor="middle">PREFIX</text>
          <text class="wf-h" x="260" y="22" text-anchor="middle">ROOT</text>
          <text class="wf-h" x="420" y="22" text-anchor="middle">SUFFIX</text>
          <text class="wf-h" x="570" y="22" text-anchor="middle">NEW WORD</text>

          <rect class="wf-pre" x="30" y="36" width="120" height="50" rx="10"/>
          <text class="wf-t" x="90" y="58" text-anchor="middle">in-</text>
          <text class="wf-s" x="90" y="76" text-anchor="middle">not</text>
          <text class="wf-op" x="170" y="68" text-anchor="middle">+</text>
          <rect class="wf-root" x="190" y="36" width="140" height="50" rx="10"/>
          <text class="wf-t" x="260" y="58" text-anchor="middle">croy</text>
          <text class="wf-s" x="260" y="76" text-anchor="middle">croire = believe</text>
          <text class="wf-op" x="350" y="68" text-anchor="middle">+</text>
          <rect class="wf-suf" x="370" y="36" width="100" height="50" rx="10"/>
          <text class="wf-t" x="420" y="58" text-anchor="middle">-able</text>
          <text class="wf-s" x="420" y="76" text-anchor="middle">can be</text>
          <text class="wf-op" x="495" y="68" text-anchor="middle">=</text>
          <text class="wf-res" x="570" y="60" text-anchor="middle">incroyable</text>
          <text class="wf-s" x="570" y="78" text-anchor="middle">unbelievable</text>

          <rect class="wf-pre" x="30" y="106" width="120" height="50" rx="10"/>
          <text class="wf-t" x="90" y="128" text-anchor="middle">mé-</text>
          <text class="wf-s" x="90" y="146" text-anchor="middle">badly</text>
          <text class="wf-op" x="170" y="138" text-anchor="middle">+</text>
          <rect class="wf-root" x="190" y="106" width="140" height="50" rx="10"/>
          <text class="wf-t" x="260" y="128" text-anchor="middle">content</text>
          <text class="wf-s" x="260" y="146" text-anchor="middle">happy</text>
          <text class="wf-op" x="350" y="138" text-anchor="middle">+</text>
          <rect class="wf-suf" x="370" y="106" width="100" height="50" rx="10"/>
          <text class="wf-t" x="420" y="128" text-anchor="middle">-ement</text>
          <text class="wf-s" x="420" y="146" text-anchor="middle">noun (m.)</text>
          <text class="wf-op" x="495" y="138" text-anchor="middle">=</text>
          <text class="wf-res" x="570" y="130" text-anchor="middle">mécontentement</text>
          <text class="wf-s" x="570" y="148" text-anchor="middle">discontent</text>

          <rect class="wf-pre" x="30" y="176" width="120" height="50" rx="10"/>
          <text class="wf-t" x="90" y="198" text-anchor="middle">sous-</text>
          <text class="wf-s" x="90" y="216" text-anchor="middle">under</text>
          <text class="wf-op" x="170" y="208" text-anchor="middle">+</text>
          <rect class="wf-root" x="190" y="176" width="140" height="50" rx="10"/>
          <text class="wf-t" x="260" y="198" text-anchor="middle">estim</text>
          <text class="wf-s" x="260" y="216" text-anchor="middle">estimer = value</text>
          <text class="wf-op" x="350" y="208" text-anchor="middle">+</text>
          <rect class="wf-suf" x="370" y="176" width="100" height="50" rx="10"/>
          <text class="wf-t" x="420" y="198" text-anchor="middle">-ation</text>
          <text class="wf-s" x="420" y="216" text-anchor="middle">noun (f.)</text>
          <text class="wf-op" x="495" y="208" text-anchor="middle">=</text>
          <text class="wf-res" x="570" y="200" text-anchor="middle">sous-estimation</text>
          <text class="wf-s" x="570" y="218" text-anchor="middle">underestimation</text>
        </svg>