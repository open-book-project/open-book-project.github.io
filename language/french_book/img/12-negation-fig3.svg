<svg viewBox="0 0 640 220" role="img" aria-label="Positive question Tu as faim? Answer oui or non. Negative question Tu n'as pas faim? Answer si to contradict and mean yes I am, or non to agree and mean no I'm not." xmlns="http://www.w3.org/2000/svg"><title>Si contradicts a negative. It is short, strong, and very French.</title><style>svg{--accent:#ea580c;--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .qq { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .qa { font: 700 15px var(--font); fill: var(--text); }
          .ay { fill: var(--good); } .an2 { fill: var(--bad); } .as { fill: var(--accent); }
          .aw { font: 800 16px var(--font); fill: var(--sheet); }
          .am2 { font: 500 12px var(--font); fill: var(--text-soft); }
          .ln2 { stroke: var(--text-soft); stroke-width: 1.8; fill: none; }
        </style></defs>
        <rect class="qq" x="20" y="20" width="200" height="50" rx="12"/><text class="qa" x="120" y="51" text-anchor="middle">Tu as faim ?</text>
        <path class="ln2" d="M220 45 H270"/>
        <rect class="ay" x="270" y="24" width="80" height="42" rx="21"/><text class="aw" x="310" y="51" text-anchor="middle">Oui</text>
        <text class="am2" x="362" y="42">= yes, I am</text>
        <rect class="an2" x="460" y="24" width="80" height="42" rx="21"/><text class="aw" x="500" y="51" text-anchor="middle">Non</text>
        <text class="am2" x="552" y="42">= no</text>
        <rect class="qq" x="20" y="120" width="200" height="50" rx="12"/><text class="qa" x="120" y="151" text-anchor="middle">Tu n’as pas faim ?</text>
        <path class="ln2" d="M220 145 H270"/>
        <rect class="as" x="270" y="124" width="80" height="42" rx="21"/><text class="aw" x="310" y="151" text-anchor="middle">Si !</text>
        <text class="am2" x="362" y="142">= yes I am!</text>
        <text class="am2" x="362" y="158">(I disagree)</text>
        <rect class="an2" x="460" y="124" width="80" height="42" rx="21"/><text class="aw" x="500" y="151" text-anchor="middle">Non</text>
        <text class="am2" x="552" y="142">= no, I’m</text>
        <text class="am2" x="552" y="158">not (agree)</text>
        <text class="am2" x="320" y="208" text-anchor="middle">Never answer a negative question with oui — say si.</text>
      </svg>