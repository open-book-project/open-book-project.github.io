<svg viewBox="0 0 640 360" role="img" aria-label="Concept map: la société in the centre, linked to l'environnement, les médias et le numérique, la politique and l'économie, each with key words; le pouvoir d'achat links politics and economy, les infox sur le climat links environment and media" xmlns="http://www.w3.org/2000/svg"><title>Four themes, and the debates that link them (dashed). Note: l’environnement is masculine despite the vowel start — check every l’ noun’s gender.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .sm-l { fill: none; stroke: var(--line-strong); stroke-width: 2; }
       .sm-d { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 5; }
       .sm-c { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
       .sm-n { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; }
       .sm-ct { font: 800 16px var(--font); fill: var(--text); }
       .sm-t { font: 800 15px var(--font); }
       .sm-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .sm-x { font: 700 12px var(--font); fill: var(--accent); }
       .sm-m { fill: var(--g-m); } .sm-f { fill: var(--g-f); } .sm-p { fill: var(--g-pl); }
      </style>
     </defs>
     <path class="sm-l" d="M320 180 L130 82 M320 180 L510 82 M320 180 L130 278 M320 180 L510 278"/>
     <path class="sm-d" d="M245 40 H395"/>
     <text class="sm-x" x="320" y="32" text-anchor="middle">les infox sur le climat</text>
     <path class="sm-d" d="M245 320 H395"/>
     <text class="sm-x" x="320" y="346" text-anchor="middle">le pouvoir d’achat</text>
     <ellipse class="sm-c" cx="320" cy="180" rx="88" ry="38"/>
     <text class="sm-ct" x="320" y="176" text-anchor="middle">La société</text>
     <text class="sm-s" x="320" y="196" text-anchor="middle">DELF B2 · DALF C1</text>
     <g text-anchor="middle">
      <rect class="sm-n" x="15" y="12" width="230" height="86" rx="12"/>
      <text class="sm-t sm-m" x="130" y="38">l’environnement (m)</text>
      <text class="sm-s" x="130" y="62">le réchauffement · les émissions</text>
      <text class="sm-s" x="130" y="82">le recyclage · la transition</text>

      <rect class="sm-n" x="395" y="12" width="230" height="86" rx="12"/>
      <text class="sm-t sm-p" x="510" y="38">les médias, le numérique</text>
      <text class="sm-s" x="510" y="62">les réseaux sociaux · l’infox</text>
      <text class="sm-s" x="510" y="82">les données · l’IA</text>

      <rect class="sm-n" x="15" y="262" width="230" height="86" rx="12"/>
      <text class="sm-t sm-f" x="130" y="288">la politique</text>
      <text class="sm-s" x="130" y="312">l’élection · la loi · la grève</text>
      <text class="sm-s" x="130" y="332">la réforme · le chômage</text>

      <rect class="sm-n" x="395" y="262" width="230" height="86" rx="12"/>
      <text class="sm-t sm-f" x="510" y="288">l’économie</text>
      <text class="sm-s" x="510" y="312">la croissance · l’inflation</text>
      <text class="sm-s" x="510" y="332">le PIB · l’entreprise</text>
     </g>
    </svg>