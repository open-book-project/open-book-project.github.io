<svg viewBox="0 0 640 400" role="img" aria-label="Decision tree. Is the sentence negative or a quantity? Then de. Is it a specific thing or a thing in general? Then le, la, les. Can you count it? Then un, une, des. Otherwise du, de la, de l'." xmlns="http://www.w3.org/2000/svg"><title>Three questions, four answers. With practice you will choose in a split second.</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line-strong:#cfd6e2;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .q { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .qt { font: 700 13px var(--font); fill: var(--text); }
          .an { fill: var(--accent-soft); }
          .at { font: 800 15px var(--font); fill: var(--accent-ink); }
          .ex2 { font: 500 12px var(--font); fill: var(--text-soft); }
          .yes { font: 800 12px var(--font); fill: var(--good); }
          .nn { font: 800 12px var(--font); fill: var(--text-soft); }
          .ed { stroke: var(--text-soft); stroke-width: 2; fill: none; }
        </style></defs>
        <rect class="q" x="20" y="20" width="270" height="52" rx="12"/>
        <text class="qt" x="155" y="42" text-anchor="middle">1. Negative (pas, jamais…) or</text>
        <text class="qt" x="155" y="60" text-anchor="middle">a quantity (beaucoup, kilo…)?</text>
        <path class="ed" d="M290 46 H380"/><text class="yes" x="335" y="40" text-anchor="middle">YES</text>
        <rect class="an" x="380" y="22" width="240" height="48" rx="12"/>
        <text class="at" x="400" y="44">de / d’</text><text class="ex2" x="400" y="61">pas de café · beaucoup de café</text>
        <path class="ed" d="M155 72 V112"/><text class="nn" x="170" y="96">NO</text>
        <rect class="q" x="20" y="112" width="270" height="52" rx="12"/>
        <text class="qt" x="155" y="134" text-anchor="middle">2. A specific thing, or a thing</text>
        <text class="qt" x="155" y="152" text-anchor="middle">in general (likes, facts)?</text>
        <path class="ed" d="M290 138 H380"/><text class="yes" x="335" y="132" text-anchor="middle">YES</text>
        <rect class="an" x="380" y="114" width="240" height="48" rx="12"/>
        <text class="at" x="400" y="136">le / la / l’ / les</text><text class="ex2" x="400" y="153">j’aime le café · le café est chaud</text>
        <path class="ed" d="M155 164 V204"/><text class="nn" x="170" y="188">NO</text>
        <rect class="q" x="20" y="204" width="270" height="52" rx="12"/>
        <text class="qt" x="155" y="226" text-anchor="middle">3. Can you count it?</text>
        <text class="qt" x="155" y="244" text-anchor="middle">(one cup, two apples…)</text>
        <path class="ed" d="M290 230 H380"/><text class="yes" x="335" y="224" text-anchor="middle">YES</text>
        <rect class="an" x="380" y="206" width="240" height="48" rx="12"/>
        <text class="at" x="400" y="228">un / une / des</text><text class="ex2" x="400" y="245">un café · des pommes</text>
        <path class="ed" d="M155 256 V296"/><text class="nn" x="170" y="280">NO</text>
        <rect class="an" x="20" y="296" width="270" height="52" rx="12"/>
        <text class="at" x="40" y="318">du / de la / de l’</text>
        <text class="ex2" x="40" y="337">du café · de la soupe · de l’eau</text>
        <text class="ex2" x="320" y="390" text-anchor="middle">Exceptions: le/la/les stay after a negative; être + un/une stays (ce n’est pas un problème).</text>
      </svg>