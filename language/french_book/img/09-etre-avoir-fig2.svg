<svg viewBox="0 0 640 330" role="img" aria-label="What follows? A determiner plus noun, a name or a stressed pronoun takes c'est. An adjective about a specific person or thing, or a bare job, takes il est or elle est. A general comment with an adjective takes c'est." xmlns="http://www.w3.org/2000/svg"><title>If an article or a name follows, choose c’est. If a bare adjective or job describes him or her, choose il / elle est.</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .hdx { font: 800 15px var(--font); fill: var(--text); }
          .kc { fill: var(--accent-soft); } .ki { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .lab { font: 800 17px var(--font); fill: var(--accent-ink); }
          .lab2 { font: 800 17px var(--font); fill: var(--role-verb); }
          .row { font: 600 13px var(--font); fill: var(--text); }
          .rs2 { font: 500 12px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="hdx" x="320" y="26" text-anchor="middle">Look at the word after “est”</text>
        <rect class="kc" x="20" y="44" width="295" height="270" rx="16"/>
        <rect class="ki" x="325" y="44" width="295" height="270" rx="16"/>
        <text class="lab" x="167" y="76" text-anchor="middle">C’EST / CE SONT</text>
        <text class="lab2" x="472" y="76" text-anchor="middle">IL EST / ELLE EST</text>
        <text class="row" x="40" y="112">+ un / le / mon … + noun</text>
        <text class="rs2" x="40" y="130">C’est un médecin. C’est mon frère.</text>
        <text class="row" x="40" y="166">+ a name or moi, toi, lui…</text>
        <text class="rs2" x="40" y="184">C’est Paul. C’est moi !</text>
        <text class="row" x="40" y="220">+ adjective, general comment</text>
        <text class="rs2" x="40" y="238">Paris ? C’est beau ! C’est facile.</text>
        <text class="row" x="40" y="274">plural noun → ce sont</text>
        <text class="rs2" x="40" y="292">Ce sont mes amis.</text>
        <text class="row" x="345" y="112">+ adjective about him / her / it</text>
        <text class="rs2" x="345" y="130">Il est grand. Elle est gentille.</text>
        <text class="row" x="345" y="166">+ bare job / nationality</text>
        <text class="rs2" x="345" y="184">Il est médecin. Elle est indienne.</text>
        <text class="row" x="345" y="220">+ time</text>
        <text class="rs2" x="345" y="238">Il est trois heures.</text>
        <text class="row" x="345" y="274">plural → ils / elles sont</text>
        <text class="rs2" x="345" y="292">Ils sont sympas.</text>
      </svg>