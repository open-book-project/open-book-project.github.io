<svg viewBox="0 0 640 230" role="img" aria-label="Two sentences joined into one: the repeated noun is replaced by qui or que" xmlns="http://www.w3.org/2000/svg"><title>A relative pronoun replaces the repeated noun in the second sentence and moves to the front of it.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--role-pron:#0891b2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .jn-bx { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
              .jn-hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .jn-ar { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
              .jn-w { font: 600 14px var(--font); fill: var(--text); }
              .jn-x { font: 600 14px var(--font); fill: var(--text-soft); text-decoration: line-through; }
              .jn-p { font: 800 14px var(--font); fill: var(--role-pron); }
              .jn-h { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
            </style>
          </defs>
          <text class="jn-h" x="20" y="20">SUBJECT → qui</text>
          <rect class="jn-bx" x="20" y="28" width="150" height="40" rx="9"/>
          <text class="jn-w" x="95" y="53" text-anchor="middle">J’ai un ami.</text>
          <rect class="jn-bx" x="180" y="28" width="170" height="40" rx="9"/>
          <text x="265" y="53" text-anchor="middle"><tspan class="jn-x">Il</tspan><tspan class="jn-w"> parle japonais.</tspan></text>
          <path class="jn-ar" d="M358 48 H392 M384 41 L394 48 L384 55"/>
          <rect class="jn-hi" x="400" y="28" width="230" height="40" rx="9"/>
          <text x="515" y="53" text-anchor="middle"><tspan class="jn-w">J’ai un ami </tspan><tspan class="jn-p">qui</tspan><tspan class="jn-w"> parle japonais.</tspan></text>

          <text class="jn-h" x="20" y="112">DIRECT OBJECT → que</text>
          <rect class="jn-bx" x="20" y="120" width="150" height="40" rx="9"/>
          <text class="jn-w" x="95" y="145" text-anchor="middle">Je lis le livre.</text>
          <rect class="jn-bx" x="180" y="120" width="170" height="40" rx="9"/>
          <text x="265" y="145" text-anchor="middle"><tspan class="jn-w">Tu m’as offert </tspan><tspan class="jn-x">ce livre</tspan></text>
          <path class="jn-ar" d="M358 140 H392 M384 133 L394 140 L384 147"/>
          <rect class="jn-hi" x="400" y="120" width="230" height="40" rx="9"/>
          <text x="515" y="145" text-anchor="middle"><tspan class="jn-w">… le livre </tspan><tspan class="jn-p">que</tspan><tspan class="jn-w"> tu m’as offert.</tspan></text>
          <text class="jn-h" x="320" y="204" text-anchor="middle">THE REPEATED NOUN DISAPPEARS · THE PRONOUN TAKES ITS PLACE AT THE FRONT</text>
        </svg>