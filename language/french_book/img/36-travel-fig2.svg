<svg viewBox="0 0 640 230" role="img" aria-label="Emergency numbers in France: 112 for any emergency in Europe, 15 SAMU for medical emergencies, 17 police, 18 pompiers for fire and rescue, 114 by text message for people who cannot speak or hear." xmlns="http://www.w3.org/2000/svg"><title>If you remember only one number, remember 112: it works from any phone, everywhere in the EU.</title><style>svg{--accent:#ea580c;--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-m:#2563eb;--g-pl:#7c3aed;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .em-c { fill: var(--sheet); stroke-width: 3; }
          .em-n { font: 800 34px var(--font); }
          .em-t { font: 700 13px var(--font); fill: var(--text); }
          .em-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
        </style></defs>
        <g transform="translate(10 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--accent)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--accent)">112</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">any emergency</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">all of Europe</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">English often</text>
          <text class="em-s" x="58" y="152" text-anchor="middle">available</text>
        </g>
        <g transform="translate(136 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--bad)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--bad)">15</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">SAMU</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">medical</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">emergency,</text>
          <text class="em-s" x="58" y="152" text-anchor="middle">ambulance</text>
        </g>
        <g transform="translate(262 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--g-m)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--g-m)">17</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">Police</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">crime, attack,</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">danger</text>
        </g>
        <g transform="translate(388 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--warn)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--warn)">18</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">Pompiers</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">fire, accident,</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">rescue — they</text>
          <text class="em-s" x="58" y="152" text-anchor="middle">also give first aid</text>
        </g>
        <g transform="translate(514 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--g-pl)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--g-pl)">114</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">by text / app</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">if you cannot</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">speak or hear</text>
        </g>
      </svg>