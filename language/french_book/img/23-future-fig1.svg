<svg viewBox="0 0 640 250" role="img" aria-label="Futur simple formula: infinitive or irregular stem ending in r, plus the endings ai, as, a, ons, ez, ont. Examples: parler plus ai gives parlerai, prendr plus ai gives prendrai, ser plus ai gives serai." xmlns="http://www.w3.org/2000/svg"><title>The r is the sound of the future. If you hear [-RAY], [-RA], [-RÕ], it is futur simple.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .fs-st { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
        .fs-en { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
        .fs-h { font: 800 13px var(--font); fill: var(--text-soft); }
        .fs-v { font: 800 18px var(--font); fill: var(--role-verb); }
        .fs-r { font: 800 18px var(--font); fill: var(--bad); }
        .fs-e { font: 800 18px var(--font); fill: var(--accent); }
        .fs-op { font: 800 22px var(--font); fill: var(--text-soft); }
        .fs-out { font: 800 18px var(--font); fill: var(--text); }
        .fs-s { font: 500 12px var(--font); fill: var(--text-soft); }
      </style></defs>
      <text class="fs-h" x="110" y="24" text-anchor="middle">STEM (always ends in -r)</text>
      <text class="fs-h" x="320" y="24" text-anchor="middle">ENDING</text>
      <text class="fs-h" x="530" y="24" text-anchor="middle">FUTURE</text>
      <rect class="fs-st" x="30" y="38" width="160" height="50" rx="12"/>
      <text class="fs-v" x="110" y="70" text-anchor="middle">parle<tspan class="fs-r">r</tspan></text>
      <text class="fs-op" x="220" y="71" text-anchor="middle">+</text>
      <rect class="fs-en" x="260" y="38" width="120" height="50" rx="12"/>
      <text class="fs-e" x="320" y="70" text-anchor="middle">-ai</text>
      <text class="fs-op" x="420" y="71" text-anchor="middle">=</text>
      <text class="fs-out" x="530" y="70" text-anchor="middle">je parlerai</text>
      <rect class="fs-st" x="30" y="104" width="160" height="50" rx="12"/>
      <text class="fs-v" x="110" y="136" text-anchor="middle">prend<tspan class="fs-r">r</tspan><tspan class="fs-s"> (e)</tspan></text>
      <text class="fs-op" x="220" y="137" text-anchor="middle">+</text>
      <rect class="fs-en" x="260" y="104" width="120" height="50" rx="12"/>
      <text class="fs-e" x="320" y="136" text-anchor="middle">-ons</text>
      <text class="fs-op" x="420" y="137" text-anchor="middle">=</text>
      <text class="fs-out" x="530" y="136" text-anchor="middle">nous prendrons</text>
      <rect class="fs-st" x="30" y="170" width="160" height="50" rx="12"/>
      <text class="fs-v" x="110" y="202" text-anchor="middle">se<tspan class="fs-r">r</tspan><tspan class="fs-s"> (être)</tspan></text>
      <text class="fs-op" x="220" y="203" text-anchor="middle">+</text>
      <rect class="fs-en" x="260" y="170" width="120" height="50" rx="12"/>
      <text class="fs-e" x="320" y="202" text-anchor="middle">-a</text>
      <text class="fs-op" x="420" y="203" text-anchor="middle">=</text>
      <text class="fs-out" x="530" y="202" text-anchor="middle">ce sera</text>
      <text class="fs-s" x="320" y="244" text-anchor="middle">Regular or irregular, every future stem ends in r — and the endings never change.</text>
    </svg>