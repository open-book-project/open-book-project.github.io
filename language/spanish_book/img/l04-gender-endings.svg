<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" role="img" aria-label="Noun endings that show masculine and feminine gender, with the common exceptions">
<rect width="640" height="400" rx="16" fill="#fdfaf3"/>
<rect x="24" y="20" width="284" height="240" rx="12" fill="#dde9f8" stroke="#2a5d9f" stroke-width="2"/>
<rect x="332" y="20" width="284" height="240" rx="12" fill="#f9dfe8" stroke="#a8325e" stroke-width="2"/>
<text x="166" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4c85">MASCULINE · el</text>
<text x="474" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#8c2450">FEMININE · la</text>
<g font-size="18" fill="#1a1a1a">
<text x="44" y="96"><tspan font-weight="bold">-o</tspan></text><text x="150" y="96">el libro</text>
<text x="44" y="136"><tspan font-weight="bold">-or</tspan></text><text x="150" y="136">el color</text>
<text x="44" y="176"><tspan font-weight="bold">-aje</tspan></text><text x="150" y="176">el viaje</text>
<text x="44" y="216"><tspan font-weight="bold">-ma</tspan> <tspan font-size="13">(Greek)</tspan></text><text x="150" y="216">el problema</text>
<text x="352" y="96"><tspan font-weight="bold">-a</tspan></text><text x="470" y="96">la casa</text>
<text x="352" y="136"><tspan font-weight="bold">-ción, -sión</tspan></text><text x="470" y="136">la canción</text>
<text x="352" y="176"><tspan font-weight="bold">-dad, -tad</tspan></text><text x="470" y="176">la ciudad</text>
<text x="352" y="216"><tspan font-weight="bold">-tud, -umbre</tspan></text><text x="470" y="216">la costumbre</text>
</g>
<rect x="24" y="280" width="592" height="100" rx="12" fill="#fff4cf" stroke="#9a7a12" stroke-width="2"/>
<text x="320" y="308" text-anchor="middle" font-size="18" font-weight="bold" fill="#5e4a06">Common exceptions</text>
<text x="44" y="340" font-size="17" fill="#1f4c85">el día · el mapa · el sofá · el planeta</text>
<text x="352" y="340" font-size="17" fill="#8c2450">la mano · la foto · la moto</text>
<text x="352" y="366" font-size="17" fill="#8c2450">la radio · la flor</text>
</svg>
