<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" font-family="sans-serif" role="img" aria-label="Decision chart for choosing hay, estar or ser">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="700" height="540" rx="16" fill="#fdfaf3"/>
<text x="250" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Which verb for “to be”?</text>
<g font-size="15" fill="#1a1a1a">
<rect x="40" y="60" width="420" height="70" rx="12" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="60" y="88">1. Are you saying that something <tspan font-weight="bold">exists</tspan>,</text>
<text x="60" y="110">with a, some, a number? (there is / there are)</text>
<rect x="40" y="180" width="420" height="70" rx="12" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="60" y="208">2. Are you saying <tspan font-weight="bold">where</tspan> a person</text>
<text x="60" y="230">or thing is?</text>
<rect x="40" y="300" width="420" height="70" rx="12" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="60" y="328">3. Are you saying <tspan font-weight="bold">how</tspan> someone or something is now:</text>
<text x="60" y="350">a feeling, a condition, the result of a change?</text>
</g>
<g font-size="20" font-weight="bold">
<rect x="520" y="70" width="150" height="50" rx="12" fill="#fff1c7" stroke="#9a7a12" stroke-width="2"/>
<text x="595" y="102" text-anchor="middle" fill="#5e4a06">HAY</text>
<rect x="520" y="180" width="150" height="70" rx="12" fill="#d6ecf3" stroke="#1f6f8b" stroke-width="2"/>
<text x="595" y="210" text-anchor="middle" fill="#144d61">ESTAR</text>
<text x="595" y="236" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">(events: SER)</text>
<rect x="520" y="310" width="150" height="50" rx="12" fill="#d6ecf3" stroke="#1f6f8b" stroke-width="2"/>
<text x="595" y="342" text-anchor="middle" fill="#144d61">ESTAR</text>
</g>
<g stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)">
<line x1="460" y1="95" x2="516" y2="95"/>
<line x1="460" y1="215" x2="516" y2="215"/>
<line x1="460" y1="335" x2="516" y2="335"/>
<line x1="250" y1="130" x2="250" y2="176"/>
<line x1="250" y1="250" x2="250" y2="296"/>
<line x1="250" y1="370" x2="250" y2="416"/>
</g>
<g font-size="14" font-weight="bold">
<text x="488" y="88" text-anchor="middle" fill="#1d5c2a">yes</text>
<text x="488" y="208" text-anchor="middle" fill="#1d5c2a">yes</text>
<text x="488" y="328" text-anchor="middle" fill="#1d5c2a">yes</text>
<text x="262" y="158" fill="#8a3a0c">no</text>
<text x="262" y="278" fill="#8a3a0c">no</text>
<text x="262" y="398" fill="#8a3a0c">no</text>
</g>
<rect x="40" y="420" width="630" height="96" rx="12" fill="#f3e0f0" stroke="#7d3a73" stroke-width="2"/>
<text x="60" y="452" font-size="20" font-weight="bold" fill="#5b2453">SER</text>
<text x="120" y="452" font-size="15" fill="#1a1a1a">who or what it is · origin, nationality · job · character</text>
<text x="120" y="476" font-size="15" fill="#1a1a1a">relationship · possession and material (ser de)</text>
<text x="120" y="500" font-size="15" fill="#1a1a1a">time, days and dates · when and where an event takes place</text>
</svg>
