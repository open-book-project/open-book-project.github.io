<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="sans-serif" role="img" aria-label="The boot pattern of stem-changing verbs, shown with poder">
  <rect x="0" y="0" width="560" height="320" rx="12" fill="#fdfaf3"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">poder (o → ue)</text>
  <path d="M50 46 L270 46 L270 186 L500 186 L500 270 L50 270 Z" fill="#fbe3c2" stroke="#b3261e" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#999" stroke-width="1" fill="none">
    <rect x="60" y="56" width="200" height="56" rx="6"/>
    <rect x="290" y="56" width="200" height="56" rx="6"/>
    <rect x="60" y="122" width="200" height="56" rx="6"/>
    <rect x="290" y="122" width="200" height="56" rx="6"/>
    <rect x="60" y="196" width="200" height="56" rx="6"/>
    <rect x="290" y="196" width="200" height="56" rx="6"/>
  </g>
  <g font-size="14" fill="#555">
    <text x="72" y="76">yo</text><text x="302" y="76">nosotros</text>
    <text x="72" y="142">tú</text><text x="302" y="142">vosotros</text>
    <text x="72" y="216">él, ella, usted</text><text x="302" y="216">ellos, ustedes</text>
  </g>
  <g font-size="20" fill="#222">
    <text x="72" y="102">p<tspan fill="#b3261e" font-weight="bold">ue</tspan>do</text>
    <text x="302" y="102">podemos</text>
    <text x="72" y="168">p<tspan fill="#b3261e" font-weight="bold">ue</tspan>des</text>
    <text x="302" y="168">podéis</text>
    <text x="72" y="242">p<tspan fill="#b3261e" font-weight="bold">ue</tspan>de</text>
    <text x="302" y="242">p<tspan fill="#b3261e" font-weight="bold">ue</tspan>den</text>
  </g>
  <text x="280" y="298" text-anchor="middle" font-size="14" fill="#444">Inside the boot the stem changes; nosotros and vosotros stay outside it.</text>
</svg>
