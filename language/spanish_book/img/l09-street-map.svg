<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="sans-serif" role="img" aria-label="A small street map of a town centre">
  <rect x="0" y="0" width="640" height="460" rx="12" fill="#fdfaf3"/>
  <!-- streets -->
  <g fill="#e4e0d6">
    <rect x="300" y="10" width="40" height="440"/>
    <rect x="10" y="270" width="620" height="30"/>
    <rect x="10" y="140" width="620" height="30"/>
  </g>
  <g fill="#555" font-size="13" font-style="italic">
    <text x="30" y="290">Calle del Sol</text>
    <text x="30" y="160">Calle de la Paz</text>
    <text x="325" y="230" transform="rotate(-90 325 230)" text-anchor="middle">Calle Mayor</text>
  </g>
  <!-- buildings -->
  <g stroke="#555" stroke-width="1.5" fill="#f2e6c9">
    <rect x="190" y="310" width="100" height="56" rx="6"/>
    <rect x="350" y="310" width="100" height="56" rx="6"/>
    <rect x="180" y="180" width="110" height="80" rx="6"/>
    <rect x="30" y="180" width="130" height="80" rx="6" fill="#d8ead2"/>
    <rect x="350" y="180" width="100" height="80" rx="6"/>
    <rect x="190" y="40" width="100" height="90" rx="6"/>
    <rect x="350" y="40" width="110" height="90" rx="6"/>
    <rect x="500" y="40" width="110" height="90" rx="6"/>
  </g>
  <g fill="#222" font-size="15" text-anchor="middle">
    <text x="240" y="343">el banco</text>
    <text x="400" y="343">la farmacia</text>
    <text x="235" y="225">el mercado</text>
    <text x="95" y="225">el parque</text>
    <text x="400" y="225">el hotel</text>
    <text x="240" y="90">la iglesia</text>
    <text x="405" y="90">el museo</text>
    <text x="555" y="90">la estación</text>
  </g>
  <!-- you are here -->
  <circle cx="320" cy="420" r="9" fill="#b3261e"/>
  <path d="M320 404 L313 396 L327 396 Z" fill="#b3261e" transform="rotate(180 320 400)"/>
  <text x="345" y="425" fill="#b3261e" font-size="15" font-weight="bold">Estás aquí</text>
</svg>
