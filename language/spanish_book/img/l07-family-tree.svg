    <line x1="240" y1="165" x2="240" y2="235"/>
    <line x1="170" y1="235" x2="310" y2="235"/>
    <line x1="170" y1="235" x2="170" y2="260"/>
    <line x1="310" y1="235" x2="310" y2="260"/>
