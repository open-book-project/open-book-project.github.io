    <rect x="485" y="260" width="110" height="50" rx="8" fill="#f7dbe6"/>
  </g>
  <g fill="#222" text-anchor="middle" font-size="15">
    <text x="280" y="51" font-weight="bold">Antonio</text><text x="280" y="70" font-size="13">el abuelo</text>
    <text x="440" y="51" font-weight="bold">Carmen</text><text x="440" y="70" font-size="13">la abuela</text>
    <text x="170" y="161" font-weight="bold">Luis</text><text x="170" y="180" font-size="13">el padre</text>
    <text x="310" y="161" font-weight="bold">Elena</text><text x="310" y="180" font-size="13">la madre</text>
    <text x="470" y="161" font-weight="bold">Rosa</text><text x="470" y="180" font-size="13">la tía</text>
    <text x="610" y="161" font-weight="bold">Javier</text><text x="610" y="180" font-size="13">el tío</text>
    <text x="170" y="281" font-weight="bold">Lucía</text><text x="170" y="300" font-size="13">yo</text>
    <text x="310" y="281" font-weight="bold">Diego</text><text x="310" y="300" font-size="13">el hermano</text>
    <text x="540" y="281" font-weight="bold">Marta</text><text x="540" y="300" font-size="13">la prima</text>
