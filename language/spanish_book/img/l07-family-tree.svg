<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="sans-serif" role="img" aria-label="Lucía's family tree">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#fdfaf3"/>
  <g stroke="#555" stroke-width="2" fill="none">
