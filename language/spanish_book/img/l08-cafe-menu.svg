<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="sans-serif" role="img" aria-label="The menu of Café La Plaza">
  <rect x="0" y="0" width="520" height="560" rx="12" fill="#fdfaf3"/>
  <rect x="16" y="16" width="488" height="528" rx="8" fill="none" stroke="#7a1f1f" stroke-width="2"/>
  <text x="260" y="58" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a1f1f">Café La Plaza</text>
  <text x="260" y="82" text-anchor="middle" font-size="14" fill="#444" font-style="italic">carta</text>
  <g font-size="15" fill="#222">
    <text x="40" y="120" font-weight="bold" fill="#7a1f1f">Desayunos</text>
    <text x="48" y="144">tostada con tomate y aceite</text><text x="480" y="144" text-anchor="end">2,50 €</text>
    <text x="48" y="166">cruasán</text><text x="480" y="166" text-anchor="end">1,80 €</text>
    <text x="48" y="188">churros con chocolate</text><text x="480" y="188" text-anchor="end">3,90 €</text>

    <text x="40" y="226" font-weight="bold" fill="#7a1f1f">Bocadillos</text>
    <text x="48" y="250">de jamón serrano</text><text x="480" y="250" text-anchor="end">4,50 €</text>
    <text x="48" y="272">de queso</text><text x="480" y="272" text-anchor="end">3,80 €</text>
    <text x="48" y="294">de tortilla de patatas</text><text x="480" y="294" text-anchor="end">4,00 €</text>

    <text x="40" y="332" font-weight="bold" fill="#7a1f1f">Raciones</text>
    <text x="48" y="356">patatas bravas</text><text x="480" y="356" text-anchor="end">5,00 €</text>
    <text x="48" y="378">gambas al ajillo</text><text x="480" y="378" text-anchor="end">9,50 €</text>
    <text x="48" y="400">ensalada mixta</text><text x="480" y="400" text-anchor="end">6,00 €</text>

    <text x="40" y="438" font-weight="bold" fill="#7a1f1f">Bebidas</text>
    <text x="48" y="462">café solo · café con leche</text><text x="480" y="462" text-anchor="end">1,40 € · 1,70 €</text>
    <text x="48" y="484">zumo de naranja natural</text><text x="480" y="484" text-anchor="end">3,00 €</text>
    <text x="48" y="506">agua mineral · refresco</text><text x="480" y="506" text-anchor="end">1,50 € · 2,20 €</text>
