<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" role="img" aria-label="A time line: completed past actions in the preterite, habits and the present now, plans with ir a in the future">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="760" height="300" rx="16" fill="#fdfaf3"/>
<text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Past, present and future in this book</text>
<line x1="30" y1="150" x2="735" y2="150" stroke="#333" stroke-width="3" marker-end="url(#ar)"/>
<line x1="420" y1="120" x2="420" y2="180" stroke="#b03030" stroke-width="3"/>
<text x="420" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a1f1f">ahora (now)</text>
<g fill="#1f6f8b">
<circle cx="90" cy="150" r="9"/>
<circle cx="190" cy="150" r="9"/>
<circle cx="300" cy="150" r="9"/>
</g>
<g font-size="14" fill="#123f50" text-anchor="middle">
<text x="90" y="186">el año pasado</text>
<text x="90" y="204">fui a México</text>
<text x="190" y="186">el sábado</text>
<text x="190" y="204">visité Toledo</text>
<text x="300" y="186">ayer</text>
<text x="300" y="204">comí paella</text>
</g>
<rect x="60" y="232" width="270" height="44" rx="10" fill="#d6ecf3" stroke="#1f6f8b" stroke-width="2"/>
<text x="195" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#123f50">PRETERITE (Lesson 15)</text>
<text x="195" y="269" text-anchor="middle" font-size="13" fill="#123f50">finished actions at a time in the past</text>
<rect x="350" y="232" width="140" height="44" rx="10" fill="#fff1c7" stroke="#9a7a12" stroke-width="2"/>
<text x="420" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d3004">PRESENT</text>
<text x="420" y="269" text-anchor="middle" font-size="13" fill="#3d3004">now, habits</text>
<g fill="#3f7a2a">
<circle cx="560" cy="150" r="9"/>
<circle cx="670" cy="150" r="9"/>
</g>
<g font-size="14" fill="#234a16" text-anchor="middle">
<text x="560" y="186">mañana</text>
<text x="560" y="204">voy a estudiar</text>
<text x="670" y="186">en agosto</text>
<text x="670" y="204">voy a viajar</text>
</g>
<rect x="510" y="232" width="210" height="44" rx="10" fill="#e3f0dc" stroke="#3f7a2a" stroke-width="2"/>
<text x="615" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#234a16">IR A + INFINITIVE (L. 14)</text>
<text x="615" y="269" text-anchor="middle" font-size="13" fill="#234a16">plans and predictions</text>
<text x="420" y="78" text-anchor="middle" font-size="14" fill="#444">Each dot is one complete event.</text>
</svg>
