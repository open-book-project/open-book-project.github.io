<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" role="img" aria-label="English I like the books compared with Spanish Me gustan los libros">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a0442c"/></marker></defs>
<rect x="0" y="0" width="760" height="330" rx="12" fill="#fdfaf3"/>
<text x="24" y="34" font-size="15" font-weight="bold" fill="#2b2118">English</text>
<path d="M150 74 Q 215 34 276 72" fill="none" stroke="#a0442c" stroke-width="2" marker-end="url(#ah)"/>
<text x="215" y="44" text-anchor="middle" font-size="12" fill="#a0442c">verb agrees with the person</text>
<rect x="100" y="76" width="100" height="44" rx="8" fill="#c9d3ea" stroke="#2b2118"/>
<text x="150" y="104" text-anchor="middle" font-size="18" fill="#2b2118">I</text>
<rect x="230" y="76" width="100" height="44" rx="8" fill="#ffffff" stroke="#2b2118"/>
<text x="280" y="104" text-anchor="middle" font-size="18" fill="#2b2118">like</text>
<rect x="360" y="76" width="160" height="44" rx="8" fill="#f3c9a8" stroke="#2b2118"/>
<text x="440" y="104" text-anchor="middle" font-size="18" fill="#2b2118">the books</text>
<text x="150" y="138" text-anchor="middle" font-size="12" fill="#5a4a3a">subject (person)</text>
<text x="280" y="138" text-anchor="middle" font-size="12" fill="#5a4a3a">verb</text>
<text x="440" y="138" text-anchor="middle" font-size="12" fill="#5a4a3a">object (thing)</text>
<text x="545" y="104" font-size="13" fill="#2b2118">"I like the books."</text>
<line x1="24" y1="160" x2="736" y2="160" stroke="#d8cdb8" stroke-width="1.5"/>
<text x="24" y="190" font-size="15" font-weight="bold" fill="#2b2118">Spanish</text>
<path d="M440 234 Q 362 194 286 232" fill="none" stroke="#a0442c" stroke-width="2" marker-end="url(#ah)"/>
<text x="362" y="204" text-anchor="middle" font-size="12" fill="#a0442c">verb agrees with the thing</text>
<rect x="100" y="236" width="100" height="44" rx="8" fill="#c9d3ea" stroke="#2b2118"/>
<text x="150" y="264" text-anchor="middle" font-size="18" fill="#2b2118">Me</text>
<rect x="230" y="236" width="100" height="44" rx="8" fill="#ffffff" stroke="#2b2118"/>
<text x="280" y="264" text-anchor="middle" font-size="18" fill="#2b2118">gustan</text>
<rect x="360" y="236" width="160" height="44" rx="8" fill="#f3c9a8" stroke="#2b2118"/>
<text x="440" y="264" text-anchor="middle" font-size="18" fill="#2b2118">los libros</text>
<text x="150" y="298" text-anchor="middle" font-size="12" fill="#5a4a3a">to me (person)</text>
<text x="280" y="298" text-anchor="middle" font-size="12" fill="#5a4a3a">verb (plural)</text>
<text x="440" y="298" text-anchor="middle" font-size="12" fill="#5a4a3a">subject (thing)</text>
<text x="545" y="252" font-size="13" fill="#2b2118">Literally: "to me</text>
<text x="545" y="270" font-size="13" fill="#2b2118">are pleasing the books"</text>
</svg>
