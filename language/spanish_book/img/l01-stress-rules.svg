<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif" role="img" aria-label="Decision chart for finding the stressed syllable of a Spanish word">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="720" height="420" rx="16" fill="#fdfaf3"/>
<text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Where does the stress fall?</text>
<g font-size="15" fill="#1a1a1a">
<rect x="30" y="64" width="330" height="64" rx="12" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="50" y="91">1. Does the word have a</text>
<text x="50" y="113"><tspan font-weight="bold">written accent</tspan> (á, é, í, ó, ú)?</text>
<rect x="30" y="190" width="330" height="64" rx="12" fill="#ffffff" stroke="#555" stroke-width="2"/>
<text x="50" y="217">2. Does it end in a <tspan font-weight="bold">vowel</tspan>,</text>
<text x="50" y="239">or in <tspan font-weight="bold">-n</tspan> or <tspan font-weight="bold">-s</tspan>?</text>
</g>
<g font-size="15">
<rect x="430" y="64" width="260" height="64" rx="12" fill="#fff1c7" stroke="#9a7a12" stroke-width="2"/>
<text x="560" y="91" text-anchor="middle" fill="#3d3004" font-weight="bold">Stress the accented vowel</text>
<text x="560" y="113" text-anchor="middle" fill="#3d3004">ca·FÉ, MÚ·si·ca, can·CIÓN</text>
<rect x="430" y="190" width="260" height="64" rx="12" fill="#d6ecf3" stroke="#1f6f8b" stroke-width="2"/>
<text x="560" y="217" text-anchor="middle" fill="#123f50" font-weight="bold">Stress the next-to-last</text>
<text x="560" y="239" text-anchor="middle" fill="#123f50">CA·sa, HA·blan, LU·nes</text>
<rect x="30" y="316" width="330" height="64" rx="12" fill="#e3f0dc" stroke="#3f7a2a" stroke-width="2"/>
<text x="195" y="343" text-anchor="middle" fill="#234a16" font-weight="bold">Stress the last syllable</text>
<text x="195" y="365" text-anchor="middle" fill="#234a16">ha·BLAR, ciu·DAD, es·pa·ÑOL</text>
</g>
<g stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)">
<line x1="360" y1="96" x2="426" y2="96"/>
<line x1="195" y1="128" x2="195" y2="186"/>
<line x1="360" y1="222" x2="426" y2="222"/>
<line x1="195" y1="254" x2="195" y2="312"/>
</g>
<g font-size="14" font-weight="bold" fill="#1a1a1a">
<text x="380" y="88">yes</text>
<text x="205" y="164">no</text>
<text x="380" y="214">yes</text>
<text x="205" y="290">no (any other consonant)</text>
</g>
<text x="540" y="345" text-anchor="middle" font-size="13" fill="#444">Words that break rule 2</text>
<text x="540" y="365" text-anchor="middle" font-size="13" fill="#444">carry a written accent.</text>
</svg>
