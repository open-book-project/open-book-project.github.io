<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" font-family="sans-serif" role="img" aria-label="Future time expressions from today to next year">
<rect x="0" y="0" width="780" height="250" rx="12" fill="#fdfaf3"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2118"/></marker></defs>
<line x1="30" y1="125" x2="760" y2="125" stroke="#2b2118" stroke-width="3" marker-end="url(#ah)"/>
<line x1="50" y1="125" x2="50" y2="92" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="50" cy="125" r="6" fill="#2b2118"/>
<text x="50" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">hoy</text>
<text x="50" y="80" text-anchor="middle" font-size="12" fill="#5a4a3a">today</text>
<line x1="130" y1="125" x2="130" y2="158" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="130" cy="125" r="5" fill="#a0442c"/>
<text x="130" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">esta tarde</text>
<text x="130" y="195" text-anchor="middle" font-size="12" fill="#5a4a3a">this afternoon</text>
<line x1="215" y1="125" x2="215" y2="92" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="215" cy="125" r="5" fill="#a0442c"/>
<text x="215" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">mañana</text>
<text x="215" y="80" text-anchor="middle" font-size="12" fill="#5a4a3a">tomorrow</text>
<line x1="300" y1="125" x2="300" y2="158" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="300" cy="125" r="5" fill="#a0442c"/>
<text x="300" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">pasado mañana</text>
<text x="300" y="195" text-anchor="middle" font-size="12" fill="#5a4a3a">day after tomorrow</text>
<line x1="390" y1="125" x2="390" y2="92" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="390" cy="125" r="5" fill="#a0442c"/>
<text x="390" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">este fin de semana</text>
<text x="390" y="80" text-anchor="middle" font-size="12" fill="#5a4a3a">this weekend</text>
<line x1="490" y1="125" x2="490" y2="158" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="490" cy="125" r="5" fill="#a0442c"/>
<text x="490" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">la semana que viene</text>
<text x="490" y="195" text-anchor="middle" font-size="12" fill="#5a4a3a">next week</text>
<line x1="600" y1="125" x2="600" y2="92" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="600" cy="125" r="5" fill="#a0442c"/>
<text x="600" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">el mes que viene</text>
<text x="600" y="80" text-anchor="middle" font-size="12" fill="#5a4a3a">next month</text>
<line x1="720" y1="125" x2="720" y2="158" stroke="#a0442c" stroke-width="1.5"/>
<circle cx="720" cy="125" r="5" fill="#a0442c"/>
<text x="720" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2118">el año que viene</text>
<text x="720" y="195" text-anchor="middle" font-size="12" fill="#5a4a3a">next year</text>
<text x="390" y="232" text-anchor="middle" font-size="13" fill="#5a4a3a">el futuro: voy a … + infinitive</text>
</svg>