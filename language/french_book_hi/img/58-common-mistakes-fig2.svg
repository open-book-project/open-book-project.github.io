<svg viewBox="0 0 640 250" role="img" aria-label="पाँच चरणों की जाँच: एक, क्रिया — avoir या être, और कौन-सा tense; दो, article — le, un, du या de; तीन, agreement — e या s जोड़ो; चार, preposition — à, en, de या chez; पाँच, pronoun — क्रिया से पहले, सही क्रम में।" xmlns="http://www.w3.org/2000/svg"><title>पाँच सेकंड की जाँच: क्रिया, article, agreement, preposition, pronoun।</title><style>svg{--accent:#ea580c;--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .rf-box { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
        .rf-num { fill: var(--bad); }
        .rf-nt { font: 800 15px var(--font); fill: var(--sheet); }
        .rf-t { font: 800 14px var(--font); fill: var(--text); }
        .rf-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .rf-ar { fill: none; stroke: var(--accent); stroke-width: 2.5; }
        .rf-h { font: 800 16px var(--font); fill: var(--text); }
      </style></defs>
      <text class="rf-h" x="20" y="30">“send” दबाने से पहले पाँच जाँचो</text>
      <rect class="rf-box" x="12" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="67" cy="86" r="15"/><text class="rf-nt" x="67" y="91" text-anchor="middle">1</text>
      <text class="rf-t" x="67" y="128" text-anchor="middle">क्रिया</text>
      <text class="rf-s" x="67" y="150" text-anchor="middle">avoir या être?</text>
      <text class="rf-s" x="67" y="168" text-anchor="middle">कौन-सा tense</text>
      <text class="rf-s" x="67" y="186" text-anchor="middle">si/quand के बाद?</text>
      <path class="rf-ar" d="M124 135 L136 135"/>
      <rect class="rf-box" x="138" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="193" cy="86" r="15"/><text class="rf-nt" x="193" y="91" text-anchor="middle">2</text>
      <text class="rf-t" x="193" y="128" text-anchor="middle">Article</text>
      <text class="rf-s" x="193" y="150" text-anchor="middle">le / un / du?</text>
      <text class="rf-s" x="193" y="168" text-anchor="middle">pas और beaucoup</text>
      <text class="rf-s" x="193" y="186" text-anchor="middle">के बाद de</text>
      <path class="rf-ar" d="M250 135 L262 135"/>
      <rect class="rf-box" x="264" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="319" cy="86" r="15"/><text class="rf-nt" x="319" y="91" text-anchor="middle">3</text>
      <text class="rf-t" x="319" y="128" text-anchor="middle">Agreement</text>
      <text class="rf-s" x="319" y="150" text-anchor="middle">feminine के लिए -e</text>
      <text class="rf-s" x="319" y="168" text-anchor="middle">plural के लिए -s</text>
      <text class="rf-s" x="319" y="186" text-anchor="middle">être के participles</text>
      <path class="rf-ar" d="M376 135 L388 135"/>
      <rect class="rf-box" x="390" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="445" cy="86" r="15"/><text class="rf-nt" x="445" y="91" text-anchor="middle">4</text>
      <text class="rf-t" x="445" y="128" text-anchor="middle">Preposition</text>
      <text class="rf-s" x="445" y="150" text-anchor="middle">à / en / au</text>
      <text class="rf-s" x="445" y="168" text-anchor="middle">व्यक्ति के लिए chez</text>
      <text class="rf-s" x="445" y="186" text-anchor="middle">क्रिया + उसका prep</text>
      <path class="rf-ar" d="M502 135 L514 135"/>
      <rect class="rf-box" x="516" y="60" width="110" height="150" rx="12"/>
      <circle class="rf-num" cx="571" cy="86" r="15"/><text class="rf-nt" x="571" y="91" text-anchor="middle">5</text>
      <text class="rf-t" x="571" y="128" text-anchor="middle">Pronoun</text>
      <text class="rf-s" x="571" y="150" text-anchor="middle">le या lui?</text>
      <text class="rf-s" x="571" y="168" text-anchor="middle">y / en चाहिए?</text>
      <text class="rf-s" x="571" y="186" text-anchor="middle">सही क्रम</text>
      <text class="rf-s" x="20" y="238">Calques और false friends आसान हैं: अगर कोई वाक्यांश “बहुत अंग्रेज़ी” लगे, तो उसे जाँच लो।</text>
    </svg>