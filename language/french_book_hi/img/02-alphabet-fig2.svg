<svg viewBox="0 0 640 250" role="img" aria-label="पाँच French accent निशान: é पर accent aigu, è, à और ù पर accent grave, vowels पर accent circonflexe, ë ï ü पर tréma, और ç में c के नीचे cédille।" xmlns="http://www.w3.org/2000/svg"><title>पाँच निशान, तीन काम: आवाज़ बदलना (é, è, ç, ë), इतिहास सँभालना (ê), या दो शब्दों में फ़र्क़ करना (à, où)।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .card { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1.5; }
        .big { font: 800 52px var(--font); fill: var(--text); }
        .hi { font: 800 52px var(--font); fill: var(--accent); }
        .nm2 { font: 700 13px var(--font); fill: var(--text); }
        .ef { font: 500 12px var(--font); fill: var(--text-soft); }
      </style></defs>
      <rect class="card" x="10" y="20" width="114" height="210" rx="12"/>
      <text class="hi" x="67" y="100" text-anchor="middle">é</text>
      <text class="nm2" x="67" y="140" text-anchor="middle">accent aigu</text>
      <text class="ef" x="67" y="162" text-anchor="middle">सिर्फ़ e पर</text>
      <text class="ef" x="67" y="180" text-anchor="middle">बंद [ay]</text>
      <text class="ef" x="67" y="198" text-anchor="middle">été, café</text>

      <rect class="card" x="136" y="20" width="114" height="210" rx="12"/>
      <text class="hi" x="193" y="100" text-anchor="middle">è</text>
      <text class="nm2" x="193" y="140" text-anchor="middle">accent grave</text>
      <text class="ef" x="193" y="162" text-anchor="middle">è · à · ù</text>
      <text class="ef" x="193" y="180" text-anchor="middle">e पर खुला [eh]</text>
      <text class="ef" x="193" y="198" text-anchor="middle">mère, à, où</text>

      <rect class="card" x="262" y="20" width="114" height="210" rx="12"/>
      <text class="hi" x="319" y="100" text-anchor="middle">ê</text>
      <text class="nm2" x="319" y="140" text-anchor="middle">circonflexe</text>
      <text class="ef" x="319" y="162" text-anchor="middle">â ê î ô û</text>
      <text class="ef" x="319" y="180" text-anchor="middle">अक्सर खोया s</text>
      <text class="ef" x="319" y="198" text-anchor="middle">forêt = जंगल</text>

      <rect class="card" x="388" y="20" width="114" height="210" rx="12"/>
      <text class="hi" x="445" y="100" text-anchor="middle">ë</text>
      <text class="nm2" x="445" y="140" text-anchor="middle">tréma</text>
      <text class="ef" x="445" y="162" text-anchor="middle">ë · ï · ü</text>
      <text class="ef" x="445" y="180" text-anchor="middle">vowels अलग बोलो</text>
      <text class="ef" x="445" y="198" text-anchor="middle">Noël, naïf</text>

      <rect class="card" x="514" y="20" width="114" height="210" rx="12"/>
      <text class="hi" x="571" y="100" text-anchor="middle">ç</text>
      <text class="nm2" x="571" y="140" text-anchor="middle">cédille</text>
      <text class="ef" x="571" y="162" text-anchor="middle">सिर्फ़ c के नीचे</text>
      <text class="ef" x="571" y="180" text-anchor="middle">नरम [s]</text>
      <text class="ef" x="571" y="198" text-anchor="middle">ça, garçon</text>
    </svg>