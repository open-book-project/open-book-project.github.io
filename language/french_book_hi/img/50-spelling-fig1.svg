<svg viewBox="0 0 640 330" role="img" aria-label="Decision tree: अगर subject vous है तो -ez लिखो; वरना vendre या vendu रखकर देखो: vendre मतलब -er infinitive, vendu मतलब -é past participle" xmlns="http://www.w3.org/2000/svg"><title>दो सवाल लगभग हर [é] अंत का फ़ैसला कर देते हैं। -é के बाद agreement (-ée, -és, -ées) जाँचो।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .dt-q { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
              .dt-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .dt-t { font: 700 14px var(--font); fill: var(--text); }
              .dt-s { font: 500 12px var(--font); fill: var(--text-soft); }
              .dt-big { font: 800 22px var(--font); fill: var(--accent); }
              .dt-line { fill: none; stroke: var(--line-strong); stroke-width: 2; }
              .dt-lab { font: 700 12px var(--font); fill: var(--accent); }
            </style>
          </defs>
          <rect class="dt-q" x="180" y="14" width="280" height="56" rx="12"/>
          <text class="dt-t" x="320" y="38" text-anchor="middle">अंत की आवाज़ [é] जैसी है</text>
          <text class="dt-s" x="320" y="56" text-anchor="middle">parl… / mang… / arriv…</text>

          <path class="dt-line" d="M320 70 L320 100"/>
          <rect class="dt-q" x="200" y="100" width="240" height="44" rx="12"/>
          <text class="dt-t" x="320" y="127" text-anchor="middle">क्या subject vous है?</text>

          <path class="dt-line" d="M440 122 L520 122 L520 160"/>
          <text class="dt-lab" x="480" y="114" text-anchor="middle">हाँ</text>
          <rect class="dt-a" x="450" y="160" width="140" height="70" rx="12"/>
          <text class="dt-big" x="520" y="192" text-anchor="middle">-ez</text>
          <text class="dt-s" x="520" y="214" text-anchor="middle">vous parlez</text>

          <path class="dt-line" d="M320 144 L320 170"/>
          <text class="dt-lab" x="334" y="162">नहीं</text>
          <rect class="dt-q" x="140" y="170" width="260" height="44" rx="12"/>
          <text class="dt-t" x="270" y="197" text-anchor="middle">vendre या vendu रखकर देखो</text>

          <path class="dt-line" d="M200 214 L120 250"/>
          <path class="dt-line" d="M340 214 L400 250"/>
          <text class="dt-lab" x="140" y="236" text-anchor="middle">vendre</text>
          <text class="dt-lab" x="390" y="236" text-anchor="middle">vendu</text>
          <rect class="dt-a" x="30" y="250" width="190" height="70" rx="12"/>
          <text class="dt-big" x="125" y="280" text-anchor="middle">-er</text>
          <text class="dt-s" x="125" y="302" text-anchor="middle">je vais parler (infinitive)</text>
          <rect class="dt-a" x="300" y="250" width="210" height="70" rx="12"/>
          <text class="dt-big" x="405" y="280" text-anchor="middle">-é (+e, +s)</text>
          <text class="dt-s" x="405" y="302" text-anchor="middle">j’ai parlé (past participle)</text>
        </svg>