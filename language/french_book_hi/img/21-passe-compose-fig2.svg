<svg viewBox="0 0 660 440" role="img" aria-label="être का घर: arriver और venir बाईं ओर से अंदर आते हैं, partir और aller दाईं ओर जाते हैं, entrer और sortir दरवाज़े पर, monter और descendre सीढ़ियों पर, naître, mourir और rester ऊपर की मंज़िल पर, tomber छत से।" xmlns="http://www.w3.org/2000/svg"><title>घर के सारे verbs être लेते हैं — साथ में re- परिवार भी: revenir, rentrer, retourner, devenir , और passer जब उसका मतलब “कहीं से होकर जाना / मिलने आ जाना” हो।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
