<svg viewBox="0 0 680 360" role="img" aria-label="फ़्रेंच के सभी indicative tenses की timeline, plus-que-parfait से futur simple तक, और अतीत से देखा गया conditional" xmlns="http://www.w3.org/2000/svg"><title>ऊपर: आज से देखे गए tenses। नीचे: वही तर्क एक क़दम पीछे से — किसी बीते पल से देखो तो conditional future की भूमिका निभाता है, और conditionnel passé futur antérieur की।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-pl:#7c3aed;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .tl-ax { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
              .tl-now { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
              .tl-p { fill: var(--role-verb); }
              .tl-f { fill: var(--role-noun); }
              .tl-bar { fill: var(--role-verb); opacity: .22; }
              .tl-n { font: 700 12.5px var(--font); fill: var(--text); }
              .tl-e { font: 500 12px var(--font); fill: var(--text-soft); font-style: italic; }
              .tl-nw { font: 800 13px var(--font); fill: var(--accent); }
              .tl-h { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
              .tl-c { fill: var(--g-pl); }
              .tl-arc { fill: none; stroke: var(--g-pl); stroke-width: 2; }
            </style>
          </defs>
          <text class="tl-h" x="20" y="22">INDICATIVE — अभी से देखा गया</text>
          <path class="tl-ax" d="M16 150 H660 M650 143 L662 150 L650 157"/>
          <path class="tl-now" d="M360 40 V185"/>
          <text class="tl-nw" x="360" y="34" text-anchor="middle">अभी</text>

          <rect class="tl-bar" x="150" y="140" width="150" height="20" rx="6"/>
          <text class="tl-n" x="225" y="82" text-anchor="middle">imparfait</text>
          <text class="tl-e" x="225" y="98" text-anchor="middle">(पृष्ठभूमि)</text>

          <circle class="tl-p" cx="70" cy="150" r="8"/>
          <text class="tl-n" x="70" y="118" text-anchor="middle">plus-que-</text>
          <text class="tl-n" x="70" y="132" text-anchor="middle">parfait</text>
          <text class="tl-e" x="70" y="180" text-anchor="middle">j’avais fini</text>

          <circle class="tl-p" cx="225" cy="150" r="8"/>
          <text class="tl-n" x="225" y="118" text-anchor="middle">passé composé</text>
          <text class="tl-n" x="225" y="132" text-anchor="middle">/ passé simple</text>
          <text class="tl-e" x="225" y="180" text-anchor="middle">j’ai fini · je finissais</text>

          <circle class="tl-f" cx="360" cy="150" r="8"/>
          <text class="tl-n" x="390" y="132" text-anchor="start">présent</text>
          <text class="tl-e" x="360" y="200" text-anchor="middle">je finis</text>

          <circle class="tl-f" cx="445" cy="150" r="7"/>
          <text class="tl-n" x="445" y="118" text-anchor="middle">futur</text>
          <text class="tl-n" x="445" y="132" text-anchor="middle">proche</text>
          <text class="tl-e" x="445" y="180" text-anchor="middle">je vais finir</text>

          <circle class="tl-f" cx="535" cy="150" r="8"/>
          <text class="tl-n" x="535" y="118" text-anchor="middle">futur</text>
          <text class="tl-n" x="535" y="132" text-anchor="middle">antérieur</text>
          <text class="tl-e" x="535" y="180" text-anchor="middle">j’aurai fini</text>

          <circle class="tl-f" cx="625" cy="150" r="8"/>
          <text class="tl-n" x="625" y="118" text-anchor="middle">futur</text>
          <text class="tl-n" x="625" y="132" text-anchor="middle">simple</text>
          <text class="tl-e" x="625" y="180" text-anchor="middle">je finirai</text>

          <text class="tl-h" x="20" y="238">किसी बीते पल से देखा गया — « Il a dit… »</text>
          <path class="tl-ax" d="M16 300 H660 M650 293 L662 300 L650 307"/>
          <path class="tl-now" d="M225 255 V325"/>
          <text class="tl-nw" x="225" y="252" text-anchor="middle">il a dit</text>
          <circle class="tl-p" cx="110" cy="300" r="8"/>
          <text class="tl-e" x="110" y="330" text-anchor="middle">qu’il avait fini</text>
          <circle class="tl-c" cx="400" cy="300" r="8"/>
          <text class="tl-e" x="400" y="330" text-anchor="middle">qu’il aurait fini</text>
          <text class="tl-n" x="400" y="284" text-anchor="middle">cond. passé</text>
          <circle class="tl-c" cx="560" cy="300" r="8"/>
          <text class="tl-e" x="560" y="330" text-anchor="middle">qu’il finirait</text>
          <text class="tl-n" x="560" y="284" text-anchor="middle">cond. présent</text>
          <text class="tl-n" x="110" y="284" text-anchor="middle">plus-que-parfait</text>
        </svg>