<svg viewBox="0 0 640 290" role="img" aria-label="ट्रैफ़िक लाइट जैसे तीन कॉलम: ज़रूरी liaison हरा, वैकल्पिक पीला, वर्जित लाल, हर एक के उदाहरण के साथ।" xmlns="http://www.w3.org/2000/svg"><title>Liaison की ट्रैफ़िक लाइट। हरा: कसकर जुड़े समूह के अंदर। पीला: ढीले जुड़े शब्दों के बीच — आपकी मर्ज़ी। लाल: कभी नहीं।</title><style>svg{--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line:#e3e7ef;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
