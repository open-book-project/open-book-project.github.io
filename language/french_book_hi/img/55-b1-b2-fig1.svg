<svg viewBox="0 0 640 300" role="img" aria-label="तीन चरणों की listening strategy। पहले: स्थिति, बोलने वाला, मक़सद, अनुमानित शब्द। दौरान: key words, संख्याएँ और नाम, connectors, बाक़ी को छोड़ दो। बाद में: जवाब जाँचो, फिर सुनो, transcript पढ़ो, नए शब्द लिखो। अगली recording के लिए एक तीर बाद वाले चरण से वापस पहले वाले चरण तक जाता है।" xmlns="http://www.w3.org/2000/svg"><title>तीन चरण। “avant” पर 30 सेकंड लगाने से आपकी समझ दुगुनी हो सकती है।</title><style>svg{--accent:#ea580c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .st-col { fill: var(--canvas); stroke: var(--line); stroke-width: 1.5; }
          .st-hd { fill: var(--accent); }
          .st-ht { font: 800 15px var(--font); fill: var(--sheet); }
          .st-t { font: 600 13px var(--font); fill: var(--text); }
          .st-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .st-a { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
          .st-h { fill: var(--accent); }
        </style></defs>
        <rect class="st-col" x="15" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="15" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="110" y="46" text-anchor="middle">AVANT · पहले</text>
        <text class="st-t" x="30" y="88">• कौन-सी स्थिति?</text>
        <text class="st-t" x="30" y="116">• कौन बोल रहा है? क्यों?</text>
        <text class="st-t" x="30" y="144">• 5 शब्दों का अनुमान</text>
        <text class="st-s" x="30" y="176">voicemail → नाम,</text>
        <text class="st-s" x="30" y="194">कारण, अनुरोध,</text>
        <text class="st-s" x="30" y="212">फ़ोन नंबर</text>
        <rect class="st-col" x="225" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="225" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="320" y="46" text-anchor="middle">PENDANT · दौरान</text>
        <text class="st-t" x="240" y="88">• मुख्य nouns &amp; verbs</text>
        <text class="st-t" x="240" y="116">• संख्याएँ, नाम</text>
        <text class="st-t" x="240" y="144">• Connectors</text>
        <text class="st-s" x="240" y="176">mais, par contre →</text>
        <text class="st-s" x="240" y="194">अहम बात</text>
        <text class="st-s" x="240" y="212">आने वाली है!</text>
        <rect class="st-col" x="435" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="435" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="530" y="46" text-anchor="middle">APRÈS · बाद में</text>
        <text class="st-t" x="450" y="88">• अंदाज़े जाँचो</text>
        <text class="st-t" x="450" y="116">• एक बार और सुनो</text>
        <text class="st-t" x="450" y="144">• Transcript पढ़ो</text>
        <text class="st-s" x="450" y="176">3–5 नए शब्द और</text>
        <text class="st-s" x="450" y="194">दोबारा काम आने वाला</text>
        <text class="st-s" x="450" y="212">एक वाक्य लिखो</text>
        <path class="st-a" d="M205 130 L222 130"/>
        <path class="st-a" d="M415 130 L432 130"/>
        <path class="st-a" d="M530 244 Q530 285 320 285 Q110 285 110 250"/>
        <polygon class="st-h" points="110,243 104,254 116,254"/>
        <text class="st-s" x="320" y="278" text-anchor="middle">अगली recording</text>
      </svg>