<svg viewBox="0 0 640 260" role="img" aria-label="Adjective से pronoun तक: ce livre बनता है celui, cette robe बनती है celle, ces livres बनता है ceux, ces robes बनता है celles। हर pronoun के बाद -ci या -là, या de और मालिक, या qui या que आता है।" xmlns="http://www.w3.org/2000/svg"><title>celui / celle / ceux / celles को हमेशा एक “पूँछ” चाहिए। अकेला “Je prends celui” अधूरा है।</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .a1 { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .a2m { fill: var(--g-m); } .a2f { fill: var(--g-f); } .a2p { fill: var(--g-pl); }
          .at1 { font: 700 15px var(--font); fill: var(--text); }
          .at2 { font: 800 16px var(--font); fill: var(--sheet); }
          .ar4 { stroke: var(--text-soft); stroke-width: 2; fill: none; }
          .tl { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
          .tail { fill: var(--accent-soft); }
          .tt { font: 700 14px var(--font); fill: var(--accent-ink); }
        </style></defs>
        <text class="tl" x="90" y="22" text-anchor="middle">ADJECTIVE + NOUN</text>
        <text class="tl" x="300" y="22" text-anchor="middle">PRONOUN</text>
        <text class="tl" x="510" y="22" text-anchor="middle">+ इनमें से एक</text>
        <rect class="a1" x="20" y="36" width="140" height="40" rx="10"/><text class="at1" x="90" y="61" text-anchor="middle">ce livre</text>
