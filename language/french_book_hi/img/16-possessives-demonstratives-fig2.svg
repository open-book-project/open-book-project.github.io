        <rect class="a2m" x="240" y="36" width="120" height="40" rx="20"/><text class="at2" x="300" y="61" text-anchor="middle">celui</text>
        <rect class="a2f" x="240" y="88" width="120" height="40" rx="20"/><text class="at2" x="300" y="113" text-anchor="middle">celle</text>
        <rect class="a2p" x="240" y="140" width="120" height="40" rx="20"/><text class="at2" x="300" y="165" text-anchor="middle">ceux</text>
        <rect class="a2p" x="240" y="192" width="120" height="40" rx="20"/><text class="at2" x="300" y="217" text-anchor="middle">celles</text>
        <path class="ar4" d="M360 134 H410"/>
        <rect class="tail" x="410" y="50" width="210" height="44" rx="12"/><text class="tt" x="426" y="77">-ci / -là · celui-ci</text>
