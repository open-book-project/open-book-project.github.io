        <rect class="a1" x="20" y="140" width="140" height="40" rx="10"/><text class="at1" x="90" y="165" text-anchor="middle">ces livres</text>
        <rect class="a1" x="20" y="192" width="140" height="40" rx="10"/><text class="at1" x="90" y="217" text-anchor="middle">ces robes</text>
