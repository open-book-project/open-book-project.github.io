<svg viewBox="0 0 640 320" role="img" aria-label="निर्णय-वृक्ष: अगर फ़्रेंच verb में कोई preposition नहीं है तो le, la, les इस्तेमाल करो; अगर उसमें à और कोई व्यक्ति है तो lui, leur।" xmlns="http://www.w3.org/2000/svg"><title>एक सवाल फ़ैसला कर देता है: क्या व्यक्ति से पहले à है? सिर्फ़ third-person रूप बदलते हैं।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-pron:#0891b2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .op-box { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
        .op-q { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
        .op-t { font: 700 15px var(--font); fill: var(--text); }
        .op-s { font: 500 13px var(--font); fill: var(--text-soft); }
        .op-big { font: 800 20px var(--font); fill: var(--role-pron); }
        .op-ln { fill: none; stroke: var(--text-soft); stroke-width: 2; }
      </style></defs>
      <rect class="op-q" x="150" y="14" width="340" height="62" rx="14"/>
      <text class="op-t" x="320" y="40" text-anchor="middle">फ़्रेंच verb + noun को देखो।</text>
      <text class="op-s" x="320" y="62" text-anchor="middle">Noun से पहले क्या आता है?</text>
      <path class="op-ln" d="M260 76 L160 128"/>
      <path class="op-ln" d="M380 76 L480 128"/>
      <text class="op-s" x="150" y="108" text-anchor="middle">कुछ नहीं</text>
      <text class="op-s" x="500" y="108" text-anchor="middle">à + व्यक्ति</text>
      <rect class="op-box" x="20" y="128" width="280" height="96" rx="14"/>
      <text class="op-t" x="160" y="156" text-anchor="middle">DIRECT (COD)</text>
      <text class="op-big" x="160" y="190" text-anchor="middle">le · la · l’ · les</text>
      <text class="op-s" x="160" y="212" text-anchor="middle">Je regarde le film → je le regarde</text>
      <rect class="op-box" x="340" y="128" width="280" height="96" rx="14"/>
      <text class="op-t" x="480" y="156" text-anchor="middle">INDIRECT (COI)</text>
      <text class="op-big" x="480" y="190" text-anchor="middle">lui · leur</text>
      <text class="op-s" x="480" y="212" text-anchor="middle">Je parle à Julie → je lui parle</text>
      <rect class="op-q" x="120" y="250" width="400" height="56" rx="14"/>
      <text class="op-t" x="320" y="274" text-anchor="middle">me · te · nous · vous</text>
      <text class="op-s" x="320" y="295" text-anchor="middle">दोनों के लिए एक ही शब्द — चुनने की ज़रूरत नहीं</text>
    </svg>