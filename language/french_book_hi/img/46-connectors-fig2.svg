<svg viewBox="0 0 640 336" role="img" aria-label="चार डिब्बे: connectors जिनके बाद indicative, subjunctive, infinitive या noun आता है" xmlns="http://www.w3.org/2000/svg"><title>चार “plugs”। विचार वही, plug अलग: bien qu’il pleuve (subjunctive), même s’il pleut (indicative), malgré la pluie (noun)।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adv:#db2777;--role-prep:#ea580c;--role-verb:#0d9488;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.md-b { stroke-width: 2; }
.md-h { font: 800 15px var(--font); }
.md-t { font: 500 13px var(--font); fill: var(--text); text-anchor: middle; }
</style>
</defs>
<g transform="translate(12 10)">
<rect class="md-b" width="300" height="152" rx="16" fill="var(--sheet-2)" stroke="var(--role-verb)"/>
<rect width="300" height="34" rx="16" fill="var(--role-verb)"/>
<text class="md-h" x="150" y="23" text-anchor="middle" fill="var(--sheet)">+ INDICATIF</text>
<text class="md-t" x="150" y="62">parce que · puisque · comme</text>
<text class="md-t" x="150" y="84">alors que · tandis que · même si</text>
<text class="md-t" x="150" y="106">dès que · après que · pendant que</text>
<text class="md-t" x="150" y="128">si bien que · vu que · lorsque</text>
</g>
<g transform="translate(328 10)">
<rect class="md-b" width="300" height="152" rx="16" fill="var(--sheet-2)" stroke="var(--role-adv)"/>
<rect width="300" height="34" rx="16" fill="var(--role-adv)"/>
<text class="md-h" x="150" y="23" text-anchor="middle" fill="var(--sheet)">+ SUBJONCTIF</text>
<text class="md-t" x="150" y="62">bien que · quoique · pour que</text>
<text class="md-t" x="150" y="84">afin que · avant que · sans que</text>
<text class="md-t" x="150" y="106">à moins que · jusqu’à ce que</text>
<text class="md-t" x="150" y="128">de peur que · à condition que</text>
</g>
<g transform="translate(12 174)">
<rect class="md-b" width="300" height="152" rx="16" fill="var(--sheet-2)" stroke="var(--accent)"/>
<rect width="300" height="34" rx="16" fill="var(--accent)"/>
<text class="md-h" x="150" y="23" text-anchor="middle" fill="var(--sheet)">+ INFINITIF</text>
<text class="md-t" x="150" y="62">pour · afin de · avant de</text>
<text class="md-t" x="150" y="84">sans · au lieu de · de peur de</text>
<text class="md-t" x="150" y="106">après avoir / être + participe</text>
<text class="md-t" x="150" y="128">(दोनों हिस्सों में एक ही subject)</text>
</g>
<g transform="translate(328 174)">
<rect class="md-b" width="300" height="152" rx="16" fill="var(--sheet-2)" stroke="var(--role-prep)"/>
<rect width="300" height="34" rx="16" fill="var(--role-prep)"/>
<text class="md-h" x="150" y="23" text-anchor="middle" fill="var(--sheet)">+ NOM</text>
<text class="md-t" x="150" y="62">grâce à · à cause de · malgré</text>
<text class="md-t" x="150" y="84">en raison de · en dépit de</text>
<text class="md-t" x="150" y="106">faute de · lors de · avant · après</text>
<text class="md-t" x="150" y="128">(आगे कोई verb नहीं)</text>
</g>
</svg>