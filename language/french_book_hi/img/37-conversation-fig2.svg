<svg viewBox="0 0 640 250" role="img" aria-label="पूरी सहमति से पूरी असहमति तक का पैमाना: Tout à fait, Je suis d'accord, C'est vrai mais, Pas tout à fait, Je ne suis pas d'accord, Au contraire, Pas du tout." xmlns="http://www.w3.org/2000/svg"><title>हरे से लाल तक: पूरी सहमति से पूरी असहमति तक। दोनों सिरे कड़े हैं — इन्हें दोस्तों के साथ इस्तेमाल करो, या तब जब आप सच में वही कहना चाहते हों।</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .ag-bar { fill: none; stroke: var(--line-strong); stroke-width: 6; stroke-linecap: round; }
          .ag-y { fill: var(--good); }
          .ag-m { fill: var(--warn); }
          .ag-n { fill: var(--bad); }
          .ag-t { font: 700 13px var(--font); fill: var(--text); }
          .ag-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
          .ag-h { font: 800 12px var(--font); letter-spacing: .08em; }
        </style></defs>
        <text class="ag-h" x="20" y="24" style="fill: var(--good)">सहमत ●</text>
        <text class="ag-h" x="620" y="24" text-anchor="end" style="fill: var(--bad)">● असहमत</text>
        <path class="ag-bar" d="M40 70 L600 70"/>
        <circle class="ag-y" cx="40" cy="70" r="11"/>
        <circle class="ag-y" cx="133" cy="70" r="10"/>
        <circle class="ag-m" cx="226" cy="70" r="9"/>
        <circle class="ag-m" cx="320" cy="70" r="9"/>
        <circle class="ag-n" cx="413" cy="70" r="9"/>
        <circle class="ag-n" cx="506" cy="70" r="10"/>
        <circle class="ag-n" cx="600" cy="70" r="11"/>
        <text class="ag-t" x="40" y="108" text-anchor="middle">Tout à</text>
        <text class="ag-t" x="40" y="124" text-anchor="middle">fait !</text>
        <text class="ag-s" x="40" y="144" text-anchor="middle">बिलकुल</text>
        <text class="ag-t" x="133" y="108" text-anchor="middle">Je suis</text>
        <text class="ag-t" x="133" y="124" text-anchor="middle">d’accord</text>
        <text class="ag-s" x="133" y="144" text-anchor="middle">मैं सहमत हूँ</text>
        <text class="ag-t" x="226" y="108" text-anchor="middle">C’est vrai,</text>
        <text class="ag-t" x="226" y="124" text-anchor="middle">mais…</text>
        <text class="ag-s" x="226" y="144" text-anchor="middle">सच है, पर…</text>
        <text class="ag-t" x="320" y="108" text-anchor="middle">Pas tout</text>
        <text class="ag-t" x="320" y="124" text-anchor="middle">à fait</text>
        <text class="ag-s" x="320" y="144" text-anchor="middle">पूरी तरह नहीं</text>
        <text class="ag-t" x="413" y="108" text-anchor="middle">Je ne suis</text>
        <text class="ag-t" x="413" y="124" text-anchor="middle">pas d’accord</text>
        <text class="ag-s" x="413" y="144" text-anchor="middle">मैं असहमत हूँ</text>
        <text class="ag-t" x="506" y="108" text-anchor="middle">Au</text>
        <text class="ag-t" x="506" y="124" text-anchor="middle">contraire !</text>
        <text class="ag-s" x="506" y="144" text-anchor="middle">बल्कि उलटा</text>
        <text class="ag-t" x="600" y="108" text-anchor="middle">Pas du</text>
        <text class="ag-t" x="600" y="124" text-anchor="middle">tout !</text>
        <text class="ag-s" x="600" y="144" text-anchor="middle">बिलकुल नहीं</text>
        <rect x="20" y="172" width="600" height="60" rx="12" style="fill: var(--accent-soft)"/>
        <text class="ag-t" x="36" y="198">विनम्र लोग बीच के हिस्से में रहते हैं।</text>
        <text class="ag-s" x="36" y="218">अजनबियों या ऑफिस में “C’est vrai, mais…” और “Je ne suis pas d’accord” के बीच ही रहो।</text>
      </svg>