<svg viewBox="0 0 640 230" role="img" aria-label="Register की सीढ़ी: एक ही वाक्य soutenu, courant और familier में" xmlns="http://www.w3.org/2000/svg"><title>एक ही संदेश, तीन register। साहित्यिक ख़ूबियाँ (छोड़ा गया pas, inversion) सीढ़ी के सबसे ऊपर रहती हैं।</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-pl:#7c3aed;--line:#e3e7ef;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .rg-1 { fill: var(--accent-soft); stroke: var(--g-pl); stroke-width: 2.5; }
              .rg-2 { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2.5; }
              .rg-3 { fill: var(--sheet); stroke: var(--line); stroke-width: 2.5; }
              .rg-h { font: 800 13px var(--font); fill: var(--text); letter-spacing: .04em; }
              .rg-e { font: 500 13px var(--font); fill: var(--text); font-style: italic; }
              .rg-s { font: 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <rect class="rg-1" x="20" y="14" width="600" height="58" rx="12"/>
          <text class="rg-h" x="40" y="38">SOUTENU</text>
          <text class="rg-s" x="40" y="58">किताबें, भाषण, औपचारिक पत्र</text>
          <text class="rg-e" x="600" y="48" text-anchor="end">Je ne sais s’il viendra ; peut-être est-il souffrant.</text>
          <rect class="rg-2" x="50" y="86" width="570" height="58" rx="12"/>
          <text class="rg-h" x="70" y="110">COURANT</text>
          <text class="rg-s" x="70" y="130">काम, ख़बरें, शिष्ट बातचीत</text>
          <text class="rg-e" x="600" y="120" text-anchor="end">Je ne sais pas s’il viendra ; il est peut-être malade.</text>
          <rect class="rg-3" x="80" y="158" width="540" height="58" rx="12"/>
          <text class="rg-h" x="100" y="182">FAMILIER</text>
          <text class="rg-s" x="100" y="202">दोस्त, परिवार</text>
          <text class="rg-e" x="600" y="192" text-anchor="end">Je sais pas s’il vient, il est p’t-être malade.</text>
        </svg>