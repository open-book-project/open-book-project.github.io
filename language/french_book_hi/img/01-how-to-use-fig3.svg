<svg viewBox="0 0 640 230" role="img" aria-label="रिव्यू टाइमलाइन: दिन 0 पर सीखो, फिर 1 दिन, 3 दिन, 1 हफ़्ते और 3 हफ़्ते बाद रिव्यू करो; हर बार गैप लंबा होता जाता है।" xmlns="http://www.w3.org/2000/svg"><title>किसी चैप्टर को पहली बार पढ़ने के 1, 3, 7 और 21 दिन बाद रिव्यू करो। चार छोटे रिव्यू उसे ज़्यादातर पक्का करने के लिए काफ़ी हैं।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .tl { fill: none; stroke: var(--line-strong); stroke-width: 3; }
        .dot { fill: var(--accent); }
        .dot0 { fill: var(--g-f); }
        .dl { font: 700 13px var(--font); fill: var(--text); }
        .ds { font: 500 12px var(--font); fill: var(--text-soft); }
        .gap { fill: none; stroke: var(--accent); stroke-width: 2; }
      </style></defs>
      <line class="tl" x1="30" y1="140" x2="620" y2="140"/>
      <path class="gap" d="M40 124 Q60 100 80 124"/>
      <path class="gap" d="M80 124 Q120 86 160 124"/>
      <path class="gap" d="M160 124 Q240 60 320 124"/>
      <path class="gap" d="M320 124 Q460 30 600 124"/>
      <circle class="dot0" cx="40" cy="140" r="12"/>
      <circle class="dot" cx="80" cy="140" r="10"/>
      <circle class="dot" cx="160" cy="140" r="10"/>
      <circle class="dot" cx="320" cy="140" r="10"/>
      <circle class="dot" cx="600" cy="140" r="10"/>
      <text class="dl" x="40" y="172" text-anchor="middle">दिन 0</text>
      <text class="ds" x="40" y="190" text-anchor="middle">सीखो</text>
      <text class="dl" x="92" y="212" text-anchor="middle">दिन 1</text>
      <text class="dl" x="160" y="172" text-anchor="middle">दिन 3</text>
      <text class="ds" x="160" y="190" text-anchor="middle">रिव्यू</text>
      <text class="dl" x="320" y="172" text-anchor="middle">दिन 7</text>
      <text class="ds" x="320" y="190" text-anchor="middle">रिव्यू</text>
      <text class="dl" x="600" y="172" text-anchor="middle">दिन 21</text>
      <text class="ds" x="600" y="190" text-anchor="middle">रिव्यू</text>
      <text class="ds" x="460" y="56" text-anchor="middle">हर गैप पिछले से लंबा</text>
    </svg>