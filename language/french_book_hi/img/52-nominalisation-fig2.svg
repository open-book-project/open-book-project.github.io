<svg viewBox="0 0 660 260" role="img" aria-label="बदलाव का diagram। ऊपर: Les prix, ont fortement, augmenté। नीचे: la forte, augmentation, des prix। Verb augmenté noun augmentation बन जाता है; adverb fortement adjective forte बन जाता है, जो feminine noun से agree करता है; subject les prix, de से शुरू होकर complement des prix बन जाता है।" xmlns="http://www.w3.org/2000/svg"><title>Les prix ont fortement augmenté → la forte augmentation des prix… inquiète les ménages.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .tbx { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .tvb { fill: var(--role-verb); }
          .tad { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
          .tn { fill: var(--g-f); }
          .tt { font: 800 16px var(--font); fill: var(--text); }
          .tw { font: 800 16px var(--font); fill: var(--sheet); }
          .tl { font: 600 12px var(--font); fill: var(--text-soft); }
          .tarr { stroke: var(--text-soft); stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
          .thd { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
        </style></defs>
        <text class="thd" x="20" y="24">VERB वाली शैली</text>
        <rect class="tbx" x="20" y="34" width="170" height="50" rx="10"/><text class="tt" x="105" y="65" text-anchor="middle">Les prix</text>
        <rect class="tad" x="205" y="34" width="210" height="50" rx="10"/><text class="tt" x="310" y="65" text-anchor="middle">ont fortement</text>
        <rect class="tvb" x="430" y="34" width="210" height="50" rx="10"/><text class="tw" x="535" y="65" text-anchor="middle">augmenté</text>

        <path class="tarr" d="M535 84 C535 130, 330 130, 330 176"/>
        <path class="tarr" d="M310 84 C310 120, 115 130, 115 176"/>
        <path class="tarr" d="M105 84 C105 110, 545 130, 545 176"/>
        <text class="tl" x="440" y="122">① verb → noun</text>
        <text class="tl" x="150" y="112">② adverb → adjective</text>
        <text class="tl" x="250" y="150">③ subject → de + noun</text>

        <text class="thd" x="20" y="170">NOUN वाली शैली</text>
        <rect class="tad" x="20" y="176" width="190" height="50" rx="10"/><text class="tt" x="115" y="207" text-anchor="middle">la forte</text>
        <rect class="tn" x="225" y="176" width="210" height="50" rx="10"/><text class="tw" x="330" y="207" text-anchor="middle">augmentation</text>
        <rect class="tbx" x="450" y="176" width="190" height="50" rx="10"/><text class="tt" x="545" y="207" text-anchor="middle">des prix</text>
        <text class="tl" x="20" y="250">forte, augmentation (feminine) से agree करता है · ④ नतीजा एक noun group है: उसे वाक्य में रखो।</text>
      </svg>