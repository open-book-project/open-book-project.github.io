<svg viewBox="0 0 640 296" role="img" aria-label="तीन तस्वीर वाले कार्ड: poser un lapin, il pleut des cordes, coûter les yeux de la tête — शाब्दिक तस्वीर और असली मतलब" xmlns="http://www.w3.org/2000/svg"><title>तस्वीर वाले कार्ड: हर idiom को एक अजीब-सी तस्वीर की तरह याद करो, फिर उससे असली मतलब जोड़ दो।</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--ink-300:#cbd5e1;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;--warn-bg:#fff6e0;background:#fff;font-family:var(--font,sans-serif)}</style>
