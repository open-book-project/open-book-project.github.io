.pc-r { font: 700 13px var(--font); fill: var(--good); text-anchor: middle; }
.pc-ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.pc-gr { fill: none; stroke: var(--line-strong); stroke-width: 2; }
</style>
</defs>
