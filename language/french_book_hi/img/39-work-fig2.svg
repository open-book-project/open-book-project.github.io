<svg viewBox="0 0 640 300" role="img" aria-label="निर्णय-वृक्ष: क्लाइंट या बाहरी पार्टनर के लिए vous; मैनेजर या काफ़ी बड़े व्यक्ति के लिए तब तक vous जब तक वे tu न कहो; आपके स्तर के सहकर्मी के लिए tu अगर टीम बोलती है, वरना इंतज़ार; और जो भी कहे on se tutoie, उसके लिए tu।" xmlns="http://www.w3.org/2000/svg"><title>नीला = vous, गुलाबी = tu। क्लाइंट लगभग हमेशा vous पर रहते हैं; सहकर्मी अक्सर कुछ दिनों में tu पर आ जाते हैं। tu से वापस vous पर कभी मत जाओ — यह थप्पड़ जैसा लगता है।</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .tv-q { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
          .tv-v { fill: var(--accent-soft); stroke: var(--g-m); stroke-width: 2.5; }
          .tv-t { fill: var(--accent-soft); stroke: var(--g-f); stroke-width: 2.5; }
          .tv-x { font: 700 13px var(--font); fill: var(--text); }
          .tv-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
          .tv-vv { font: 800 15px var(--font); fill: var(--g-m); }
          .tv-tt { font: 800 15px var(--font); fill: var(--g-f); }
          .tv-a { fill: none; stroke: var(--text-soft); stroke-width: 2; }
          .tv-l { font: 700 11px var(--font); fill: var(--text-soft); }
        </style></defs>
        <rect class="tv-q" x="200" y="10" width="240" height="44" rx="10"/>
        <text class="tv-x" x="320" y="37" text-anchor="middle">आप किससे बात कर रहे हैं?</text>
        <path class="tv-a" d="M260 54 L90 96"/>
        <path class="tv-a" d="M320 54 L320 96"/>
        <path class="tv-a" d="M380 54 L550 96"/>
        <rect class="tv-q" x="10" y="98" width="180" height="50" rx="10"/>
        <text class="tv-x" x="100" y="120" text-anchor="middle">क्लाइंट, पार्टनर,</text>
        <text class="tv-x" x="100" y="138" text-anchor="middle">अजनबी</text>
        <rect class="tv-q" x="230" y="98" width="180" height="50" rx="10"/>
        <text class="tv-x" x="320" y="120" text-anchor="middle">मैनेजर, डायरेक्टर,</text>
        <text class="tv-x" x="320" y="138" text-anchor="middle">काफ़ी बड़ा सहकर्मी</text>
        <rect class="tv-q" x="450" y="98" width="180" height="50" rx="10"/>
        <text class="tv-x" x="540" y="120" text-anchor="middle">आपके स्तर का</text>
        <text class="tv-x" x="540" y="138" text-anchor="middle">सहकर्मी</text>
        <path class="tv-a" d="M100 148 L100 190"/>
        <path class="tv-a" d="M320 148 L320 190"/>
        <path class="tv-a" d="M500 148 L470 190"/>
        <path class="tv-a" d="M580 148 L600 190"/>
        <rect class="tv-v" x="20" y="192" width="160" height="62" rx="10"/>
        <text class="tv-vv" x="100" y="218" text-anchor="middle">VOUS</text>
        <text class="tv-s" x="100" y="238" text-anchor="middle">Monsieur / Madame + नाम</text>
        <rect class="tv-v" x="240" y="192" width="160" height="62" rx="10"/>
        <text class="tv-vv" x="320" y="218" text-anchor="middle">VOUS</text>
        <text class="tv-s" x="320" y="238" text-anchor="middle">जब तक वे tu न कहो</text>
        <text class="tv-l" x="476" y="172" text-anchor="end">टीम tu बोलती है</text>
        <rect class="tv-t" x="414" y="192" width="104" height="62" rx="10"/>
        <text class="tv-tt" x="466" y="218" text-anchor="middle">TU</text>
        <text class="tv-s" x="466" y="238" text-anchor="middle">टीम जैसा करो</text>
        <text class="tv-l" x="596" y="172">पक्का नहीं</text>
        <rect class="tv-v" x="528" y="192" width="104" height="62" rx="10"/>
        <text class="tv-vv" x="580" y="218" text-anchor="middle">VOUS</text>
        <text class="tv-s" x="580" y="238" text-anchor="middle">फिर पूछो</text>
        <text class="tv-s" x="10" y="286">बदलाव का जादुई वाक्य: “On peut se tutoyer ?” — और कोई आपसे कहे तो “Oui, bien sûr !” कहकर मान लो।</text>
      </svg>