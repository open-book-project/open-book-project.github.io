<svg viewBox="0 0 640 340" role="img" aria-label="Construction का नक़्शा: तीन कॉलम — सीधे कर्म वाले verbs, à वाले verbs, de वाले verbs — और हर एक के साथ आने वाले pronouns" xmlns="http://www.w3.org/2000/svg"><title>Verbs के तीन परिवार। छोटा शब्द pronoun भी तय करता है: je l’attends , je lui téléphone , j’en ai besoin (देखो Object pronouns और Y, en &amp; pronoun order )।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-prep:#ea580c;--role-pron:#0891b2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs>
          <style>
            .cv-h { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
            .cv-b { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
            .cv-ht { font: 800 15px var(--font); fill: var(--text); }
            .cv-hs { font: 500 11px var(--font); fill: var(--text-soft); }
            .cv-t { font: 500 13px var(--font); fill: var(--text); }
            .cv-v { fill: var(--role-verb); font-weight: 700; }
            .cv-p { fill: var(--role-prep); font-weight: 800; }
            .cv-pr { font: 700 12px var(--font); fill: var(--role-pron); }
          </style>
        </defs>
        <g text-anchor="middle">
          <rect class="cv-h" x="20" y="16" width="180" height="48" rx="10"/>
          <text class="cv-ht" x="110" y="38">verb + qqn / qqch</text>
          <text class="cv-hs" x="110" y="55">कोई छोटा शब्द नहीं</text>
          <rect class="cv-h" x="230" y="16" width="180" height="48" rx="10"/>
          <text class="cv-ht" x="320" y="38">verb + <tspan class="cv-p">à</tspan></text>
          <text class="cv-hs" x="320" y="55">अप्रत्यक्ष कर्म</text>
          <rect class="cv-h" x="440" y="16" width="180" height="48" rx="10"/>
          <text class="cv-ht" x="530" y="38">verb + <tspan class="cv-p">de</tspan></text>
          <text class="cv-hs" x="530" y="55">"का / के बारे में / से"</text>
        </g>
        <rect class="cv-b" x="20" y="74" width="180" height="196" rx="10"/>
        <rect class="cv-b" x="230" y="74" width="180" height="196" rx="10"/>
        <rect class="cv-b" x="440" y="74" width="180" height="196" rx="10"/>
        <g class="cv-t">
          <text x="34" y="102"><tspan class="cv-v">attendre</tspan> le bus</text>
          <text x="34" y="126"><tspan class="cv-v">chercher</tspan> ses clés</text>
          <text x="34" y="150"><tspan class="cv-v">écouter</tspan> la radio</text>
          <text x="34" y="174"><tspan class="cv-v">regarder</tspan> la télé</text>
          <text x="34" y="198"><tspan class="cv-v">payer</tspan> le repas</text>
          <text x="34" y="222"><tspan class="cv-v">aider</tspan> ma mère</text>
          <text x="34" y="246"><tspan class="cv-v">appeler</tspan> Paul</text>
          <text x="244" y="102"><tspan class="cv-v">téléphoner</tspan> <tspan class="cv-p">à</tspan> Paul</text>
          <text x="244" y="126"><tspan class="cv-v">répondre</tspan> <tspan class="cv-p">à</tspan> Léa</text>
          <text x="244" y="150"><tspan class="cv-v">penser</tspan> <tspan class="cv-p">à</tspan> toi</text>
          <text x="244" y="174"><tspan class="cv-v">jouer</tspan> <tspan class="cv-p">au</tspan> foot</text>
          <text x="244" y="198"><tspan class="cv-v">plaire</tspan> <tspan class="cv-p">à</tspan> qqn</text>
          <text x="244" y="222"><tspan class="cv-v">manquer</tspan> <tspan class="cv-p">à</tspan> qqn</text>
          <text x="244" y="246"><tspan class="cv-v">commencer</tspan> <tspan class="cv-p">à</tspan> lire</text>
          <text x="454" y="102"><tspan class="cv-v">avoir besoin</tspan> <tspan class="cv-p">d’</tspan>aide</text>
          <text x="454" y="126"><tspan class="cv-v">s’occuper</tspan> <tspan class="cv-p">de</tspan> Léo</text>
          <text x="454" y="150"><tspan class="cv-v">se souvenir</tspan> <tspan class="cv-p">de</tspan> toi</text>
          <text x="454" y="174"><tspan class="cv-v">jouer</tspan> <tspan class="cv-p">du</tspan> piano</text>
          <text x="454" y="198"><tspan class="cv-v">parler</tspan> <tspan class="cv-p">du</tspan> film</text>
          <text x="454" y="222"><tspan class="cv-v">essayer</tspan> <tspan class="cv-p">de</tspan> dormir</text>
          <text x="454" y="246"><tspan class="cv-v">arrêter</tspan> <tspan class="cv-p">de</tspan> fumer</text>
        </g>
        <g text-anchor="middle">
          <rect class="cv-b" x="20" y="282" width="180" height="46" rx="10"/>
          <text class="cv-pr" x="110" y="310">→ le, la, les</text>
          <rect class="cv-b" x="230" y="282" width="180" height="46" rx="10"/>
          <text class="cv-pr" x="320" y="301">→ lui, leur (लोग)</text>
          <text class="cv-pr" x="320" y="318">→ y (चीज़ें)</text>
          <rect class="cv-b" x="440" y="282" width="180" height="46" rx="10"/>
          <text class="cv-pr" x="530" y="310">→ en (चीज़ें)</text>
        </g>
      </svg>