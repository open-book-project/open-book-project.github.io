<svg viewBox="0 0 640 250" role="img" aria-label="तीन nasal स्वर: bon में on गोल होंठों के साथ, banc में an खुले मुँह के साथ, bain में in फैले होंठों के साथ; और हर एक का oral जोड़ीदार।" xmlns="http://www.w3.org/2000/svg"><title>गुलाबी रेखा आपके होंठों का आकार है। गोल → खुला → फैला हुआ। अगर आपके दो nasal एक जैसे सुनाई दो, तो पहले होंठों का आकार बढ़ा-चढ़ाकर बनाओ।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .nz-card { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
          .nz-w { font: 800 26px var(--font); fill: var(--text); }
          .nz-s { font: 700 15px var(--font); fill: var(--accent); }
          .nz-t { font: 500 12.5px var(--font); fill: var(--text-soft); }
          .nz-lip { fill: none; stroke: var(--g-f); stroke-width: 3; }
          .nz-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .08em; }
        </style></defs>
        <text class="nz-h" x="20" y="22">एक ही B, तीन nasal स्वर</text>
        <g transform="translate(20 34)">
          <rect class="nz-card" x="0" y="0" width="190" height="200" rx="14"/>
          <ellipse class="nz-lip" cx="95" cy="52" rx="20" ry="22"/>
          <text class="nz-w" x="95" y="118" text-anchor="middle">bon</text>
          <text class="nz-s" x="95" y="142" text-anchor="middle">[bõ] — “on”</text>
          <text class="nz-t" x="95" y="166" text-anchor="middle">होंठ छोटे और गोल</text>
          <text class="nz-t" x="95" y="186" text-anchor="middle">oral जोड़ीदार: beau [boh]</text>
        </g>
        <g transform="translate(225 34)">
          <rect class="nz-card" x="0" y="0" width="190" height="200" rx="14"/>
          <ellipse class="nz-lip" cx="95" cy="52" rx="30" ry="26"/>
          <text class="nz-w" x="95" y="118" text-anchor="middle">banc</text>
          <text class="nz-s" x="95" y="142" text-anchor="middle">[bã] — “an / en”</text>
          <text class="nz-t" x="95" y="166" text-anchor="middle">मुँह पूरा खुला, जबड़ा नीचे</text>
          <text class="nz-t" x="95" y="186" text-anchor="middle">oral जोड़ीदार: bas [ba]</text>
        </g>
        <g transform="translate(430 34)">
          <rect class="nz-card" x="0" y="0" width="190" height="200" rx="14"/>
          <ellipse class="nz-lip" cx="95" cy="52" rx="36" ry="12"/>
          <text class="nz-w" x="95" y="118" text-anchor="middle">bain</text>
          <text class="nz-s" x="95" y="142" text-anchor="middle">[bɛ̃] — “in / ain”</text>
          <text class="nz-t" x="95" y="166" text-anchor="middle">होंठ फैले, हल्की मुस्कान</text>
          <text class="nz-t" x="95" y="186" text-anchor="middle">oral जोड़ीदार: baie [beh]</text>
        </g>
      </svg>