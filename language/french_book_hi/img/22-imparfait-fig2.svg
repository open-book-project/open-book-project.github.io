<svg viewBox="0 0 660 330" role="img" aria-label="निर्णय-वृक्ष। क्या यह एक बार हुआ, या गिनी हुई बार, या किसी बंद अवधि में? हाँ: passé composé। क्या यह वर्णन, आदत या चलती हुई क्रिया है? हाँ: imparfait।" xmlns="http://www.w3.org/2000/svg"><title>घटनाएँ कहानी को आगे बढ़ाती हैं (passé composé)। वर्णन, आदतें और चलती क्रियाएँ उसे थामे रखती हैं (imparfait)।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .dt-q { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
        .dt-pc { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
        .dt-im { fill: var(--sheet); stroke: var(--accent); stroke-width: 2.5; }
        .dt-t { font: 700 13px var(--font); fill: var(--text); }
        .dt-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .dt-pct { font: 800 16px var(--font); fill: var(--role-verb); }
        .dt-imt { font: 800 16px var(--font); fill: var(--accent); }
        .dt-ln { fill: none; stroke: var(--text-soft); stroke-width: 2; }
      </style></defs>
      <rect class="dt-q" x="110" y="12" width="440" height="70" rx="14"/>
      <text class="dt-t" x="330" y="40" text-anchor="middle">क्या यह कोई EVENT है? जो घटित हुआ —</text>
      <text class="dt-s" x="330" y="62" text-anchor="middle">एक बार · गिनी हुई बार · एक बंद अवधि में</text>
      <path class="dt-ln" d="M230 82 L150 128"/>
      <path class="dt-ln" d="M430 82 L510 128"/>
      <text class="dt-s" x="170" y="110" text-anchor="end">हाँ</text>
      <text class="dt-s" x="490" y="110">नहीं — यह दृश्य है</text>
      <rect class="dt-pc" x="20" y="128" width="290" height="180" rx="14"/>
      <text class="dt-pct" x="165" y="158" text-anchor="middle">PASSÉ COMPOSÉ</text>
      <text class="dt-t" x="40" y="190">• Soudain, il est entré.</text>
      <text class="dt-t" x="40" y="216">• J’y suis allé trois fois.</text>
      <text class="dt-t" x="40" y="242">• J’ai vécu à Delhi pendant 5 ans.</text>
      <text class="dt-s" x="40" y="272">hier · soudain · une fois · trois fois</text>
      <text class="dt-s" x="40" y="292">tout à coup · pendant + durée finie</text>
      <rect class="dt-im" x="350" y="128" width="290" height="180" rx="14"/>
      <text class="dt-imt" x="495" y="158" text-anchor="middle">IMPARFAIT</text>
      <text class="dt-t" x="370" y="190">• वर्णन: Il faisait beau.</text>
      <text class="dt-t" x="370" y="216">• आदत: J’y allais souvent.</text>
      <text class="dt-t" x="370" y="242">• चलती क्रिया: Je lisais…</text>
      <text class="dt-s" x="370" y="272">souvent · d’habitude · chaque jour</text>
      <text class="dt-s" x="370" y="292">quand j’étais petit · pendant que</text>
    </svg>