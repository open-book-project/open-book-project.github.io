<svg viewBox="0 0 640 260" role="img" aria-label="दो चित्र। Oral vowel: कोमल तालु नाक को बंद कर देता है, हवा सिर्फ़ मुँह से निकलती है। Nasal vowel: कोमल तालु नीचे होता है, हवा मुँह और नाक दोनों से निकलती है।" xmlns="http://www.w3.org/2000/svg"><title>कोमल तालु (गुलाबी) नाक का दरवाज़ा है। Nasal vowel के लिए दरवाज़ा खोलो और कुछ हवा नाक से निकलने दो — पर n बोलकर मुँह कभी बंद न करो।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .ch2 { fill: none; stroke: var(--line-strong); stroke-width: 2.5; }
        .vel { fill: none; stroke: var(--g-f); stroke-width: 6; stroke-linecap: round; }
        .air { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
        .ah { fill: var(--accent); }
        .h1 { font: 800 15px var(--font); fill: var(--text); }
        .h2 { font: 600 12px var(--font); fill: var(--text-soft); }
        .h3 { font: 700 12px var(--font); fill: var(--g-f); }
      </style></defs>
      <text class="h1" x="160" y="26" text-anchor="middle">Oral vowel: a, o, é…</text>
      <rect class="ch2" x="40" y="50" width="220" height="40" rx="20"/>
      <rect class="ch2" x="40" y="120" width="220" height="50" rx="22"/>
      <text class="h2" x="70" y="75">नाक</text>
      <text class="h2" x="70" y="150">मुँह</text>
      <line class="vel" x1="262" y1="92" x2="262" y2="58"/>
      <text class="h3" x="270" y="74">बंद</text>
      <path class="air" d="M300 190 Q290 145 250 145 L30 145"/>
      <polygon class="ah" points="18,145 34,137 34,153"/>
      <text class="h2" x="150" y="210" text-anchor="middle">हवा सिर्फ़ मुँह से बाहर</text>
      <text class="h2" x="305" y="214" text-anchor="middle">फेफड़े</text>

      <text class="h1" x="480" y="26" text-anchor="middle">Nasal vowel: an, on, in</text>
      <rect class="ch2" x="360" y="50" width="220" height="40" rx="20"/>
      <rect class="ch2" x="360" y="120" width="220" height="50" rx="22"/>
      <text class="h2" x="390" y="75">नाक</text>
      <text class="h2" x="390" y="150">मुँह</text>
      <line class="vel" x1="582" y1="118" x2="560" y2="104"/>
      <text class="h3" x="588" y="104">खुला</text>
      <path class="air" d="M620 200 Q610 145 570 145 L350 145"/>
      <path class="air" d="M600 160 Q596 70 560 70 L350 70"/>
      <polygon class="ah" points="338,145 354,137 354,153"/>
      <polygon class="ah" points="338,70 354,62 354,78"/>
      <text class="h2" x="470" y="210" text-anchor="middle">हवा मुँह और नाक दोनों से बाहर</text>
      <text class="h2" x="470" y="236" text-anchor="middle">अंत में n या m की आवाज़ नहीं!</text>
    </svg>