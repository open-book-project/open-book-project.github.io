<svg viewBox="0 0 660 330" role="img" aria-label="शून्य से सब तक की मात्रा का पैमाना, हर पंक्ति में दस बिंदु। Aucun: शून्य बिंदु भरे, एकवचन, aucun étudiant n'est venu। Quelques: लगभग तीन, quelques étudiants। Plusieurs: चार या पाँच, दो से ज़्यादा। Certains: कुछ, पर सब नहीं, यानी बाक़ी नहीं आए। Tous: सारे दस बिंदु, tous les étudiants। Pronoun रूप: aucun, quelques-uns, plusieurs, certains, tous जिसे tus बोला जाता है।" xmlns="http://www.w3.org/2000/svg"><title>यह पैमाना एक एहसास है, गणित नहीं: quelques और plusieurs आपस में मिल जाते हैं। Certains हमेशा इशारा करता है “और बाक़ी नहीं आए”।</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .on { fill: var(--accent); }
          .off { fill: none; stroke: var(--line-strong); stroke-width: 1.8; }
          .wd { font: 800 15px var(--font); fill: var(--text); }
          .pr { font: 600 12px var(--font); fill: var(--accent-ink); }
          .ex2 { font: 500 12px var(--font); fill: var(--text-soft); }
          .ax { stroke: var(--text-soft); stroke-width: 2; fill: none; }
          .axl { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
        </style></defs>
        <path class="ax" d="M20 318 H636 M626 312 L636 318 L626 324"/>
        <text class="axl" x="20" y="308">0</text><text class="axl" x="600" y="308">सब</text>

        <text class="wd" x="20" y="34">aucun(e)</text><text class="pr" x="20" y="52">pron. aucun(e) · एकवचन</text>
        <g transform="translate(250 30)"><circle class="off" cx="0" cy="0" r="8"/><circle class="off" cx="22" cy="0" r="8"/><circle class="off" cx="44" cy="0" r="8"/><circle class="off" cx="66" cy="0" r="8"/><circle class="off" cx="88" cy="0" r="8"/><circle class="off" cx="110" cy="0" r="8"/><circle class="off" cx="132" cy="0" r="8"/><circle class="off" cx="154" cy="0" r="8"/><circle class="off" cx="176" cy="0" r="8"/><circle class="off" cx="198" cy="0" r="8"/></g>
        <text class="ex2" x="470" y="35">Aucun élève n’est venu.</text>

        <text class="wd" x="20" y="94">quelques</text><text class="pr" x="20" y="112">pron. quelques-un(e)s</text>
        <g transform="translate(250 90)"><circle class="on" cx="0" cy="0" r="8"/><circle class="on" cx="22" cy="0" r="8"/><circle class="on" cx="44" cy="0" r="8"/><circle class="off" cx="66" cy="0" r="8"/><circle class="off" cx="88" cy="0" r="8"/><circle class="off" cx="110" cy="0" r="8"/><circle class="off" cx="132" cy="0" r="8"/><circle class="off" cx="154" cy="0" r="8"/><circle class="off" cx="176" cy="0" r="8"/><circle class="off" cx="198" cy="0" r="8"/></g>
        <text class="ex2" x="470" y="95">कुछ — छोटी संख्या</text>

        <text class="wd" x="20" y="154">plusieurs</text><text class="pr" x="20" y="172">pron. plusieurs · कभी नहीं बदलता</text>
        <g transform="translate(250 150)"><circle class="on" cx="0" cy="0" r="8"/><circle class="on" cx="22" cy="0" r="8"/><circle class="on" cx="44" cy="0" r="8"/><circle class="on" cx="66" cy="0" r="8"/><circle class="on" cx="88" cy="0" r="8"/><circle class="off" cx="110" cy="0" r="8"/><circle class="off" cx="132" cy="0" r="8"/><circle class="off" cx="154" cy="0" r="8"/><circle class="off" cx="176" cy="0" r="8"/><circle class="off" cx="198" cy="0" r="8"/></g>
        <text class="ex2" x="470" y="155">कई — दो से ज़्यादा</text>

        <text class="wd" x="20" y="214">certain(e)s</text><text class="pr" x="20" y="232">pron. certain(e)s</text>
        <g transform="translate(250 210)"><circle class="on" cx="0" cy="0" r="8"/><circle class="on" cx="22" cy="0" r="8"/><circle class="on" cx="44" cy="0" r="8"/><circle class="on" cx="66" cy="0" r="8"/><circle class="on" cx="88" cy="0" r="8"/><circle class="on" cx="110" cy="0" r="8"/><circle class="off" cx="132" cy="0" r="8"/><circle class="off" cx="154" cy="0" r="8"/><circle class="off" cx="176" cy="0" r="8"/><circle class="off" cx="198" cy="0" r="8"/></g>
        <text class="ex2" x="470" y="215">कुछ — पर बाक़ी नहीं</text>

        <text class="wd" x="20" y="274">tous / toutes</text><text class="pr" x="20" y="292">pron. tous [tus] / toutes</text>
        <g transform="translate(250 270)"><circle class="on" cx="0" cy="0" r="8"/><circle class="on" cx="22" cy="0" r="8"/><circle class="on" cx="44" cy="0" r="8"/><circle class="on" cx="66" cy="0" r="8"/><circle class="on" cx="88" cy="0" r="8"/><circle class="on" cx="110" cy="0" r="8"/><circle class="on" cx="132" cy="0" r="8"/><circle class="on" cx="154" cy="0" r="8"/><circle class="on" cx="176" cy="0" r="8"/><circle class="on" cx="198" cy="0" r="8"/></g>
        <text class="ex2" x="470" y="275">Tous les élèves sont venus.</text>
      </svg>