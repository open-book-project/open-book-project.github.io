<svg viewBox="0 0 640 330" role="img" aria-label="नोट्स लेने का एक template। ऊपरी पट्टी: विषय, बोलने वाला, पाठ का प्रकार। बायाँ कॉलम: मुख्य विचार, क्रमांक और तीरों के साथ। दायाँ कॉलम: उदाहरण, आँकड़े, उद्धरण। नीचे बाएँ: बोलने वाले का रवैया — पक्ष में, विरोध में, संतुलित या व्यंग्यात्मक। नीचे दाएँ: सुनने के बाद लिखा गया एक वाक्य का सार।" xmlns="http://www.w3.org/2000/svg"><title>Recording से पहले तैयार किया गया नोट्स का पन्ना। “Synthèse” सिर्फ़ आख़िर में भरो — यह आपको नक़ल करने की बजाय समझने पर मजबूर करता है।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .nt-f { fill: var(--canvas); stroke: var(--line); stroke-width: 1.5; }
          .nt-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
          .nt-h { font: 800 13px var(--font); fill: var(--accent); letter-spacing: .04em; }
          .nt-t { font: 600 13px var(--font); fill: var(--text); }
          .nt-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .nt-l { fill: none; stroke: var(--role-verb); stroke-width: 2; stroke-linecap: round; }
        </style></defs>
        <rect class="nt-a" x="15" y="12" width="610" height="46" rx="10"/>
        <text class="nt-h" x="30" y="32">SUJET · LOCUTEUR · TYPE</text>
        <text class="nt-s" x="30" y="50">voiture en ville · débat radio · 2 invités</text>
        <rect class="nt-f" x="15" y="68" width="360" height="160" rx="10"/>
        <text class="nt-h" x="30" y="90">IDÉES CLÉS</text>
        <text class="nt-t" x="30" y="116">1. Morel : interdiction progressive</text>
        <path class="nt-l" d="M44 126 L44 140 L60 140"/>
        <text class="nt-s" x="66" y="144">↓ pollution, ↓ bruit → santé publ.</text>
        <text class="nt-t" x="30" y="172">2. Garnier : contre ≠ « tous à vélo »</text>
        <path class="nt-l" d="M44 182 L44 196 L60 196"/>
        <text class="nt-s" x="66" y="200">pb : qui n’a pas d’alternative ?</text>
        <rect class="nt-f" x="385" y="68" width="240" height="160" rx="10"/>
        <text class="nt-h" x="400" y="90">EXEMPLES · CHIFFRES</text>
        <text class="nt-s" x="400" y="116">• infirmière à 30 km,</text>
        <text class="nt-s" x="400" y="134">  service à minuit</text>
        <text class="nt-s" x="400" y="160">• commerces : −⅓ clients</text>
        <text class="nt-s" x="400" y="178">  en 1 an</text>
        <text class="nt-s" x="400" y="204">• « la rue ≠ parking »</text>
        <rect class="nt-f" x="15" y="238" width="250" height="80" rx="10"/>
        <text class="nt-h" x="30" y="260">ATTITUDE</text>
        <text class="nt-s" x="30" y="282">pour · contre · nuancé ·</text>
        <text class="nt-s" x="30" y="300">ironique · indigné · amusé</text>
        <rect class="nt-a" x="275" y="238" width="350" height="80" rx="10"/>
        <text class="nt-h" x="290" y="260">SYNTHÈSE (1 phrase, après)</text>
        <text class="nt-s" x="290" y="282">Accord sur le but (moins de pollution),</text>
        <text class="nt-s" x="290" y="300">désaccord sur la méthode et l’équité.</text>
      </svg>