<svg viewBox="0 0 640 330" role="img" aria-label="आगे क्या आता है? Determiner + noun, कोई नाम या stressed pronoun हो तो c'est। किसी ख़ास व्यक्ति या चीज़ के बारे में adjective, या अकेला पेशा हो तो il est या elle est। adjective के साथ आम टिप्पणी हो तो c'est।" xmlns="http://www.w3.org/2000/svg"><title>अगर article या नाम आता है, तो c’est चुनो। अगर अकेला adjective या पेशा उसका वर्णन करता है, तो il / elle est चुनो।</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .hdx { font: 800 15px var(--font); fill: var(--text); }
          .kc { fill: var(--accent-soft); } .ki { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .lab { font: 800 17px var(--font); fill: var(--accent-ink); }
          .lab2 { font: 800 17px var(--font); fill: var(--role-verb); }
          .row { font: 600 13px var(--font); fill: var(--text); }
          .rs2 { font: 500 12px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="hdx" x="320" y="26" text-anchor="middle">“est” के बाद वाले शब्द को देखो</text>
        <rect class="kc" x="20" y="44" width="295" height="270" rx="16"/>
        <rect class="ki" x="325" y="44" width="295" height="270" rx="16"/>
        <text class="lab" x="167" y="76" text-anchor="middle">C’EST / CE SONT</text>
        <text class="lab2" x="472" y="76" text-anchor="middle">IL EST / ELLE EST</text>
        <text class="row" x="40" y="112">+ un / le / mon … + noun</text>
        <text class="rs2" x="40" y="130">C’est un médecin. C’est mon frère.</text>
        <text class="row" x="40" y="166">+ कोई नाम या moi, toi, lui…</text>
        <text class="rs2" x="40" y="184">C’est Paul. C’est moi !</text>
        <text class="row" x="40" y="220">+ adjective, आम टिप्पणी</text>
        <text class="rs2" x="40" y="238">Paris ? C’est beau ! C’est facile.</text>
        <text class="row" x="40" y="274">बहुवचन noun → ce sont</text>
        <text class="rs2" x="40" y="292">Ce sont mes amis.</text>
        <text class="row" x="345" y="112">+ उसके/उनके बारे में adjective</text>
        <text class="rs2" x="345" y="130">Il est grand. Elle est gentille.</text>
        <text class="row" x="345" y="166">+ अकेला पेशा / राष्ट्रीयता</text>
        <text class="rs2" x="345" y="184">Il est médecin. Elle est indienne.</text>
        <text class="row" x="345" y="220">+ समय</text>
        <text class="rs2" x="345" y="238">Il est trois heures.</text>
        <text class="row" x="345" y="274">बहुवचन → ils / elles sont</text>
        <text class="rs2" x="345" y="292">Ils sont sympas.</text>
      </svg>