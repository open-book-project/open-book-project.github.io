<svg viewBox="0 0 640 300" role="img" aria-label="Gross से net तक: salaire brut 3000 यूरो, में से cotisations घटाने पर salaire net avant impôt लगभग 2340 यूरो, उसमें से prélèvement à la source घटाने पर net à payer लगभग 2220 यूरो, जो le compte courant में आते हैं" xmlns="http://www.w3.org/2000/svg"><title>Gross से net तक (एक उदाहरण — असली दरें अलग होती हैं)। जब कोई फ़्रेंच व्यक्ति अपनी सैलरी बताए, तो पूछो: brut ou net ?</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-m:#2563eb;--g-pl:#7c3aed;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .sl-1 { fill: var(--g-m); opacity: .85; }
       .sl-2 { fill: var(--g-m); opacity: .6; }
       .sl-3 { fill: var(--accent); opacity: .85; }
       .sl-x { fill: var(--g-pl); opacity: .35; }
       .sl-t { font: 700 14px var(--font); fill: var(--text); }
       .sl-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .sl-v { font: 800 14px var(--font); fill: var(--sheet); }
      </style>
     </defs>
     <text class="sl-t" x="10" y="28">le salaire brut</text>
     <rect class="sl-1" x="200" y="12" width="420" height="28" rx="6"/>
     <text class="sl-v" x="610" y="31" text-anchor="end">3 000 €</text>

     <text class="sl-s" x="10" y="78">− les cotisations sociales</text>
     <rect class="sl-x" x="528" y="62" width="92" height="24" rx="6"/>
     <text class="sl-s" x="520" y="79" text-anchor="end">≈ 22 % (retraite, santé, chômage)</text>

     <text class="sl-t" x="10" y="128">le net avant impôt</text>
     <rect class="sl-2" x="200" y="112" width="328" height="28" rx="6"/>
     <text class="sl-v" x="518" y="131" text-anchor="end">≈ 2 340 €</text>

     <text class="sl-s" x="10" y="178">− le prélèvement à la source</text>
     <rect class="sl-x" x="512" y="162" width="16" height="24" rx="4"/>
     <text class="sl-s" x="504" y="179" text-anchor="end">आयकर, हर महीने कटता है</text>

     <text class="sl-t" x="10" y="228">le net à payer</text>
     <rect class="sl-3" x="200" y="212" width="312" height="28" rx="6"/>
     <text class="sl-v" x="502" y="231" text-anchor="end">≈ 2 220 €</text>

     <text class="sl-s" x="200" y="275">→ virement से आपके compte courant में आता है</text>
    </svg>