<svg viewBox="0 0 640 330" role="img" aria-label="Pattern का नक़्शा। Singular के endings -s, -s, -t हैं, या pouvoir और vouloir के लिए -x, -x, -t। Nous और vous infinitive का stem इस्तेमाल करते हैं। Ils में अक्सर बदला हुआ stem आता है: viennent, peuvent, veulent, doivent, prennent, boivent। सिर्फ़ चार verbs -ont पर ख़त्म होते हैं: sont, ont, vont, font, और सिर्फ़ तीन vous रूप -ez पर ख़त्म नहीं होते: êtes, faites, dites।" xmlns="http://www.w3.org/2000/svg"><title>चार नियम लगभग हर irregular present को सँभाल लेते हैं। “मशहूर गिने-चुने रूप” को गीत की तरह रट लो: sont, ont, vont, font — êtes, faites, dites।</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .zone { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .zone2 { fill: var(--accent-soft); }
          .zh { font: 800 14px var(--font); fill: var(--text); }
          .zt { font: 600 13px var(--font); fill: var(--text-soft); }
          .ve { font: 700 13.5px var(--font); fill: var(--role-verb); }
        </style></defs>
        <rect class="zone2" x="20" y="20" width="290" height="140" rx="16"/>
        <text class="zh" x="40" y="48">1. Singular: -s, -s, -t</text>
        <text class="ve" x="40" y="74">je dors · tu dors · il dort</text>
        <text class="ve" x="40" y="96">je finis · tu finis · il finit</text>
        <text class="zt" x="40" y="122">pouvoir / vouloir: -x, -x, -t</text>
        <text class="zt" x="40" y="142">-dre verbs: il vend, il prend (t नहीं)</text>
        <rect class="zone" x="330" y="20" width="290" height="140" rx="16"/>
        <text class="zh" x="350" y="48">2. nous / vous: infinitive का stem</text>
        <text class="ve" x="350" y="74">venir → venons, venez</text>
        <text class="ve" x="350" y="96">devoir → devons, devez</text>
        <text class="ve" x="350" y="118">prendre → prenons, prenez</text>
        <text class="zt" x="350" y="142">ये infinitive जैसे दिखते हैं</text>
        <rect class="zone" x="20" y="176" width="290" height="140" rx="16"/>
        <text class="zh" x="40" y="204">3. ils: अक्सर मज़बूत stem</text>
        <text class="ve" x="40" y="230">viennent · prennent</text>
        <text class="ve" x="40" y="252">peuvent · veulent · doivent</text>
        <text class="zt" x="40" y="278">nous/vous से अलग तीसरा stem,</text>
        <text class="zt" x="40" y="298">जिसमें सुनाई देने वाला consonant है</text>
        <rect class="zone2" x="330" y="176" width="290" height="140" rx="16"/>
        <text class="zh" x="350" y="204">4. मशहूर गिने-चुने रूप</text>
        <text class="zt" x="350" y="230">सिर्फ़ 4 verbs -ont पर ख़त्म होते हैं:</text>
        <text class="ve" x="350" y="252">sont · ont · vont · font</text>
        <text class="zt" x="350" y="278">सिर्फ़ 3 vous रूप -ez के बिना हैं:</text>
        <text class="ve" x="350" y="300">êtes · faites · dites</text>
      </svg>