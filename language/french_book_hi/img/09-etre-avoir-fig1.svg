<svg viewBox="0 0 640 250" role="img" aria-label="ils sont का उच्चारण s की आवाज़ के साथ eel son है; ils ont का उच्चारण liaison की वजह से z की आवाज़ के साथ eel zon है। सिर्फ़ एक आवाज़ “वे हैं” और “उनके पास है” को अलग करती है।" xmlns="http://www.w3.org/2000/svg"><title>शुरुआती फ़्रेंच की सबसे ज़रूरी minimal pair: s = être, z = avoir।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line:#e3e7ef;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-faint:#6b7385;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .w1 { font: 800 30px var(--font); fill: var(--text); }
          .sv { font: 800 30px var(--font); fill: var(--role-verb); }
          .ph { font: 700 18px ui-monospace, Menlo, Consolas, monospace; }
          .ss { fill: var(--g-m); } .zz { fill: var(--g-f); }
          .cap { font: 600 13px var(--font); fill: var(--text-soft); }
          .pan { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1.5; }
          .arc2 { stroke: var(--accent); stroke-width: 3; fill: none; }
          .gap { stroke: var(--text-faint); stroke-width: 2; fill: none; stroke-dasharray: 3 4; }
        </style></defs>
        <rect class="pan" x="20" y="20" width="290" height="190" rx="18"/>
        <rect class="pan" x="330" y="20" width="290" height="190" rx="18"/>
        <text class="cap" x="165" y="48" text-anchor="middle">वे हैं</text>
        <text class="cap" x="475" y="48" text-anchor="middle">उनके पास है</text>
        <text class="w1" x="70" y="110">ils</text><text class="sv" x="140" y="110">sont</text>
        <path class="gap" d="M118 120 V140"/>
        <text class="w1" x="390" y="110">ils</text><text class="sv" x="458" y="110">ont</text>
        <path class="arc2" d="M432 118 Q445 140 458 118"/>
        <text class="ph" x="165" y="168" text-anchor="middle">[eel <tspan class="ss">S</tspan>Õ]</text>
        <text class="ph" x="475" y="168" text-anchor="middle">[eel-<tspan class="zz">Z</tspan>Õ]</text>
        <text class="cap" x="165" y="195" text-anchor="middle">फुफकारता s — जोड़ नहीं</text>
        <text class="cap" x="475" y="195" text-anchor="middle">भनभनाता z — liaison</text>
        <text class="cap" x="320" y="238" text-anchor="middle">एक आवाज़ मतलब बदल देती है। अभ्यास: ils sont / ils ont · elles sont / elles ont।</text>
      </svg>