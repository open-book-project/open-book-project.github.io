<svg viewBox="0 0 640 320" role="img" aria-label="किताब के सात पार्ट का रोड मैप: A1 पर Commencer से B2 पर Maîtriser और C2 के झंडे तक।" xmlns="http://www.w3.org/2000/svg"><title>किताब का रास्ता। पार्ट 1–4 बुनियाद बनाते हैं; पार्ट 5–7 शब्द, लेखन और निखार जोड़ते हैं। हर स्टॉप पर उसकी CEFR रेंज और चैप्टरों की संख्या दी है।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-pl:#7c3aed;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .road { fill: none; stroke: var(--line-strong); stroke-width: 10; stroke-linecap: round; }
        .stop { fill: var(--accent); }
        .stop2 { fill: var(--g-pl); }
        .num { font: 800 14px var(--font); fill: var(--sheet); }
        .nm { font: 700 14px var(--font); fill: var(--text); }
        .lv { font: 600 12px var(--font); fill: var(--text-soft); }
        .fl { fill: var(--g-f); }
        .pole { fill: var(--text-soft); }
      </style></defs>
      <path class="road" d="M40 95 H560 A80 80 0 0 1 560 255 H70"/>
      <circle class="stop" cx="70" cy="95" r="17"/><text class="num" x="70" y="100" text-anchor="middle">1</text>
      <text class="nm" x="70" y="62" text-anchor="middle">Commencer</text><text class="lv" x="70" y="132" text-anchor="middle">A1 · 6 अध्याय</text>
      <circle class="stop" cx="215" cy="95" r="17"/><text class="num" x="215" y="100" text-anchor="middle">2</text>
      <text class="nm" x="215" y="62" text-anchor="middle">Les bases</text><text class="lv" x="215" y="132" text-anchor="middle">A1–A2 · 10 अध्याय</text>
      <circle class="stop" cx="360" cy="95" r="17"/><text class="num" x="360" y="100" text-anchor="middle">3</text>
      <text class="nm" x="360" y="62" text-anchor="middle">Construire</text><text class="lv" x="360" y="132" text-anchor="middle">A2–C1 · 14 अध्याय</text>
      <circle class="stop" cx="505" cy="95" r="17"/><text class="num" x="505" y="100" text-anchor="middle">4</text>
      <text class="nm" x="505" y="62" text-anchor="middle">Parler</text><text class="lv" x="505" y="132" text-anchor="middle">A2–C1 · 7 अध्याय</text>
      <circle class="stop2" cx="505" cy="255" r="17"/><text class="num" x="505" y="260" text-anchor="middle">5</text>
      <text class="nm" x="505" y="222" text-anchor="middle">Vocabulaire</text><text class="lv" x="505" y="292" text-anchor="middle">A1–C2 · 7 अध्याय</text>
      <circle class="stop2" cx="360" cy="255" r="17"/><text class="num" x="360" y="260" text-anchor="middle">6</text>
      <text class="nm" x="360" y="222" text-anchor="middle">Écrire</text><text class="lv" x="360" y="292" text-anchor="middle">A2–C1 · 3 अध्याय</text>
      <circle class="stop2" cx="215" cy="255" r="17"/><text class="num" x="215" y="260" text-anchor="middle">7</text>
      <text class="nm" x="215" y="222" text-anchor="middle">Maîtriser</text><text class="lv" x="215" y="292" text-anchor="middle">B2–C2 · 4 अध्याय</text>
      <rect class="pole" x="68" y="205" width="4" height="50"/>
      <polygon class="fl" points="72,205 112,217 72,229"/>
      <text class="nm" x="70" y="292" text-anchor="middle">C2</text>
    </svg>