<svg viewBox="0 0 640 230" role="img" aria-label="quatre-vingt-dix-sept कैसे बनता है: चार गुना बीस, जमा दस, जमा सात, बराबर सत्तानवे। नीचे, पाँच जोड़ियों में लिखा एक French फ़ोन नंबर: zéro six, soixante-dix-huit, quatre-vingt-douze, quinze, trente-trois।" xmlns="http://www.w3.org/2000/svg"><title>लिखने से पहले पूरे समूह का इंतज़ार करो। फ़ोन नंबर में हर जोड़ी 00 से 99 के बीच की एक संख्या है।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
