<svg viewBox="0 0 640 360" role="img" aria-label="एक सड़क का नक़्शा। Vous êtes ici से सीधे ट्रैफ़िक लाइट तक जाओ, दाएँ मुड़ो, फिर दाईं ओर की दूसरी सड़क लो। फ़ार्मेसी आपके बाईं ओर, डाकघर के सामने है।" xmlns="http://www.w3.org/2000/svg"><title>लाइन का पीछा करो: ① tout droit jusqu’au feu , ② tournez à droite , ③ prenez la deuxième rue à droite — फ़ार्मेसी वहीं है।</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-m:#2563eb;--good:#15803d;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .mp-blk { fill: var(--canvas); stroke: var(--line); stroke-width: 1.5; }
          .mp-rt { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
          .mp-t { font: 700 13px var(--font); fill: var(--text); }
          .mp-s { font: 600 11.5px var(--font); fill: var(--text-soft); }
          .mp-cue { font: 800 13px var(--font); fill: var(--accent-ink); }
          .mp-goal { fill: var(--good); }
          .mp-cross { fill: var(--sheet); }
          .mp-me { fill: var(--g-m); }
          .mp-light { fill: var(--warn); }
        </style></defs>
        <rect class="mp-blk" x="20" y="20" width="150" height="90" rx="6"/>
        <rect class="mp-blk" x="220" y="20" width="150" height="90" rx="6"/>
        <rect class="mp-blk" x="420" y="20" width="90" height="90" rx="6"/>
        <rect class="mp-blk" x="560" y="20" width="62" height="90" rx="6"/>
        <rect class="mp-blk" x="20" y="160" width="150" height="80" rx="6"/>
        <rect class="mp-blk" x="220" y="160" width="150" height="80" rx="6"/>
        <rect class="mp-blk" x="420" y="160" width="90" height="80" rx="6"/>
        <rect class="mp-blk" x="560" y="160" width="62" height="80" rx="6"/>
        <rect class="mp-blk" x="20" y="290" width="150" height="60" rx="6"/>
        <rect class="mp-blk" x="220" y="290" width="150" height="60" rx="6"/>
        <rect class="mp-blk" x="420" y="290" width="90" height="60" rx="6"/>
        <rect class="mp-blk" x="560" y="290" width="62" height="60" rx="6"/>
        <path class="mp-rt" d="M195 340 L195 135 L535 135 L535 200"/>
        <circle class="mp-me" cx="195" cy="342" r="9"/>
        <text class="mp-t" x="165" y="330" text-anchor="end">Vous êtes</text>
        <text class="mp-t" x="165" y="345" text-anchor="end">ici →</text>
        <circle class="mp-light" cx="195" cy="135" r="9"/>
        <text class="mp-cue" x="30" y="192">① tout droit</text>
        <text class="mp-cue" x="30" y="210">jusqu’au feu</text>
        <text class="mp-s" x="30" y="228">(passez le carrefour)</text>
        <text class="mp-cue" x="232" y="62">② au feu,</text>
        <text class="mp-cue" x="232" y="80">tournez à droite →</text>
        <text class="mp-s" x="400" y="154">1re</text>
        <text class="mp-s" x="541" y="154">2e</text>
        <text class="mp-cue" x="232" y="316">③ la 2e à droite :</text>
        <text class="mp-cue" x="232" y="334">c’est sur votre gauche</text>
        <text class="mp-t" x="295" y="205" text-anchor="middle">le café</text>
        <text class="mp-t" x="465" y="196" text-anchor="middle">la</text>
        <text class="mp-t" x="465" y="212" text-anchor="middle">poste</text>
        <rect class="mp-goal" x="577" y="172" width="28" height="28" rx="5"/>
        <rect class="mp-cross" x="588" y="177" width="6" height="18"/>
        <rect class="mp-cross" x="582" y="183" width="18" height="6"/>
        <text class="mp-s" x="591" y="222" text-anchor="middle">pharmacie</text>
      </svg>