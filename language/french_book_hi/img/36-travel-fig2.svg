<svg viewBox="0 0 640 230" role="img" aria-label="फ़्रांस में आपातकालीन नंबर: पूरे यूरोप में किसी भी आपातकाल के लिए 112, चिकित्सा आपातकाल के लिए 15 SAMU, पुलिस के लिए 17, आग और बचाव के लिए 18 pompiers, और बोल या सुन न पाने वालों के लिए टेक्स्ट संदेश से 114।" xmlns="http://www.w3.org/2000/svg"><title>अगर आपको सिर्फ़ एक नंबर याद रहे, तो 112 याद रखो: यह EU में हर जगह, किसी भी फ़ोन से काम करता है।</title><style>svg{--accent:#ea580c;--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-m:#2563eb;--g-pl:#7c3aed;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .em-c { fill: var(--sheet); stroke-width: 3; }
          .em-n { font: 800 34px var(--font); }
          .em-t { font: 700 13px var(--font); fill: var(--text); }
          .em-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
        </style></defs>
        <g transform="translate(10 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--accent)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--accent)">112</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">हर आपातकाल</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">पूरे यूरोप में</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">अंग्रेज़ी अक्सर</text>
          <text class="em-s" x="58" y="152" text-anchor="middle">उपलब्ध</text>
        </g>
        <g transform="translate(136 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--bad)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--bad)">15</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">SAMU</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">चिकित्सा</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">आपातकाल,</text>
          <text class="em-s" x="58" y="152" text-anchor="middle">एम्बुलेंस</text>
        </g>
        <g transform="translate(262 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--g-m)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--g-m)">17</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">Police</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">अपराध, हमला,</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">ख़तरा</text>
        </g>
        <g transform="translate(388 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--warn)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--warn)">18</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">Pompiers</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">आग, दुर्घटना, बचाव</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">प्राथमिक उपचार</text>
          <text class="em-s" x="58" y="152" text-anchor="middle">भी देते हैं</text>
        </g>
        <g transform="translate(514 14)">
          <rect class="em-c" x="0" y="0" width="116" height="200" rx="14" style="stroke: var(--g-pl)"/>
          <text class="em-n" x="58" y="60" text-anchor="middle" style="fill: var(--g-pl)">114</text>
          <text class="em-t" x="58" y="96" text-anchor="middle">टेक्स्ट / ऐप से</text>
          <text class="em-s" x="58" y="118" text-anchor="middle">अगर आप बोल या</text>
          <text class="em-s" x="58" y="136" text-anchor="middle">सुन नहीं सकते</text>
        </g>
      </svg>