<svg viewBox="0 0 640 345" role="img" aria-label="निर्णय का chart: हाँ/नहीं वाला सवाल dialectical plan तक ले जाता है, समस्या वाला सवाल problem-causes-solutions तक, और पहलुओं वाला सवाल thematic plan तक" xmlns="http://www.w3.org/2000/svg"><title>सवाल को plan चुनने दो।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.pf-top { fill: var(--canvas); stroke: var(--line-strong); stroke-width: 2; }
.pf-q { fill: var(--sheet); stroke: var(--g-m); stroke-width: 2; }
.pf-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.pf-t { font: 600 12.5px var(--font); fill: var(--text); }
.pf-b { font: 800 13px var(--font); fill: var(--text); }
.pf-s { font: 500 12px var(--font); fill: var(--text-soft); }
.pf-arr { fill: none; stroke: var(--text-soft); stroke-width: 2; }
</style>
</defs>
<rect class="pf-top" x="150" y="12" width="340" height="50" rx="12"/>
<text class="pf-b" x="320" y="35" text-anchor="middle">विषय पढ़ो।</text>
<text class="pf-s" x="320" y="52" text-anchor="middle">यह किस तरह का सवाल है?</text>
<path class="pf-arr" d="M260 62 L112 104 M320 62 L320 104 M380 62 L528 104"/>
<path class="pf-arr" d="M120 95.5 L112 104 L123.2 107.1 M314 96 L320 106 L326 96 M520 95.5 L528 104 L516.8 107.1"/>

<rect class="pf-q" x="12" y="108" width="200" height="60" rx="10"/>
<text class="pf-t" x="112" y="133" text-anchor="middle">Faut-il… ? Peut-on… ?</text>
<text class="pf-s" x="112" y="152" text-anchor="middle">हाँ / नहीं वाली बहस</text>
<rect class="pf-q" x="220" y="108" width="200" height="60" rx="10"/>
<text class="pf-t" x="320" y="133" text-anchor="middle">Comment lutter contre… ?</text>
<text class="pf-s" x="320" y="152" text-anchor="middle">हल करने वाली समस्या</text>
<rect class="pf-q" x="428" y="108" width="200" height="60" rx="10"/>
<text class="pf-t" x="528" y="133" text-anchor="middle">Quels sont les effets… ?</text>
<text class="pf-s" x="528" y="152" text-anchor="middle">कई पहलू</text>

<path class="pf-arr" d="M112 168 L112 205 M106 197 L112 207 L118 197 M320 168 L320 205 M314 197 L320 207 L326 197 M528 168 L528 205 M522 197 L528 207 L534 197"/>

<rect class="pf-a" x="12" y="210" width="200" height="74" rx="10"/>
<text class="pf-b" x="112" y="236" text-anchor="middle">Plan dialectique</text>
<text class="pf-s" x="112" y="256" text-anchor="middle">thèse · antithèse</text>
<text class="pf-s" x="112" y="273" text-anchor="middle">· synthèse</text>
<rect class="pf-a" x="220" y="210" width="200" height="74" rx="10"/>
<text class="pf-b" x="320" y="236" text-anchor="middle">Problème → solutions</text>
<text class="pf-s" x="320" y="256" text-anchor="middle">constat · causes</text>
<text class="pf-s" x="320" y="273" text-anchor="middle">· solutions</text>
<rect class="pf-a" x="428" y="210" width="200" height="74" rx="10"/>
<text class="pf-b" x="528" y="236" text-anchor="middle">Plan thématique</text>
<text class="pf-s" x="528" y="256" text-anchor="middle">पहलू 1 · पहलू 2</text>
<text class="pf-s" x="528" y="273" text-anchor="middle">· पहलू 3</text>

<text class="pf-s" x="320" y="320" text-anchor="middle">निश्चित नहीं हैं? Dialectical plan ज़्यादातर B2 विषयों पर फ़िट होता है।</text>
</svg>