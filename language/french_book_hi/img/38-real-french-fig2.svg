<svg viewBox="0 0 640 230" role="img" aria-label="घटाव की सीढ़ी: जैसे-जैसे बोलचाल ढीली होती जाती है, Je ne sais pas बनता है Je sais pas, फिर J'sais pas, फिर Chais pas।" xmlns="http://www.w3.org/2000/svg"><title>हर क़दम पर कोई ध्वनि गिरती है या मिल जाती है। अर्थ कभी नहीं बदलता — सिर्फ़ माहौल बदलता है।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .cl-b { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
          .cl-t { font: 800 17px var(--font); fill: var(--text); }
          .cl-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .cl-a { fill: none; stroke: var(--accent); stroke-width: 2.5; }
          .cl-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
        </style></defs>
        <text class="cl-h" x="10" y="20">एक वाक्य, चार रफ़्तारें</text>
        <rect class="cl-b" x="10" y="40" width="190" height="56" rx="12"/>
        <text class="cl-t" x="105" y="66" text-anchor="middle">Je ne sais pas</text>
        <text class="cl-s" x="105" y="86" text-anchor="middle">लिखित · सावधानी से</text>
        <path class="cl-a" d="M200 82 Q215 100 222 108"/>
        <rect class="cl-b" x="150" y="108" width="170" height="56" rx="12"/>
        <text class="cl-t" x="235" y="134" text-anchor="middle">Je sais pas</text>
        <text class="cl-s" x="235" y="154" text-anchor="middle">सामान्य बोलचाल: ne नहीं</text>
        <path class="cl-a" d="M320 118 Q340 100 350 88"/>
        <rect class="cl-b" x="300" y="40" width="160" height="56" rx="12"/>
        <text class="cl-t" x="380" y="66" text-anchor="middle">J’sais pas</text>
        <text class="cl-s" x="380" y="86" text-anchor="middle">तेज़: je का e गिरा</text>
        <path class="cl-a" d="M460 82 Q475 100 482 108"/>
        <rect class="cl-b" x="430" y="108" width="200" height="56" rx="12" style="fill: var(--accent-soft)"/>
        <text class="cl-t" x="530" y="134" text-anchor="middle">Chais pas</text>
        <text class="cl-s" x="530" y="154" text-anchor="middle">ढीला: j + s मिलकर “ch”</text>
        <text class="cl-s" x="10" y="200">“je suis” → “j’suis” → “chuis” भी ऐसे ही। चारों समझो; पहले दो बोलो, बाक़ी अपने आप आ जाएँगे।</text>
      </svg>