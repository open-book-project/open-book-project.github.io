<svg viewBox="0 0 640 330" role="img" aria-label="क्षैतिज बार चार्ट: किताब के हर Part के हिसाब से टेस्ट के सवाल। Commencer 5, Les bases 10, Construire 12, Parler 4, Vocabulaire 5, Écrire 3, Maîtriser 1।" xmlns="http://www.w3.org/2000/svg"><title>हर बार किताब का एक Part है। कई सवाल एक साथ दो चैप्टर परखते हैं (जैसे Q23 subjunctive और linking words दोनों परखता है), इसलिए हर चैप्टर कवर होता है।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .pt { font: 700 14px var(--font); fill: var(--text); }
          .pe { font: 500 11px var(--font); fill: var(--text-soft); }
          .bar { fill: var(--accent); }
          .bar2 { fill: var(--accent); opacity: .6; }
          .num { font: 700 13px var(--font); fill: var(--text); }
          .ax { stroke: var(--line); stroke-width: 2; fill: none; }
          .ttl { font: 700 13px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="ttl" x="20" y="22">हर Part में सवाल (कुल 40)</text>
        <path class="ax" d="M178 34 L178 318"/>
        <text class="pt" x="20" y="60">Commencer</text><text class="pe" x="20" y="74">शुरुआत</text>
        <rect class="bar" x="180" y="48" width="140" height="24" rx="5"/><text class="num" x="328" y="65">5 · Q1–5</text>
        <text class="pt" x="20" y="100">Les bases</text><text class="pe" x="20" y="114">बुनियाद</text>
        <rect class="bar2" x="180" y="88" width="280" height="24" rx="5"/><text class="num" x="468" y="105">10 · Q6–15</text>
        <text class="pt" x="20" y="140">Construire</text><text class="pe" x="20" y="154">वाक्य बनाना</text>
        <rect class="bar" x="180" y="128" width="336" height="24" rx="5"/><text class="num" x="524" y="145">12 · Q16–27</text>
        <text class="pt" x="20" y="180">Parler</text><text class="pe" x="20" y="194">बोलना सीखो</text>
        <rect class="bar2" x="180" y="168" width="112" height="24" rx="5"/><text class="num" x="300" y="185">4 · Q28–31</text>
        <text class="pt" x="20" y="220">Vocabulaire</text><text class="pe" x="20" y="234">शब्दावली</text>
        <rect class="bar" x="180" y="208" width="140" height="24" rx="5"/><text class="num" x="328" y="225">5 · Q32–36</text>
        <text class="pt" x="20" y="260">Écrire</text><text class="pe" x="20" y="274">लिखना सीखो</text>
        <rect class="bar2" x="180" y="248" width="84" height="24" rx="5"/><text class="num" x="272" y="265">3 · Q37–39</text>
        <text class="pt" x="20" y="300">Maîtriser</text><text class="pe" x="20" y="314">महारत</text>
        <rect class="bar" x="180" y="288" width="28" height="24" rx="5"/><text class="num" x="216" y="305">1 · Q40 (+ हर जगह ग़लतियाँ)</text>
      </svg>