<svg viewBox="0 0 640 260" role="img" aria-label="दो पंक्तियाँ। पहली पंक्ति: je n'ai pas, jamais, rien, plus, फिर vu: negative शब्द सहायक verb और participle के बीच बैठता है। दूसरी पंक्ति: je n'ai vu, फिर personne, aucun, que, nulle part: ये participle के बाद आते हैं।" xmlns="http://www.w3.org/2000/svg"><title>Rien participle से पहले जाता है, personne उसके बाद। एक मशहूर जोड़ी जो साथ सीखनी चाहिए: je n’ai rien vu / je n’ai vu personne.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .bb { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .bn { fill: var(--g-f); }
          .bv { fill: var(--role-verb); }
          .tw { font: 800 16px var(--font); fill: var(--sheet); }
          .tk { font: 800 16px var(--font); fill: var(--text); }
          .cp { font: 600 13px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="cp" x="20" y="26">ज़्यादातर शब्द: सहायक verb और participle के बीच</text>
        <rect class="bb" x="20" y="38" width="64" height="44" rx="10"/><text class="tk" x="52" y="66" text-anchor="middle">je</text>
        <rect class="bn" x="92" y="38" width="54" height="44" rx="10"/><text class="tw" x="119" y="66" text-anchor="middle">n’</text>
        <rect class="bv" x="154" y="38" width="64" height="44" rx="10"/><text class="tw" x="186" y="66" text-anchor="middle">ai</text>
        <rect class="bn" x="226" y="38" width="250" height="44" rx="10"/><text class="tw" x="351" y="66" text-anchor="middle">pas · jamais · rien · plus</text>
        <rect class="bv" x="484" y="38" width="72" height="44" rx="10"/><text class="tw" x="520" y="66" text-anchor="middle">vu</text>
        <text class="cp" x="20" y="108">je n’ai rien vu = कुछ नहीं देखा · je n’ai jamais vu la mer = कभी समुद्र नहीं देखा</text>
        <text class="cp" x="20" y="150">ये चार: participle के बाद</text>
        <rect class="bb" x="20" y="162" width="64" height="44" rx="10"/><text class="tk" x="52" y="190" text-anchor="middle">je</text>
        <rect class="bn" x="92" y="162" width="54" height="44" rx="10"/><text class="tw" x="119" y="190" text-anchor="middle">n’</text>
        <rect class="bv" x="154" y="162" width="64" height="44" rx="10"/><text class="tw" x="186" y="190" text-anchor="middle">ai</text>
        <rect class="bv" x="226" y="162" width="72" height="44" rx="10"/><text class="tw" x="262" y="190" text-anchor="middle">vu</text>
        <rect class="bn" x="306" y="162" width="314" height="44" rx="10"/><text class="tw" x="463" y="190" text-anchor="middle">personne · aucun · que · nulle part</text>
        <text class="cp" x="20" y="232">je n’ai vu personne = किसी को नहीं देखा · je n’ai trouvé aucune solution</text>
      </svg>