<svg viewBox="0 0 640 260" role="img" aria-label="किसी जगह “में” या “को” कहने का निर्णय-पथ। शहर: à। देश: क्या बहुवचन है? aux। स्त्रीलिंग है, या vowel से शुरू होता है? en। वरना पुल्लिंग: au।" xmlns="http://www.w3.org/2000/svg"><title>तीन सवाल preposition चुन देते हैं। “से” के लिए बदल दो: à → de, en → de / d’, au → du, aux → des।</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line-strong:#cfd6e2;--role-prep:#ea580c;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .dq { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .dt { font: 700 13.5px var(--font); fill: var(--text); }
          .da { fill: var(--accent-soft); }
          .dw { font: 800 18px var(--font); fill: var(--role-prep); }
          .dx { font: 500 12px var(--font); fill: var(--text-soft); }
          .dl { stroke: var(--text-soft); stroke-width: 2; fill: none; }
          .dy { font: 800 11.5px var(--font); fill: var(--good); }
        </style></defs>
        <rect class="dq" x="20" y="20" width="180" height="44" rx="12"/><text class="dt" x="110" y="47" text-anchor="middle">क्या शहर है?</text>
        <path class="dl" d="M200 42 H250"/><text class="dy" x="225" y="36" text-anchor="middle">हाँ</text>
        <rect class="da" x="250" y="20" width="370" height="44" rx="12"/><text class="dw" x="270" y="49">à</text><text class="dx" x="300" y="47">à Paris · à Delhi · à Londres</text>
        <path class="dl" d="M110 64 V84"/>
        <rect class="dq" x="20" y="84" width="180" height="44" rx="12"/><text class="dt" x="110" y="111" text-anchor="middle">क्या बहुवचन देश है?</text>
        <path class="dl" d="M200 106 H250"/><text class="dy" x="225" y="100" text-anchor="middle">हाँ</text>
        <rect class="da" x="250" y="84" width="370" height="44" rx="12"/><text class="dw" x="270" y="113">aux</text><text class="dx" x="316" y="111">aux États-Unis · aux Philippines</text>
        <path class="dl" d="M110 128 V148"/>
        <rect class="dq" x="20" y="148" width="180" height="44" rx="12"/><text class="dt" x="110" y="168" text-anchor="middle">स्त्रीलिंग है, या vowel से</text><text class="dt" x="110" y="184" text-anchor="middle">शुरू होता है?</text>
        <path class="dl" d="M200 170 H250"/><text class="dy" x="225" y="164" text-anchor="middle">हाँ</text>
        <rect class="da" x="250" y="148" width="370" height="44" rx="12"/><text class="dw" x="270" y="177">en</text><text class="dx" x="306" y="175">en France · en Inde · en Iran</text>
        <path class="dl" d="M110 192 V212"/>
        <rect class="da" x="20" y="212" width="600" height="44" rx="12"/><text class="dw" x="40" y="241">au</text><text class="dx" x="80" y="239">पुल्लिंग देश: au Japon · au Canada · au Portugal · au Mexique</text>
      </svg>