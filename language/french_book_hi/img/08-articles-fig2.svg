<svg viewBox="0 0 640 400" role="img" aria-label="डिसीज़न ट्री। क्या वाक्य नकारात्मक है या मात्रा बताता है? तो de। क्या यह कोई ख़ास चीज़ है या आम तौर पर कोई चीज़? तो le, la, les। क्या आप उसे गिन सकते हैं? तो un, une, des। वरना du, de la, de l'।" xmlns="http://www.w3.org/2000/svg"><title>तीन सवाल, चार जवाब। अभ्यास के साथ आप पल भर में चुन लेंगे।</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line-strong:#cfd6e2;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .q { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .qt { font: 700 13px var(--font); fill: var(--text); }
          .an { fill: var(--accent-soft); }
          .at { font: 800 15px var(--font); fill: var(--accent-ink); }
          .ex2 { font: 500 12px var(--font); fill: var(--text-soft); }
          .yes { font: 800 12px var(--font); fill: var(--good); }
          .nn { font: 800 12px var(--font); fill: var(--text-soft); }
          .ed { stroke: var(--text-soft); stroke-width: 2; fill: none; }
        </style></defs>
        <rect class="q" x="20" y="20" width="270" height="52" rx="12"/>
        <text class="qt" x="155" y="42" text-anchor="middle">1. नकारात्मक (pas, jamais…) या</text>
        <text class="qt" x="155" y="60" text-anchor="middle">मात्रा (beaucoup, kilo…)?</text>
        <path class="ed" d="M290 46 H380"/><text class="yes" x="335" y="40" text-anchor="middle">हाँ</text>
        <rect class="an" x="380" y="22" width="240" height="48" rx="12"/>
        <text class="at" x="400" y="44">de / d’</text><text class="ex2" x="400" y="61">pas de café · beaucoup de café</text>
        <path class="ed" d="M155 72 V112"/><text class="nn" x="170" y="96">नहीं</text>
        <rect class="q" x="20" y="112" width="270" height="52" rx="12"/>
        <text class="qt" x="155" y="134" text-anchor="middle">2. कोई ख़ास चीज़, या आम तौर पर</text>
        <text class="qt" x="155" y="152" text-anchor="middle">कोई चीज़ (पसंद, तथ्य)?</text>
        <path class="ed" d="M290 138 H380"/><text class="yes" x="335" y="132" text-anchor="middle">हाँ</text>
        <rect class="an" x="380" y="114" width="240" height="48" rx="12"/>
        <text class="at" x="400" y="136">le / la / l’ / les</text><text class="ex2" x="400" y="153">j’aime le café · le café est chaud</text>
        <path class="ed" d="M155 164 V204"/><text class="nn" x="170" y="188">नहीं</text>
        <rect class="q" x="20" y="204" width="270" height="52" rx="12"/>
        <text class="qt" x="155" y="226" text-anchor="middle">3. क्या आप उसे गिन सकते हैं?</text>
        <text class="qt" x="155" y="244" text-anchor="middle">(एक कप, दो सेब…)</text>
        <path class="ed" d="M290 230 H380"/><text class="yes" x="335" y="224" text-anchor="middle">हाँ</text>
        <rect class="an" x="380" y="206" width="240" height="48" rx="12"/>
        <text class="at" x="400" y="228">un / une / des</text><text class="ex2" x="400" y="245">un café · des pommes</text>
        <path class="ed" d="M155 256 V296"/><text class="nn" x="170" y="280">नहीं</text>
        <rect class="an" x="20" y="296" width="270" height="52" rx="12"/>
        <text class="at" x="40" y="318">du / de la / de l’</text>
        <text class="ex2" x="40" y="337">du café · de la soupe · de l’eau</text>
        <text class="ex2" x="320" y="390" text-anchor="middle">अपवाद: निषेध के बाद le/la/les रहते हैं; être + un/une रहते हैं (ce n’est pas un problème)।</text>
      </svg>