<svg viewBox="0 0 640 300" role="img" aria-label="बीच में “अभी” वाली समय-रेखा। il y a बीते हुए किसी क्षण की ओर इशारा करता है: पहले। depuis बीते समय से अब तक का तीर है, जो अब भी जारी है: से या तक। dans आगे के किसी क्षण की ओर इशारा करता है: अब से इतने समय बाद। pendant अवधि का एक बंद खंड है: के दौरान। en एक खंड है जिस पर फ़िनिश-झंडा है: कुछ पूरा करने में लगा समय।" xmlns="http://www.w3.org/2000/svg"><title>पाँच छोटे शब्द, समय के पाँच आकार। depuis और dans दोनों “अभी” को देखते हैं; pendant और en एक खंड नापते हैं।</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--role-prep:#ea580c;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .axis { stroke: var(--text-soft); stroke-width: 2.5; fill: none; }
          .now { fill: var(--accent); }
          .nowt { font: 800 13px var(--font); fill: var(--accent-ink); }
          .tk2 { font: 800 15px var(--font); fill: var(--role-prep); }
          .tx { font: 500 12px var(--font); fill: var(--text-soft); }
          .past { stroke: var(--g-m); stroke-width: 3; fill: none; }
          .futr { stroke: var(--g-f); stroke-width: 3; fill: none; }
          .dur { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
          .dotm { fill: var(--g-m); } .dotf { fill: var(--g-f); }
        </style></defs>
        <path class="axis" d="M20 150 H620"/>
        <circle class="now" cx="320" cy="150" r="9"/>
        <text class="nowt" x="320" y="178" text-anchor="middle">अभी</text>
        <circle class="dotm" cx="120" cy="150" r="7"/>
        <path class="past" d="M310 120 Q215 88 128 138"/>
        <text class="tk2" x="215" y="76" text-anchor="middle">il y a</text>
        <text class="tx" x="215" y="94" text-anchor="middle">पहले (ago) · il y a deux ans</text>
        <path class="past" d="M130 208 H306 M296 200 L306 208 L296 216"/>
        <text class="tk2" x="218" y="236" text-anchor="middle">depuis</text>
        <text class="tx" x="218" y="254" text-anchor="middle">से / तक — अब भी जारी</text>
        <text class="tx" x="218" y="270" text-anchor="middle">j’habite ici depuis 2020</text>
        <circle class="dotf" cx="520" cy="150" r="7"/>
        <path class="futr" d="M330 120 Q425 88 512 138"/>
        <text class="tk2" x="425" y="76" text-anchor="middle">dans</text>
        <text class="tx" x="425" y="94" text-anchor="middle">अब से (in) · dans dix minutes</text>
        <rect class="dur" x="360" y="198" width="120" height="20" rx="10"/>
        <text class="tk2" x="420" y="240" text-anchor="middle">pendant</text>
        <text class="tx" x="420" y="256" text-anchor="middle">के दौरान — एक खंड</text>
        <rect class="dur" x="500" y="198" width="100" height="20" rx="10"/>
        <path class="futr" d="M600 208 V182"/><rect class="dotf" x="600" y="182" width="14" height="9"/>
        <text class="tk2" x="550" y="240" text-anchor="middle">en</text>
        <text class="tx" x="550" y="256" text-anchor="middle">लगा समय</text>
        <text class="tx" x="550" y="272" text-anchor="middle">en une heure</text>
        <text class="tx" x="320" y="26" text-anchor="middle">बीते का बिंदु · अब तक की रेखा · आगे का बिंदु · एक खंड · पूरा होने तक का खंड</text>
      </svg>