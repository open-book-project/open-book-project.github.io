<svg viewBox="0 0 640 330" role="img" aria-label="फ़्रेंच 70, 80, 90 और 97 कैसे बनाती है। 70 यानी 60 जमा 10, soixante-dix। 80 यानी चार गुणा 20, quatre-vingts। 90 यानी चार गुणा 20 जमा 10, quatre-vingt-dix। 97 यानी चार गुणा 20 जमा 17, quatre-vingt-dix-sept। बेल्जियम और स्विट्ज़रलैंड में septante और nonante बोलते हैं।" xmlns="http://www.w3.org/2000/svg"><title>नीला = 60, नारंगी = 20, गुलाबी = जो आप जोड़ते हैं। ब्लॉकों को देखते हुए फ़्रेंच बोलो: “चार-बीस-दस-सात” = 97।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line:#e3e7ef;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .big { font: 800 26px var(--font); fill: var(--text); }
        .b60 { fill: var(--g-m); }
        .b20 { fill: var(--accent); }
        .b10 { fill: var(--g-f); }
        .bt { font: 800 13px var(--font); fill: var(--sheet); }
        .fw { font: 800 15px var(--font); fill: var(--text); }
        .fs { font: 500 12px var(--font); fill: var(--text-soft); }
        .note { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1.5; }
        .nt2 { font: 600 13px var(--font); fill: var(--text); }
      </style></defs>
      <text class="big" x="20" y="55">70</text>
      <rect class="b60" x="80" y="32" width="180" height="30" rx="5"/><text class="bt" x="170" y="52" text-anchor="middle">60</text>
      <rect class="b10" x="262" y="32" width="30" height="30" rx="5"/><text class="bt" x="277" y="52" text-anchor="middle">10</text>
      <text class="fw" x="400" y="46">soixante-dix</text><text class="fs" x="400" y="64">60 + 10</text>

      <text class="big" x="20" y="125">80</text>
      <rect class="b20" x="80" y="102" width="58" height="30" rx="5"/><text class="bt" x="109" y="122" text-anchor="middle">20</text>
      <rect class="b20" x="140" y="102" width="58" height="30" rx="5"/><text class="bt" x="169" y="122" text-anchor="middle">20</text>
      <rect class="b20" x="200" y="102" width="58" height="30" rx="5"/><text class="bt" x="229" y="122" text-anchor="middle">20</text>
      <rect class="b20" x="260" y="102" width="58" height="30" rx="5"/><text class="bt" x="289" y="122" text-anchor="middle">20</text>
      <text class="fw" x="400" y="116">quatre-vingts</text><text class="fs" x="400" y="134">4 × 20</text>

      <text class="big" x="20" y="195">90</text>
      <rect class="b20" x="80" y="172" width="58" height="30" rx="5"/><text class="bt" x="109" y="192" text-anchor="middle">20</text>
      <rect class="b20" x="140" y="172" width="58" height="30" rx="5"/><text class="bt" x="169" y="192" text-anchor="middle">20</text>
      <rect class="b20" x="200" y="172" width="58" height="30" rx="5"/><text class="bt" x="229" y="192" text-anchor="middle">20</text>
      <rect class="b20" x="260" y="172" width="58" height="30" rx="5"/><text class="bt" x="289" y="192" text-anchor="middle">20</text>
      <rect class="b10" x="320" y="172" width="30" height="30" rx="5"/><text class="bt" x="335" y="192" text-anchor="middle">10</text>
      <text class="fw" x="400" y="186">quatre-vingt-dix</text><text class="fs" x="400" y="204">4 × 20 + 10</text>

      <text class="big" x="20" y="265">97</text>
      <rect class="b20" x="80" y="242" width="58" height="30" rx="5"/><text class="bt" x="109" y="262" text-anchor="middle">20</text>
      <rect class="b20" x="140" y="242" width="58" height="30" rx="5"/><text class="bt" x="169" y="262" text-anchor="middle">20</text>
      <rect class="b20" x="200" y="242" width="58" height="30" rx="5"/><text class="bt" x="229" y="262" text-anchor="middle">20</text>
      <rect class="b20" x="260" y="242" width="58" height="30" rx="5"/><text class="bt" x="289" y="262" text-anchor="middle">20</text>
      <rect class="b10" x="320" y="242" width="51" height="30" rx="5"/><text class="bt" x="345" y="262" text-anchor="middle">17</text>
      <text class="fw" x="400" y="256">quatre-vingt-dix-sept</text><text class="fs" x="400" y="274">4 × 20 + 17</text>

      <rect class="note" x="10" y="292" width="620" height="32" rx="8"/>
      <text class="nt2" x="320" y="313" text-anchor="middle">बेल्जियम और स्विट्ज़रलैंड: 70 septante · 90 nonante · (स्विस 80: huitante)</text>
    </svg>