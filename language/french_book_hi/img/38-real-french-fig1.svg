<svg viewBox="0 0 640 250" role="img" aria-label="ne कितनी बार रखा जाता है, लिखने में हमेशा से लेकर दोस्तों के बीच लगभग कभी नहीं तक: लिखना, ख़बरें और भाषण, job interview, work meeting, दोस्तों से बातचीत।" xmlns="http://www.w3.org/2000/svg"><title>माहौल जितना आरामदेह, ne उतना कम सुनाई देता है। इसे हर जगह रखना कभी ग़लत नहीं है — बस दोस्तों के बीच थोड़ा formal लगता है।</title><style>svg{--accent:#ea580c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .ne-bg { fill: var(--canvas); }
          .ne-b { fill: var(--accent); }
          .ne-t { font: 700 13px var(--font); fill: var(--text); }
          .ne-s { font: 600 12px var(--font); fill: var(--text-soft); }
          .ne-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
        </style></defs>
        <text class="ne-h" x="10" y="20">“NE” कितनी बार रखा जाता है? (मोटा अंदाज़ा, सटीक आँकड़े नहीं)</text>
        <text class="ne-t" x="10" y="54">लिखना (ईमेल, निबंध)</text>
        <rect class="ne-bg" x="230" y="40" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="40" width="380" height="20" rx="10"/>
        <text class="ne-s" x="230" y="76">हमेशा</text>
        <text class="ne-t" x="10" y="104">ख़बरें, भाषण</text>
        <rect class="ne-bg" x="230" y="90" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="90" width="300" height="20" rx="10"/>
        <text class="ne-s" x="230" y="126">आम तौर पर</text>
        <text class="ne-t" x="10" y="154">Job interview</text>
        <rect class="ne-bg" x="230" y="140" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="140" width="190" height="20" rx="10"/>
        <text class="ne-s" x="230" y="176">अक्सर — मिला-जुला</text>
        <text class="ne-t" x="10" y="204">दोस्त, परिवार, सहकर्मी</text>
        <rect class="ne-bg" x="230" y="190" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="190" width="30" height="20" rx="10"/>
        <text class="ne-s" x="230" y="226">लगभग कभी नहीं</text>
      </svg>