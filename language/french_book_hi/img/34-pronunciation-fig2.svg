<svg viewBox="0 0 640 330" role="img" aria-label="स्वर के वक्र: कथन अंत में नीचे जाता है, हाँ/नहीं वाला सवाल अंत में ऊपर जाता है, सवाल-शब्द पहले वाला सवाल ऊँचा शुरू होकर नीचे आता है, अंत में सवाल-शब्द हो तो ऊपर जाता है, और लंबा वाक्य हर समूह के अंत में ऊपर जाकर सबसे आख़िर में नीचे आता है।" xmlns="http://www.w3.org/2000/svg"><title>नीला = नीचे जाना, गुलाबी = ऊपर जाना। वाक्य के बीच की उठान (5) कहती है &quot;रुको, मैं अभी पूरा नहीं बोला&quot;। सिर्फ़ आख़िरी गिरावट कहती है &quot;ख़त्म&quot;।</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .pc-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
          .pc-w { font: 600 14px var(--font); fill: var(--text); }
          .pc-down { fill: none; stroke: var(--g-m); stroke-width: 3.5; stroke-linecap: round; }
          .pc-up { fill: none; stroke: var(--g-f); stroke-width: 3.5; stroke-linecap: round; }
          .pc-base { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
        </style></defs>
        <text class="pc-h" x="16" y="22">1 · कथन — नीचे जाता है ↘</text>
        <line class="pc-base" x1="16" y1="70" x2="300" y2="70"/>
        <path class="pc-down" d="M24 52 L150 52 Q200 54 230 78"/>
        <text class="pc-w" x="24" y="100">Tu viens demain.</text>

        <text class="pc-h" x="336" y="22">2 · हाँ/नहीं सवाल — ऊपर जाता है ↗</text>
        <line class="pc-base" x1="336" y1="70" x2="624" y2="70"/>
        <path class="pc-up" d="M344 66 L470 66 Q520 64 552 36"/>
        <text class="pc-w" x="344" y="100">Tu viens demain ?</text>

        <text class="pc-h" x="16" y="152">3 · सवाल-शब्द पहले — नीचे ↘</text>
        <line class="pc-base" x1="16" y1="200" x2="300" y2="200"/>
        <path class="pc-down" d="M24 172 Q60 168 110 186 L250 206"/>
        <text class="pc-w" x="24" y="232">Où est-ce que tu vas ?</text>

        <text class="pc-h" x="336" y="152">4 · सवाल-शब्द अंत में — ऊपर ↗</text>
        <line class="pc-base" x1="336" y1="200" x2="624" y2="200"/>
        <path class="pc-up" d="M344 196 L480 196 Q520 194 548 168"/>
        <text class="pc-w" x="344" y="232">Tu vas où ?</text>

        <text class="pc-h" x="16" y="270">5 · लंबा वाक्य — हर समूह पर ऊपर ↗, अंत में नीचे ↘</text>
        <path class="pc-up" d="M24 296 L110 296 Q130 294 142 280"/>
        <path class="pc-up" d="M190 296 L330 296 Q350 294 362 280"/>
        <path class="pc-down" d="M410 290 L540 290 Q575 292 600 312"/>
        <text class="pc-w" x="24" y="322">Le matin,</text>
        <text class="pc-w" x="190" y="322">avant le travail,</text>
        <text class="pc-w" x="410" y="322">je bois un café.</text>
      </svg>