<svg viewBox="0 0 640 250" role="img" aria-label="कहा गया बनाम मतलब। Ce n'est pas mal का मतलब है यह बहुत अच्छा है। Bravo, c'est malin का मतलब है यह बेवकूफ़ी थी। Il aurait démissionné का मतलब है पुष्टि नहीं हुई है। Je veux bien, mais का मतलब है ना, या शर्तों के साथ हाँ।" xmlns="http://www.w3.org/2000/svg"><title>कहा गया बनाम मतलब। बायाँ कॉलम वह है जो आप सुनते हैं; दायाँ वह जो native speaker समझता है।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .sm-hd { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
          .sm-b1 { fill: var(--canvas); stroke: var(--line); stroke-width: 1.5; }
          .sm-b2 { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
          .sm-t { font: 700 14px var(--font); fill: var(--text); }
          .sm-a { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
          .sm-h { fill: var(--accent); }
        </style></defs>
        <text class="sm-hd" x="140" y="22" text-anchor="middle">ON DIT…</text>
        <text class="sm-hd" x="500" y="22" text-anchor="middle">ON VEUT DIRE…</text>
        <rect class="sm-b1" x="15" y="34" width="250" height="40" rx="10"/>
        <text class="sm-t" x="140" y="59" text-anchor="middle">Ce n’est pas mal.</text>
        <path class="sm-a" d="M272 54 L360 54"/><polygon class="sm-h" points="368,54 358,48 358,60"/>
        <rect class="sm-b2" x="375" y="34" width="250" height="40" rx="10"/>
        <text class="sm-t" x="500" y="59" text-anchor="middle">C’est très bien.</text>
        <rect class="sm-b1" x="15" y="86" width="250" height="40" rx="10"/>
        <text class="sm-t" x="140" y="111" text-anchor="middle">Bravo, c’est malin.</text>
        <path class="sm-a" d="M272 106 L360 106"/><polygon class="sm-h" points="368,106 358,100 358,112"/>
        <rect class="sm-b2" x="375" y="86" width="250" height="40" rx="10"/>
        <text class="sm-t" x="500" y="111" text-anchor="middle">C’était idiot.</text>
        <rect class="sm-b1" x="15" y="138" width="250" height="40" rx="10"/>
        <text class="sm-t" x="140" y="163" text-anchor="middle">Il aurait démissionné.</text>
        <path class="sm-a" d="M272 158 L360 158"/><polygon class="sm-h" points="368,158 358,152 358,164"/>
        <rect class="sm-b2" x="375" y="138" width="250" height="40" rx="10"/>
        <text class="sm-t" x="500" y="163" text-anchor="middle">Ce n’est pas confirmé.</text>
        <rect class="sm-b1" x="15" y="190" width="250" height="40" rx="10"/>
        <text class="sm-t" x="140" y="215" text-anchor="middle">Je veux bien, mais…</text>
        <path class="sm-a" d="M272 210 L360 210"/><polygon class="sm-h" points="368,210 358,204 358,216"/>
        <rect class="sm-b2" x="375" y="190" width="250" height="40" rx="10"/>
        <text class="sm-t" x="500" y="215" text-anchor="middle">Oui, à mes conditions.</text>
      </svg>