<svg viewBox="0 0 640 300" role="img" aria-label="फ़ोन कॉल का flow: कंपनी फ़ोन उठाती है, आप अपना परिचय देकर किसी को माँगते हैं, वे पूछते हैं कौन बोल रहा है, फिर या तो वे आपको जोड़ देते हैं, या लाइन व्यस्त है और आप इंतज़ार करते हैं, या वह व्यक्ति बाहर है और आप संदेश छोड़ते हैं।" xmlns="http://www.w3.org/2000/svg"><title>गुलाबी डिब्बे आपके वाक्य हैं; सफ़ेद डिब्बे वे हैं जो आप सुनते हैं। “C’est de la part de qui ?” के बाद तीन संभावित नतीजे — और हर एक के लिए तैयार वाक्य।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .pf-n { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
          .pf-y { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .pf-t { font: 700 13px var(--font); fill: var(--text); }
          .pf-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
          .pf-a { fill: none; stroke: var(--text-soft); stroke-width: 2; }
          .pf-h { font: 700 11px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
        </style></defs>
        <text class="pf-h" x="10" y="16">वे</text>
        <text class="pf-h" x="10" y="98">आप</text>
        <rect class="pf-n" x="10" y="24" width="190" height="46" rx="10"/>
        <text class="pf-t" x="22" y="44">Société X, bonjour !</text>
        <text class="pf-s" x="22" y="61">कंपनी फ़ोन उठाती है</text>
        <path class="pf-a" d="M105 70 L105 104"/>
        <rect class="pf-y" x="10" y="106" width="190" height="56" rx="10"/>
        <text class="pf-t" x="22" y="126">Bonjour, [nom], de [X].</text>
        <text class="pf-t" x="22" y="146">Je voudrais parler à…</text>
        <path class="pf-a" d="M200 134 L232 134"/>
        <rect class="pf-n" x="234" y="106" width="176" height="56" rx="10"/>
        <text class="pf-t" x="246" y="126">C’est de la part</text>
        <text class="pf-t" x="246" y="146">de qui ?</text>
        <path class="pf-a" d="M410 120 L446 50"/>
        <path class="pf-a" d="M410 134 L446 134"/>
        <path class="pf-a" d="M410 148 L446 220"/>
        <rect class="pf-n" x="448" y="24" width="184" height="56" rx="10"/>
        <text class="pf-t" x="460" y="44">Ne quittez pas,</text>
        <text class="pf-t" x="460" y="64">je vous le/la passe.</text>
        <rect class="pf-n" x="448" y="106" width="184" height="56" rx="10"/>
        <text class="pf-t" x="460" y="126">Sa ligne est occupée.</text>
        <text class="pf-s" x="460" y="146">→ Je patiente. / Je rappellerai.</text>
        <rect class="pf-n" x="448" y="190" width="184" height="66" rx="10"/>
        <text class="pf-t" x="460" y="210">Il/Elle est absent(e).</text>
        <text class="pf-s" x="460" y="228">→ Je laisse un message.</text>
        <text class="pf-s" x="460" y="245">→ Il/Elle peut me rappeler ?</text>
        <rect class="pf-y" x="10" y="200" width="400" height="56" rx="10"/>
        <text class="pf-t" x="22" y="222">हमेशा ऐसे ख़त्म करो: Merci, bonne journée ! / Au revoir.</text>
        <text class="pf-s" x="22" y="242">नाम अक्षर-अक्षर बोलकर बताओ, नंबर दो-दो अंकों में।</text>
      </svg>