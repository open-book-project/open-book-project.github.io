<text class="bz-s" x="416" y="270">Covid के बाद से हाथ मिलाना,</text>
<text class="bz-s" x="416" y="286">हाथ हिलाना या bise न करना आम है।</text>
<text class="bz-s" x="416" y="312">मोटा नियम: सामने वाले को पहल</text>
