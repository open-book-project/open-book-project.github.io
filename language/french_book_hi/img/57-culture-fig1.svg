<svg viewBox="0 0 640 360" role="img" aria-label="France का योजनाबद्ध नक्शा जो क्षेत्र के हिसाब से bises की लगभग संख्या दिखाता है: Finistère में एक, Paris सहित ज़्यादातर France में दो, Montpellier, Provence, Drôme और Ardèche के आसपास दक्षिण के कुछ हिस्सों में तीन, और Normandy, Loire इलाक़े और Nord जैसे उत्तर तथा पश्चिम के कुछ हिस्सों में चार।" xmlns="http://www.w3.org/2000/svg"><title>France में la bise का एक योजनाबद्ध खाका। सीमाएँ धुँधली हैं: दो पड़ोसी शहर, या दो परिवार, इसे अलग तरह से कर सकते हैं।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs><style>
.bz-land { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
