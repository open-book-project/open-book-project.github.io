<svg viewBox="0 0 640 280" role="img" aria-label="Paul और Marie, दोनों के पास एक गाड़ी और एक फ़ोन है। Paul की गाड़ी sa voiture है, Marie की गाड़ी भी sa voiture है, क्योंकि voiture स्त्रीलिंग है। Paul का फ़ोन और Marie का फ़ोन दोनों son téléphone हैं, क्योंकि téléphone पुल्लिंग है। Possessive वस्तु के पीछे चलता है, मालिक के पीछे नहीं।" xmlns="http://www.w3.org/2000/svg"><title>Paul की गाड़ी और Marie की गाड़ी, दोनों sa voiture हैं। मालिक पर ज़ोर देना हो तो à lui / à elle जोड़ो (section 4)।</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .ow { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .owt { font: 800 15px var(--font); fill: var(--text); }
          .ob { font: 700 14px var(--font); fill: var(--text-soft); }
          .pf { fill: var(--g-f); } .pm { fill: var(--g-m); }
          .pw { font: 800 15px var(--font); fill: var(--sheet); }
          .lf { stroke: var(--g-f); stroke-width: 2.5; fill: none; }
          .lm { stroke: var(--g-m); stroke-width: 2.5; fill: none; }
          .nt2 { font: 600 13px var(--font); fill: var(--text-soft); }
        </style></defs>
        <rect class="ow" x="20" y="30" width="140" height="56" rx="14"/><text class="owt" x="90" y="64" text-anchor="middle">Paul (वह, पुरुष)</text>
        <rect class="ow" x="20" y="180" width="140" height="56" rx="14"/><text class="owt" x="90" y="214" text-anchor="middle">Marie (वह, स्त्री)</text>
        <path class="lf" d="M160 52 C230 52 250 98 330 98"/>
        <path class="lf" d="M160 204 C230 204 250 118 330 118"/>
        <path class="lm" d="M160 66 C240 66 250 160 330 160"/>
        <path class="lm" d="M160 218 C240 218 250 180 330 180"/>
        <rect class="pf" x="330" y="84" width="150" height="48" rx="24"/><text class="pw" x="405" y="114" text-anchor="middle">sa voiture</text>
        <rect class="pm" x="330" y="146" width="150" height="48" rx="24"/><text class="pw" x="405" y="176" text-anchor="middle">son téléphone</text>
        <text class="ob" x="495" y="104">voiture = f</text><text class="nt2" x="495" y="122">→ sa (उसकी)</text>
        <text class="ob" x="495" y="166">téléphone = m</text><text class="nt2" x="495" y="184">→ son (उसका)</text>
        <text class="nt2" x="320" y="262" text-anchor="middle">मालिक कोई मायने नहीं रखता। वस्तु का gender तय करता है कि son होगा या sa।</text>
      </svg>