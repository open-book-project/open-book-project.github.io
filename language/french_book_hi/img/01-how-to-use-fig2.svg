<svg viewBox="0 0 640 220" role="img" aria-label="20 मिनट की एक बार, पाँच हिस्सों में बँटी: पढ़ना 6 मिनट, सुनना 4, ज़ोर से दोहराना 5, क्विज़ 3, रिव्यू 2।" xmlns="http://www.w3.org/2000/svg"><title>थोड़ा पढ़ो, फिर ज़्यादातर समय कानों और मुँह को दो। आख़िर में किसी पुराने चैप्टर पर एक छोटी नज़र डालो।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .mn { font: 800 15px var(--font); fill: var(--sheet); }
        .sl { font: 700 13px var(--font); fill: var(--text); }
        .ss { font: 500 12px var(--font); fill: var(--text-soft); }
        .tk { font: 600 12px var(--font); fill: var(--text-soft); }
        .s1 { fill: var(--g-m); } .s2 { fill: var(--accent); } .s3 { fill: var(--g-f); }
        .s4 { fill: var(--g-pl); } .s5 { fill: var(--role-verb); }
      </style></defs>
      <text class="sl" x="20" y="34">आपके 20 मिनट</text>
      <rect class="s1" x="20" y="60" width="180" height="50" rx="8"/>
      <rect class="s2" x="202" y="60" width="118" height="50" rx="8"/>
      <rect class="s3" x="322" y="60" width="148" height="50" rx="8"/>
      <rect class="s4" x="472" y="60" width="88" height="50" rx="8"/>
      <rect class="s5" x="562" y="60" width="58" height="50" rx="8"/>
      <text class="mn" x="110" y="91" text-anchor="middle">6 मिनट</text>
      <text class="mn" x="261" y="91" text-anchor="middle">4 मिनट</text>
      <text class="mn" x="396" y="91" text-anchor="middle">5 मिनट</text>
      <text class="mn" x="516" y="91" text-anchor="middle">3</text>
      <text class="mn" x="591" y="91" text-anchor="middle">2</text>
      <text class="sl" x="110" y="140" text-anchor="middle">1 पढ़ो</text>
      <text class="ss" x="110" y="158" text-anchor="middle">एक या दो सेक्शन</text>
      <text class="sl" x="261" y="140" text-anchor="middle">2 सुनो</text>
      <text class="ss" x="261" y="158" text-anchor="middle">हर 🔊</text>
      <text class="sl" x="396" y="140" text-anchor="middle">3 ज़ोर से दोहराओ</text>
      <text class="ss" x="396" y="158" text-anchor="middle">आवाज़ की नकल करो</text>
      <text class="sl" x="516" y="140" text-anchor="middle">4 क्विज़</text>
      <text class="ss" x="516" y="158" text-anchor="middle">खुद को टेस्ट करो</text>
      <text class="sl" x="591" y="140" text-anchor="middle">5 रिव्यू</text>
      <text class="ss" x="591" y="158" text-anchor="middle">पुराने पेज</text>
      <text class="tk" x="20" y="200">0 मिनट</text>
      <text class="tk" x="620" y="200" text-anchor="end">20 मिनट</text>
    </svg>