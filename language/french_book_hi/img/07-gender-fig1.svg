<svg viewBox="0 0 640 300" role="img" aria-label="छह चीज़ों की तुलना: बाईं ओर हिंदी का लिंग, दाईं ओर फ़्रेंच का लिंग। तीन में मेल खाता है और तीन में नहीं।" xmlns="http://www.w3.org/2000/svg"><title>हिंदी और फ़्रेंच दोनों में दो genders हैं, पर हर भाषा अपना फ़ैसला खुद करती है। नीला = masculine, गुलाबी = feminine।</title><style>svg{--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--good:#15803d;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .t1 { font: 700 15px var(--font); }
          .t2 { font: 500 12px var(--font); fill: var(--text-soft); }
          .hd { font: 800 13px var(--font); fill: var(--text); letter-spacing: .06em; }
          .mm { fill: var(--g-m); } .ff { fill: var(--g-f); }
          .ok { font: 800 14px var(--font); fill: var(--good); } .no { font: 800 14px var(--font); fill: var(--bad); }
          .ln { stroke: var(--line); stroke-width: 1.5; fill: none; }
        </style></defs>
        <text class="hd" x="120" y="28" text-anchor="middle">हिंदी</text>
        <text class="hd" x="460" y="28" text-anchor="middle">फ़्रेंच</text>
        <text class="hd" x="300" y="28" text-anchor="middle">एक जैसा?</text>
        <g>
          <text class="t1 ff" x="120" y="64" text-anchor="middle">किताब (f)</text>
          <path class="ln" d="M190 59 H390"/>
          <text class="t1 mm" x="460" y="64" text-anchor="middle">le livre (m)</text>
          <text class="no" x="300" y="52" text-anchor="middle">✗</text>
        </g>
        <g>
          <text class="t1 mm" x="120" y="104" text-anchor="middle">पानी (m)</text>
          <path class="ln" d="M190 99 H390"/>
          <text class="t1 ff" x="460" y="104" text-anchor="middle">l’eau (f)</text>
          <text class="no" x="300" y="92" text-anchor="middle">✗</text>
        </g>
        <g>
          <text class="t1 mm" x="120" y="144" text-anchor="middle">घर (m)</text>
          <path class="ln" d="M190 139 H390"/>
          <text class="t1 ff" x="460" y="144" text-anchor="middle">la maison (f)</text>
          <text class="no" x="300" y="132" text-anchor="middle">✗</text>
        </g>
        <g>
          <text class="t1 ff" x="120" y="184" text-anchor="middle">गाड़ी (f)</text>
          <path class="ln" d="M190 179 H390"/>
          <text class="t1 ff" x="460" y="184" text-anchor="middle">la voiture (f)</text>
          <text class="ok" x="300" y="172" text-anchor="middle">✓</text>
        </g>
        <g>
          <text class="t1 ff" x="120" y="224" text-anchor="middle">कुर्सी (f)</text>
          <path class="ln" d="M190 219 H390"/>
          <text class="t1 ff" x="460" y="224" text-anchor="middle">la chaise (f)</text>
          <text class="ok" x="300" y="212" text-anchor="middle">✓</text>
        </g>
        <g>
          <text class="t1 mm" x="120" y="264" text-anchor="middle">दिन (m)</text>
          <path class="ln" d="M190 259 H390"/>
          <text class="t1 mm" x="460" y="264" text-anchor="middle">le jour (m)</text>
          <text class="ok" x="300" y="252" text-anchor="middle">✓</text>
        </g>
        <text class="t2" x="320" y="292" text-anchor="middle">आधे मेल खाते हैं, आधे नहीं — इसलिए हर शब्द के साथ फ़्रेंच gender सीखो।</text>
      </svg>