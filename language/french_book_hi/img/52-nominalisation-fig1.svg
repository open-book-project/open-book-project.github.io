<svg viewBox="0 0 660 320" role="img" aria-label="Suffix और gender का chart। Masculine: -ment जैसे le développement, -age जैसे le recyclage (अपवाद la plage, la page, l'image), -isme जैसे le réalisme, और व्यक्ति के लिए -eur, le chercheur। Feminine: -tion और -sion जैसे la décision, -ure जैसे la fermeture, -ée जैसे l'arrivée, -ance और -ence जैसे la croissance (अपवाद le silence), -té और -ité जैसे l'efficacité (अपवाद l'été, le comité), -esse जैसे la jeunesse, और गुण के लिए -eur, la chaleur (अपवाद le bonheur, le malheur, l'honneur)।" xmlns="http://www.w3.org/2000/svg"><title>Masculine: -ment, -age, -isme। Feminine: लगभग बाकी सब। -eur पर ध्यान दो: व्यक्ति (le chercheur) masculine है, गुण (la chaleur) feminine।</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .mb { fill: var(--g-m); opacity: .16; }
          .fb { fill: var(--g-f); opacity: .16; }
          .mh { font: 800 15px var(--font); fill: var(--g-m); letter-spacing: .05em; }
          .fh { font: 800 15px var(--font); fill: var(--g-f); letter-spacing: .05em; }
          .sx { font: 800 15px var(--font); fill: var(--text); }
          .se { font: 500 12px var(--font); fill: var(--text-soft); }
          .xx { font: 600 11.5px var(--font); fill: var(--text-soft); font-style: italic; }
        </style></defs>
        <rect class="mb" x="14" y="14" width="300" height="292" rx="16"/>
        <rect class="fb" x="330" y="14" width="316" height="292" rx="16"/>
        <text class="mh" x="164" y="42" text-anchor="middle">MASCULINE (पुल्लिंग) · le</text>
        <text class="fh" x="488" y="42" text-anchor="middle">FEMININE (स्त्रीलिंग) · la</text>

        <text class="sx" x="32" y="80">-ment</text><text class="se" x="110" y="80">le développement</text>
        <text class="sx" x="32" y="122">-age</text><text class="se" x="110" y="122">le recyclage</text>
        <text class="xx" x="110" y="139">पर: la plage, la page, l’image</text>
        <text class="sx" x="32" y="180">-isme</text><text class="se" x="110" y="180">le réalisme</text>
        <text class="sx" x="32" y="222">-eur (व्यक्ति)</text><text class="se" x="140" y="222">le chercheur</text>
        <text class="sx" x="32" y="264">कोई suffix नहीं</text><text class="se" x="130" y="264">le départ, le choix…</text>
        <text class="xx" x="130" y="281">पर: la vente, la baisse</text>

        <text class="sx" x="348" y="80">-tion / -sion</text><text class="se" x="470" y="80">la décision</text>
        <text class="sx" x="348" y="112">-ure</text><text class="se" x="470" y="112">la fermeture</text>
        <text class="sx" x="348" y="144">-ée</text><text class="se" x="470" y="144">l’arrivée</text>
        <text class="sx" x="348" y="176">-ance / -ence</text><text class="se" x="470" y="176">la croissance</text>
        <text class="xx" x="470" y="191">पर: le silence</text>
        <text class="sx" x="348" y="222">-té / -ité</text><text class="se" x="470" y="222">l’efficacité</text>
        <text class="xx" x="470" y="237">पर: l’été, le comité</text>
        <text class="sx" x="348" y="266">-esse · -eur (गुण)</text><text class="se" x="348" y="284">la jeunesse · la chaleur</text>
        <text class="xx" x="348" y="300">पर: le bonheur, le malheur, l’honneur</text>
      </svg>