<svg viewBox="0 0 640 392" role="img" aria-label="Connectors का grid: सात काम पंक्तियों में, बोलचाल, रोज़मर्रा और औपचारिक registers कॉलम में" xmlns="http://www.w3.org/2000/svg"><title>Register grid। किसी बात को “औपचारिक पोशाक” पहनाने के लिए एक पंक्ति को बाएँ से दाएँ पढ़ो; mais और donc हर कॉलम में चलते हैं।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-adv:#db2777;--role-pron:#0891b2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.rg-c { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1; }
.rg-f { font: 700 13px var(--font); fill: var(--text); }
.rg-t { font: 500 12.5px var(--font); fill: var(--text); text-anchor: middle; }
.rg-h { font: 800 13px var(--font); text-anchor: middle; fill: var(--sheet); }
</style>
</defs>
<rect x="116" y="8" width="168" height="26" rx="13" fill="var(--role-adv)"/><text class="rg-h" x="200" y="26">बोलचाल</text>
<rect x="290" y="8" width="168" height="26" rx="13" fill="var(--accent)"/><text class="rg-h" x="374" y="26">रोज़मर्रा</text>
<rect x="464" y="8" width="168" height="26" rx="13" fill="var(--role-pron)"/><text class="rg-h" x="548" y="26">औपचारिक</text>
<g transform="translate(0 44)">
<text class="rg-f" x="6" y="28">जोड़ना</text>
<rect class="rg-c" x="116" width="168" height="44" rx="8"/><text class="rg-t" x="200" y="27">en plus</text>
<rect class="rg-c" x="290" width="168" height="44" rx="8"/><text class="rg-t" x="374" y="27">de plus, aussi</text>
<rect class="rg-c" x="464" width="168" height="44" rx="8"/><text class="rg-t" x="548" y="27">en outre, par ailleurs</text>
</g>
<g transform="translate(0 92)">
<text class="rg-f" x="6" y="28">विरोध</text>
<rect class="rg-c" x="116" width="168" height="44" rx="8"/><text class="rg-t" x="200" y="27">mais, par contre</text>
<rect class="rg-c" x="290" width="168" height="44" rx="8"/><text class="rg-t" x="374" y="19">pourtant,</text><text class="rg-t" x="374" y="35">en revanche</text>
<rect class="rg-c" x="464" width="168" height="44" rx="8"/><text class="rg-t" x="548" y="19">cependant, toutefois,</text><text class="rg-t" x="548" y="35">néanmoins</text>
</g>
<g transform="translate(0 140)">
<text class="rg-f" x="6" y="28">कारण</text>
<rect class="rg-c" x="116" width="168" height="44" rx="8"/><text class="rg-t" x="200" y="27">parce que, vu que</text>
<rect class="rg-c" x="290" width="168" height="44" rx="8"/><text class="rg-t" x="374" y="19">parce que, puisque,</text><text class="rg-t" x="374" y="35">comme</text>
<rect class="rg-c" x="464" width="168" height="44" rx="8"/><text class="rg-t" x="548" y="19">car, étant donné que,</text><text class="rg-t" x="548" y="35">en raison de</text>
</g>
<g transform="translate(0 188)">
<text class="rg-f" x="6" y="28">परिणाम</text>
<rect class="rg-c" x="116" width="168" height="44" rx="8"/><text class="rg-t" x="200" y="27">du coup, alors</text>
<rect class="rg-c" x="290" width="168" height="44" rx="8"/><text class="rg-t" x="374" y="27">donc, c’est pourquoi</text>
<rect class="rg-c" x="464" width="168" height="44" rx="8"/><text class="rg-t" x="548" y="27">par conséquent, ainsi</text>
</g>
<g transform="translate(0 236)">
<text class="rg-f" x="6" y="28">Concession</text>
<rect class="rg-c" x="116" width="168" height="44" rx="8"/><text class="rg-t" x="200" y="27">même si, quand même</text>
<rect class="rg-c" x="290" width="168" height="44" rx="8"/><text class="rg-t" x="374" y="27">bien que, malgré</text>
<rect class="rg-c" x="464" width="168" height="44" rx="8"/><text class="rg-t" x="548" y="27">quoique, en dépit de</text>
</g>
<g transform="translate(0 284)">
<text class="rg-f" x="6" y="28">उद्देश्य</text>
<rect class="rg-c" x="116" width="168" height="44" rx="8"/><text class="rg-t" x="200" y="27">pour</text>
<rect class="rg-c" x="290" width="168" height="44" rx="8"/><text class="rg-t" x="374" y="27">pour que, afin de</text>
<rect class="rg-c" x="464" width="168" height="44" rx="8"/><text class="rg-t" x="548" y="27">afin que, en vue de</text>
</g>
<g transform="translate(0 332)">
<text class="rg-f" x="6" y="28">निचोड़</text>
<rect class="rg-c" x="116" width="168" height="44" rx="8"/><text class="rg-t" x="200" y="27">bref</text>
<rect class="rg-c" x="290" width="168" height="44" rx="8"/><text class="rg-t" x="374" y="27">en résumé, finalement</text>
<rect class="rg-c" x="464" width="168" height="44" rx="8"/><text class="rg-t" x="548" y="27">en somme, en définitive</text>
</g>
</svg>