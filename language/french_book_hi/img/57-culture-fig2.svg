<svg viewBox="0 0 640 320" role="img" aria-label="क्षेत्र के हिसाब से French बोलने वालों का bubble chart, मोटे अनुमान: सब-सहारा अफ़्रीका और हिंद महासागर में लगभग 150 मिलियन, यूरोप में 100 मिलियन, उत्तरी अफ़्रीका और मध्य-पूर्व में 45 मिलियन, अमेरिका और Caribbean में 20 मिलियन, और एशिया तथा ओशिनिया में 3 मिलियन।" xmlns="http://www.w3.org/2000/svg"><title>क्षेत्र के हिसाब से French बोलने वाले — पूर्णांकित मोटे अंदाज़े, जनगणना के सटीक आँकड़े नहीं।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs><style>
.fw-a { fill: var(--accent); fill-opacity: .22; stroke: var(--accent); stroke-width: 2.5; }
.fw-e { fill: var(--g-m); fill-opacity: .2; stroke: var(--g-m); stroke-width: 2.5; }
.fw-n { fill: var(--g-f); fill-opacity: .2; stroke: var(--g-f); stroke-width: 2.5; }
.fw-m { fill: var(--g-pl); fill-opacity: .2; stroke: var(--g-pl); stroke-width: 2.5; }
.fw-v { font: 800 16px var(--font); fill: var(--text); }
.fw-vs { font: 800 13px var(--font); fill: var(--text); }
.fw-l { font: 600 12.5px var(--font); fill: var(--text); }
.fw-h { font: 800 16px var(--font); fill: var(--text); }
.fw-s { font: 500 12px var(--font); fill: var(--text-soft); }
.fw-base { stroke: var(--line-strong); stroke-width: 1.5; }
</style></defs>
<text class="fw-h" x="20" y="30">French बोलने वाले कहाँ रहते हैं</text>
<text class="fw-s" x="20" y="48">मोटे, पूर्णांकित OIF-आधारित अनुमान (2022), मिलियन में — कुल ≈ 321 M।</text>
<text class="fw-s" x="20" y="64">Bubble का क्षेत्रफल बोलने वालों की संख्या के अनुपात में है।</text>
<line class="fw-base" x1="20" y1="232" x2="620" y2="232"/>
<circle class="fw-m" cx="62" cy="206" r="25"/>
<text class="fw-vs" x="62" y="211" text-anchor="middle">≈ 20</text>
<text class="fw-l" x="62" y="254" text-anchor="middle">अमेरिका और</text>
<text class="fw-l" x="62" y="270" text-anchor="middle">Caribbean</text>
<circle class="fw-e" cx="170" cy="175" r="56"/>
<text class="fw-v" x="170" y="181" text-anchor="middle">≈ 100</text>
<text class="fw-l" x="170" y="254" text-anchor="middle">यूरोप</text>
<circle class="fw-n" cx="290" cy="193" r="38"/>
<text class="fw-v" x="290" y="199" text-anchor="middle">≈ 45</text>
<text class="fw-l" x="290" y="254" text-anchor="middle">उत्तरी अफ़्रीका और</text>
<text class="fw-l" x="290" y="270" text-anchor="middle">मध्य-पूर्व</text>
<circle class="fw-a" cx="428" cy="162" r="69"/>
<text class="fw-v" x="428" y="168" text-anchor="middle">≈ 150</text>
<text class="fw-l" x="428" y="254" text-anchor="middle">सब-सहारा अफ़्रीका</text>
<text class="fw-l" x="428" y="270" text-anchor="middle">और हिंद महासागर</text>
<circle class="fw-m" cx="568" cy="221" r="10"/>
<text class="fw-vs" x="568" y="200" text-anchor="middle">≈ 3</text>
<text class="fw-l" x="568" y="254" text-anchor="middle">एशिया और</text>
<text class="fw-l" x="568" y="270" text-anchor="middle">ओशिनिया</text>
<text class="fw-s" x="20" y="304">गिनती इस पर निर्भर करती है कि “बोलने वाला” किसे कहा जाए। अफ़्रीका का हिस्सा सबसे तेज़ी से बढ़ रहा है।</text>
</svg>