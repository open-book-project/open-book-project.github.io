<svg viewBox="0 0 640 290" role="img" aria-label="पाँच steps में सुनने का चक्र: 1 बिना text के सुनो, 2 मोटा-मोटा मतलब समझो, 3 key words और दूसरी बार सुनना, 4 transcript और अनुवाद पढ़ो, 5 dictée लिखो और ज़ोर से बोलो, फिर अगली कहानी के साथ वापस step 1 पर।" xmlns="http://www.w3.org/2000/svg"><title>सुनने का चक्र। Steps 1–2 आपके कान को तैयार करते हैं; steps 3–5 शब्दों को याददाश्त में पक्का करते हैं।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .lc-box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .lc-t { font: 700 14px var(--font); fill: var(--text); }
          .lc-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .lc-a { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
          .lc-h { fill: var(--accent); }
          .lc-c { font: 700 13px var(--font); fill: var(--text-soft); }
        </style></defs>
        <rect class="lc-box" x="235" y="12" width="170" height="54" rx="12"/>
        <text class="lc-t" x="320" y="35" text-anchor="middle">1 · सुनो</text>
        <text class="lc-s" x="320" y="54" text-anchor="middle">बिना text — दो बार</text>
        <rect class="lc-box" x="450" y="88" width="175" height="54" rx="12"/>
        <text class="lc-t" x="537" y="111" text-anchor="middle">2 · मतलब पकड़ो</text>
        <text class="lc-s" x="537" y="130" text-anchor="middle">कौन? कहाँ? क्या?</text>
        <rect class="lc-box" x="360" y="218" width="170" height="54" rx="12"/>
        <text class="lc-t" x="445" y="241" text-anchor="middle">3 · Key words</text>
        <text class="lc-s" x="445" y="260" text-anchor="middle">details के लिए फिर सुनो</text>
        <rect class="lc-box" x="110" y="218" width="170" height="54" rx="12"/>
        <text class="lc-t" x="195" y="241" text-anchor="middle">4 · पढ़ो</text>
        <text class="lc-s" x="195" y="260" text-anchor="middle">transcript + अनुवाद</text>
        <rect class="lc-box" x="15" y="88" width="175" height="54" rx="12"/>
        <text class="lc-t" x="102" y="111" text-anchor="middle">5 · लिखो और बोलो</text>
        <text class="lc-s" x="102" y="130" text-anchor="middle">dictée, ज़ोर से दोहराओ</text>
        <path class="lc-a" d="M407 40 Q470 44 500 80"/>
        <polygon class="lc-h" points="505,86 492,80 503,73"/>
        <path class="lc-a" d="M537 145 Q535 195 500 212"/>
        <polygon class="lc-h" points="493,215 501,204 506,213"/>
        <path class="lc-a" d="M357 245 L290 245"/>
        <polygon class="lc-h" points="283,245 293,239 293,251"/>
        <path class="lc-a" d="M150 215 Q105 195 102 150"/>
        <polygon class="lc-h" points="102,143 96,154 108,154"/>
        <path class="lc-a" d="M135 85 Q160 42 226 39"/>
        <polygon class="lc-h" points="233,39 223,33 223,45"/>
        <text class="lc-c" x="320" y="140" text-anchor="middle">हर कहानी के लिए</text>
        <text class="lc-c" x="320" y="160" text-anchor="middle">वही 5 steps</text>
        <text class="lc-s" x="320" y="180" text-anchor="middle">≈ 10 मिनट</text>
      </svg>