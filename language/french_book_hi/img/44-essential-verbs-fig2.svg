<svg viewBox="0 0 640 270" role="img" aria-label="चित्र: अंग्रेज़ी I miss you बनाम फ़्रेंच Tu me manques — कर्ता और कर्म की जगह अदला-बदली हो जाती है" xmlns="http://www.w3.org/2000/svg"><title>रंगीन डिब्बा = कर्ता, जो verb के अंत को नियंत्रित करता है। तीर दो व्यक्तियों की अदला-बदली दिखाते हैं।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs>
          <style>
            .rv-s { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
            .rv-b { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; }
            .rv-t { font: 700 16px var(--font); fill: var(--text); }
            .rv-v { fill: var(--role-verb); }
            .rv-l { font: 700 13px var(--font); fill: var(--text-soft); }
            .rv-n { font: 500 13px var(--font); fill: var(--text-soft); }
            .rv-a { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 5; }
          </style>
        </defs>
        <text class="rv-l" x="20" y="63">अंग्रेज़ी</text>
        <text class="rv-l" x="20" y="183">Français</text>
        <rect class="rv-s" x="150" y="40" width="90" height="36" rx="8"/>
        <rect class="rv-b" x="260" y="40" width="110" height="36" rx="8"/>
        <rect class="rv-b" x="390" y="40" width="90" height="36" rx="8"/>
        <rect class="rv-s" x="150" y="160" width="90" height="36" rx="8"/>
        <rect class="rv-b" x="260" y="160" width="70" height="36" rx="8"/>
        <rect class="rv-b" x="350" y="160" width="130" height="36" rx="8"/>
        <g class="rv-t" text-anchor="middle">
          <text x="195" y="64">I</text>
          <text class="rv-v" x="315" y="64">miss</text>
          <text x="435" y="64">you</text>
          <text x="195" y="184">Tu</text>
          <text x="295" y="184">me</text>
          <text class="rv-v" x="415" y="184">manques</text>
        </g>
        <path class="rv-a" d="M195 76 C195 118 295 118 295 160"/>
        <path class="rv-a" d="M435 76 C435 118 195 118 195 160"/>
        <text class="rv-n" x="500" y="63">कर्ता = I</text>
        <text class="rv-n" x="500" y="183">कर्ता = tu</text>
        <text class="rv-n" x="20" y="232">शाब्दिक: "तुम मुझे कम पड़ते हो": जिसकी याद आती है वही कर्ता है।</text>
        <text class="rv-n" x="20" y="254">यही तरीक़ा: Ce film me plaît = मुझे यह फ़िल्म पसंद है ("यह फ़िल्म मुझे भाती है")।</text>
      </svg>