<svg viewBox="0 0 640 230" role="img" aria-label="Positive imperative का क्रम: verb, फिर le la les, फिर moi toi lui nous vous leur, फिर y, फिर en। Negative imperative में pronouns verb से पहले सामान्य क्रम में रहते हैं।" xmlns="http://www.w3.org/2000/svg"><title>सिर्फ़ positive command में pronouns जगह बदलते हैं। ne … pas जोड़ते ही सब कुछ section 6 के पाँच खानों वाले क्रम में लौट आता है।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .pi-v { fill: var(--accent-soft); stroke: var(--role-verb); stroke-width: 2.5; }
        .pi-s { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
        .pi-w { font: 700 14px var(--font); fill: var(--text); }
        .pi-vt { font: 800 15px var(--font); fill: var(--role-verb); }
        .pi-h { font: 800 14px var(--font); fill: var(--accent); }
        .pi-s2 { font: 500 12px var(--font); fill: var(--text-soft); }
        .pi-w2 { font: 600 13px var(--font); fill: var(--text); }
      </style></defs>
      <text class="pi-h" x="20" y="26">POSITIVE: पहले verb, hyphens के साथ</text>
      <rect class="pi-v" x="20" y="40" width="110" height="56" rx="12"/>
      <text class="pi-vt" x="75" y="74" text-anchor="middle">VERB</text>
      <rect class="pi-s" x="140" y="40" width="110" height="56" rx="12"/>
      <text class="pi-w" x="195" y="73" text-anchor="middle">le · la · les</text>
      <rect class="pi-s" x="260" y="34" width="180" height="68" rx="12"/>
      <text class="pi-w" x="350" y="62" text-anchor="middle">moi · toi · lui</text>
      <text class="pi-w" x="350" y="84" text-anchor="middle">nous · vous · leur</text>
      <rect class="pi-s" x="450" y="40" width="70" height="56" rx="12"/>
      <text class="pi-w" x="485" y="73" text-anchor="middle">y</text>
      <rect class="pi-s" x="530" y="40" width="70" height="56" rx="12"/>
      <text class="pi-w" x="565" y="73" text-anchor="middle">en</text>
      <text class="pi-s2" x="20" y="124">Donne-le-moi ! · Dis-la-leur ! · Donne-m’en ! · Va-t’en ! · Vas-y !</text>
      <text class="pi-h" x="20" y="166">NEGATIVE: सामान्य क्रम, verb से पहले</text>
      <text class="pi-w2" x="20" y="194">Ne me le donne pas ! · Ne la leur dis pas ! · Ne t’en va pas ! · N’y va pas !</text>
    </svg>