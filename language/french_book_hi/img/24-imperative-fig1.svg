<svg viewBox="0 0 660 300" role="img" aria-label="आईने वाली तस्वीर। Positive: verb, फिर hyphens के साथ pronoun, जैसे Donne-le-moi और Lève-toi। Negative: ne, pronoun, verb, pas, जैसे Ne me le donne pas और Ne te lève pas।" xmlns="http://www.w3.org/2000/svg"><title>Positive आदेश pronouns को verb के पीछे पलट देते हैं; ne … pas उन्हें फिर आगे पलट देता है।</title><style>svg{--accent:#ea580c;--bad:#be123c;--bad-bg:#fdecef;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--line-strong:#cfd6e2;--role-verb:#0d9488;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .im-pos { fill: var(--good-bg); stroke: var(--good); stroke-width: 2; }
        .im-neg { fill: var(--bad-bg); stroke: var(--bad); stroke-width: 2; }
        .im-hp { font: 800 14px var(--font); fill: var(--good); }
        .im-hn { font: 800 14px var(--font); fill: var(--bad); }
        .im-v { font: 800 18px var(--font); fill: var(--role-verb); }
        .im-p { font: 800 18px var(--font); fill: var(--accent); }
        .im-w { font: 700 18px var(--font); fill: var(--text-soft); }
        .im-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .im-ln { fill: none; stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 5 5; }
      </style></defs>
      <rect class="im-pos" x="14" y="14" width="300" height="270" rx="16"/>
      <text class="im-hp" x="164" y="44" text-anchor="middle">POSITIVE ✓ — pronoun बाद में</text>
      <text class="im-v" x="40" y="96">Regarde</text><text class="im-p" x="124" y="96">-moi !</text>
      <text class="im-v" x="40" y="136">Donne</text><text class="im-p" x="104" y="136">-le-moi !</text>
      <text class="im-v" x="40" y="176">Lève</text><text class="im-p" x="88" y="176">-toi !</text>
      <text class="im-v" x="40" y="216">Dites</text><text class="im-p" x="96" y="216">-lui !</text>
      <text class="im-s" x="164" y="262" text-anchor="middle">me → moi · te → toi · hyphens</text>
      <path class="im-ln" d="M330 24 L330 274"/>
      <rect class="im-neg" x="346" y="14" width="300" height="270" rx="16"/>
      <text class="im-hn" x="496" y="44" text-anchor="middle">NEGATIVE ✗ — pronoun पहले</text>
      <text class="im-w" x="366" y="96">Ne</text><text class="im-p" x="396" y="96">me</text><text class="im-v" x="430" y="96">regarde</text><text class="im-w" x="508" y="96">pas !</text>
      <text class="im-w" x="366" y="136">Ne</text><text class="im-p" x="396" y="136">me le</text><text class="im-v" x="456" y="136">donne</text><text class="im-w" x="522" y="136">pas !</text>
      <text class="im-w" x="366" y="176">Ne</text><text class="im-p" x="396" y="176">te</text><text class="im-v" x="420" y="176">lève</text><text class="im-w" x="468" y="176">pas !</text>
      <text class="im-w" x="366" y="216">Ne</text><text class="im-p" x="396" y="216">lui</text><text class="im-v" x="430" y="216">dites</text><text class="im-w" x="486" y="216">rien !</text>
      <text class="im-s" x="496" y="262" text-anchor="middle">सामान्य क्रम · me, te वही रहते हैं · hyphen नहीं</text>
    </svg>