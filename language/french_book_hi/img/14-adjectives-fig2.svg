<svg viewBox="0 0 640 330" role="img" aria-label="Noun से पहले और बाद में। mon ancien professeur का मतलब मेरे पूर्व शिक्षक; une maison ancienne का मतलब एक पुराना घर। ma chère amie का मतलब मेरी प्रिय सहेली; une robe chère का मतलब एक महँगी ड्रेस। ma propre chambre का मतलब मेरा अपना कमरा; une chambre propre का मतलब एक साफ़ कमरा। un grand homme का मतलब एक महान आदमी; un homme grand का मतलब एक लंबा आदमी। un pauvre homme का मतलब एक बेचारा आदमी; un homme pauvre का मतलब एक ग़रीब आदमी।" xmlns="http://www.w3.org/2000/svg"><title>पहले = आप उसके बारे में कैसा महसूस करते हैं; बाद में = वह असल में क्या है। और भी: le seul ami (इकलौता दोस्त) / un homme seul (अकेला आदमी)।</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-adj:#9333ea;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .cb { fill: var(--accent-soft); } .ca { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.2; }
          .hh2 { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
          .fr2 { font: 700 14px var(--font); fill: var(--text); }
          .ad2 { fill: var(--role-adj); font-weight: 800; }
          .en2 { font: 500 12px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="hh2" x="165" y="22" text-anchor="middle">पहले · लाक्षणिक</text>
        <text class="hh2" x="475" y="22" text-anchor="middle">बाद में · शाब्दिक</text>
        <rect class="cb" x="20" y="34" width="290" height="50" rx="10"/><text class="fr2" x="34" y="56">mon <tspan class="ad2">ancien</tspan> professeur</text><text class="en2" x="34" y="74">मेरे पूर्व शिक्षक</text>
        <rect class="ca" x="330" y="34" width="290" height="50" rx="10"/><text class="fr2" x="344" y="56">une maison <tspan class="ad2">ancienne</tspan></text><text class="en2" x="344" y="74">एक पुराना (ऐतिहासिक) घर</text>
        <rect class="cb" x="20" y="92" width="290" height="50" rx="10"/><text class="fr2" x="34" y="114">ma <tspan class="ad2">chère</tspan> amie</text><text class="en2" x="34" y="132">मेरी प्रिय सहेली</text>
        <rect class="ca" x="330" y="92" width="290" height="50" rx="10"/><text class="fr2" x="344" y="114">une robe <tspan class="ad2">chère</tspan></text><text class="en2" x="344" y="132">एक महँगी ड्रेस</text>
        <rect class="cb" x="20" y="150" width="290" height="50" rx="10"/><text class="fr2" x="34" y="172">ma <tspan class="ad2">propre</tspan> chambre</text><text class="en2" x="34" y="190">मेरा अपना कमरा</text>
        <rect class="ca" x="330" y="150" width="290" height="50" rx="10"/><text class="fr2" x="344" y="172">une chambre <tspan class="ad2">propre</tspan></text><text class="en2" x="344" y="190">एक साफ़ कमरा</text>
        <rect class="cb" x="20" y="208" width="290" height="50" rx="10"/><text class="fr2" x="34" y="230">un <tspan class="ad2">grand</tspan> homme</text><text class="en2" x="34" y="248">एक महान आदमी</text>
        <rect class="ca" x="330" y="208" width="290" height="50" rx="10"/><text class="fr2" x="344" y="230">un homme <tspan class="ad2">grand</tspan></text><text class="en2" x="344" y="248">एक लंबा आदमी</text>
        <rect class="cb" x="20" y="266" width="290" height="50" rx="10"/><text class="fr2" x="34" y="288">un <tspan class="ad2">pauvre</tspan> homme</text><text class="en2" x="34" y="306">एक बेचारा (दुर्भाग्यशाली) आदमी</text>
        <rect class="ca" x="330" y="266" width="290" height="50" rx="10"/><text class="fr2" x="344" y="288">un homme <tspan class="ad2">pauvre</tspan></text><text class="en2" x="344" y="306">एक ग़रीब (बिना पैसे वाला) आदमी</text>
      </svg>