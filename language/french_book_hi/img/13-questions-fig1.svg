<svg viewBox="0 0 640 300" role="img" aria-label="Register की सीढ़ी। सबसे नीचे की सीढ़ी, रोज़ की बोलचाल: intonation, Tu parles français? बीच की सीढ़ी, सामान्य और हमेशा सुरक्षित: est-ce que, Est-ce que tu parles français? सबसे ऊपर की सीढ़ी, औपचारिक और लिखित: inversion, Parles-tu français?" xmlns="http://www.w3.org/2000/svg"><title>तीनों का मतलब है “क्या आप फ़्रेंच बोलते हैं?”। A1 में नीचे के दो तरीक़ों से बोलो, और सबसे ऊपर वाले को पढ़ना सीखो।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .st1 { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .st2 { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .sh { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
          .sx { font: 700 16px var(--font); fill: var(--text); }
          .sv2 { fill: var(--role-verb); }
          .sn { font: 500 12px var(--font); fill: var(--text-soft); }
          .ar2 { stroke: var(--text-soft); stroke-width: 2; fill: none; }
        </style></defs>
        <rect class="st1" x="20" y="208" width="400" height="74" rx="14"/>
        <text class="sh" x="40" y="232">रोज़ की बोलचाल · INTONATION</text>
        <text class="sx" x="40" y="258">Tu <tspan class="sv2">parles</tspan> français ? ↗</text>
        <text class="sn" x="40" y="275">वाक्य वही, बस आख़िर में आवाज़ ऊपर उठती है</text>
        <rect class="st2" x="110" y="114" width="400" height="74" rx="14"/>
        <text class="sh" x="130" y="138">सामान्य · हमेशा सुरक्षित · EST-CE QUE</text>
        <text class="sx" x="130" y="164">Est-ce que tu <tspan class="sv2">parles</tspan> français ?</text>
        <text class="sn" x="130" y="181">आगे est-ce que जोड़ो — शब्द-क्रम नहीं बदलता</text>
        <rect class="st1" x="200" y="20" width="420" height="74" rx="14"/>
        <text class="sh" x="220" y="44">औपचारिक · लेखन · INVERSION</text>
        <text class="sx" x="220" y="70"><tspan class="sv2">Parles</tspan>-tu français ?</text>
        <text class="sn" x="220" y="87">पहले verb, फिर hyphen, फिर subject pronoun</text>
        <path class="ar2" d="M560 270 V120 M552 130 L560 118 L568 130"/>
        <text class="sn" x="575" y="200" transform="rotate(-90 575 200)">ज़्यादा औपचारिक</text>
      </svg>