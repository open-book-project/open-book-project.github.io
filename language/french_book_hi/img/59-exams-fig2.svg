<svg viewBox="0 0 640 300" role="img" aria-label="चार DELF papers, हर एक 25 में से, स्तंभों के रूप में, 25 में से 5 पर एक कट-ऑफ़ रेखा और 100 में से 50 के पास होने वाले कुल अंक के साथ" xmlns="http://www.w3.org/2000/svg"><title>एक उदाहरण परिणाम। कमज़ोर writing (10/25) चलेगी क्योंकि कुल 60 है और कोई paper 5 से कम नहीं। किसी एक भी paper में 4/25 पूरा exam फ़ेल करा देगा, भले ही कुल 80/100 हो।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .col { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .fillc { fill: var(--accent); opacity: .55; }
          .el { stroke: var(--g-f); stroke-width: 2.5; stroke-dasharray: 6 5; fill: none; }
          .t1 { font: 700 14px var(--font); fill: var(--text); }
          .t2 { font: 500 12px var(--font); fill: var(--text-soft); }
          .t3 { font: 700 13px var(--font); fill: var(--g-f); }
          .tot { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
        </style></defs>
        <rect class="col" x="40" y="40" width="80" height="200" rx="6"/>
        <rect class="col" x="140" y="40" width="80" height="200" rx="6"/>
        <rect class="col" x="240" y="40" width="80" height="200" rx="6"/>
        <rect class="col" x="340" y="40" width="80" height="200" rx="6"/>
        <rect class="fillc" x="40" y="96" width="80" height="144" rx="6"/>
        <rect class="fillc" x="140" y="120" width="80" height="120" rx="6"/>
        <rect class="fillc" x="240" y="160" width="80" height="80" rx="6"/>
        <rect class="fillc" x="340" y="104" width="80" height="136" rx="6"/>
        <path class="el" d="M30 200 L430 200"/>
        <text class="t3" x="436" y="204">5/25 = कट-ऑफ़ रेखा</text>
        <text class="t1" x="80" y="262" text-anchor="middle">सुनना</text>
        <text class="t1" x="180" y="262" text-anchor="middle">पढ़ना</text>
        <text class="t1" x="280" y="262" text-anchor="middle">लिखना</text>
        <text class="t1" x="380" y="262" text-anchor="middle">बोलना</text>
        <text class="t2" x="80" y="280" text-anchor="middle">CO · 18/25</text>
        <text class="t2" x="180" y="280" text-anchor="middle">CE · 15/25</text>
        <text class="t2" x="280" y="280" text-anchor="middle">PE · 10/25</text>
        <text class="t2" x="380" y="280" text-anchor="middle">PO · 17/25</text>
        <rect class="tot" x="455" y="60" width="170" height="110" rx="12"/>
        <text class="t1" x="540" y="90" text-anchor="middle">कुल 60/100</text>
        <text class="t2" x="540" y="114" text-anchor="middle">≥ 50 और कोई paper</text>
        <text class="t2" x="540" y="132" text-anchor="middle">5/25 से कम नहीं</text>
