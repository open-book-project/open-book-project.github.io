<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif" role="img" aria-label="Wohin with the accusative and wo with the dative">
  <rect x="0" y="0" width="720" height="380" rx="12" fill="#fdfaf3"/>
  <rect x="20" y="20" width="330" height="270" rx="10" fill="#fff4e6" stroke="#c2410c" stroke-width="2"/>
  <rect x="370" y="20" width="330" height="270" rx="10" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="2"/>
  <text x="185" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#7c2d12">Wohin? movement</text>
  <text x="185" y="72" text-anchor="middle" font-size="15" fill="#7c2d12">→ accusative</text>
  <text x="535" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3c66">Wo? position</text>
  <text x="535" y="72" text-anchor="middle" font-size="15" fill="#1f3c66">→ dative</text>
  <g stroke="#555" stroke-width="2" fill="#ffffff">
    <polygon points="210,140 260,100 310,140"/><rect x="220" y="140" width="80" height="60"/>
    <polygon points="510,140 560,100 610,140"/><rect x="520" y="140" width="80" height="60"/>
  </g>
  <g fill="#c2410c"><circle cx="90" cy="150" r="9"/><rect x="84" y="160" width="12" height="28" rx="4"/></g>
  <path d="M110 170 L210 170" stroke="#c2410c" stroke-width="3"/>
  <polygon points="210,162 226,170 210,178" fill="#c2410c"/>
  <g fill="#2f5d9a"><circle cx="560" cy="160" r="9"/><rect x="554" y="170" width="12" height="26" rx="4"/></g>
  <g font-size="15" fill="#222">
    <text x="40" y="232">Ich gehe in <tspan font-weight="bold">die</tspan> Küche.</text>
    <text x="40" y="256">Ich gehe <tspan font-weight="bold">ins</tspan> Kino.</text>
    <text x="40" y="280">Ich lege das Buch auf <tspan font-weight="bold">den</tspan> Tisch.</text>
    <text x="390" y="232">Ich bin in <tspan font-weight="bold">der</tspan> Küche.</text>
    <text x="390" y="256">Ich bin <tspan font-weight="bold">im</tspan> Kino.</text>
    <text x="390" y="280">Das Buch liegt auf <tspan font-weight="bold">dem</tspan> Tisch.</text>
  </g>
  <rect x="20" y="304" width="680" height="58" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="328" text-anchor="middle" font-size="14" fill="#333">The nine two-way prepositions:</text>
  <text x="360" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">in · an · auf · neben · vor · hinter · über · unter · zwischen</text>
</svg>
