<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="sans-serif" role="img" aria-label="The menu of Café Lindenhof">
  <rect x="0" y="0" width="720" height="440" rx="12" fill="#fdfaf3"/>
  <rect x="40" y="20" width="640" height="400" rx="10" fill="#fffdf6" stroke="#8a6d3b" stroke-width="2"/>
  <text x="360" y="58" text-anchor="middle" font-size="24" font-weight="bold" fill="#5a3e12" font-family="serif">Café Lindenhof</text>
  <text x="360" y="80" text-anchor="middle" font-size="14" fill="#7a5c2a" font-style="italic">Speisekarte</text>
  <line x1="80" y1="92" x2="640" y2="92" stroke="#c9a96b" stroke-width="1.5"/>
  <g font-size="16" font-weight="bold" fill="#5a3e12">
    <text x="80" y="122">Getränke</text>
    <text x="380" y="122">Speisen</text>
  </g>
  <g font-size="15" fill="#222">
    <text x="80" y="152">Kaffee</text><text x="330" y="152" text-anchor="end">2,80 €</text>
    <text x="80" y="178">Cappuccino</text><text x="330" y="178" text-anchor="end">3,50 €</text>
    <text x="80" y="204">Tee (Milch, Zitrone)</text><text x="330" y="204" text-anchor="end">2,70 €</text>
    <text x="80" y="230">Mineralwasser 0,4 l</text><text x="330" y="230" text-anchor="end">2,60 €</text>
    <text x="80" y="256">Apfelschorle 0,4 l</text><text x="330" y="256" text-anchor="end">3,20 €</text>
    <text x="80" y="282">Bier 0,5 l</text><text x="330" y="282" text-anchor="end">4,20 €</text>
    <text x="380" y="152">Kartoffelsuppe (vegetarisch)</text><text x="640" y="152" text-anchor="end">8,30 €</text>
    <text x="380" y="178">Käsespätzle mit Salat</text><text x="640" y="178" text-anchor="end">11,50 €</text>
    <text x="380" y="204">Bratwurst mit Brot</text><text x="640" y="204" text-anchor="end">7,90 €</text>
    <text x="380" y="230">Gemischter Salat</text><text x="640" y="230" text-anchor="end">6,80 €</text>
    <text x="380" y="256">Apfelkuchen</text><text x="640" y="256" text-anchor="end">3,90 €</text>
    <text x="380" y="282">mit Sahne</text><text x="640" y="282" text-anchor="end">+ 0,80 €</text>
  </g>
  <line x1="80" y1="306" x2="640" y2="306" stroke="#c9a96b" stroke-width="1.5"/>
  <g font-size="14" fill="#444">
    <text x="360" y="334" text-anchor="middle">Ravi: Cappuccino 3,50 € + Kartoffelsuppe 8,30 € = 11,80 €</text>
    <text x="360" y="358" text-anchor="middle">Emma: Tee 2,70 € + Käsespätzle 11,50 € = 14,20 €</text>
    <text x="360" y="392" text-anchor="middle" font-style="italic" fill="#7a5c2a">Prices include service. A small tip is usual: say the total you want to pay.</text>
  </g>
</svg>
