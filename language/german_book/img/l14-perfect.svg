<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif" role="img" aria-label="The perfect tense and the past participle">
  <rect x="0" y="0" width="720" height="400" rx="12" fill="#fdfaf3"/>
  <g font-size="19" fill="#222">
    <text x="40" y="70">Ich</text>
    <rect x="90" y="48" width="70" height="32" rx="6" fill="#fed7aa" stroke="#c2410c"/>
    <text x="125" y="70" text-anchor="middle" font-weight="bold" fill="#7c2d12">habe</text>
    <text x="175" y="70">gestern einen Film</text>
    <rect x="540" y="48" width="110" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="595" y="70" text-anchor="middle" font-weight="bold" fill="#1d4ed8">gesehen.</text>
    <path d="M125 44 L125 28 L595 28 L595 44" fill="none" stroke="#888" stroke-width="2"/>
  </g>
  <text x="360" y="104" text-anchor="middle" font-size="13" fill="#444">haben or sein in position 2 · past participle at the end</text>
  <g font-size="14" fill="#222">
    <rect x="20" y="125" width="330" height="120" rx="10" fill="#f1f7ee" stroke="#4d7c4d"/>
    <text x="35" y="150" font-weight="bold" font-size="15" fill="#244d24">regular: ge- + stem + -t</text>
    <text x="35" y="178">machen → gemacht</text>
    <text x="35" y="202">kaufen → gekauft</text>
    <text x="35" y="226">arbeiten → gearbeitet</text>
    <rect x="370" y="125" width="330" height="120" rx="10" fill="#fdf0e3" stroke="#b5752a"/>
    <text x="385" y="150" font-weight="bold" font-size="15" fill="#6b3f0c">irregular: ge- + stem + -en</text>
    <text x="385" y="178">sehen → gesehen</text>
    <text x="385" y="202">trinken → getrunken (new vowel)</text>
    <text x="385" y="226">schreiben → geschrieben</text>
    <rect x="20" y="260" width="330" height="120" rx="10" fill="#e3ecf8" stroke="#4a6fa5"/>
    <text x="35" y="285" font-weight="bold" font-size="15" fill="#1f3c66">separable: prefix + ge- + verb</text>
    <text x="35" y="313">einkaufen → eingekauft</text>
    <text x="35" y="337">anrufen → angerufen</text>
    <text x="35" y="361">aufstehen → aufgestanden</text>
    <rect x="370" y="260" width="330" height="120" rx="10" fill="#f3e8fb" stroke="#7c3aed"/>
    <text x="385" y="285" font-weight="bold" font-size="15" fill="#4c1d95">no ge-: be-, ver-, er- … and -ieren</text>
    <text x="385" y="313">besuchen → besucht</text>
    <text x="385" y="337">verstehen → verstanden</text>
    <text x="385" y="361">studieren → studiert</text>
  </g>
</svg>
