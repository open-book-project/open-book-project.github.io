<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" role="img" aria-label="Nominative and accusative: only the masculine changes">
  <rect x="0" y="0" width="720" height="330" rx="12" fill="#fdfaf3"/>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="245" y="38" fill="#1d4ed8">masculine</text>
    <text x="395" y="38" fill="#be185d">feminine</text>
    <text x="530" y="38" fill="#444">neuter</text>
    <text x="645" y="38" fill="#6d28d9">plural</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="20" y="92">nominative</text>
    <text x="20" y="108" font-size="12" fill="#666">(subject)</text>
    <text x="20" y="232">accusative</text>
    <text x="20" y="248" font-size="12" fill="#666">(object)</text>
  </g>
  <rect x="170" y="56" width="150" height="74" rx="8" fill="#e3ecf8" stroke="#2563eb"/>
  <rect x="170" y="196" width="150" height="74" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <g font-size="17" text-anchor="middle" fill="#222">
    <text x="245" y="82">der</text><text x="245" y="104">ein · kein</text><text x="245" y="124" font-size="14">mein</text>
    <text x="245" y="222" font-weight="bold" fill="#7c2d12">den</text><text x="245" y="244" font-weight="bold" fill="#7c2d12">einen · keinen</text><text x="245" y="264" font-size="14" font-weight="bold" fill="#7c2d12">meinen</text>
  </g>
  <path d="M245 136 L245 186" stroke="#c2410c" stroke-width="3"/>
  <polygon points="236,180 254,180 245,194" fill="#c2410c"/>
  <g font-size="17" text-anchor="middle" fill="#222">
    <rect x="335" y="56" width="120" height="74" rx="8" fill="#fbe3ef" stroke="#db2777"/>
    <text x="395" y="84">die</text><text x="395" y="108">eine · keine</text>
    <rect x="335" y="196" width="120" height="74" rx="8" fill="#fbe3ef" stroke="#db2777"/>
    <text x="395" y="224">die</text><text x="395" y="248">eine · keine</text>
    <rect x="470" y="56" width="120" height="74" rx="8" fill="#eeeeee" stroke="#666"/>
    <text x="530" y="84">das</text><text x="530" y="108">ein · kein</text>
    <rect x="470" y="196" width="120" height="74" rx="8" fill="#eeeeee" stroke="#666"/>
    <text x="530" y="224">das</text><text x="530" y="248">ein · kein</text>
    <rect x="605" y="56" width="95" height="74" rx="8" fill="#ede6fb" stroke="#7c3aed"/>
    <text x="652" y="84">die</text><text x="652" y="108">keine</text>
    <rect x="605" y="196" width="95" height="74" rx="8" fill="#ede6fb" stroke="#7c3aed"/>
    <text x="652" y="224">die</text><text x="652" y="248">keine</text>
  </g>
  <g font-size="30" text-anchor="middle" fill="#888">
    <text x="395" y="172">=</text><text x="530" y="172">=</text><text x="652" y="172">=</text>
  </g>
  <text x="360" y="308" text-anchor="middle" font-size="15" fill="#333">In the accusative, only the masculine changes: der → den, ein → einen.</text>
</svg>
