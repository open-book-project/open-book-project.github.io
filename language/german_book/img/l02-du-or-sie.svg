<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif" role="img" aria-label="Du or Sie: a decision chart">
  <rect x="0" y="0" width="720" height="400" rx="12" fill="#fdfaf3"/>
  <rect x="235" y="18" width="250" height="44" rx="22" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="360" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Who are you talking to?</text>
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M300 62 L190 96"/>
    <path d="M420 62 L530 96"/>
  </g>
  <polygon points="190,96 200,86 204,97" fill="#555"/>
  <polygon points="530,96 516,97 520,86" fill="#555"/>
  <rect x="30" y="100" width="320" height="225" rx="10" fill="#e6f2e6" stroke="#4d7c4d" stroke-width="2"/>
  <rect x="370" y="100" width="320" height="225" rx="10" fill="#e8eaf6" stroke="#4a5aa5" stroke-width="2"/>
  <text x="190" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#244d24">du (one) · ihr (several)</text>
  <text x="530" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#26306b">Sie (one or several)</text>
  <g font-size="14" fill="#222">
    <text x="50" y="162">• family and friends</text>
    <text x="50" y="186">• children and animals</text>
    <text x="50" y="210">• other students, young people</text>
    <text x="50" y="234">• colleagues in many workplaces</text>
    <text x="50" y="258">• first names: Emma, Jonas</text>
    <text x="50" y="282">• anyone who offers du</text>
    <text x="390" y="162">• adults you do not know</text>
    <text x="390" y="186">• shop, café and office staff</text>
    <text x="390" y="210">• teachers and lecturers</text>
    <text x="390" y="234">• doctors and officials</text>
    <text x="390" y="258">• surnames: Herr Becker, Frau Wagner</text>
    <text x="390" y="282">• formal work relations</text>
  </g>
  <text x="190" y="310" text-anchor="middle" font-size="13" fill="#244d24">Wie heißt du? · Woher kommt ihr?</text>
  <text x="530" y="310" text-anchor="middle" font-size="13" fill="#26306b">Wie heißen Sie? · Woher kommen Sie?</text>
  <rect x="30" y="342" width="660" height="40" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="368" text-anchor="middle" font-size="14" fill="#333">In doubt, use Sie with adults, and wait for the other person to offer du.</text>
</svg>
