<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif" role="img" aria-label="The two sounds of ch">
  <rect x="0" y="0" width="720" height="380" rx="12" fill="#fdfaf3"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ch: look at the letter before it</text>
  <rect x="30" y="56" width="315" height="230" rx="10" fill="#e3ecf8" stroke="#4a6fa5" stroke-width="2"/>
  <rect x="375" y="56" width="315" height="230" rx="10" fill="#f8ead9" stroke="#b5752a" stroke-width="2"/>
  <text x="187" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f3c66">ach sound [kh]</text>
  <text x="187" y="108" text-anchor="middle" font-size="13" fill="#333">after a, o, u, au</text>
  <text x="187" y="126" text-anchor="middle" font-size="13" fill="#333">back of the mouth, as in Scottish loch</text>
  <text x="532" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b3f0c">ich sound [ç]</text>
  <text x="532" y="108" text-anchor="middle" font-size="13" fill="#333">after e, i, ä, ö, ü, ei, eu, consonants;</text>
  <text x="532" y="126" text-anchor="middle" font-size="13" fill="#333">in -chen; front of the mouth, as in huge</text>
  <g font-size="19" fill="#222" text-anchor="middle">
    <text x="187" y="162">Bach</text>
    <text x="187" y="188">noch</text>
    <text x="187" y="214">Buch</text>
    <text x="187" y="240">auch</text>
    <text x="187" y="266">Nacht</text>
    <text x="532" y="162">ich</text>
    <text x="532" y="188">nicht</text>
    <text x="532" y="214">Bücher</text>
    <text x="532" y="240">Milch</text>
    <text x="532" y="266">Mädchen</text>
  </g>
  <rect x="30" y="302" width="660" height="60" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="327" text-anchor="middle" font-size="14" fill="#333">chs is said [ks]: sechs, wachsen</text>
  <text x="360" y="349" text-anchor="middle" font-size="14" fill="#333">final -ig is said like -ich in standard German: zwanzig, richtig</text>
</svg>
