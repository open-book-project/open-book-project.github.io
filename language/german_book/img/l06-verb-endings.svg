<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif" role="img" aria-label="Stem and endings of the present tense">
  <rect x="0" y="0" width="720" height="400" rx="12" fill="#fdfaf3"/>
  <text x="30" y="36" font-size="17" font-weight="bold" fill="#222">spielen = stem + ending</text>
  <rect x="40" y="100" width="130" height="56" rx="10" fill="#e5e5e5" stroke="#666" stroke-width="2"/>
  <text x="105" y="136" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">spiel-</text>
  <g stroke="#888" stroke-width="1.5" fill="none">
    <path d="M170 128 L250 60"/><path d="M170 128 L250 90"/><path d="M170 128 L250 120"/>
    <path d="M170 128 L250 150"/><path d="M170 128 L250 180"/><path d="M170 128 L250 210"/>
  </g>
  <g font-size="17">
    <rect x="252" y="46" width="56" height="26" rx="6" fill="#dbeafe"/><text x="280" y="65" text-anchor="middle" font-weight="bold" fill="#1d4ed8">-e</text>
    <rect x="252" y="76" width="56" height="26" rx="6" fill="#dcfce7"/><text x="280" y="95" text-anchor="middle" font-weight="bold" fill="#15803d">-st</text>
    <rect x="252" y="106" width="56" height="26" rx="6" fill="#fef3c7"/><text x="280" y="125" text-anchor="middle" font-weight="bold" fill="#b45309">-t</text>
    <rect x="252" y="136" width="56" height="26" rx="6" fill="#fce7f3"/><text x="280" y="155" text-anchor="middle" font-weight="bold" fill="#be185d">-en</text>
    <rect x="252" y="166" width="56" height="26" rx="6" fill="#fef3c7"/><text x="280" y="185" text-anchor="middle" font-weight="bold" fill="#b45309">-t</text>
    <rect x="252" y="196" width="56" height="26" rx="6" fill="#fce7f3"/><text x="280" y="215" text-anchor="middle" font-weight="bold" fill="#be185d">-en</text>
  </g>
  <g font-size="16" fill="#222">
    <text x="325" y="65">ich spiele</text>
    <text x="325" y="95">du spielst</text>
    <text x="325" y="125">er, sie, es spielt</text>
    <text x="325" y="155">wir spielen</text>
    <text x="325" y="185">ihr spielt</text>
    <text x="325" y="215">sie, Sie spielen</text>
  </g>
  <line x1="30" y1="246" x2="690" y2="246" stroke="#ccc" stroke-width="1.5"/>
  <text x="30" y="276" font-size="17" font-weight="bold" fill="#222">fahren: the vowel changes only with du and er, sie, es</text>
  <g font-size="17" fill="#222">
    <text x="40" y="312">ich fahre</text>
    <text x="40" y="340">wir fahren</text>
    <text x="40" y="368">ihr fahrt</text>
    <rect x="248" y="292" width="200" height="56" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="262" y="314">du f<tspan font-weight="bold">ä</tspan>hrst</text>
    <text x="262" y="340">er, sie, es f<tspan font-weight="bold">ä</tspan>hrt</text>
    <text x="480" y="312" font-size="14" fill="#444">also e → i: du sprichst</text>
    <text x="480" y="340" font-size="14" fill="#444">and e → ie: du liest</text>
    <text x="480" y="368" font-size="14" fill="#444">the endings never change</text>
  </g>
</svg>
