<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" role="img" aria-label="A timeline of Emma's weekday">
  <rect x="0" y="0" width="720" height="300" rx="12" fill="#fdfaf3"/>
  <line x1="40" y1="150" x2="690" y2="150" stroke="#555" stroke-width="3"/>
  <g font-size="13" fill="#222" text-anchor="middle">
    <g><circle cx="50" cy="150" r="6" fill="#2563eb"/><text x="50" y="135" font-weight="bold">6.30</text><text x="50" y="118">steht auf</text></g>
    <g><circle cx="115" cy="150" r="6" fill="#2563eb"/><text x="115" y="175" font-weight="bold">6.40</text><text x="115" y="192">duscht sich,</text><text x="115" y="207">zieht sich an</text></g>
    <g><circle cx="180" cy="150" r="6" fill="#2563eb"/><text x="180" y="135" font-weight="bold">7.00</text><text x="180" y="118">frühstückt</text></g>
    <g><circle cx="245" cy="150" r="6" fill="#2563eb"/><text x="245" y="175" font-weight="bold">7.30</text><text x="245" y="192">geht los</text></g>
    <g><circle cx="310" cy="150" r="6" fill="#c2410c"/><text x="310" y="135" font-weight="bold">8.00</text><text x="310" y="118">der Kurs</text><text x="310" y="103">fängt an</text></g>
    <g><circle cx="380" cy="150" r="6" fill="#2563eb"/><text x="380" y="175" font-weight="bold">13.00</text><text x="380" y="192">kommt nach</text><text x="380" y="207">Hause</text></g>
    <g><circle cx="450" cy="150" r="6" fill="#2563eb"/><text x="450" y="135" font-weight="bold">15.00</text><text x="450" y="118">kauft ein</text></g>
    <g><circle cx="520" cy="150" r="6" fill="#2563eb"/><text x="520" y="175" font-weight="bold">19.00</text><text x="520" y="192">kocht</text></g>
    <g><circle cx="590" cy="150" r="6" fill="#2563eb"/><text x="590" y="135" font-weight="bold">21.00</text><text x="590" y="118">sieht fern</text></g>
    <g><circle cx="670" cy="150" r="6" fill="#6d28d9"/><text x="670" y="175" font-weight="bold">23.00</text><text x="670" y="192">schläft ein</text></g>
  </g>
  <text x="360" y="40" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Emmas Tag</text>
  <text x="360" y="270" text-anchor="middle" font-size="13" fill="#444">Separable verbs: steht auf, zieht sich an, geht los, fängt an, kauft ein, sieht fern, schläft ein</text>
</svg>
