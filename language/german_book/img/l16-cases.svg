<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif" role="img" aria-label="Which case? An overview">
  <rect x="0" y="0" width="720" height="420" rx="12" fill="#fdfaf3"/>
  <rect x="20" y="20" width="210" height="300" rx="10" fill="#eeeeee" stroke="#666" stroke-width="2"/>
  <rect x="255" y="20" width="210" height="300" rx="10" fill="#fff4e6" stroke="#c2410c" stroke-width="2"/>
  <rect x="490" y="20" width="210" height="300" rx="10" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="2"/>
  <g text-anchor="middle" font-weight="bold" font-size="18">
    <text x="125" y="52" fill="#333">Nominative</text>
    <text x="360" y="52" fill="#7c2d12">Accusative</text>
    <text x="595" y="52" fill="#1f3c66">Dative</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#555">
    <text x="125" y="72">der · ein · er</text>
    <text x="360" y="72">den · einen · ihn</text>
    <text x="595" y="72">dem · der · den -n · ihm</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="34" y="106">• the subject</text>
    <text x="34" y="132">• after sein,</text>
    <text x="48" y="150">heißen, werden</text>
    <text x="34" y="186" font-style="italic" fill="#444">Der Mann ist</text>
    <text x="34" y="204" font-style="italic" fill="#444">mein Bruder.</text>
    <text x="269" y="106">• the direct object</text>
    <text x="269" y="132">• after es gibt</text>
    <text x="269" y="158">• after durch, für,</text>
    <text x="283" y="176">gegen, ohne, um</text>
    <text x="269" y="202">• wohin? (movement)</text>
    <text x="283" y="220">after two-way prep.</text>
    <text x="269" y="256" font-style="italic" fill="#444">Ich kaufe einen Stuhl</text>
    <text x="269" y="274" font-style="italic" fill="#444">für meinen Vater.</text>
    <text x="504" y="106">• the indirect object</text>
    <text x="504" y="132">• after aus, bei, mit,</text>
    <text x="518" y="150">nach, seit, von, zu</text>
    <text x="504" y="176">• gefallen, helfen,</text>
    <text x="518" y="194">danken, gehören</text>
    <text x="504" y="220">• wo? (position)</text>
    <text x="518" y="238">after two-way prep.</text>
    <text x="504" y="274" font-style="italic" fill="#444">Ich fahre mit dem Bus.</text>
    <text x="504" y="292" font-style="italic" fill="#444">Wien gefällt mir.</text>
  </g>
  <rect x="255" y="336" width="445" height="66" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="477" y="360" text-anchor="middle" font-size="14" fill="#333">two-way: in · an · auf · neben · vor · hinter · über · unter · zwischen</text>
  <text x="477" y="384" text-anchor="middle" font-size="14" fill="#333">wohin? → accusative · wo? → dative</text>
  <path d="M360 320 L400 336" stroke="#c2410c" stroke-width="2"/>
  <path d="M595 320 L555 336" stroke="#2f5d9a" stroke-width="2"/>
</svg>
