<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="sans-serif" role="img" aria-label="The verb comes second">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#fdfaf3"/>
  <text x="120" y="34" text-anchor="middle" font-size="14" fill="#444">position 1</text>
  <text x="335" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">position 2: always the verb</text>
  <text x="560" y="34" text-anchor="middle" font-size="14" fill="#444">the rest</text>
  <g font-size="17" fill="#222">
    <rect x="20" y="50" width="200" height="44" rx="8" fill="#e3ecf8" stroke="#4a6fa5"/>
    <text x="120" y="78" text-anchor="middle">Wir</text>
    <rect x="20" y="110" width="200" height="44" rx="8" fill="#e3ecf8" stroke="#4a6fa5"/>
    <text x="120" y="138" text-anchor="middle">Morgen</text>
    <rect x="20" y="170" width="200" height="44" rx="8" fill="#e3ecf8" stroke="#4a6fa5"/>
    <text x="120" y="198" text-anchor="middle">Nach Dresden</text>
    <rect x="20" y="230" width="200" height="44" rx="8" fill="#e3ecf8" stroke="#4a6fa5"/>
    <text x="120" y="258" text-anchor="middle">Um neun Uhr zwölf</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#7c2d12">
    <rect x="270" y="50" width="130" height="44" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="335" y="78" text-anchor="middle">fahren</text>
    <rect x="270" y="110" width="130" height="44" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="335" y="138" text-anchor="middle">fahren</text>
    <rect x="270" y="170" width="130" height="44" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="335" y="198" text-anchor="middle">fahren</text>
    <rect x="270" y="230" width="130" height="44" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="335" y="258" text-anchor="middle">fahren</text>
  </g>
  <g font-size="17" fill="#222">
    <rect x="440" y="50" width="260" height="44" rx="8" fill="#f1f1f1" stroke="#999"/>
    <text x="570" y="78" text-anchor="middle">morgen nach Dresden.</text>
    <rect x="440" y="110" width="260" height="44" rx="8" fill="#f1f1f1" stroke="#999"/>
    <text x="570" y="138" text-anchor="middle"><tspan font-weight="bold">wir</tspan> nach Dresden.</text>
    <rect x="440" y="170" width="260" height="44" rx="8" fill="#f1f1f1" stroke="#999"/>
    <text x="570" y="198" text-anchor="middle"><tspan font-weight="bold">wir</tspan> morgen.</text>
    <rect x="440" y="230" width="260" height="44" rx="8" fill="#f1f1f1" stroke="#999"/>
    <text x="570" y="258" text-anchor="middle"><tspan font-weight="bold">wir</tspan> nach Dresden.</text>
  </g>
  <text x="360" y="306" text-anchor="middle" font-size="14" fill="#333">Position 1 holds one element of any length. If it is not the subject,</text>
  <text x="360" y="326" text-anchor="middle" font-size="14" fill="#333">the subject (wir) comes straight after the verb.</text>
</svg>
