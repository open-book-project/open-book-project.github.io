<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="sans-serif" role="img" aria-label="Clues to the gender of German nouns">
  <rect x="0" y="0" width="720" height="430" rx="12" fill="#fdfaf3"/>
  <rect x="20" y="20" width="220" height="310" rx="10" fill="#e3ecf8" stroke="#2563eb" stroke-width="2"/>
  <rect x="250" y="20" width="220" height="310" rx="10" fill="#fbe3ef" stroke="#db2777" stroke-width="2"/>
  <rect x="480" y="20" width="220" height="310" rx="10" fill="#eeeeee" stroke="#666" stroke-width="2"/>
  <g text-anchor="middle" font-weight="bold" font-size="24">
    <text x="130" y="54" fill="#1d4ed8">der</text>
    <text x="360" y="54" fill="#be185d">die</text>
    <text x="590" y="54" fill="#444">das</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#333">
    <text x="130" y="74">masculine</text>
    <text x="360" y="74">feminine</text>
    <text x="590" y="74">neuter</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="34" y="104">• male people</text>
    <text x="34" y="128">• days, months, seasons</text>
    <text x="34" y="152">• weather, compass</text>
    <text x="34" y="176">• -er from verbs</text>
    <text x="34" y="200">• -ling, -ismus, -ist</text>
    <text x="264" y="104">• female people, -in</text>
    <text x="264" y="128">• most nouns in -e</text>
    <text x="264" y="152">• -ung, -heit, -keit</text>
    <text x="264" y="176">• -schaft, -ion, -tät</text>
    <text x="264" y="200">• -ik, -ie, -ei, -ur</text>
    <text x="494" y="104">• -chen, -lein</text>
    <text x="494" y="128">• young beings</text>
    <text x="494" y="152">• infinitives as nouns</text>
    <text x="494" y="176">• -um, -ment</text>
    <text x="494" y="200">• many borrowed words</text>
  </g>
  <g font-size="15" fill="#1d4ed8" font-style="italic">
    <text x="34" y="236">der Vater</text>
    <text x="34" y="258">der Montag</text>
    <text x="34" y="280">der Regen</text>
    <text x="34" y="302">der Lehrer</text>
  </g>
  <g font-size="15" fill="#be185d" font-style="italic">
    <text x="264" y="236">die Mutter</text>
    <text x="264" y="258">die Lampe</text>
    <text x="264" y="280">die Wohnung</text>
    <text x="264" y="302">die Musik</text>
  </g>
  <g font-size="15" fill="#444" font-style="italic">
    <text x="494" y="236">das Mädchen</text>
    <text x="494" y="258">das Kind</text>
    <text x="494" y="280">das Essen</text>
    <text x="494" y="302">das Museum</text>
  </g>
  <rect x="20" y="346" width="680" height="66" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="372" text-anchor="middle" font-size="15" fill="#333">Compounds take the gender of the last part:</text>
  <text x="360" y="396" text-anchor="middle" font-size="15" fill="#333">das Haus + die Tür = die Haustür</text>
</svg>
