<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" role="img" aria-label="Three meanings of sie">
  <rect x="0" y="0" width="720" height="330" rx="12" fill="#fdfaf3"/>
  <rect x="20" y="20" width="215" height="220" rx="10" fill="#fbe3ef" stroke="#db2777" stroke-width="2"/>
  <rect x="252" y="20" width="215" height="220" rx="10" fill="#ede6fb" stroke="#7c3aed" stroke-width="2"/>
  <rect x="485" y="20" width="215" height="220" rx="10" fill="#e3ecf8" stroke="#2f5d9a" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="127" y="58" font-size="26" font-weight="bold" fill="#be185d">sie</text>
    <text x="127" y="84" font-size="16" fill="#333">= she</text>
    <text x="360" y="58" font-size="26" font-weight="bold" fill="#5b21b6">sie</text>
    <text x="360" y="84" font-size="16" fill="#333">= they</text>
    <text x="592" y="58" font-size="26" font-weight="bold" fill="#1f3c66">Sie</text>
    <text x="592" y="84" font-size="16" fill="#333">= you (polite)</text>
  </g>
  <g text-anchor="middle" font-size="17" fill="#222">
    <text x="127" y="124">sie ist</text>
    <text x="127" y="150">sie hat</text>
    <text x="127" y="176">sie komm<tspan font-weight="bold">t</tspan></text>
    <text x="360" y="124">sie sind</text>
    <text x="360" y="150">sie haben</text>
    <text x="360" y="176">sie komm<tspan font-weight="bold">en</tspan></text>
    <text x="592" y="124">Sie sind</text>
    <text x="592" y="150">Sie haben</text>
    <text x="592" y="176">Sie komm<tspan font-weight="bold">en</tspan></text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#444">
    <text x="127" y="214">verb ends in -t</text>
    <text x="360" y="214">verb ends in -en</text>
    <text x="592" y="214">-en, and a capital S</text>
  </g>
  <rect x="20" y="258" width="680" height="54" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="290" text-anchor="middle" font-size="14" fill="#333">At the start of a sentence, only the context tells "they" from polite "you".</text>
</svg>
