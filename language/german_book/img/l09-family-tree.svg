<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="sans-serif" role="img" aria-label="Jonas's family tree">
  <rect x="0" y="0" width="720" height="360" rx="12" fill="#fdfaf3"/>
  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="315" y1="55" x2="405" y2="55"/>
    <line x1="360" y1="55" x2="360" y2="110"/>
    <line x1="195" y1="110" x2="525" y2="110"/>
    <line x1="195" y1="110" x2="195" y2="140"/>
    <line x1="525" y1="110" x2="525" y2="140"/>
    <line x1="240" y1="165" x2="270" y2="165"/>
    <line x1="525" y1="165" x2="555" y2="165"/>
    <line x1="255" y1="165" x2="255" y2="235"/>
    <line x1="110" y1="235" x2="390" y2="235"/>
    <line x1="110" y1="235" x2="110" y2="260"/>
    <line x1="250" y1="235" x2="250" y2="260"/>
    <line x1="390" y1="235" x2="390" y2="260"/>
    <line x1="540" y1="165" x2="540" y2="260"/>
  </g>
  <g stroke="#555" stroke-width="1.5">
    <rect x="205" y="30" width="110" height="50" rx="8" fill="#dbe8f7"/>
    <rect x="405" y="30" width="110" height="50" rx="8" fill="#f7dbe6"/>
    <rect x="130" y="140" width="110" height="50" rx="8" fill="#dbe8f7"/>
    <rect x="270" y="140" width="110" height="50" rx="8" fill="#f7dbe6"/>
    <rect x="415" y="140" width="110" height="50" rx="8" fill="#f7dbe6"/>
    <rect x="555" y="140" width="110" height="50" rx="8" fill="#dbe8f7"/>
    <rect x="55" y="260" width="110" height="50" rx="8" fill="#f7dbe6"/>
    <rect x="195" y="260" width="110" height="50" rx="8" fill="#dbe8f7"/>
    <rect x="335" y="260" width="110" height="50" rx="8" fill="#dbe8f7" stroke-width="3"/>
    <rect x="485" y="260" width="110" height="50" rx="8" fill="#f7dbe6"/>
  </g>
  <g fill="#222" text-anchor="middle" font-size="15">
    <text x="260" y="51" font-weight="bold">Werner</text><text x="260" y="70" font-size="13">der Opa</text>
    <text x="460" y="51" font-weight="bold">Helga</text><text x="460" y="70" font-size="13">die Oma</text>
    <text x="185" y="161" font-weight="bold">Thomas</text><text x="185" y="180" font-size="13">der Vater</text>
    <text x="325" y="161" font-weight="bold">Petra</text><text x="325" y="180" font-size="13">die Mutter</text>
    <text x="470" y="161" font-weight="bold">Karin</text><text x="470" y="180" font-size="13">die Tante</text>
    <text x="610" y="161" font-weight="bold">Stefan</text><text x="610" y="180" font-size="13">der Onkel</text>
    <text x="110" y="281" font-weight="bold">Lena</text><text x="110" y="300" font-size="13">die Schwester</text>
    <text x="250" y="281" font-weight="bold">Tim</text><text x="250" y="300" font-size="13">der Bruder</text>
    <text x="390" y="281" font-weight="bold">Jonas</text><text x="390" y="300" font-size="13">ich</text>
    <text x="540" y="281" font-weight="bold">Sophie</text><text x="540" y="300" font-size="13">die Cousine</text>
  </g>
  <text x="700" y="345" fill="#555" font-size="12" text-anchor="end">blue: men · pink: women · seen from Jonas</text>
</svg>
