<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="sans-serif" role="img" aria-label="The sentence bracket with modal verbs">
  <rect x="0" y="0" width="720" height="360" rx="12" fill="#fdfaf3"/>
  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#444">modal verb in position 2 … infinitive at the end</text>
  <g font-size="18" fill="#222">
    <text x="30" y="110">Ich</text>
    <rect x="80" y="88" width="70" height="32" rx="6" fill="#fed7aa" stroke="#c2410c"/>
    <text x="115" y="110" text-anchor="middle" font-weight="bold" fill="#7c2d12">kann</text>
    <text x="165" y="110">am Freitag leider nicht</text>
    <rect x="570" y="88" width="100" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="620" y="110" text-anchor="middle" font-weight="bold" fill="#1d4ed8">kommen.</text>
    <path d="M115 84 L115 66 L620 66 L620 84" fill="none" stroke="#888" stroke-width="2"/>
  </g>
  <g font-size="18" fill="#222">
    <text x="30" y="200">Am Samstag</text>
    <rect x="140" y="178" width="90" height="32" rx="6" fill="#fed7aa" stroke="#c2410c"/>
    <text x="185" y="200" text-anchor="middle" font-weight="bold" fill="#7c2d12">können</text>
    <text x="245" y="200">wir ins Kino</text>
    <rect x="570" y="178" width="100" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="620" y="200" text-anchor="middle" font-weight="bold" fill="#1d4ed8">gehen.</text>
    <path d="M185 174 L185 156 L620 156 L620 174" fill="none" stroke="#888" stroke-width="2"/>
  </g>
  <g font-size="18" fill="#222">
    <rect x="30" y="268" width="80" height="32" rx="6" fill="#fed7aa" stroke="#c2410c"/>
    <text x="70" y="290" text-anchor="middle" font-weight="bold" fill="#7c2d12">Willst</text>
    <text x="125" y="290">du am Freitag</text>
    <rect x="555" y="268" width="130" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="620" y="290" text-anchor="middle" font-weight="bold" fill="#1d4ed8">mitkommen?</text>
    <path d="M70 264 L70 246 L620 246 L620 264" fill="none" stroke="#888" stroke-width="2"/>
  </g>
  <text x="360" y="336" text-anchor="middle" font-size="14" fill="#444">Between the two verbs: the middle field. In a yes-no question the modal verb comes first.</text>
</svg>
