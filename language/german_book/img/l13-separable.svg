<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="sans-serif" role="img" aria-label="A separable verb: aufstehen">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#fdfaf3"/>
  <rect x="270" y="20" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="47" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">auf</text>
  <rect x="340" y="20" width="110" height="40" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="395" y="47" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c2d12">stehen</text>
  <text x="470" y="47" font-size="14" fill="#444">= to get up (stress: AUF-stehen)</text>
  <path d="M305 62 L620 128" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <path d="M395 62 L140 128" stroke="#c2410c" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <g font-size="19" fill="#222">
    <text x="40" y="160">Ich</text>
    <rect x="95" y="136" width="90" height="34" rx="6" fill="#fed7aa" stroke="#c2410c"/>
    <text x="140" y="160" text-anchor="middle" font-weight="bold" fill="#7c2d12">stehe</text>
    <text x="205" y="160">um sieben Uhr</text>
    <rect x="585" y="136" width="70" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="620" y="160" text-anchor="middle" font-weight="bold" fill="#1d4ed8">auf.</text>
    <path d="M140 132 L140 116 L620 116 L620 132" fill="none" stroke="#888" stroke-width="2"/>
  </g>
  <text x="360" y="200" text-anchor="middle" font-size="14" fill="#444">present tense: the verb in position 2, the prefix at the end</text>
  <line x1="30" y1="218" x2="690" y2="218" stroke="#ccc"/>
  <g font-size="19" fill="#222">
    <text x="40" y="270">Ich</text>
    <rect x="95" y="246" width="70" height="34" rx="6" fill="#f1f1f1" stroke="#888"/>
    <text x="130" y="270" text-anchor="middle" font-weight="bold">muss</text>
    <text x="185" y="270">um sieben Uhr</text>
    <rect x="530" y="246" width="140" height="34" rx="6" fill="#e0f2e9" stroke="#15803d"/>
    <text x="600" y="270" text-anchor="middle" font-weight="bold" fill="#15803d">aufstehen.</text>
    <path d="M130 242 L130 226 L600 226 L600 242" fill="none" stroke="#888" stroke-width="2"/>
  </g>
  <text x="360" y="312" text-anchor="middle" font-size="14" fill="#444">with a modal verb: the infinitive stays in one piece at the end</text>
</svg>
