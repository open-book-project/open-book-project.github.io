<svg viewBox="0 0 640 220" role="img" aria-label="20 minute ki bar paanch hisson me bati hui: padhna 6 minute, sunna 4, zor se doharana 5, quiz 3, revise 2." xmlns="http://www.w3.org/2000/svg"><title>Thoda padho, phir zyada-tar time kaan aur munh ko do. Aakhir me kisi purane chapter par ek quick nazar daalo.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .mn { font: 800 15px var(--font); fill: var(--sheet); }
        .sl { font: 700 13px var(--font); fill: var(--text); }
        .ss { font: 500 12px var(--font); fill: var(--text-soft); }
        .tk { font: 600 12px var(--font); fill: var(--text-soft); }
        .s1 { fill: var(--g-m); } .s2 { fill: var(--accent); } .s3 { fill: var(--g-f); }
        .s4 { fill: var(--g-pl); } .s5 { fill: var(--role-verb); }
      </style></defs>
      <text class="sl" x="20" y="34">Tumhare 20 minute</text>
      <rect class="s1" x="20" y="60" width="180" height="50" rx="8"/>
      <rect class="s2" x="202" y="60" width="118" height="50" rx="8"/>
      <rect class="s3" x="322" y="60" width="148" height="50" rx="8"/>
      <rect class="s4" x="472" y="60" width="88" height="50" rx="8"/>
      <rect class="s5" x="562" y="60" width="58" height="50" rx="8"/>
      <text class="mn" x="110" y="91" text-anchor="middle">6 min</text>
      <text class="mn" x="261" y="91" text-anchor="middle">4 min</text>
      <text class="mn" x="396" y="91" text-anchor="middle">5 min</text>
      <text class="mn" x="516" y="91" text-anchor="middle">3</text>
      <text class="mn" x="591" y="91" text-anchor="middle">2</text>
      <text class="sl" x="110" y="140" text-anchor="middle">1 Padho</text>
      <text class="ss" x="110" y="158" text-anchor="middle">1–2 sections</text>
      <text class="sl" x="261" y="140" text-anchor="middle">2 Suno</text>
      <text class="ss" x="261" y="158" text-anchor="middle">har 🔊</text>
      <text class="sl" x="396" y="140" text-anchor="middle">3 Zor se doharao</text>
      <text class="ss" x="396" y="158" text-anchor="middle">awaaz ki nakal</text>
      <text class="sl" x="516" y="140" text-anchor="middle">4 Quiz</text>
      <text class="ss" x="516" y="158" text-anchor="middle">khud ko parkho</text>
      <text class="sl" x="591" y="140" text-anchor="middle">5 Revise</text>
      <text class="ss" x="591" y="158" text-anchor="middle">purane pages</text>
      <text class="tk" x="20" y="200">0 min</text>
      <text class="tk" x="620" y="200" text-anchor="end">20 min</text>
    </svg>