      <text class="cm-l" x="20" y="115">Articles</text><rect class="cm-track" x="200" y="100" width="380" height="20" rx="6"/><rect class="cm-bar" x="200" y="100" width="334" height="20" rx="6"/><text class="cm-n" x="542" y="115">8.8</text>
