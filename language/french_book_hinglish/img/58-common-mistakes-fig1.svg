<svg viewBox="0 0 640 330" role="img" aria-label="Horizontal bar chart jo aath galti-groups ko rank karta hai ki wo kitni baar aate hain aur kitna nuksaan karte hain: prepositions sabse upar, phir articles, tenses aur moods, gender aur agreement, English calques, pronouns, word order aur sabse neeche false friends." xmlns="http://www.w3.org/2000/svg"><title>Laal groups learner ke lagbhag har sentence me aate hain, isliye inhe theek karne ka fayda sabse jaldi milta hai.</title><style>svg{--accent:#ea580c;--bad:#be123c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .cm-h { font: 800 16px var(--font); fill: var(--text); }
        .cm-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .cm-l { font: 650 13px var(--font); fill: var(--text); }
        .cm-n { font: 700 12px var(--font); fill: var(--text-soft); }
        .cm-bar { fill: var(--bad); opacity: .75; }
        .cm-bar2 { fill: var(--accent); opacity: .7; }
        .cm-track { fill: var(--canvas); }
      </style></defs>
      <text class="cm-h" x="20" y="28">Kaun si galtiyaan sabse zyada chubhti hain?</text>
      <text class="cm-s" x="20" y="47">Frequency × asar, 0–10 — ek anubhavi teacher ka andaza, koi study nahi.</text>
