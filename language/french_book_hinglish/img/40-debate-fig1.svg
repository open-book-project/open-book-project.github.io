<svg viewBox="0 0 640 250" role="img" aria-label="Presentation timeline: hook, problem aur plan ke saath introduction; part one; part two; summary aur opening ke saath conclusion. Signpost phrases har transition ko mark karte hain." xmlns="http://www.w3.org/2000/svg"><title>Introduction aur conclusion sabse chhote hisse hain par sabse zaroori: examiners aur audience shuru aur ant yaad rakhte hain.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .ps-i { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .ps-p { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
          .ps-t { font: 800 13px var(--font); fill: var(--text); }
          .ps-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
          .ps-g { font: 700 11.5px var(--font); fill: var(--accent-ink); }
          .ps-a { fill: none; stroke: var(--accent); stroke-width: 2.5; }
        </style></defs>
        <path class="ps-a" d="M10 30 L630 30"/>
        <path class="ps-a" d="M622 24 L630 30 L622 36"/>
        <rect class="ps-i" x="10" y="48" width="170" height="150" rx="12"/>
        <text class="ps-t" x="22" y="72">INTRODUCTION</text>
        <text class="ps-s" x="22" y="96">1. l’accroche (hook)</text>
        <text class="ps-s" x="22" y="116">2. la problématique</text>
        <text class="ps-s" x="22" y="136">3. l’annonce du plan</text>
        <text class="ps-g" x="22" y="164">« Je vais d’abord…,</text>
        <text class="ps-g" x="22" y="182">puis… »</text>
        <rect class="ps-p" x="190" y="48" width="140" height="150" rx="12"/>
        <text class="ps-t" x="202" y="72">PARTIE 1</text>
        <text class="ps-s" x="202" y="96">argument</text>
        <text class="ps-s" x="202" y="116">+ example</text>
        <text class="ps-g" x="202" y="164">« Tout d’abord… »</text>
        <text class="ps-g" x="202" y="182">« De plus… »</text>
        <rect class="ps-p" x="340" y="48" width="140" height="150" rx="12"/>
        <text class="ps-t" x="352" y="72">PARTIE 2</text>
        <text class="ps-s" x="352" y="96">argument / limit</text>
        <text class="ps-s" x="352" y="116">+ example</text>
        <text class="ps-g" x="352" y="164">« Passons</text>
        <text class="ps-g" x="352" y="182">maintenant à… »</text>
        <rect class="ps-i" x="490" y="48" width="140" height="150" rx="12"/>
        <text class="ps-t" x="502" y="72">CONCLUSION</text>
        <text class="ps-s" x="502" y="96">1. nichod</text>
        <text class="ps-s" x="502" y="116">2. jawab</text>
        <text class="ps-s" x="502" y="136">3. aage ki baat</text>
        <text class="ps-g" x="502" y="164">« Pour</text>
        <text class="ps-g" x="502" y="182">conclure… »</text>
        <text class="ps-s" x="10" y="232">Do ya teen parts classic French plan hai. Signposts (gulabi me) sunne wale ko batate hain ki woh kahan hai.</text>
      </svg>