<svg viewBox="0 0 660 270" role="img" aria-label="Timeline: haal ke past se ab tak aur phir future me. Ab se thoda pehle: je viens de partir. Ab ke thoda baad: je vais partir, paas ka aur planned. Door: je partirai, predictions aur promises." xmlns="http://www.w3.org/2000/svg"><title>venir de (abhi kiya) se aller + infinitive (karne hi wala) aur phir futur simple (karega) tak. Bolchaal me fixed plan ke liye present bhi chal jaata hai: je pars demain .</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .ft-ax { fill: none; stroke: var(--line-strong); stroke-width: 3; }
        .ft-now { fill: var(--text); }
        .ft-near { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
        .ft-far { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2; stroke-dasharray: 6 5; }
        .ft-past { fill: var(--canvas); stroke: var(--line-strong); stroke-width: 2; }
        .ft-h { font: 800 14px var(--font); fill: var(--text); }
        .ft-a { font: 800 14px var(--font); fill: var(--accent); }
        .ft-v { font: 800 14px var(--font); fill: var(--role-verb); }
        .ft-s { font: 500 12px var(--font); fill: var(--text-soft); }
      </style></defs>
      <path class="ft-ax" d="M20 140 L640 140 M628 132 L642 140 L628 148"/>
      <rect class="ft-past" x="40" y="60" width="150" height="60" rx="12"/>
      <text class="ft-h" x="115" y="86" text-anchor="middle">je viens de partir</text>
      <text class="ft-s" x="115" y="106" text-anchor="middle">main abhi-abhi gaya</text>
      <circle class="ft-now" cx="220" cy="140" r="9"/>
      <text class="ft-h" x="220" y="172" text-anchor="middle">NOW</text>
      <text class="ft-s" x="220" y="190" text-anchor="middle">je pars</text>
      <rect class="ft-near" x="250" y="60" width="170" height="60" rx="12"/>
      <text class="ft-a" x="335" y="86" text-anchor="middle">je vais partir</text>
      <text class="ft-s" x="335" y="106" text-anchor="middle">futur proche</text>
      <rect class="ft-far" x="450" y="60" width="180" height="60" rx="12"/>
      <text class="ft-v" x="540" y="86" text-anchor="middle">je partirai</text>
      <text class="ft-s" x="540" y="106" text-anchor="middle">futur simple</text>
      <text class="ft-s" x="335" y="220" text-anchor="middle">planned · jaldi · pehle se dikh raha</text>
      <text class="ft-s" x="335" y="238" text-anchor="middle">rozmarra ki bolchaal</text>
      <text class="ft-s" x="540" y="220" text-anchor="middle">baad me · predictions · promises</text>
      <text class="ft-s" x="540" y="238" text-anchor="middle">forecasts · formal aur likhit</text>
    </svg>