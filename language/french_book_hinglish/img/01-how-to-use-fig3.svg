<svg viewBox="0 0 640 230" role="img" aria-label="Review timeline: din 0 par seekho, phir 1 din, 3 din, 1 hafte aur 3 hafte baad revise karo; har baar gap lamba hota jaata hai." xmlns="http://www.w3.org/2000/svg"><title>Chapter ko padhne ke 1, 3, 7 aur 21 din baad revise karo. Chaar chhote reviews zyada-tar cheezon ko pakka karne ke liye kaafi hain.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .tl { fill: none; stroke: var(--line-strong); stroke-width: 3; }
        .dot { fill: var(--accent); }
        .dot0 { fill: var(--g-f); }
        .dl { font: 700 13px var(--font); fill: var(--text); }
        .ds { font: 500 12px var(--font); fill: var(--text-soft); }
        .gap { fill: none; stroke: var(--accent); stroke-width: 2; }
      </style></defs>
      <line class="tl" x1="30" y1="140" x2="620" y2="140"/>
      <path class="gap" d="M40 124 Q60 100 80 124"/>
