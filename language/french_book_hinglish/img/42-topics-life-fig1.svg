<svg viewBox="0 0 640 330" role="img" aria-label="Job ki zindagi: la candidature, l'entretien d'embauche, la période d'essai ke saath l'embauche, phir l'entretien annuel ke saath le CDI, aur bahar nikalne ke teen raaste: la démission, le licenciement, la retraite" xmlns="http://www.w3.org/2000/svg"><title>French job ki zindagi. Ek chauthi nikasi, la rupture conventionnelle , dono taraf ki sehmati se hone wala ant hai.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .jb-b { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.6; }
       .jb-k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
       .jb-a { fill: none; stroke: var(--text-soft); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
       .jb-n { font: 800 12px var(--font); fill: var(--text-soft); }
       .jb-t { font: 700 14px var(--font); }
       .jb-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .jb-m { fill: var(--g-m); } .jb-f { fill: var(--g-f); }
      </style>
     </defs>
     <g text-anchor="middle">
      <rect class="jb-b" x="10" y="30" width="140" height="70" rx="12"/>
      <text class="jb-n" x="80" y="50">1 · POSTULER</text>
      <text class="jb-t jb-f" x="80" y="72">la candidature</text>
      <text class="jb-s" x="80" y="90">CV + lettre</text>

      <rect class="jb-b" x="170" y="30" width="140" height="70" rx="12"/>
      <text class="jb-n" x="240" y="50">2 · PASSER</text>
      <text class="jb-t jb-m" x="240" y="72">l’entretien</text>
      <text class="jb-s" x="240" y="90">d’embauche</text>

      <rect class="jb-b" x="330" y="30" width="140" height="70" rx="12"/>
      <text class="jb-n" x="400" y="50">3 · ÊTRE EMBAUCHÉ</text>
      <text class="jb-t jb-f" x="400" y="72">la période</text>
      <text class="jb-s" x="400" y="90">d’essai</text>

      <rect class="jb-k" x="490" y="30" width="140" height="70" rx="12"/>
      <text class="jb-n" x="560" y="50">4 · SIGNER</text>
      <text class="jb-t jb-m" x="560" y="72">le CDI</text>
      <text class="jb-s" x="560" y="90">(ou le CDD)</text>
     </g>
     <path class="jb-a" d="M150 65 H166 M160 59 L166 65 L160 71"/>
     <path class="jb-a" d="M310 65 H326 M320 59 L326 65 L320 71"/>
     <path class="jb-a" d="M470 65 H486 M480 59 L486 65 L480 71"/>
     <path class="jb-a" d="M600 100 C640 140 620 170 560 170 C500 170 480 140 520 100"/>
     <text class="jb-t jb-m" x="560" y="192" text-anchor="middle">l’entretien annuel</text>
     <text class="jb-s" x="560" y="209" text-anchor="middle">saal me ek baar: review</text>
     <path class="jb-a" d="M490 90 C400 150 330 170 330 230"/>
     <text class="jb-s" x="330" y="160" text-anchor="middle">le préavis</text>
     <g text-anchor="middle">
      <rect class="jb-b" x="40" y="240" width="170" height="70" rx="12"/>
      <text class="jb-n" x="125" y="260">TUM CHHODTE HO</text>
      <text class="jb-t jb-f" x="125" y="282">la démission</text>
      <text class="jb-s" x="125" y="300">démissionner</text>
      <rect class="jb-b" x="245" y="240" width="170" height="70" rx="12"/>
      <text class="jb-n" x="330" y="260">WOH KHATAM KARTE HAIN</text>
      <text class="jb-t jb-m" x="330" y="282">le licenciement</text>
      <text class="jb-s" x="330" y="300">être licencié</text>
      <rect class="jb-b" x="450" y="240" width="170" height="70" rx="12"/>
      <text class="jb-n" x="535" y="260">CAREER KA ANT</text>
      <text class="jb-t jb-f" x="535" y="282">la retraite</text>
      <text class="jb-s" x="535" y="300">partir à la retraite</text>
     </g>
     <path class="jb-a" d="M330 230 H125 V236 M330 230 V236 M330 230 H535 V236"/>
    </svg>