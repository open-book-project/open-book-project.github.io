<svg viewBox="0 0 640 210" role="img" aria-label="Sentence Mon frère habite à Lyon depuis deux ans teen rhythm groups me bata hua; har syllable ka barabar box hai aur har group ka aakhri syllable lamba aur coloured hai." xmlns="http://www.w3.org/2000/svg"><title>Teen groups, teen stress: mon FRÈRE / habite à LYON / depuis deux ANS. Words syllables me ghul jaate hain: “habite à” “a-bi-ta” ban jaata hai.</title><style>svg{--accent:#ea580c;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .rg-b { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; }
          .rg-s { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .rg-t { font: 600 14px var(--font); fill: var(--text); }
          .rg-st { font: 800 14px var(--font); fill: var(--accent-ink); }
          .rg-g { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
          .rg-br { fill: none; stroke: var(--text-soft); stroke-width: 2; }
        </style></defs>
        <text class="rg-g" x="16" y="22">MON FRÈRE HABITE À LYON DEPUIS DEUX ANS — BOLE JAANE WALE SYLLABLES</text>
        <rect class="rg-b" x="16" y="50" width="54" height="44" rx="8"/><text class="rg-t" x="43" y="78" text-anchor="middle">mõ</text>
        <rect class="rg-s" x="76" y="44" width="80" height="56" rx="8"/><text class="rg-st" x="116" y="78" text-anchor="middle">FRÈR</text>
        <path class="rg-br" d="M16 112 L16 120 L156 120 L156 112"/>
        <text class="rg-g" x="86" y="140" text-anchor="middle">group 1</text>
        <rect class="rg-b" x="180" y="50" width="54" height="44" rx="8"/><text class="rg-t" x="207" y="78" text-anchor="middle">a</text>
        <rect class="rg-b" x="240" y="50" width="54" height="44" rx="8"/><text class="rg-t" x="267" y="78" text-anchor="middle">bi</text>
        <rect class="rg-b" x="300" y="50" width="54" height="44" rx="8"/><text class="rg-t" x="327" y="78" text-anchor="middle">ta</text>
        <rect class="rg-s" x="360" y="44" width="80" height="56" rx="8"/><text class="rg-st" x="400" y="78" text-anchor="middle">LYÕ</text>
        <path class="rg-br" d="M180 112 L180 120 L440 120 L440 112"/>
        <text class="rg-g" x="310" y="140" text-anchor="middle">group 2 — “habite à” = “a-bi-ta”</text>
        <rect class="rg-b" x="464" y="50" width="38" height="44" rx="8"/><text class="rg-t" x="483" y="78" text-anchor="middle">duh</text>
        <rect class="rg-b" x="506" y="50" width="38" height="44" rx="8"/><text class="rg-t" x="525" y="78" text-anchor="middle">pwi</text>
        <rect class="rg-b" x="548" y="50" width="34" height="44" rx="8"/><text class="rg-t" x="565" y="78" text-anchor="middle">dø</text>
        <rect class="rg-s" x="586" y="44" width="46" height="56" rx="8"/><text class="rg-st" x="609" y="78" text-anchor="middle">ZÃ</text>
        <path class="rg-br" d="M464 112 L464 120 L632 120 L632 112"/>
        <text class="rg-g" x="548" y="140" text-anchor="middle">group 3</text>
        <text class="rg-t" x="16" y="186">Grey boxes barabar lambai ke hain. Coloured = stress wala, lamba syllable.</text>
