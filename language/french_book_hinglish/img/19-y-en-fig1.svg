<svg viewBox="0 0 640 290" role="img" aria-label="En ke saath noun gayab ho jaata hai lekin quantity aakhir me rehti hai: j'ai deux frères ban jaata hai j'en ai deux." xmlns="http://www.w3.org/2000/svg"><title>Noun chala jaata hai, en verb se pehle uski jagah le leta hai, aur koi bhi number ya quantity word peeche aakhir me reh jaata hai.</title><style>svg{--accent:#ea580c;--bad:#be123c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line:#e3e7ef;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .ye-t { font: 700 16px var(--font); fill: var(--text); }
        .ye-n { font: 700 16px var(--font); fill: var(--role-noun); }
        .ye-q { font: 800 16px var(--font); fill: var(--good); }
        .ye-p { font: 800 16px var(--font); fill: var(--accent); }
        .ye-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .ye-ar { fill: none; stroke: var(--accent); stroke-width: 2.5; }
        .ye-bx { fill: var(--canvas); stroke: var(--line); stroke-width: 1.5; }
        .ye-x { fill: none; stroke: var(--bad); stroke-width: 2.5; }
      </style></defs>
      <rect class="ye-bx" x="14" y="14" width="612" height="78" rx="14"/>
      <text class="ye-t" x="40" y="48">J’ai</text>
      <text class="ye-q" x="96" y="48">deux</text>
      <text class="ye-n" x="150" y="48">frères.</text>
      <path class="ye-x" d="M148 40 L216 54"/>
      <path class="ye-ar" d="M236 44 L300 44 M290 36 L302 44 L290 52"/>
      <text class="ye-t" x="320" y="48">J’</text>
      <text class="ye-p" x="338" y="48">en</text>
      <text class="ye-t" x="368" y="48">ai</text>
      <text class="ye-q" x="394" y="48">deux.</text>
      <text class="ye-s" x="40" y="76">noun → en (verb se pehle) · quantity wahin rehti hai (verb ke baad)</text>
      <rect class="ye-bx" x="14" y="104" width="612" height="78" rx="14"/>
      <text class="ye-t" x="40" y="138">Il boit</text>
      <text class="ye-q" x="110" y="138">beaucoup de</text>
      <text class="ye-n" x="218" y="138">thé.</text>
      <path class="ye-ar" d="M262 134 L316 134 M306 126 L318 134 L306 142"/>
      <text class="ye-t" x="336" y="138">Il</text>
      <text class="ye-p" x="354" y="138">en</text>
      <text class="ye-t" x="384" y="138">boit</text>
      <text class="ye-q" x="426" y="138">beaucoup.</text>
      <text class="ye-s" x="40" y="166">“de” noun ke saath en me chala jaata hai</text>
      <rect class="ye-bx" x="14" y="194" width="612" height="78" rx="14"/>
      <text class="ye-t" x="40" y="228">Tu as</text>
      <text class="ye-q" x="96" y="228">du</text>
      <text class="ye-n" x="122" y="228">pain ?</text>
      <path class="ye-ar" d="M190 224 L244 224 M234 216 L246 224 L234 232"/>
      <text class="ye-t" x="262" y="228">Oui, j’</text>
      <text class="ye-p" x="318" y="228">en</text>
      <text class="ye-t" x="346" y="228">ai.</text>
      <text class="ye-t" x="384" y="228">/ Non, je n’</text>
      <text class="ye-p" x="490" y="228">en</text>
      <text class="ye-t" x="518" y="228">ai pas.</text>
      <text class="ye-s" x="40" y="256">partitive (du, de la, des): sirf en — rakhne ko kuch nahi</text>
    </svg>