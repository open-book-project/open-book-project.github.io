<svg viewBox="0 0 640 290" role="img" aria-label="French punctuation spacing: question mark, exclamation mark, colon aur semicolon se pehle space, guillemets ke andar space, aur full stop aur comma se pehle koi space nahi" xmlns="http://www.w3.org/2000/svg"><title>Rangeen blocks wo spaces hain jo French jodti hai. Québec aur Switzerland me practice thodi alag hai (aksar ; ! ? se pehle space nahi), par exam ke liye France ka rule safe choice hai.</title><style>svg{--accent:#ea580c;--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sp-w { font: 700 20px var(--font); fill: var(--text); }
              .sp-gap { fill: var(--accent); opacity: .35; }
              .sp-no { fill: none; stroke: var(--bad); stroke-width: 2.5; stroke-linecap: round; }
              .sp-lab { font: 600 13px var(--font); fill: var(--text-soft); }
              .sp-labok { font: 700 13px var(--font); fill: var(--accent); }
              .sp-labbad { font: 700 13px var(--font); fill: var(--bad); }
              .sp-rule { fill: none; stroke: var(--line); stroke-width: 1; }
            </style>
          </defs>
          <text class="sp-w" x="180" y="46" text-anchor="end">Tu viens</text>
          <rect class="sp-gap" x="184" y="28" width="14" height="24" rx="3"/>
          <text class="sp-w" x="202" y="46">?</text>
          <text class="sp-labok" x="350" y="38">? aur ! se pehle space</text>
          <text class="sp-lab" x="350" y="56">Tu viens ? · C’est super !</text>
          <path class="sp-rule" d="M30 74 L610 74"/>

          <text class="sp-w" x="180" y="112" text-anchor="end">Attention</text>
          <rect class="sp-gap" x="184" y="94" width="14" height="24" rx="3"/>
          <text class="sp-w" x="202" y="112">:</text>
          <text class="sp-w" x="216" y="112">danger</text>
          <text class="sp-labok" x="350" y="104">: aur ; se pehle space</text>
          <text class="sp-lab" x="350" y="122">aur baad me normal space</text>
          <path class="sp-rule" d="M30 140 L610 140"/>

          <text class="sp-w" x="60" y="178">«</text>
          <rect class="sp-gap" x="80" y="160" width="14" height="24" rx="3"/>
          <text class="sp-w" x="98" y="178">Bonjour</text>
          <rect class="sp-gap" x="190" y="160" width="14" height="24" rx="3"/>
          <text class="sp-w" x="208" y="178">»</text>
          <text class="sp-labok" x="350" y="170">« guillemets » ke andar space</text>
          <text class="sp-lab" x="350" y="188">careful French me " " kabhi nahi</text>
          <path class="sp-rule" d="M30 206 L610 206"/>

          <text class="sp-w" x="140" y="248" text-anchor="end">Merci</text>
          <text class="sp-w" x="141" y="248">,</text>
          <text class="sp-w" x="240" y="248" text-anchor="end">Paul</text>
          <text class="sp-w" x="241" y="248">.</text>
          <path class="sp-no" d="M136 262 L148 274 M148 262 L136 274"/>
          <path class="sp-no" d="M236 262 L248 274 M248 262 L236 274"/>
          <text class="sp-labbad" x="350" y="240">, aur . se pehle space nahi</text>
          <text class="sp-lab" x="350" y="258">English jaisa hi</text>
        </svg>