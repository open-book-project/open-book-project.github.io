<svg viewBox="0 0 640 330" role="img" aria-label="Pronoun ki position chaar patterns me: verb se pehle, ne aur pas ke andar, infinitive se pehle, aur auxiliary se pehle." xmlns="http://www.w3.org/2000/svg"><title>Chaar patterns, ek aadat: pronoun verb ke aage chipka rehta hai, aur ne … pas pronoun + verb ke poore block ko gherta hai.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .opp-sub { fill: var(--canvas); stroke: var(--line-strong); stroke-width: 1.5; }
        .opp-pr { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
        .opp-vb { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2; }
        .opp-w { font: 700 15px var(--font); fill: var(--text); }
        .opp-p { font: 800 15px var(--font); fill: var(--accent); }
        .opp-v { font: 700 15px var(--font); fill: var(--role-verb); }
        .opp-l { font: 600 12px var(--font); fill: var(--text-soft); }
      </style></defs>
      <text class="opp-l" x="20" y="34">simple verb</text>
      <rect class="opp-sub" x="130" y="14" width="64" height="32" rx="8"/><text class="opp-w" x="162" y="36" text-anchor="middle">Je</text>
      <rect class="opp-pr" x="204" y="14" width="54" height="32" rx="8"/><text class="opp-p" x="231" y="36" text-anchor="middle">le</text>
      <rect class="opp-vb" x="268" y="14" width="90" height="32" rx="8"/><text class="opp-v" x="313" y="36" text-anchor="middle">vois</text>
      <text class="opp-l" x="20" y="114">negative</text>
      <rect class="opp-sub" x="130" y="94" width="64" height="32" rx="8"/><text class="opp-w" x="162" y="116" text-anchor="middle">Je</text>
      <rect class="opp-sub" x="204" y="94" width="44" height="32" rx="8"/><text class="opp-w" x="226" y="116" text-anchor="middle">ne</text>
      <rect class="opp-pr" x="258" y="94" width="54" height="32" rx="8"/><text class="opp-p" x="285" y="116" text-anchor="middle">le</text>
      <rect class="opp-vb" x="322" y="94" width="90" height="32" rx="8"/><text class="opp-v" x="367" y="116" text-anchor="middle">vois</text>
      <rect class="opp-sub" x="422" y="94" width="54" height="32" rx="8"/><text class="opp-w" x="449" y="116" text-anchor="middle">pas</text>
      <text class="opp-l" x="20" y="194">+ infinitive</text>
      <rect class="opp-sub" x="130" y="174" width="64" height="32" rx="8"/><text class="opp-w" x="162" y="196" text-anchor="middle">Je</text>
      <rect class="opp-vb" x="204" y="174" width="80" height="32" rx="8"/><text class="opp-v" x="244" y="196" text-anchor="middle">vais</text>
      <rect class="opp-pr" x="294" y="174" width="54" height="32" rx="8"/><text class="opp-p" x="321" y="196" text-anchor="middle">le</text>
      <rect class="opp-vb" x="358" y="174" width="90" height="32" rx="8"/><text class="opp-v" x="403" y="196" text-anchor="middle">voir</text>
      <text class="opp-l" x="20" y="274">passé composé</text>
      <rect class="opp-sub" x="130" y="254" width="64" height="32" rx="8"/><text class="opp-w" x="162" y="276" text-anchor="middle">Je</text>
      <rect class="opp-sub" x="204" y="254" width="44" height="32" rx="8"/><text class="opp-w" x="226" y="276" text-anchor="middle">ne</text>
      <rect class="opp-pr" x="258" y="254" width="54" height="32" rx="8"/><text class="opp-p" x="285" y="276" text-anchor="middle">l’</text>
      <rect class="opp-vb" x="322" y="254" width="60" height="32" rx="8"/><text class="opp-v" x="352" y="276" text-anchor="middle">ai</text>
      <rect class="opp-sub" x="392" y="254" width="54" height="32" rx="8"/><text class="opp-w" x="419" y="276" text-anchor="middle">pas</text>
      <rect class="opp-vb" x="456" y="254" width="70" height="32" rx="8"/><text class="opp-v" x="491" y="276" text-anchor="middle">vu</text>
      <text class="opp-l" x="320" y="318" text-anchor="middle">Pronoun (highlighted) hamesha apne verb ke ekdum aage baithta hai: conjugated verb, infinitive ya auxiliary.</text>
    </svg>