<svg viewBox="0 0 640 300" role="img" aria-label="Decision tree: client ya external partner ko vous; manager ya kaafi bade insaan ko vous jab tak woh tu offer na karein; apne level ke colleague ko tu agar team karti hai, warna ruko; jo bhi on se tutoie kehta hai use tu." xmlns="http://www.w3.org/2000/svg"><title>Neela = vous, gulabi = tu. Clients lagbhag hamesha vous par rehte hain; colleagues aksar kuch dinon me tu par aa jaate hain. Tu se wapas vous par kabhi mat jao — thappad jaisa lagta hai.</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .tv-q { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
          .tv-v { fill: var(--accent-soft); stroke: var(--g-m); stroke-width: 2.5; }
          .tv-t { fill: var(--accent-soft); stroke: var(--g-f); stroke-width: 2.5; }
          .tv-x { font: 700 13px var(--font); fill: var(--text); }
          .tv-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
          .tv-vv { font: 800 15px var(--font); fill: var(--g-m); }
          .tv-tt { font: 800 15px var(--font); fill: var(--g-f); }
          .tv-a { fill: none; stroke: var(--text-soft); stroke-width: 2; }
          .tv-l { font: 700 11px var(--font); fill: var(--text-soft); }
        </style></defs>
        <rect class="tv-q" x="200" y="10" width="240" height="44" rx="10"/>
        <text class="tv-x" x="320" y="37" text-anchor="middle">Aap kis se baat kar rahe ho?</text>
        <path class="tv-a" d="M260 54 L90 96"/>
        <path class="tv-a" d="M320 54 L320 96"/>
        <path class="tv-a" d="M380 54 L550 96"/>
        <rect class="tv-q" x="10" y="98" width="180" height="50" rx="10"/>
        <text class="tv-x" x="100" y="120" text-anchor="middle">Client, partner,</text>
        <text class="tv-x" x="100" y="138" text-anchor="middle">ajnabi</text>
        <rect class="tv-q" x="230" y="98" width="180" height="50" rx="10"/>
        <text class="tv-x" x="320" y="120" text-anchor="middle">Manager, director,</text>
        <text class="tv-x" x="320" y="138" text-anchor="middle">kaafi bade colleague</text>
        <rect class="tv-q" x="450" y="98" width="180" height="50" rx="10"/>
        <text class="tv-x" x="540" y="120" text-anchor="middle">Apne level ka</text>
        <text class="tv-x" x="540" y="138" text-anchor="middle">colleague</text>
        <path class="tv-a" d="M100 148 L100 190"/>
        <path class="tv-a" d="M320 148 L320 190"/>
        <path class="tv-a" d="M500 148 L470 190"/>
        <path class="tv-a" d="M580 148 L600 190"/>
        <rect class="tv-v" x="20" y="192" width="160" height="62" rx="10"/>
        <text class="tv-vv" x="100" y="218" text-anchor="middle">VOUS</text>
        <text class="tv-s" x="100" y="238" text-anchor="middle">Monsieur / Madame + nom</text>
        <rect class="tv-v" x="240" y="192" width="160" height="62" rx="10"/>
        <text class="tv-vv" x="320" y="218" text-anchor="middle">VOUS</text>
        <text class="tv-s" x="320" y="238" text-anchor="middle">jab tak woh tu offer na karein</text>
        <text class="tv-l" x="476" y="172" text-anchor="end">team tu use karti hai</text>
        <rect class="tv-t" x="414" y="192" width="104" height="62" rx="10"/>
        <text class="tv-tt" x="466" y="218" text-anchor="middle">TU</text>
        <text class="tv-s" x="466" y="238" text-anchor="middle">team ko follow karo</text>
        <text class="tv-l" x="584" y="172">pakka nahi</text>
        <rect class="tv-v" x="528" y="192" width="104" height="62" rx="10"/>
        <text class="tv-vv" x="580" y="218" text-anchor="middle">VOUS</text>
        <text class="tv-s" x="580" y="238" text-anchor="middle">phir poocho</text>
        <text class="tv-s" x="10" y="286">Switch karne wali jaadui line: “On peut se tutoyer ?” — aur agar koi tumse kahe, to “Oui, bien sûr !” bolkar maan lo.</text>
      </svg>