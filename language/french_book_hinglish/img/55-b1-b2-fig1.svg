<svg viewBox="0 0 640 300" role="img" aria-label="Teen stage ki listening strategy. Pehle: situation, bolne wala, maqsad, predicted words. Dauran: key words, numbers aur naam, connectors, baaki ignore karo. Baad me: jawab check karo, dobara suno, transcript padho, naye words note karo. Ek teer baad se wapas pehle par jaata hai agli recording ke liye." xmlns="http://www.w3.org/2000/svg"><title>Teen stages. “Avant” par 30 second lagane se aap jitna samajhte ho wo double ho sakta hai.</title><style>svg{--accent:#ea580c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .st-col { fill: var(--canvas); stroke: var(--line); stroke-width: 1.5; }
          .st-hd { fill: var(--accent); }
          .st-ht { font: 800 15px var(--font); fill: var(--sheet); }
          .st-t { font: 600 13px var(--font); fill: var(--text); }
          .st-s { font: 500 12px var(--font); fill: var(--text-soft); }
          .st-a { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
          .st-h { fill: var(--accent); }
        </style></defs>
        <rect class="st-col" x="15" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="15" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="110" y="46" text-anchor="middle">AVANT · pehle</text>
        <text class="st-t" x="30" y="88">• Kaun si situation?</text>
        <text class="st-t" x="30" y="116">• Kaun bol raha? Kyun?</text>
        <text class="st-t" x="30" y="144">• 5 words predict karo</text>
        <text class="st-s" x="30" y="176">voicemail → naam,</text>
        <text class="st-s" x="30" y="194">wajah, request,</text>
        <text class="st-s" x="30" y="212">phone number</text>
        <rect class="st-col" x="225" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="225" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="320" y="46" text-anchor="middle">PENDANT · dauran</text>
        <text class="st-t" x="240" y="88">• Key nouns &amp; verbs</text>
        <text class="st-t" x="240" y="116">• Numbers, naam</text>
        <text class="st-t" x="240" y="144">• Connectors</text>
        <text class="st-s" x="240" y="176">mais, par contre →</text>
        <text class="st-s" x="240" y="194">zaroori baat</text>
        <text class="st-s" x="240" y="212">aane wali hai!</text>
        <rect class="st-col" x="435" y="20" width="190" height="220" rx="14"/>
        <rect class="st-hd" x="435" y="20" width="190" height="40" rx="14"/>
        <text class="st-ht" x="530" y="46" text-anchor="middle">APRÈS · baad me</text>
        <text class="st-t" x="450" y="88">• Andaze check karo</text>
        <text class="st-t" x="450" y="116">• Ek baar aur suno</text>
        <text class="st-t" x="450" y="144">• Transcript padho</text>
        <text class="st-s" x="450" y="176">3–5 naye words note</text>
        <text class="st-s" x="450" y="194">karo aur ek kaam ka</text>
        <text class="st-s" x="450" y="212">sentence dobara use ke liye</text>
        <path class="st-a" d="M205 130 L222 130"/>
        <path class="st-a" d="M415 130 L432 130"/>
        <path class="st-a" d="M530 244 Q530 285 320 285 Q110 285 110 250"/>
        <polygon class="st-h" points="110,243 104,254 116,254"/>
        <text class="st-s" x="320" y="278" text-anchor="middle">agli recording</text>
      </svg>