<svg viewBox="0 0 640 340" role="img" aria-label="Ghadi ka chehra jo minutes bolna dikhata hai. Daayein aadha, ghante ke baad: cinq, dix, et quart, vingt, vingt-cinq, et demie. Baayein aadha, agle ghante se pehle: moins vingt-cinq, moins vingt, moins le quart, moins dix, moins cinq. Suiyan 9:45 dikhati hain, dix heures moins le quart." xmlns="http://www.w3.org/2000/svg"><title>Daayein aadha (ghante ke baad): et ya sirf minutes. Baayein aadha (agle ghante se pehle): moins — “agla ghanta minus…”.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .face { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 3; }
        .past { fill: var(--accent-soft); }
        .tk2 { fill: var(--text-soft); }
        .hh { fill: none; stroke: var(--text); stroke-width: 6; stroke-linecap: round; }
        .mh { fill: none; stroke: var(--g-f); stroke-width: 4; stroke-linecap: round; }
        .ctr { fill: var(--text); }
        .pl { font: 700 13px var(--font); fill: var(--accent); }
        .ml { font: 700 13px var(--font); fill: var(--g-f); }
        .tl2 { font: 700 13px var(--font); fill: var(--text); }
        .cap { font: 600 13px var(--font); fill: var(--text-soft); }
      </style></defs>
      <circle class="face" cx="320" cy="165" r="100"/>
      <path class="past" d="M320 68 A97 97 0 0 1 320 262 Z"/>
      <circle class="tk2" cx="320" cy="75" r="3.5"/><circle class="tk2" cx="365" cy="87" r="3"/><circle class="tk2" cx="398" cy="120" r="3"/>
      <circle class="tk2" cx="410" cy="165" r="3.5"/><circle class="tk2" cx="398" cy="210" r="3"/><circle class="tk2" cx="365" cy="243" r="3"/>
      <circle class="tk2" cx="320" cy="255" r="3.5"/><circle class="tk2" cx="275" cy="243" r="3"/><circle class="tk2" cx="242" cy="210" r="3"/>
      <circle class="tk2" cx="230" cy="165" r="3.5"/><circle class="tk2" cx="242" cy="120" r="3"/><circle class="tk2" cx="275" cy="87" r="3"/>
      <line class="mh" x1="320" y1="165" x2="244" y2="165"/>
      <line class="hh" x1="320" y1="165" x2="272" y2="145"/>
      <circle class="ctr" cx="320" cy="165" r="6"/>
      <text class="tl2" x="320" y="50" text-anchor="middle">pile (theek baje)</text>
      <text class="pl" x="381" y="64">cinq</text>
      <text class="pl" x="424" y="108">dix</text>
      <text class="pl" x="440" y="170">et quart</text>
      <text class="pl" x="424" y="232">vingt</text>
      <text class="pl" x="381" y="276">vingt-cinq</text>
      <text class="tl2" x="320" y="292" text-anchor="middle">et demie</text>
      <text class="ml" x="259" y="276" text-anchor="end">moins vingt-cinq</text>
      <text class="ml" x="216" y="232" text-anchor="end">moins vingt</text>
      <text class="ml" x="200" y="170" text-anchor="end">moins le quart</text>
      <text class="ml" x="216" y="108" text-anchor="end">moins dix</text>
      <text class="ml" x="259" y="64" text-anchor="end">moins cinq</text>
      <text class="cap" x="320" y="326" text-anchor="middle">Suiyan 9:45 dikhati hain → “Il est dix heures moins le quart.”</text>
    </svg>