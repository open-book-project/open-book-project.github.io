<svg viewBox="0 0 640 340" role="img" aria-label="French vowel chart. Baayein taraf front spread vowels i, é, è, a; beech me front rounded vowels u, eu closed, eu open; daayein taraf back rounded vowels ou, o closed, o open; centre me e muet." xmlns="http://www.w3.org/2000/svg"><title>Vowel map. Baayein: hont failey hue, muskurahat jaise. Daayein: hont gol, jeebh peechhe khichi hui. Beech ke bhare hue circles “naye” French vowels hain: jeebh aage aur hont gol.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .trap2 { fill: none; stroke: var(--line-strong); stroke-width: 2.5; }
        .vs { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
        .vr { fill: var(--accent); }
        .vl { font: 800 17px var(--font); fill: var(--text); }
        .vlw { font: 800 17px var(--font); fill: var(--sheet); }
        .vx { font: 500 12px var(--font); fill: var(--text-soft); }
        .hd { font: 700 12px var(--font); fill: var(--text); }
        .sd { font: 600 12px var(--font); fill: var(--text-soft); }
      </style></defs>
      <path class="trap2" d="M80 60 L580 60 L580 300 L220 300 Z"/>
      <text class="hd" x="130" y="40" text-anchor="middle">hont failey hue</text>
      <text class="hd" x="300" y="40" text-anchor="middle">hont gol, jeebh aage</text>
      <text class="hd" x="530" y="40" text-anchor="middle">gol, jeebh peechhe</text>
      <text class="sd" x="16" y="74">closed</text>
      <text class="sd" x="150" y="320">open</text>
      <circle class="vs" cx="104" cy="82" r="18"/><text class="vl" x="104" y="88" text-anchor="middle">i</text><text class="vx" x="128" y="104">lit</text>
      <circle class="vr" cx="260" cy="82" r="18"/><text class="vlw" x="260" y="88" text-anchor="middle">u</text><text class="vx" x="284" y="104">tu</text>
      <circle class="vs" cx="550" cy="82" r="18"/><text class="vl" x="550" y="88" text-anchor="middle">ou</text><text class="vx" x="510" y="110">vous</text>
      <circle class="vs" cx="150" cy="150" r="18"/><text class="vl" x="150" y="156" text-anchor="middle">é</text><text class="vx" x="174" y="172">thé</text>
      <circle class="vr" cx="290" cy="150" r="18"/><text class="vlw" x="290" y="156" text-anchor="middle">eu</text><text class="vx" x="314" y="172">deux</text>
      <circle class="vs" cx="550" cy="150" r="18"/><text class="vl" x="550" y="156" text-anchor="middle">o</text><text class="vx" x="510" y="178">beau</text>
      <circle class="vs" cx="400" cy="190" r="18"/><text class="vl" x="400" y="196" text-anchor="middle">e</text><text class="vx" x="424" y="212">le (uh)</text>
      <circle class="vs" cx="196" cy="226" r="18"/><text class="vl" x="196" y="232" text-anchor="middle">è</text><text class="vx" x="220" y="248">mère</text>
      <circle class="vr" cx="320" cy="226" r="18"/><text class="vlw" x="320" y="232" text-anchor="middle">œ</text><text class="vx" x="344" y="248">sœur</text>
      <circle class="vs" cx="550" cy="226" r="18"/><text class="vl" x="550" y="232" text-anchor="middle">o</text><text class="vx" x="510" y="254">bol</text>
      <circle class="vs" cx="250" cy="284" r="18"/><text class="vl" x="250" y="290" text-anchor="middle">a</text><text class="vx" x="274" y="300">la</text>
    </svg>