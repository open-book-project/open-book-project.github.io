<svg viewBox="0 0 640 290" role="img" aria-label="Traffic light jaise teen columns: obligatory liaison hare me, optional peele me, forbidden laal me, har ek ke examples ke saath." xmlns="http://www.w3.org/2000/svg"><title>Liaison traffic light. Hara: tight group ke andar. Peela: dheele words ke beech — tumhari choice. Laal: kabhi nahi.</title><style>svg{--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--line:#e3e7ef;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .lg { fill: var(--good); } .la { fill: var(--warn); } .lr { fill: var(--bad); }
        .col { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1.5; }
        .ct { font: 800 15px var(--font); fill: var(--text); }
        .ce { font: 600 13px var(--font); fill: var(--text); }
        .cs { font: 500 12px var(--font); fill: var(--text-soft); }
      </style></defs>
      <rect class="col" x="10" y="10" width="200" height="270" rx="12"/>
      <rect class="col" x="220" y="10" width="200" height="270" rx="12"/>
      <rect class="col" x="430" y="10" width="200" height="270" rx="12"/>
      <circle class="lg" cx="110" cy="50" r="22"/>
      <circle class="la" cx="320" cy="50" r="22"/>
      <circle class="lr" cx="530" cy="50" r="22"/>
      <text class="ct" x="110" y="100" text-anchor="middle">Obligatory</text>
      <text class="cs" x="110" y="118" text-anchor="middle">hamesha jodo</text>
      <text class="ce" x="110" y="150" text-anchor="middle">les‿amis</text>
      <text class="ce" x="110" y="175" text-anchor="middle">ils‿ont</text>
      <text class="ce" x="110" y="200" text-anchor="middle">un petit‿ami</text>
      <text class="ce" x="110" y="225" text-anchor="middle">en‿Inde</text>
      <text class="ct" x="320" y="100" text-anchor="middle">Optional</text>
      <text class="cs" x="320" y="118" text-anchor="middle">zyada = zyada formal</text>
      <text class="ce" x="320" y="150" text-anchor="middle">je suis (‿) allé</text>
      <text class="ce" x="320" y="175" text-anchor="middle">pas (‿) encore</text>
      <text class="ce" x="320" y="200" text-anchor="middle">des amis (‿) anglais</text>
      <text class="ce" x="320" y="225" text-anchor="middle">c’est (‿) ici</text>
      <text class="ct" x="530" y="100" text-anchor="middle">Forbidden</text>
      <text class="cs" x="530" y="118" text-anchor="middle">kabhi mat jodo</text>
      <text class="ce" x="530" y="150" text-anchor="middle">et | elle</text>
