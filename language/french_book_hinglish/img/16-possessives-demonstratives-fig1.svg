<svg viewBox="0 0 640 280" role="img" aria-label="Paul aur Marie, dono ke paas ek car aur ek phone hai. Paul ki car sa voiture hai, Marie ki car bhi sa voiture hai, kyunki voiture feminine hai. Paul ka phone aur Marie ka phone dono son téléphone hain, kyunki téléphone masculine hai. Possessive cheez ko follow karta hai, malik ko nahi." xmlns="http://www.w3.org/2000/svg"><title>Paul ki car aur Marie ki car, dono sa voiture hain. Malik par zor dena ho to à lui / à elle jodo (section 4).</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .ow { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .owt { font: 800 15px var(--font); fill: var(--text); }
          .ob { font: 700 14px var(--font); fill: var(--text-soft); }
          .pf { fill: var(--g-f); } .pm { fill: var(--g-m); }
          .pw { font: 800 15px var(--font); fill: var(--sheet); }
          .lf { stroke: var(--g-f); stroke-width: 2.5; fill: none; }
          .lm { stroke: var(--g-m); stroke-width: 2.5; fill: none; }
          .nt2 { font: 600 13px var(--font); fill: var(--text-soft); }
        </style></defs>
        <rect class="ow" x="20" y="30" width="140" height="56" rx="14"/><text class="owt" x="90" y="64" text-anchor="middle">Paul (ladka)</text>
        <rect class="ow" x="20" y="180" width="140" height="56" rx="14"/><text class="owt" x="90" y="214" text-anchor="middle">Marie (ladki)</text>
        <path class="lf" d="M160 52 C230 52 250 98 330 98"/>
        <path class="lf" d="M160 204 C230 204 250 118 330 118"/>
        <path class="lm" d="M160 66 C240 66 250 160 330 160"/>
        <path class="lm" d="M160 218 C240 218 250 180 330 180"/>
        <rect class="pf" x="330" y="84" width="150" height="48" rx="24"/><text class="pw" x="405" y="114" text-anchor="middle">sa voiture</text>
        <rect class="pm" x="330" y="146" width="150" height="48" rx="24"/><text class="pw" x="405" y="176" text-anchor="middle">son téléphone</text>
        <text class="ob" x="495" y="104">voiture = f</text><text class="nt2" x="495" y="122">→ sa (uska / uski)</text>
        <text class="ob" x="495" y="166">téléphone = m</text><text class="nt2" x="495" y="184">→ son (uska / uski)</text>
        <text class="nt2" x="320" y="262" text-anchor="middle">Malik se farq nahi padta. Cheez ka gender son ya sa chunta hai.</text>
      </svg>