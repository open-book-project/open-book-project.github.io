<svg viewBox="0 0 660 260" role="img" aria-label="Superlative ki position. Adjective noun se pehle: la plus belle ville. Adjective noun ke baad: la ville la plus intéressante, jisme article la dobara aata hai." xmlns="http://www.w3.org/2000/svg"><title>Noun se pehle: la plus belle ville . Noun ke baad: la ville la plus intéressante — article wapas aata hai.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--role-adj:#9333ea;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
