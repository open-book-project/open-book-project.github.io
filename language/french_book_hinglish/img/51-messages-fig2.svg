<svg viewBox="0 0 660 540" role="img" aria-label="French formal letter ka layout, aath numbered hisson ke saath: sender, recipient, jagah aur date, subject, salutation, body, closing formula aur signature" xmlns="http://www.w3.org/2000/svg"><title>French formal letter. Sender upar left, recipient right me, phir jagah aur date, subject, salutation, body, closing formula aur signature.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-m:#2563eb;--line:#e3e7ef;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs>
<style>
.lt-page { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
.lt-t { font: 500 12px var(--font); fill: var(--text); }
.lt-b { font: 700 12px var(--font); fill: var(--text); }
.lt-bar { fill: var(--line); }
.lt-lead { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
.lt-num { fill: var(--accent); }
.lt-numt { font: 800 12px var(--font); fill: var(--sheet); }
.lt-lab { font: 700 13px var(--font); fill: var(--text); }
.lt-sub { font: 500 12px var(--font); fill: var(--text-soft); }
.lt-sig { fill: none; stroke: var(--g-m); stroke-width: 2; }
</style>
</defs>
<rect class="lt-page" x="12" y="10" width="390" height="520" rx="8"/>

<text class="lt-b" x="32" y="38">Priya Sharma</text>
<text class="lt-t" x="32" y="54">14 rue des Lilas</text>
<text class="lt-t" x="32" y="70">69003 Lyon</text>

<text class="lt-b" x="222" y="108">Atelier Cassiopée</text>
<text class="lt-t" x="222" y="124">25 avenue Victor-Hugo</text>
<text class="lt-t" x="222" y="140">75016 Paris</text>

<text class="lt-t" x="222" y="180">Lyon, le 12 mars 2026</text>

<text class="lt-b" x="32" y="218">Objet : Candidature – assistante</text>
<text class="lt-t" x="32" y="234">P. J. : CV</text>

<text class="lt-t" x="32" y="268">Madame, Monsieur,</text>

<rect class="lt-bar" x="48" y="284" width="334" height="7" rx="3"/>
<rect class="lt-bar" x="32" y="298" width="350" height="7" rx="3"/>
<rect class="lt-bar" x="32" y="312" width="260" height="7" rx="3"/>
<rect class="lt-bar" x="48" y="332" width="334" height="7" rx="3"/>
<rect class="lt-bar" x="32" y="346" width="350" height="7" rx="3"/>
<rect class="lt-bar" x="32" y="360" width="300" height="7" rx="3"/>
<rect class="lt-bar" x="48" y="380" width="334" height="7" rx="3"/>
<rect class="lt-bar" x="32" y="394" width="210" height="7" rx="3"/>

<text class="lt-t" x="48" y="428">Veuillez agréer, Madame, Monsieur,</text>
<text class="lt-t" x="32" y="444">l’expression de mes salutations distinguées.</text>

<path class="lt-sig" d="M232 480 C 245 460, 256 492, 268 474 S 290 466, 300 480 S 322 484, 340 470"/>
<text class="lt-t" x="240" y="506">Priya Sharma</text>

<path class="lt-lead" d="M130 54 L420 54"/>
<path class="lt-lead" d="M380 124 L420 124"/>
<path class="lt-lead" d="M362 176 L420 184"/>
<path class="lt-lead" d="M250 222 L420 240"/>
<path class="lt-lead" d="M150 264 L420 298"/>
<path class="lt-lead" d="M384 340 L420 352"/>
<path class="lt-lead" d="M300 436 L420 412"/>
<path class="lt-lead" d="M344 476 L420 470"/>

<circle class="lt-num" cx="432" cy="50" r="10"/><text class="lt-numt" x="432" y="54" text-anchor="middle">1</text>
<text class="lt-lab" x="448" y="48">Expéditeur</text><text class="lt-sub" x="448" y="64">aap — upar left</text>

<circle class="lt-num" cx="432" cy="120" r="10"/><text class="lt-numt" x="432" y="124" text-anchor="middle">2</text>
<text class="lt-lab" x="448" y="118">Destinataire</text><text class="lt-sub" x="448" y="134">paane wala — right</text>

<circle class="lt-num" cx="432" cy="182" r="10"/><text class="lt-numt" x="432" y="186" text-anchor="middle">3</text>
<text class="lt-lab" x="448" y="180">Lieu et date</text><text class="lt-sub" x="448" y="196">“Lyon, le 12 mars 2026”</text>

<circle class="lt-num" cx="432" cy="240" r="10"/><text class="lt-numt" x="432" y="244" text-anchor="middle">4</text>
<text class="lt-lab" x="448" y="238">Objet (+ P. J.)</text><text class="lt-sub" x="448" y="254">subject; attachments</text>

<circle class="lt-num" cx="432" cy="298" r="10"/><text class="lt-numt" x="432" y="302" text-anchor="middle">5</text>
<text class="lt-lab" x="448" y="296">Appel</text><text class="lt-sub" x="448" y="312">salutation + comma</text>

<circle class="lt-num" cx="432" cy="352" r="10"/><text class="lt-numt" x="432" y="356" text-anchor="middle">6</text>
<text class="lt-lab" x="448" y="350">Corps de la lettre</text><text class="lt-sub" x="448" y="366">body: 3–4 chhote paragraphs</text>

<circle class="lt-num" cx="432" cy="412" r="10"/><text class="lt-numt" x="432" y="416" text-anchor="middle">7</text>
<text class="lt-lab" x="448" y="410">Formule de politesse</text><text class="lt-sub" x="448" y="426">appel ko hubahu doharata hai</text>

<circle class="lt-num" cx="432" cy="470" r="10"/><text class="lt-numt" x="432" y="474" text-anchor="middle">8</text>
<text class="lt-lab" x="448" y="468">Signature</text><text class="lt-sub" x="448" y="484">haath se + poora naam</text>
</svg>