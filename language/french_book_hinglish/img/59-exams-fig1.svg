<svg viewBox="0 0 640 330" role="img" aria-label="Chhe CEFR levels ki seedhi, A1 découverte se C2 maîtrise tak, har seedhi ke liye guided study ke lagbhag jode hue ghante ke saath" xmlns="http://www.w3.org/2000/svg"><title>Levels ke official French naam, guided study (classes ya is book jaisi structured book) ke lagbhag jode hue ghanton ke saath. Har seedhi pichhli se oonchi hai: B2 → C1 me A1 → A2 se zyada waqt lagta hai.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .st { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
          .lv { font: 800 22px var(--font); fill: var(--accent); }
          .nm { font: 600 13px var(--font); fill: var(--text); }
          .hr { font: 500 12px var(--font); fill: var(--text-soft); }
          .ax { stroke: var(--line); stroke-width: 2; fill: none; }
          .grp { font: 700 13px var(--font); fill: var(--text-soft); }
        </style></defs>
        <path class="ax" d="M30 290 L620 290"/>
        <rect class="st" x="40" y="240" width="90" height="50" rx="6"/>
        <rect class="st" x="135" y="205" width="90" height="85" rx="6"/>
        <rect class="st" x="230" y="165" width="90" height="125" rx="6"/>
        <rect class="st" x="325" y="120" width="90" height="170" rx="6"/>
        <rect class="st" x="420" y="75" width="90" height="215" rx="6"/>
        <rect class="st" x="515" y="30" width="90" height="260" rx="6"/>
        <text class="lv" x="85" y="272" text-anchor="middle">A1</text>
        <text class="lv" x="180" y="237" text-anchor="middle">A2</text>
        <text class="lv" x="275" y="197" text-anchor="middle">B1</text>
        <text class="lv" x="370" y="152" text-anchor="middle">B2</text>
        <text class="lv" x="465" y="107" text-anchor="middle">C1</text>
        <text class="lv" x="560" y="62" text-anchor="middle">C2</text>
        <text class="nm" x="85" y="230" text-anchor="middle">découverte</text>
        <text class="nm" x="180" y="195" text-anchor="middle">survie</text>
        <text class="nm" x="275" y="155" text-anchor="middle">seuil</text>
        <text class="nm" x="370" y="110" text-anchor="middle">avancé</text>
        <text class="nm" x="465" y="65" text-anchor="middle">autonome</text>
        <text class="nm" x="560" y="20" text-anchor="middle">maîtrise</text>
        <text class="hr" x="85" y="288" text-anchor="middle">~80 h</text>
        <text class="hr" x="180" y="288" text-anchor="middle">~200 h</text>
        <text class="hr" x="275" y="288" text-anchor="middle">~400 h</text>
        <text class="hr" x="370" y="288" text-anchor="middle">~600 h</text>
        <text class="hr" x="465" y="288" text-anchor="middle">~900 h</text>
        <text class="hr" x="560" y="288" text-anchor="middle">1100 h +</text>
        <text class="grp" x="132" y="315" text-anchor="middle">basic user</text>
        <text class="grp" x="322" y="315" text-anchor="middle">independent user</text>
        <text class="grp" x="512" y="315" text-anchor="middle">proficient user</text>
      </svg>