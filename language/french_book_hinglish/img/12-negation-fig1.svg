<svg viewBox="0 0 640 230" role="img" aria-label="Negation sandwich: subject, phir ne, phir object pronouns, phir conjugated verb, phir pas. Example: Je ne le vois pas." xmlns="http://www.w3.org/2000/svg"><title>ne subject ke turant baad aata hai; pas conjugated verb ke turant baad. Object pronouns andar, verb ke paas rehte hain (dekho Object pronouns ).</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .sl { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .br { fill: var(--g-f); }
          .vb { fill: var(--role-verb); }
          .wh { font: 800 18px var(--font); fill: var(--sheet); }
          .bk { font: 800 18px var(--font); fill: var(--text); }
          .lb { font: 600 12px var(--font); fill: var(--text-soft); }
          .brk { stroke: var(--g-f); stroke-width: 2.5; fill: none; }
        </style></defs>
        <rect class="sl" x="20" y="60" width="100" height="56" rx="12"/><text class="bk" x="70" y="95" text-anchor="middle">Je</text>
        <rect class="br" x="132" y="60" width="90" height="56" rx="12"/><text class="wh" x="177" y="95" text-anchor="middle">ne</text>
        <rect class="sl" x="234" y="60" width="90" height="56" rx="12"/><text class="bk" x="279" y="95" text-anchor="middle">le</text>
        <rect class="vb" x="336" y="60" width="140" height="56" rx="12"/><text class="wh" x="406" y="95" text-anchor="middle">vois</text>
        <rect class="br" x="488" y="60" width="110" height="56" rx="12"/><text class="wh" x="543" y="95" text-anchor="middle">pas</text>
        <text class="lb" x="70" y="140" text-anchor="middle">subject</text>
        <text class="lb" x="177" y="140" text-anchor="middle">pehla slice</text>
        <text class="lb" x="279" y="140" text-anchor="middle">pronoun (agar ho)</text>
        <text class="lb" x="406" y="140" text-anchor="middle">conjugated verb</text>
        <text class="lb" x="543" y="140" text-anchor="middle">doosra slice</text>
        <path class="brk" d="M177 40 V30 H543 V40"/>
        <text class="lb" x="360" y="22" text-anchor="middle">sandwich: andar ka sab verb ka hissa hai</text>
        <text class="bk" x="320" y="196" text-anchor="middle">Je ne le vois pas.</text>
        <text class="lb" x="320" y="216" text-anchor="middle">Main use nahi dekhta.</text>
      </svg>