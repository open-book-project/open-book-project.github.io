<svg viewBox="0 0 640 320" role="img" aria-label="Region ke hisaab se French bolne walon ka bubble chart, mote anumaan: sub-Saharan Africa aur Indian Ocean me lagbhag 15 crore, Europe me 10 crore, North Africa aur Middle East me 4.5 crore, Americas aur Caribbean me 2 crore, aur Asia aur Oceania me 30 lakh." xmlns="http://www.w3.org/2000/svg"><title>Region ke hisaab se French bolne wale — gol kiye hue andaaze, exact census figures nahi.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs><style>
.fw-a { fill: var(--accent); fill-opacity: .22; stroke: var(--accent); stroke-width: 2.5; }
.fw-e { fill: var(--g-m); fill-opacity: .2; stroke: var(--g-m); stroke-width: 2.5; }
.fw-n { fill: var(--g-f); fill-opacity: .2; stroke: var(--g-f); stroke-width: 2.5; }
.fw-m { fill: var(--g-pl); fill-opacity: .2; stroke: var(--g-pl); stroke-width: 2.5; }
.fw-v { font: 800 16px var(--font); fill: var(--text); }
.fw-vs { font: 800 13px var(--font); fill: var(--text); }
.fw-l { font: 600 12.5px var(--font); fill: var(--text); }
.fw-h { font: 800 16px var(--font); fill: var(--text); }
.fw-s { font: 500 12px var(--font); fill: var(--text-soft); }
.fw-base { stroke: var(--line-strong); stroke-width: 1.5; }
</style></defs>
<text class="fw-h" x="20" y="30">French bolne wale kahan rehte hain</text>
<text class="fw-s" x="20" y="48">Mota-mota, gol kiye OIF-based anumaan (2022), millions me — kul ≈ 321 M.</text>
<text class="fw-s" x="20" y="64">Bubble ka area bolne walon ki sankhya ke anupaat me hai.</text>
<line class="fw-base" x1="20" y1="232" x2="620" y2="232"/>
<circle class="fw-m" cx="62" cy="206" r="25"/>
<text class="fw-vs" x="62" y="211" text-anchor="middle">≈ 20</text>
<text class="fw-l" x="62" y="254" text-anchor="middle">Americas &amp;</text>
<text class="fw-l" x="62" y="270" text-anchor="middle">Caribbean</text>
<circle class="fw-e" cx="170" cy="175" r="56"/>
<text class="fw-v" x="170" y="181" text-anchor="middle">≈ 100</text>
<text class="fw-l" x="170" y="254" text-anchor="middle">Europe</text>
<circle class="fw-n" cx="290" cy="193" r="38"/>
<text class="fw-v" x="290" y="199" text-anchor="middle">≈ 45</text>
<text class="fw-l" x="290" y="254" text-anchor="middle">North Africa &amp;</text>
<text class="fw-l" x="290" y="270" text-anchor="middle">Middle East</text>
<circle class="fw-a" cx="428" cy="162" r="69"/>
<text class="fw-v" x="428" y="168" text-anchor="middle">≈ 150</text>
<text class="fw-l" x="428" y="254" text-anchor="middle">Sub-Saharan Africa</text>
<text class="fw-l" x="428" y="270" text-anchor="middle">&amp; Indian Ocean</text>
<circle class="fw-m" cx="568" cy="221" r="10"/>
<text class="fw-vs" x="568" y="200" text-anchor="middle">≈ 3</text>
<text class="fw-l" x="568" y="254" text-anchor="middle">Asia &amp;</text>
<text class="fw-l" x="568" y="270" text-anchor="middle">Oceania</text>
<text class="fw-s" x="20" y="304">Ginti is par nirbhar hai ki “speaker” kise kehte hain. Africa ka hissa sabse tezi se badh raha hai.</text>
</svg>