<svg viewBox="0 0 640 230" role="img" aria-label="le livre aur les livres: noun ka sound same, sirf article ka sound luh se lay ho jaata hai. Vowel se pehle les liaison se z sound jodta hai." xmlns="http://www.w3.org/2000/svg"><title>Article suno, noun ka end nahi. Liaison Silent letters &amp; liaison me samjhaya gaya hai.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-m:#2563eb;--g-pl:#7c3aed;--text:#121826;--text-faint:#6b7385;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .big { font: 800 24px var(--font); fill: var(--text); }
          .art { font: 800 24px var(--font); }
          .snd { font: 600 13px ui-monospace, Menlo, Consolas, monospace; fill: var(--text-soft); }
          .note { font: 600 13px var(--font); fill: var(--text-soft); }
          .hl { fill: var(--accent-soft); }
          .mm2 { fill: var(--g-m); } .pp2 { fill: var(--g-pl); }
          .arc { stroke: var(--accent); stroke-width: 2.5; fill: none; }
          .sil { font: 800 24px var(--font); fill: var(--text-faint); }
        </style></defs>
        <rect class="hl" x="40" y="22" width="80" height="44" rx="10"/>
        <text class="art mm2" x="80" y="54" text-anchor="middle">le</text>
        <text class="big" x="140" y="54">livre</text>
        <text class="snd" x="80" y="88" text-anchor="middle">[luh]</text>
        <text class="snd" x="175" y="88" text-anchor="middle">[LEEVR]</text>
        <rect class="hl" x="340" y="22" width="80" height="44" rx="10"/>
        <text class="art pp2" x="380" y="54" text-anchor="middle">les</text>
        <text class="big" x="440" y="54">livre</text><text class="sil" x="500" y="54">s</text>
        <text class="snd" x="380" y="88" text-anchor="middle">[lay]</text>
        <text class="snd" x="475" y="88" text-anchor="middle">[LEEVR]</text>
        <text class="note" x="320" y="118" text-anchor="middle">Noun ka sound same — plural article batata hai.</text>
        <text class="art pp2" x="190" y="182" text-anchor="middle">les</text>
        <text class="big" x="250" y="182">amis</text>
        <path class="arc" d="M212 190 Q231 210 250 190"/>
        <text class="snd" x="231" y="220" text-anchor="middle">[lay-za-MEE]</text>
        <text class="note" x="420" y="182">Vowel se pehle les ka s</text>
        <text class="note" x="420" y="200">z ki tarah sunai deta hai (liaison).</text>
      </svg>