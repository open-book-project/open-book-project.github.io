<svg viewBox="0 0 640 340" role="img" aria-label="Ek dabba aur ek gend alag-alag jagah par: dans ka matlab andar, sur ka matlab upar, sous ka matlab neeche, devant ka matlab saamne, derrière ka matlab peeche, à côté de ka matlab bagal me, entre ka matlab beech me, près de ka matlab paas, loin de ka matlab door." xmlns="http://www.w3.org/2000/svg"><title>Gend wo cheez hai jiske baare me baat ho rahi hai; dabba reference point hai. Aur bhi: en face de (saamne wali taraf), au-dessus de (upar), au bout de (ke aakhir me).</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-prep:#ea580c;--text-faint:#6b7385;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .bx { fill: none; stroke: var(--ink-300); stroke-width: 2.5; }
          .ball { fill: var(--role-prep); }
          .ghost { fill: var(--role-prep); opacity: .4; }
          .pl3 { font: 800 15px var(--font); fill: var(--role-prep); }
          .pe { font: 500 12px var(--font); fill: var(--text-soft); }
          .dash { stroke: var(--text-faint); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
        </style></defs>
        <g transform="translate(20 20)">
          <rect class="bx" x="0" y="20" width="80" height="60" rx="6"/>
          <circle class="ball" cx="40" cy="52" r="11"/>
          <text class="pl3" x="40" y="104" text-anchor="middle">dans</text><text class="pe" x="40" y="120" text-anchor="middle">andar</text>
        </g>
        <g transform="translate(140 20)">
          <rect class="bx" x="0" y="20" width="80" height="60" rx="6"/>
          <circle class="ball" cx="40" cy="9" r="11"/>
          <text class="pl3" x="40" y="104" text-anchor="middle">sur</text><text class="pe" x="40" y="120" text-anchor="middle">upar</text>
        </g>
        <g transform="translate(260 20)">
          <rect class="bx" x="0" y="10" width="80" height="60" rx="6"/>
          <circle class="ball" cx="40" cy="83" r="11"/>
          <text class="pl3" x="40" y="114" text-anchor="middle">sous</text><text class="pe" x="40" y="130" text-anchor="middle">neeche</text>
        </g>
        <g transform="translate(380 20)">
          <rect class="bx" x="14" y="16" width="70" height="56" rx="6"/>
          <circle class="ball" cx="49" cy="80" r="11"/>
          <text class="pl3" x="49" y="114" text-anchor="middle">devant</text><text class="pe" x="49" y="130" text-anchor="middle">saamne</text>
        </g>
        <g transform="translate(500 20)">
          <circle class="ghost" cx="34" cy="20" r="11"/>
          <rect class="bx" x="14" y="26" width="76" height="56" rx="6"/>
          <text class="pl3" x="52" y="104" text-anchor="middle">derrière</text><text class="pe" x="52" y="120" text-anchor="middle">peeche</text>
        </g>
        <g transform="translate(20 190)">
          <rect class="bx" x="0" y="10" width="60" height="56" rx="6"/>
          <circle class="ball" cx="84" cy="40" r="11"/>
          <text class="pl3" x="50" y="96" text-anchor="middle">à côté de</text><text class="pe" x="50" y="112" text-anchor="middle">bagal me</text>
        </g>
        <g transform="translate(170 190)">
          <rect class="bx" x="0" y="10" width="56" height="56" rx="6"/>
          <rect class="bx" x="124" y="10" width="56" height="56" rx="6"/>
          <circle class="ball" cx="90" cy="40" r="11"/>
          <text class="pl3" x="90" y="96" text-anchor="middle">entre</text><text class="pe" x="90" y="112" text-anchor="middle">beech me</text>
        </g>
        <g transform="translate(400 190)">
          <rect class="bx" x="0" y="10" width="50" height="56" rx="6"/>
          <circle class="ball" cx="66" cy="40" r="9"/>
          <circle class="ball" cx="200" cy="40" r="9"/>
          <path class="dash" d="M76 40 H190"/>
          <text class="pl3" x="62" y="96" text-anchor="middle">près de</text><text class="pe" x="62" y="112" text-anchor="middle">paas</text>
          <text class="pl3" x="186" y="96" text-anchor="middle">loin de</text><text class="pe" x="186" y="112" text-anchor="middle">door</text>
        </g>
      </svg>