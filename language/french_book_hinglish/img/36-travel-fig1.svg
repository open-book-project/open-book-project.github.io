<svg viewBox="0 0 640 360" role="img" aria-label="Body outline aur labels: à la tête, à l'oreille, aux dents, à la gorge, au dos, au bras, au ventre, à la main, à la jambe, au genou, au pied." xmlns="http://www.w3.org/2000/svg"><title>J’ai mal + à + body part. Colour se gender pata chalta hai, aur gender se form: au dos, à la gorge, aux dents.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .bd { fill: none; stroke: var(--text-soft); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
          .bd-l { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
          .bd-m { font: 700 14px var(--font); fill: var(--g-m); }
          .bd-f { font: 700 14px var(--font); fill: var(--g-f); }
          .bd-p { font: 700 14px var(--font); fill: var(--g-pl); }
          .bd-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
          .bd-r { font: 600 14px var(--font); fill: var(--text); }
          .bd-box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
        </style></defs>
        <text class="bd-h" x="20" y="22">J’AI MAL…</text>
        <circle class="bd" cx="220" cy="62" r="28"/>
        <path class="bd" d="M220 90 L220 104"/>
        <path class="bd" d="M184 108 Q220 100 256 108 L262 210 Q220 218 178 210 Z"/>
        <path class="bd" d="M184 112 L150 190 L140 232"/>
        <path class="bd" d="M256 112 L290 190 L300 232"/>
        <path class="bd" d="M196 214 L190 285 L186 338 L166 342"/>
        <path class="bd" d="M244 214 L250 285 L254 338 L274 342"/>
        <path class="bd-l" d="M196 50 L120 40"/><text class="bd-f" x="20" y="45">à la tête</text>
        <path class="bd-l" d="M194 66 L120 72"/><text class="bd-f" x="20" y="77">à l’oreille</text>
        <path class="bd-l" d="M214 78 L120 104"/><text class="bd-p" x="20" y="109">aux dents</text>
        <path class="bd-l" d="M220 98 L330 70"/><text class="bd-f" x="336" y="75">à la gorge</text>
        <path class="bd-l" d="M256 130 L330 110"/><text class="bd-m" x="336" y="115">au dos</text>
        <path class="bd-l" d="M168 150 L120 150"/><text class="bd-m" x="20" y="155">au bras</text>
        <path class="bd-l" d="M230 175 L330 160"/><text class="bd-m" x="336" y="165">au ventre</text>
        <path class="bd-l" d="M140 232 L120 220"/><text class="bd-f" x="20" y="225">à la main</text>
        <path class="bd-l" d="M192 260 L120 268"/><text class="bd-f" x="20" y="273">à la jambe</text>
        <path class="bd-l" d="M250 285 L330 280"/><text class="bd-m" x="336" y="285">au genou</text>
        <path class="bd-l" d="M274 340 L330 330"/><text class="bd-m" x="336" y="335">au pied</text>
        <rect class="bd-box" x="460" y="40" width="168" height="150" rx="12"/>
        <text class="bd-r" x="474" y="66">à + le → <tspan class="bd-m">au</tspan></text>
        <text class="bd-r" x="474" y="94">à + la → <tspan class="bd-f">à la</tspan></text>
        <text class="bd-r" x="474" y="122">à + l’ → <tspan class="bd-f">à l’</tspan></text>
        <text class="bd-r" x="474" y="150">à + les → <tspan class="bd-p">aux</tspan></text>
        <text class="bd-h" x="474" y="176">rang = <tspan class="bd-m">m</tspan> · <tspan class="bd-f">f</tspan> · <tspan class="bd-p">pl</tspan></text>
      </svg>