<svg viewBox="0 0 640 200" role="img" aria-label="Futur antérieur: an action finished before another future action" xmlns="http://www.w3.org/2000/svg"><title>Dono actions future me hain; jo pehle khatam hota hai wo futur antérieur leta hai.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-pl:#7c3aed;--line:#e3e7ef;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .fa-ax { fill: none; stroke: var(--text-soft); stroke-width: 2.5; }
              .fa-now { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
              .fa-d1 { fill: var(--g-pl); }
              .fa-d2 { fill: var(--role-noun); }
              .fa-arc { fill: none; stroke: var(--line); stroke-width: 2; }
              .fa-n { font: 700 13px var(--font); fill: var(--text); }
              .fa-e { font: 500 12.5px var(--font); fill: var(--text-soft); font-style: italic; }
              .fa-nw { font: 800 13px var(--font); fill: var(--accent); }
            </style>
          </defs>
          <path class="fa-ax" d="M20 110 H620 M610 103 L622 110 L610 117"/>
          <path class="fa-now" d="M110 50 V140"/>
          <text class="fa-nw" x="110" y="42" text-anchor="middle">ABHI</text>
          <circle class="fa-d1" cx="350" cy="110" r="10"/>
          <text class="fa-n" x="350" y="80" text-anchor="middle">1 · tu auras fini</text>
          <text class="fa-e" x="350" y="146" text-anchor="middle">futur antérieur</text>
          <circle class="fa-d2" cx="530" cy="110" r="10"/>
          <text class="fa-n" x="530" y="80" text-anchor="middle">2 · tu pourras sortir</text>
          <text class="fa-e" x="530" y="146" text-anchor="middle">futur simple</text>
          <path class="fa-arc" d="M360 96 Q440 40 520 96"/>
          <text class="fa-e" x="320" y="186" text-anchor="middle">English me: "when you have finished" · French me: "when you will have finished"</text>
        </svg>