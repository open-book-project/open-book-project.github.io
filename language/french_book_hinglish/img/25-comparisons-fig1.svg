<svg viewBox="0 0 640 290" role="img" aria-label="Bars ke teen jode. Plus: pehla bar lamba hai. Aussi: dono bar barabar hain. Moins: pehla bar chhota hai." xmlns="http://www.w3.org/2000/svg"><title>Teen words, teen rishte. Beech ka adjective ab bhi apne noun se agree karta hai.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .cm-a { fill: var(--accent); }
        .cm-b { fill: var(--line-strong); }
        .cm-base { fill: none; stroke: var(--line-strong); stroke-width: 2; }
        .cm-h { font: 800 18px var(--font); fill: var(--accent); }
        .cm-t { font: 700 13px var(--font); fill: var(--text); }
        .cm-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .cm-sign { font: 800 22px var(--font); fill: var(--text-soft); }
      </style></defs>
      <path class="cm-base" d="M20 200 L620 200"/>
      <text class="cm-h" x="110" y="30" text-anchor="middle">plus … que</text>
      <rect class="cm-a" x="60" y="60" width="40" height="140" rx="6"/>
      <rect class="cm-b" x="120" y="120" width="40" height="80" rx="6"/>
      <text class="cm-sign" x="110" y="110" text-anchor="middle">&gt;</text>
      <text class="cm-t" x="110" y="226" text-anchor="middle">A est plus grand que B</text>
      <text class="cm-s" x="110" y="246" text-anchor="middle">… se zyada</text>
      <text class="cm-h" x="320" y="30" text-anchor="middle">aussi … que</text>
      <rect class="cm-a" x="270" y="100" width="40" height="100" rx="6"/>
      <rect class="cm-b" x="330" y="100" width="40" height="100" rx="6"/>
      <text class="cm-sign" x="320" y="90" text-anchor="middle">=</text>
      <text class="cm-t" x="320" y="226" text-anchor="middle">A est aussi grand que B</text>
      <text class="cm-s" x="320" y="246" text-anchor="middle">utna … jitna</text>
      <text class="cm-h" x="530" y="30" text-anchor="middle">moins … que</text>
      <rect class="cm-a" x="480" y="130" width="40" height="70" rx="6"/>
      <rect class="cm-b" x="540" y="70" width="40" height="130" rx="6"/>
      <text class="cm-sign" x="530" y="120" text-anchor="middle">&lt;</text>
      <text class="cm-t" x="530" y="226" text-anchor="middle">A est moins grand que B</text>
      <text class="cm-s" x="530" y="246" text-anchor="middle">… se kam</text>
      <text class="cm-s" x="320" y="280" text-anchor="middle">A = rangeen bar · B = grey bar</text>
    </svg>