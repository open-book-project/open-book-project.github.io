<svg viewBox="0 0 640 270" role="img" aria-label="Ek awaaz, paanch spellings: sound ay ko é (café, mangé), er (manger), ez (vous parlez), et (aur wala word) aur ai (j'ai) likha ja sakta hai." xmlns="http://www.w3.org/2000/svg"><title>…paanch spellings. Dictée me word ke aas-paas ka grammar batata hai ki kaun si spelling likhni hai.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .dc-hub { fill: var(--accent); }
          .dc-hubt { font: 800 16px var(--font); fill: var(--sheet); }
          .dc-hubs { font: 600 12px var(--font); fill: var(--sheet); }
          .dc-l { fill: none; stroke: var(--line); stroke-width: 2.5; }
          .dc-sp { font: 800 16px var(--font); fill: var(--role-verb); }
          .dc-ex { font: 500 13px var(--font); fill: var(--text); }
          .dc-n { font: 500 12px var(--font); fill: var(--text-soft); }
        </style></defs>
        <rect class="dc-hub" x="20" y="100" width="170" height="70" rx="35"/>
        <text class="dc-hubt" x="105" y="132" text-anchor="middle">sound “ay”</text>
        <text class="dc-hubs" x="105" y="152" text-anchor="middle">ek awaaz…</text>
        <path class="dc-l" d="M190 135 C230 135 230 30 270 30"/>
        <path class="dc-l" d="M190 135 C230 135 230 82 270 82"/>
        <path class="dc-l" d="M190 135 L270 135"/>
        <path class="dc-l" d="M190 135 C230 135 230 188 270 188"/>
        <path class="dc-l" d="M190 135 C230 135 230 240 270 240"/>
        <text class="dc-sp" x="280" y="35">é</text>
        <text class="dc-ex" x="330" y="35">le café · il a mangé</text>
        <text class="dc-n" x="330" y="51">a / est ke baad past participle</text>
        <text class="dc-sp" x="280" y="87">-er</text>
        <text class="dc-ex" x="330" y="87">manger · aller · parler</text>
        <text class="dc-n" x="330" y="103">infinitive: à, de, pour ya 2nd verb ke baad</text>
        <text class="dc-sp" x="280" y="140">-ez</text>
        <text class="dc-ex" x="330" y="140">vous parlez · chez</text>
        <text class="dc-n" x="330" y="156">vous ke saath</text>
        <text class="dc-sp" x="280" y="193">et</text>
        <text class="dc-ex" x="330" y="193">du pain et du lait</text>
        <text class="dc-n" x="330" y="209">“aur” — t hamesha silent</text>
        <text class="dc-sp" x="280" y="245">ai</text>
        <text class="dc-ex" x="330" y="245">j’ai · je parlerai</text>
        <text class="dc-n" x="330" y="261">je ke baad</text>
      </svg>