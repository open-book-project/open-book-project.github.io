<svg viewBox="0 0 640 330" role="img" aria-label="Noun se pehle aur baad. mon ancien professeur ka matlab mera purana (pichla) teacher; une maison ancienne ka matlab ek purana ghar. ma chère amie ka matlab meri pyaari dost; une robe chère ka matlab mehngi dress. ma propre chambre ka matlab mera apna kamra; une chambre propre ka matlab saaf kamra. un grand homme ka matlab mahaan insaan; un homme grand ka matlab lamba aadmi. un pauvre homme ka matlab bechaara aadmi; un homme pauvre ka matlab gareeb aadmi." xmlns="http://www.w3.org/2000/svg"><title>Pehle = aap uske baare me kaisa mehsoos karte ho; baad me = wo asal me kya hai. Aur bhi: le seul ami (akela dost) / un homme seul (akela aadmi).</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-adj:#9333ea;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .cb { fill: var(--accent-soft); } .ca { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.2; }
          .hh2 { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
          .fr2 { font: 700 14px var(--font); fill: var(--text); }
          .ad2 { fill: var(--role-adj); font-weight: 800; }
          .en2 { font: 500 12px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="hh2" x="165" y="22" text-anchor="middle">PEHLE · figurative</text>
        <text class="hh2" x="475" y="22" text-anchor="middle">BAAD ME · literal</text>
        <rect class="cb" x="20" y="34" width="290" height="50" rx="10"/><text class="fr2" x="34" y="56">mon <tspan class="ad2">ancien</tspan> professeur</text><text class="en2" x="34" y="74">mere pichhle teacher</text>
        <rect class="ca" x="330" y="34" width="290" height="50" rx="10"/><text class="fr2" x="344" y="56">une maison <tspan class="ad2">ancienne</tspan></text><text class="en2" x="344" y="74">ek purana (aitihasik) ghar</text>
        <rect class="cb" x="20" y="92" width="290" height="50" rx="10"/><text class="fr2" x="34" y="114">ma <tspan class="ad2">chère</tspan> amie</text><text class="en2" x="34" y="132">meri pyaari dost</text>
        <rect class="ca" x="330" y="92" width="290" height="50" rx="10"/><text class="fr2" x="344" y="114">une robe <tspan class="ad2">chère</tspan></text><text class="en2" x="344" y="132">ek mehngi dress</text>
        <rect class="cb" x="20" y="150" width="290" height="50" rx="10"/><text class="fr2" x="34" y="172">ma <tspan class="ad2">propre</tspan> chambre</text><text class="en2" x="34" y="190">mera apna kamra</text>
        <rect class="ca" x="330" y="150" width="290" height="50" rx="10"/><text class="fr2" x="344" y="172">une chambre <tspan class="ad2">propre</tspan></text><text class="en2" x="344" y="190">ek saaf kamra</text>
        <rect class="cb" x="20" y="208" width="290" height="50" rx="10"/><text class="fr2" x="34" y="230">un <tspan class="ad2">grand</tspan> homme</text><text class="en2" x="34" y="248">ek mahaan insaan</text>
        <rect class="ca" x="330" y="208" width="290" height="50" rx="10"/><text class="fr2" x="344" y="230">un homme <tspan class="ad2">grand</tspan></text><text class="en2" x="344" y="248">ek lamba aadmi</text>
        <rect class="cb" x="20" y="266" width="290" height="50" rx="10"/><text class="fr2" x="34" y="288">un <tspan class="ad2">pauvre</tspan> homme</text><text class="en2" x="34" y="306">ek bechaara (badqismat) aadmi</text>
        <rect class="ca" x="330" y="266" width="290" height="50" rx="10"/><text class="fr2" x="344" y="288">un homme <tspan class="ad2">pauvre</tspan></text><text class="en2" x="344" y="306">ek gareeb (paise ke bina) aadmi</text>
      </svg>