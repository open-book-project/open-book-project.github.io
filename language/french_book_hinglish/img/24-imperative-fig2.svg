<svg viewBox="0 0 660 330" role="img" aria-label="Politeness ladder: kisi se darwaza band karne ko kehna, Ferme la porte se neeche se Veuillez fermer la porte tak upar." xmlns="http://www.w3.org/2000/svg"><title>Wahi request chhe seedhiyon par. Bolchaal ki French zyadatar seedhi 2–4 par rehti hai; 5–6 formal bolchaal aur likhne ke liye hain.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .pl-st { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
        .pl-t { font: 700 14px var(--font); fill: var(--text); }
        .pl-s { font: 500 12px var(--font); fill: var(--text-soft); }
        .pl-ar { fill: none; stroke: var(--accent); stroke-width: 3; }
        .pl-h { font: 800 12px var(--font); fill: var(--accent); }
      </style></defs>
      <path class="pl-ar" d="M30 312 L30 24 M22 36 L30 22 L38 36"/>
      <text class="pl-h" x="44" y="30">zyada formal</text>
      <text class="pl-h" x="44" y="318">seedha</text>
      <rect class="pl-st" x="60" y="268" width="290" height="40" rx="10"/>
      <text class="pl-t" x="76" y="293">Ferme la porte !</text>
      <text class="pl-s" x="366" y="293">dost, family, urgent</text>
      <rect class="pl-st" x="100" y="222" width="300" height="40" rx="10"/>
      <text class="pl-t" x="116" y="247">Ferme la porte, s’il te plaît.</text>
      <text class="pl-s" x="416" y="247">dostana request</text>
      <rect class="pl-st" x="140" y="176" width="300" height="40" rx="10"/>
      <text class="pl-t" x="156" y="201">Tu peux fermer la porte ?</text>
      <text class="pl-s" x="456" y="201">rozmarra, naram</text>
      <rect class="pl-st" x="180" y="130" width="300" height="40" rx="10"/>
      <text class="pl-t" x="196" y="155">Vous pourriez fermer la porte ?</text>
      <text class="pl-s" x="496" y="155">polite, ajnabi</text>
      <rect class="pl-st" x="220" y="84" width="300" height="40" rx="10"/>
      <text class="pl-t" x="236" y="109">Pourriez-vous fermer la porte ?</text>
      <text class="pl-s" x="536" y="109">bahut polite</text>
      <rect class="pl-st" x="260" y="38" width="300" height="40" rx="10"/>
      <text class="pl-t" x="276" y="63">Veuillez fermer la porte.</text>
      <text class="pl-s" x="576" y="63">formal, likhit</text>
    </svg>