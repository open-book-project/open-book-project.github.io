<svg viewBox="0 0 640 300" role="img" aria-label="Noun beech me hai. BAGS adjectives uske pehle aate hain: beauty beau, joli; age jeune, vieux, nouveau; goodness bon, mauvais; size grand, petit, gros. Baaki sab baad me: colours, nationalities, shapes, lambe adjectives." xmlns="http://www.w3.org/2000/svg"><title>BAGS adjectives chhote, common aur “subjective” hote hain. Pehle ye bhi aate hain: autre, premier, dernier (series me), aur numbers.</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-noun:#2563eb;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .nn2 { fill: var(--role-noun); }
          .nw { font: 800 20px var(--font); fill: var(--sheet); }
          .bag { fill: var(--accent-soft); }
          .oth { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .bl { font: 800 14px var(--font); fill: var(--accent-ink); }
          .bt2 { font: 600 13px var(--font); fill: var(--text); }
          .bs { font: 500 12px var(--font); fill: var(--text-soft); }
          .ha { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
          .ar3 { stroke: var(--text-soft); stroke-width: 2; fill: none; }
        </style></defs>
        <text class="ha" x="135" y="26" text-anchor="middle">PEHLE · BAGS</text>
        <text class="ha" x="505" y="26" text-anchor="middle">BAAD ME · BAAKI SAB</text>
        <rect class="bag" x="20" y="40" width="230" height="52" rx="12"/><text class="bl" x="36" y="62">B · Beauty</text><text class="bs" x="36" y="80">beau, joli</text>
        <rect class="bag" x="20" y="100" width="230" height="52" rx="12"/><text class="bl" x="36" y="122">A · Age</text><text class="bs" x="36" y="140">jeune, vieux, nouveau</text>
        <rect class="bag" x="20" y="160" width="230" height="52" rx="12"/><text class="bl" x="36" y="182">G · Goodness</text><text class="bs" x="36" y="200">bon, mauvais, meilleur</text>
        <rect class="bag" x="20" y="220" width="230" height="52" rx="12"/><text class="bl" x="36" y="242">S · Size</text><text class="bs" x="36" y="260">grand, petit, gros, long</text>
        <path class="ar3" d="M250 156 H268"/>
        <rect class="nn2" x="270" y="126" width="100" height="60" rx="14"/><text class="nw" x="320" y="163" text-anchor="middle">NOUN</text>
        <path class="ar3" d="M370 156 H390"/>
        <rect class="oth" x="390" y="40" width="230" height="52" rx="12"/><text class="bt2" x="406" y="62">colours</text><text class="bs" x="406" y="80">une robe rouge</text>
        <rect class="oth" x="390" y="100" width="230" height="52" rx="12"/><text class="bt2" x="406" y="122">nationalities</text><text class="bs" x="406" y="140">un film indien</text>
        <rect class="oth" x="390" y="160" width="230" height="52" rx="12"/><text class="bt2" x="406" y="182">shapes, lambe adjectives</text><text class="bs" x="406" y="200">une table ronde, un livre intéressant</text>
        <rect class="oth" x="390" y="220" width="230" height="52" rx="12"/><text class="bt2" x="406" y="242">participles</text><text class="bs" x="406" y="260">une porte fermée</text>
        <text class="bs" x="320" y="292" text-anchor="middle">une belle petite maison blanche — do BAGS pehle, colour baad me</text>
      </svg>