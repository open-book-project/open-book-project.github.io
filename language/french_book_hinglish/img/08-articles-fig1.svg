<svg viewBox="0 0 640 280" role="img" aria-label="à plus le au ban jaata hai, à plus les aux ban jaata hai, de plus le du ban jaata hai, de plus les des ban jaata hai. la aur l' ke saath kuch nahi badalta." xmlns="http://www.w3.org/2000/svg"><title>Chaar jod jo ratt lene hain: au, aux, du, des. Feminine la aur elided l’ jaise hain waise rehte hain.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--role-prep:#ea580c;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .pr { font: 800 18px var(--font); fill: var(--role-prep); }
          .ar { font: 800 18px var(--font); }
          .rs { font: 800 22px var(--font); fill: var(--text); }
          .op { font: 700 16px var(--font); fill: var(--text-soft); }
          .sm { font: 600 13px var(--font); fill: var(--text-soft); }
          .card { fill: var(--accent-soft); }
          .bx2 { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
          .am { fill: var(--g-m); } .ap { fill: var(--g-pl); } .af { fill: var(--g-f); }
          .arw { stroke: var(--accent); stroke-width: 2.5; fill: none; }
        </style></defs>
        <text class="sm" x="160" y="24" text-anchor="middle">JUD JAATE HAIN</text>
        <text class="sm" x="480" y="24" text-anchor="middle">ALAG RAHTE HAIN</text>
        <g>
          <text class="pr" x="40" y="66">à</text><text class="op" x="62" y="66">+</text><text class="ar am" x="80" y="66">le</text>
          <path class="arw" d="M112 60 H172 M164 53 L172 60 L164 67"/>
          <rect class="card" x="182" y="40" width="96" height="36" rx="10"/><text class="rs" x="230" y="66" text-anchor="middle">au</text>
        </g>
        <g>
          <text class="pr" x="40" y="122">à</text><text class="op" x="62" y="122">+</text><text class="ar ap" x="80" y="122">les</text>
          <path class="arw" d="M118 116 H172 M164 109 L172 116 L164 123"/>
          <rect class="card" x="182" y="96" width="96" height="36" rx="10"/><text class="rs" x="230" y="122" text-anchor="middle">aux</text>
        </g>
        <g>
          <text class="pr" x="30" y="178">de</text><text class="op" x="62" y="178">+</text><text class="ar am" x="80" y="178">le</text>
          <path class="arw" d="M112 172 H172 M164 165 L172 172 L164 179"/>
          <rect class="card" x="182" y="152" width="96" height="36" rx="10"/><text class="rs" x="230" y="178" text-anchor="middle">du</text>
        </g>
        <g>
          <text class="pr" x="30" y="234">de</text><text class="op" x="62" y="234">+</text><text class="ar ap" x="80" y="234">les</text>
          <path class="arw" d="M118 228 H172 M164 221 L172 228 L164 235"/>
          <rect class="card" x="182" y="208" width="96" height="36" rx="10"/><text class="rs" x="230" y="234" text-anchor="middle">des</text>
        </g>
        <rect class="bx2" x="360" y="40" width="250" height="204" rx="14"/>
        <text class="ar" x="380" y="80"><tspan class="pr">à</tspan><tspan class="af"> la</tspan><tspan class="op">  →  à la plage</tspan></text>
        <text class="ar" x="380" y="122"><tspan class="pr">à</tspan><tspan class="am"> l’</tspan><tspan class="op">  →  à l’hôtel</tspan></text>
        <text class="ar" x="380" y="164"><tspan class="pr">de</tspan><tspan class="af"> la</tspan><tspan class="op">  →  de la gare</tspan></text>
        <text class="ar" x="380" y="206"><tspan class="pr">de</tspan><tspan class="am"> l’</tspan><tspan class="op">  →  de l’hôpital</tspan></text>
        <text class="sm" x="320" y="270" text-anchor="middle">Sirf le aur les judte hain. la aur l’ kabhi nahi badalte.</text>
      </svg>