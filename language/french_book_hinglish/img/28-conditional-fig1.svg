<svg viewBox="0 0 640 230" role="img" aria-label="Future stem plus imparfait endings se conditional banta hai" xmlns="http://www.w3.org/2000/svg"><title>Conditional ek hybrid hai: future ka &quot;r&quot; wala stem, imparfait ke endings.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cd-bx { fill: var(--sheet); stroke: var(--line); stroke-width: 2; }
              .cd-hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .cd-t { font: 700 13px var(--font); fill: var(--text-soft); }
              .cd-w { font: 800 20px var(--font); fill: var(--text); }
              .cd-st { fill: var(--role-verb); }
              .cd-en { fill: var(--accent); }
              .cd-op { font: 800 28px var(--font); fill: var(--text-soft); }
              .cd-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <rect class="cd-bx" x="10" y="20" width="180" height="110" rx="12"/>
          <text class="cd-t" x="100" y="46" text-anchor="middle">FUTURE se stem</text>
          <text class="cd-w" x="100" y="86" text-anchor="middle"><tspan class="cd-st">parler</tspan>ai</text>
          <text class="cd-s" x="100" y="114" text-anchor="middle">main bolunga</text>

          <text class="cd-op" x="212" y="86" text-anchor="middle">+</text>

          <rect class="cd-bx" x="232" y="20" width="180" height="110" rx="12"/>
          <text class="cd-t" x="322" y="46" text-anchor="middle">IMPARFAIT se ending</text>
          <text class="cd-w" x="322" y="86" text-anchor="middle">parl<tspan class="cd-en">ais</tspan></text>
          <text class="cd-s" x="322" y="114" text-anchor="middle">main bol raha tha</text>

          <text class="cd-op" x="434" y="86" text-anchor="middle">=</text>

          <rect class="cd-hi" x="454" y="20" width="176" height="110" rx="12"/>
          <text class="cd-t" x="542" y="46" text-anchor="middle">CONDITIONAL</text>
          <text class="cd-w" x="542" y="86" text-anchor="middle"><tspan class="cd-st">parler</tspan><tspan class="cd-en">ais</tspan></text>
          <text class="cd-s" x="542" y="114" text-anchor="middle">main bolta (agar...)</text>

          <text class="cd-s" x="320" y="170" text-anchor="middle">Future stem irregular hai? Conditional wahi rakhta hai:</text>
          <text class="cd-w" x="320" y="204" text-anchor="middle"><tspan class="cd-st">ser</tspan><tspan class="cd-en">ais</tspan> · <tspan class="cd-st">aur</tspan><tspan class="cd-en">ais</tspan> · <tspan class="cd-st">ir</tspan><tspan class="cd-en">ais</tspan> · <tspan class="cd-st">fer</tspan><tspan class="cd-en">ais</tspan> · <tspan class="cd-st">voudr</tspan><tspan class="cd-en">ais</tspan></text>
        </svg>