<svg viewBox="0 0 640 330" role="img" aria-label="Pattern map. Singular endings -s, -s, -t hain, ya pouvoir aur vouloir ke liye -x, -x, -t. Nous aur vous infinitive wala stem use karte hain. Ils aksar badla hua stem use karta hai: viennent, peuvent, veulent, doivent, prennent, boivent. Sirf chaar verbs -ont par khatam hote hain: sont, ont, vont, font, aur sirf teen vous forms -ez par khatam nahi hote: êtes, faites, dites." xmlns="http://www.w3.org/2000/svg"><title>Chaar rules lagbhag har irregular present ko cover kar dete hain. “Famous few” ko chant ki tarah yaad karo: sont, ont, vont, font — êtes, faites, dites.</title><style>svg{--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .zone { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .zone2 { fill: var(--accent-soft); }
          .zh { font: 800 14px var(--font); fill: var(--text); }
          .zt { font: 600 13px var(--font); fill: var(--text-soft); }
          .ve { font: 700 13.5px var(--font); fill: var(--role-verb); }
        </style></defs>
        <rect class="zone2" x="20" y="20" width="290" height="140" rx="16"/>
        <text class="zh" x="40" y="48">1. Singular: -s, -s, -t</text>
        <text class="ve" x="40" y="74">je dors · tu dors · il dort</text>
        <text class="ve" x="40" y="96">je finis · tu finis · il finit</text>
        <text class="zt" x="40" y="122">pouvoir / vouloir: -x, -x, -t</text>
        <text class="zt" x="40" y="142">-dre verbs: il vend, il prend (t nahi)</text>
        <rect class="zone" x="330" y="20" width="290" height="140" rx="16"/>
        <text class="zh" x="350" y="48">2. nous / vous: infinitive stem</text>
        <text class="ve" x="350" y="74">venir → venons, venez</text>
        <text class="ve" x="350" y="96">devoir → devons, devez</text>
        <text class="ve" x="350" y="118">prendre → prenons, prenez</text>
        <text class="zt" x="350" y="142">infinitive jaise dikhte hain</text>
        <rect class="zone" x="20" y="176" width="290" height="140" rx="16"/>
        <text class="zh" x="40" y="204">3. ils: aksar ek strong stem</text>
        <text class="ve" x="40" y="230">viennent · prennent</text>
        <text class="ve" x="40" y="252">peuvent · veulent · doivent</text>
        <text class="zt" x="40" y="278">nous/vous se alag teesra stem,</text>
        <text class="zt" x="40" y="298">consonant ke saath jo sunai deta hai</text>
        <rect class="zone2" x="330" y="176" width="290" height="140" rx="16"/>
        <text class="zh" x="350" y="204">4. Mashhoor gine-chune</text>
        <text class="zt" x="350" y="230">Sirf 4 verbs -ont par khatam:</text>
        <text class="ve" x="350" y="252">sont · ont · vont · font</text>
        <text class="zt" x="350" y="278">Sirf 3 vous forms me -ez nahi:</text>
        <text class="ve" x="350" y="300">êtes · faites · dites</text>
      </svg>