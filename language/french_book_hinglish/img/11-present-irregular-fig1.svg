<svg viewBox="0 0 640 260" role="img" aria-label="savoir infinitive, que, question word ya kisi fact se pehle aata hai: je sais nager, je sais que, je sais où. connaître kisi insaan, jagah ya cheez se pehle aata hai jisse tum waaqif ho: je connais Paul, je connais Paris." xmlns="http://www.w3.org/2000/svg"><title>Hindi me bhi aisa hi batwara hai: pata hona (fact jaanna) aur jaanna / pehchaanna (kisi insaan ko jaanna).</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .pl1 { fill: var(--accent-soft); } .pl2 { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
          .hh { font: 800 22px var(--font); fill: var(--role-verb); }
          .ss1 { font: 600 13px var(--font); fill: var(--text-soft); }
          .it { font: 700 14px var(--font); fill: var(--text); }
          .ix { font: 500 13px var(--font); fill: var(--text-soft); }
          .dot { fill: var(--accent); }
        </style></defs>
        <rect class="pl1" x="20" y="20" width="290" height="220" rx="18"/>
        <rect class="pl2" x="330" y="20" width="290" height="220" rx="18"/>
        <text class="hh" x="165" y="56" text-anchor="middle">SAVOIR</text>
        <text class="ss1" x="165" y="76" text-anchor="middle">facts, skills — kuch pata hona / aana</text>
        <text class="hh" x="475" y="56" text-anchor="middle">CONNAÎTRE</text>
        <text class="ss1" x="475" y="76" text-anchor="middle">log, jagah — waaqif hona</text>
        <circle class="dot" cx="44" cy="110" r="5"/><text class="it" x="58" y="115">+ infinitive</text><text class="ix" x="160" y="115">je sais nager</text>
        <circle class="dot" cx="44" cy="148" r="5"/><text class="it" x="58" y="153">+ que …</text><text class="ix" x="160" y="153">je sais qu’il est là</text>
        <circle class="dot" cx="44" cy="186" r="5"/><text class="it" x="58" y="191">+ où, quand…</text><text class="ix" x="160" y="191">je sais où il habite</text>
        <circle class="dot" cx="44" cy="224" r="5"/><text class="it" x="58" y="229">+ ek fact</text><text class="ix" x="160" y="229">je sais la réponse</text>
        <circle class="dot" cx="354" cy="110" r="5"/><text class="it" x="368" y="115">+ koi insaan</text><text class="ix" x="470" y="115">je connais Paul</text>
        <circle class="dot" cx="354" cy="148" r="5"/><text class="it" x="368" y="153">+ koi jagah</text><text class="ix" x="470" y="153">je connais Paris</text>
        <circle class="dot" cx="354" cy="186" r="5"/><text class="it" x="368" y="191">+ koi kaam, field</text><text class="ix" x="470" y="191">je connais ce film</text>
        <text class="ix" x="475" y="226" text-anchor="middle">kabhi + que nahi, kabhi + infinitive nahi</text>
      </svg>