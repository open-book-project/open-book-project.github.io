<svg viewBox="0 0 640 300" role="img" aria-label="Verlan kaise kaam karta hai: louche se chelou, femme se meuf, fête se teuf" xmlns="http://www.w3.org/2000/svg"><title>Verlan sounds par chalta hai, spelling par nahi — isliye result ki spelling aazaad aur simple hoti hai: chelou, meuf, teuf.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .vl-word { font: 700 16px var(--font); fill: var(--text); }
              .vl-res { font: 800 18px var(--font); fill: var(--accent); }
              .vl-box { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; }
              .vl-box2 { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
              .vl-syl { font: 700 15px var(--font); fill: var(--text); }
              .vl-arrow { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
              .vl-note { font: 500 12px var(--font); fill: var(--text-soft); }
              .vl-step { font: 700 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <text class="vl-step" x="60" y="22" text-anchor="middle">shabd</text>
          <text class="vl-step" x="230" y="22" text-anchor="middle">1. syllables me todo</text>
          <text class="vl-step" x="430" y="22" text-anchor="middle">2. unhe badal do</text>
          <text class="vl-step" x="580" y="22" text-anchor="middle">3. verlan</text>

          <text class="vl-word" x="60" y="72" text-anchor="middle">louche</text>
          <rect class="vl-box" x="170" y="50" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="198" y="72" text-anchor="middle">lou</text>
          <rect class="vl-box" x="236" y="50" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="264" y="72" text-anchor="middle">che</text>
          <path class="vl-arrow" d="M300 60 C340 40, 360 40, 400 60"/>
          <path class="vl-arrow" d="M300 76 C340 96, 360 96, 400 76"/>
          <rect class="vl-box2" x="402" y="50" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="430" y="72" text-anchor="middle">che</text>
          <rect class="vl-box2" x="462" y="50" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="490" y="72" text-anchor="middle">lou</text>
          <text class="vl-res" x="580" y="74" text-anchor="middle">chelou</text>
          <text class="vl-note" x="320" y="108" text-anchor="middle">do syllables: bas unhe badal do (dodgy, ajeeb)</text>

          <text class="vl-word" x="60" y="162" text-anchor="middle">femme</text>
          <rect class="vl-box" x="170" y="140" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="198" y="162" text-anchor="middle">fa</text>
          <rect class="vl-box" x="236" y="140" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="264" y="162" text-anchor="middle">meu</text>
          <path class="vl-arrow" d="M300 150 C340 130, 360 130, 400 150"/>
          <path class="vl-arrow" d="M300 166 C340 186, 360 186, 400 166"/>
          <rect class="vl-box2" x="402" y="140" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="430" y="162" text-anchor="middle">meu</text>
          <rect class="vl-box2" x="462" y="140" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="490" y="162" text-anchor="middle">fa</text>
          <text class="vl-res" x="580" y="164" text-anchor="middle">meuf</text>
          <text class="vl-note" x="320" y="198" text-anchor="middle">ek syllable: "-eu" sound jodo, badlo, phir ant hata do</text>

          <text class="vl-word" x="60" y="252" text-anchor="middle">fête</text>
          <rect class="vl-box" x="170" y="230" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="198" y="252" text-anchor="middle">fè</text>
          <rect class="vl-box" x="236" y="230" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="264" y="252" text-anchor="middle">teu</text>
          <path class="vl-arrow" d="M300 240 C340 220, 360 220, 400 240"/>
          <path class="vl-arrow" d="M300 256 C340 276, 360 276, 400 256"/>
          <rect class="vl-box2" x="402" y="230" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="430" y="252" text-anchor="middle">teu</text>
          <rect class="vl-box2" x="462" y="230" width="56" height="34" rx="8"/>
          <text class="vl-syl" x="490" y="252" text-anchor="middle">fè</text>
          <text class="vl-res" x="580" y="254" text-anchor="middle">teuf</text>
          <text class="vl-note" x="320" y="290" text-anchor="middle">party: une teuf</text>
        </svg>