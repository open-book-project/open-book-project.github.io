<svg viewBox="0 0 640 300" role="img" aria-label="Munh ki teen positions. i ke liye: hont failey, jeebh aage. u ke liye: hont gol, jeebh aage. ou ke liye: hont gol, jeebh peechhe." xmlns="http://www.w3.org/2000/svg"><title>u = i ki jeebh + ou ke hont. “ee” bolo, jeebh ko bilkul wahin rakho, phir hont ko ek chhote gole me gol karo jaise seeti bajane ke liye.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .lip { fill: var(--g-f); opacity: .85; }
        .hole { fill: var(--sheet); }
        .pal { fill: none; stroke: var(--line-strong); stroke-width: 3; stroke-linecap: round; }
        .tng { fill: var(--accent); }
        .t1 { font: 800 22px var(--font); fill: var(--text); }
        .t2 { font: 600 12px var(--font); fill: var(--text-soft); }
        .t3 { font: 700 12px var(--font); fill: var(--text); }
      </style></defs>
      <text class="t1" x="107" y="32" text-anchor="middle">i  [ee]</text>
      <text class="t1" x="320" y="32" text-anchor="middle">u  [ew]</text>
      <text class="t1" x="533" y="32" text-anchor="middle">ou  [oo]</text>
      <ellipse class="lip" cx="107" cy="80" rx="66" ry="16"/><ellipse class="hole" cx="107" cy="80" rx="54" ry="5"/>
      <ellipse class="lip" cx="320" cy="80" rx="28" ry="26"/><ellipse class="hole" cx="320" cy="80" rx="10" ry="10"/>
      <ellipse class="lip" cx="533" cy="80" rx="28" ry="26"/><ellipse class="hole" cx="533" cy="80" rx="10" ry="10"/>
      <text class="t2" x="107" y="128" text-anchor="middle">hont failey (smile)</text>
      <text class="t2" x="320" y="128" text-anchor="middle">hont gol, aage nikle hue</text>
      <text class="t2" x="533" y="128" text-anchor="middle">hont gol, aage nikle hue</text>
      <path class="pal" d="M30 180 Q107 140 184 180"/>
      <path class="tng" d="M30 250 Q50 172 100 182 Q150 192 184 250 Z"/>
      <path class="pal" d="M243 180 Q320 140 397 180"/>
      <path class="tng" d="M243 250 Q263 172 313 182 Q363 192 397 250 Z"/>
      <path class="pal" d="M456 180 Q533 140 610 180"/>
      <path class="tng" d="M456 250 Q500 230 540 190 Q580 170 610 250 Z"/>
      <text class="t3" x="107" y="276" text-anchor="middle">jeebh AAGE ←</text>
      <text class="t3" x="320" y="276" text-anchor="middle">jeebh AAGE ←</text>
      <text class="t3" x="533" y="276" text-anchor="middle">→ jeebh PEECHHE</text>
      <text class="t2" x="107" y="294" text-anchor="middle">(munh ka aage wala hissa baayein)</text>
    </svg>