<svg viewBox="0 0 640 300" role="img" aria-label="Je, tu, il aur ils ke around ek boot ki shape: in forms me spelling change hoti hai, jaise j'achète aur ils achètent. Boot ke bahar nous achetons aur vous achetez infinitive wali spelling hi rakhte hain." xmlns="http://www.w3.org/2000/svg"><title>Yahi boot acheter (è), appeler (ll), préférer (è) aur payer (i) par bhi chalta hai.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .bt { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
          .cel { font: 700 16px var(--font); fill: var(--text); }
          .chg { fill: var(--g-f); font-weight: 800; }
          .out { font: 700 16px var(--font); fill: var(--text-soft); }
          .ttl { font: 800 14px var(--font); fill: var(--text); }
          .nt { font: 500 12.5px var(--font); fill: var(--text-soft); }
        </style></defs>
        <text class="ttl" x="320" y="26" text-anchor="middle">acheter (kharidna)</text>
        <path class="bt" d="M60 46 H200 V176 H330 V270 H60 Z"/>
        <text class="cel" x="80" y="84">j’ach<tspan class="chg">è</tspan>te</text>
        <text class="cel" x="80" y="130">tu ach<tspan class="chg">è</tspan>tes</text>
        <text class="cel" x="80" y="176">il ach<tspan class="chg">è</tspan>te</text>
        <text class="cel" x="80" y="244">ils ach<tspan class="chg">è</tspan>tent</text>
        <text class="out" x="240" y="84">nous achetons</text>
        <text class="out" x="240" y="130">vous achetez</text>
        <text class="nt" x="380" y="210">Boot ke andar: ending silent hai,</text>
        <text class="nt" x="380" y="228">isliye stem badal jaata hai.</text>
        <text class="nt" x="380" y="254">Bahar: -ons / -ez sunai dete hain,</text>
        <text class="nt" x="380" y="272">isliye stem acheter jaisa rehta hai.</text>
      </svg>