<svg viewBox="0 0 640 360" role="img" aria-label="France ka schematic map jo region ke hisaab se bises ki lagbhag sankhya dikhata hai: Finistère me ek, Paris sameet zyadatar France me do, Montpellier, Provence, Drôme aur Ardèche ke aas-paas south ke kuch hisson me teen, aur Normandy, Loire area aur Nord jaise north aur west ke kuch hisson me chaar." xmlns="http://www.w3.org/2000/svg"><title>France me la bise ka ek schematic sketch. Seemayein dhundhli hain: do paas ke shehar, ya do families, alag tarah se kar sakte hain.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--g-pl:#7c3aed;--line-strong:#cfd6e2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
<defs><style>
.bz-land { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.bz-1 { fill: var(--g-pl); opacity: .5; }
.bz-3 { fill: var(--g-f); opacity: .42; }
.bz-4 { fill: var(--g-m); opacity: .42; }
.bz-n { font: 800 20px var(--font); fill: var(--text); }
.bz-city { fill: var(--text); }
.bz-c { font: 600 12px var(--font); fill: var(--text-soft); }
.bz-h { font: 800 16px var(--font); fill: var(--text); }
.bz-t { font: 600 13px var(--font); fill: var(--text); }
.bz-s { font: 500 12px var(--font); fill: var(--text-soft); }
.bz-k { stroke: var(--line-strong); stroke-width: 1; }
</style></defs>
