<svg viewBox="0 0 640 300" role="img" aria-label="Do columns: baayein neele me aam taur par masculine endings, daayein gulaabi me aam taur par feminine endings." xmlns="http://www.w3.org/2000/svg"><title>Ending sabse mazboot sanket hai. Har taraf ke paanch seekho, phir kuch jaal ratt lo.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--g-f:#db2777;--g-m:#2563eb;--line:#e3e7ef;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .colh { font: 800 15px var(--font); }
          .end { font: 800 16px var(--font); fill: var(--sheet); }
          .exm { font: 500 12.5px var(--font); fill: var(--text-soft); }
          .bm { fill: var(--g-m); } .bf { fill: var(--g-f); }
          .tm { fill: var(--g-m); } .tf { fill: var(--g-f); }
          .mid { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 4 5; }
        </style></defs>
        <text class="colh tm" x="160" y="30" text-anchor="middle">MASCULINE · le / un</text>
        <text class="colh tf" x="480" y="30" text-anchor="middle">FEMININE · la / une</text>
        <path class="mid" d="M320 45 V285"/>
        <rect class="bm" x="30" y="50" width="86" height="30" rx="15"/><text class="end" x="73" y="71" text-anchor="middle">-ment</text><text class="exm" x="128" y="70">le moment</text>
        <rect class="bm" x="30" y="92" width="86" height="30" rx="15"/><text class="end" x="73" y="113" text-anchor="middle">-age</text><text class="exm" x="128" y="112">le fromage</text>
        <rect class="bm" x="30" y="134" width="86" height="30" rx="15"/><text class="end" x="73" y="155" text-anchor="middle">-eau</text><text class="exm" x="128" y="154">le gâteau</text>
        <rect class="bm" x="30" y="176" width="86" height="30" rx="15"/><text class="end" x="73" y="197" text-anchor="middle">-isme</text><text class="exm" x="128" y="196">le tourisme</text>
        <rect class="bm" x="30" y="218" width="86" height="30" rx="15"/><text class="end" x="73" y="239" text-anchor="middle">-oir</text><text class="exm" x="128" y="238">le miroir</text>
        <rect class="bf" x="350" y="50" width="86" height="30" rx="15"/><text class="end" x="393" y="71" text-anchor="middle">-tion</text><text class="exm" x="448" y="70">la nation</text>
        <rect class="bf" x="350" y="92" width="86" height="30" rx="15"/><text class="end" x="393" y="113" text-anchor="middle">-té</text><text class="exm" x="448" y="112">la liberté</text>
        <rect class="bf" x="350" y="134" width="86" height="30" rx="15"/><text class="end" x="393" y="155" text-anchor="middle">-ette</text><text class="exm" x="448" y="154">la baguette</text>
        <rect class="bf" x="350" y="176" width="86" height="30" rx="15"/><text class="end" x="393" y="197" text-anchor="middle">-ence</text><text class="exm" x="448" y="196">la chance</text>
        <rect class="bf" x="350" y="218" width="86" height="30" rx="15"/><text class="end" x="393" y="239" text-anchor="middle">-ure</text><text class="exm" x="448" y="238">la voiture</text>
        <text class="exm" x="160" y="280" text-anchor="middle">jaal: la page, la plage, l’eau</text>
        <text class="exm" x="480" y="280" text-anchor="middle">jaal: l’été, le côté, le silence</text>
      </svg>