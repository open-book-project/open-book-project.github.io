<svg viewBox="0 0 640 250" role="img" aria-label="ne kitni baar rakha jaata hai, writing me hamesha se dosto ke beech lagbhag kabhi nahi tak: writing, news aur speeches, job interview, work meeting, dosto se baatein." xmlns="http://www.w3.org/2000/svg"><title>Situation jitni relaxed, ne utna kam sunai deta hai. Har jagah rakhna kabhi galat nahi hai — bas dosto ke beech thoda formal lagta hai.</title><style>svg{--accent:#ea580c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
        <defs><style>
          .ne-bg { fill: var(--canvas); }
          .ne-b { fill: var(--accent); }
          .ne-t { font: 700 13px var(--font); fill: var(--text); }
          .ne-s { font: 600 12px var(--font); fill: var(--text-soft); }
          .ne-h { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
        </style></defs>
        <text class="ne-h" x="10" y="20">“NE” KITNI BAAR RAKHA JAATA HAI? (mota andaza, exact figures nahi)</text>
        <text class="ne-t" x="10" y="54">Writing (emails, essays)</text>
        <rect class="ne-bg" x="230" y="40" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="40" width="380" height="20" rx="10"/>
        <text class="ne-s" x="230" y="76">hamesha</text>
        <text class="ne-t" x="10" y="104">News, speeches</text>
        <rect class="ne-bg" x="230" y="90" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="90" width="300" height="20" rx="10"/>
        <text class="ne-s" x="230" y="126">aksar</text>
        <text class="ne-t" x="10" y="154">Job interview</text>
        <rect class="ne-bg" x="230" y="140" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="140" width="190" height="20" rx="10"/>
        <text class="ne-s" x="230" y="176">kabhi-kabhi — mila-jula</text>
        <text class="ne-t" x="10" y="204">Dost, family, colleagues</text>
        <rect class="ne-bg" x="230" y="190" width="380" height="20" rx="10"/>
        <rect class="ne-b" x="230" y="190" width="30" height="20" rx="10"/>
        <text class="ne-s" x="230" y="226">lagbhag kabhi nahi</text>
      </svg>