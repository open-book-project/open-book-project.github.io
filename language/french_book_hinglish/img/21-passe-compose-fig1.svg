<svg viewBox="0 0 640 220" role="img" aria-label="Formula: subject plus present me avoir ya être plus past participle. Examples: j'ai mangé, elle est partie." xmlns="http://www.w3.org/2000/svg"><title>Subject ke baad do tukde. Helper person batata hai; participle meaning batata hai — aur être ke saath agreement bhi.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
      <defs><style>
        .pc-b { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
        .pc-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
        .pc-p { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
        .pc-h { font: 800 13px var(--font); fill: var(--text-soft); }
        .pc-w { font: 800 18px var(--font); fill: var(--text); }
        .pc-aw { font: 800 18px var(--font); fill: var(--accent); }
        .pc-pw { font: 800 18px var(--font); fill: var(--role-verb); }
        .pc-op { font: 800 22px var(--font); fill: var(--text-soft); }
      </style></defs>
      <text class="pc-h" x="95" y="26" text-anchor="middle">SUBJECT</text>
      <text class="pc-h" x="320" y="26" text-anchor="middle">AVOIR / ÊTRE (present)</text>
      <text class="pc-h" x="530" y="26" text-anchor="middle">PAST PARTICIPLE</text>
      <rect class="pc-b" x="30" y="40" width="130" height="60" rx="14"/>
      <text class="pc-w" x="95" y="78" text-anchor="middle">J’</text>
      <text class="pc-op" x="190" y="79" text-anchor="middle">+</text>
      <rect class="pc-a" x="220" y="40" width="200" height="60" rx="14"/>
      <text class="pc-aw" x="320" y="78" text-anchor="middle">ai</text>
      <text class="pc-op" x="450" y="79" text-anchor="middle">+</text>
      <rect class="pc-p" x="470" y="40" width="130" height="60" rx="14"/>
      <text class="pc-pw" x="535" y="78" text-anchor="middle">mangé</text>
      <rect class="pc-b" x="30" y="130" width="130" height="60" rx="14"/>
      <text class="pc-w" x="95" y="168" text-anchor="middle">Elle</text>
      <text class="pc-op" x="190" y="169" text-anchor="middle">+</text>
      <rect class="pc-a" x="220" y="130" width="200" height="60" rx="14"/>
      <text class="pc-aw" x="320" y="168" text-anchor="middle">est</text>
      <text class="pc-op" x="450" y="169" text-anchor="middle">+</text>
      <rect class="pc-p" x="470" y="130" width="130" height="60" rx="14"/>
      <text class="pc-pw" x="535" y="168" text-anchor="middle">partie</text>
    </svg>