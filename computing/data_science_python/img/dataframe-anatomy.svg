<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <!-- column labels -->
  <g fill="#fbefd5" stroke="#8a5a00" stroke-width="1.5">
    <rect x="160" y="60" width="110" height="34"/>
    <rect x="270" y="60" width="110" height="34"/>
    <rect x="380" y="60" width="110" height="34"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="bold">
    <text x="215" y="82">city</text><text x="325" y="82">product</text><text x="435" y="82">qty</text>
  </g>
  <!-- index -->
  <g fill="#dde6f3" stroke="#2b4c7e" stroke-width="1.5">
    <rect x="90" y="94" width="70" height="34"/>
    <rect x="90" y="128" width="70" height="34"/>
    <rect x="90" y="162" width="70" height="34"/>
    <rect x="90" y="196" width="70" height="34"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="125" y="116">101</text><text x="125" y="150">102</text><text x="125" y="184">103</text><text x="125" y="218">104</text>
  </g>
  <!-- values -->
  <g fill="#ffffff" stroke="#888888" stroke-width="1">
    <rect x="160" y="94" width="110" height="34"/><rect x="270" y="94" width="110" height="34"/><rect x="380" y="94" width="110" height="34" fill="#e3f1ef"/>
    <rect x="160" y="128" width="110" height="34"/><rect x="270" y="128" width="110" height="34"/><rect x="380" y="128" width="110" height="34" fill="#e3f1ef"/>
    <rect x="160" y="162" width="110" height="34"/><rect x="270" y="162" width="110" height="34"/><rect x="380" y="162" width="110" height="34" fill="#e3f1ef"/>
    <rect x="160" y="196" width="110" height="34"/><rect x="270" y="196" width="110" height="34"/><rect x="380" y="196" width="110" height="34" fill="#e3f1ef"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="215" y="116">Pune</text><text x="325" y="116">mango</text><text x="435" y="116">3</text>
    <text x="215" y="150">Delhi</text><text x="325" y="150">apple</text><text x="435" y="150">5</text>
    <text x="215" y="184">Pune</text><text x="325" y="184">banana</text><text x="435" y="184">12</text>
    <text x="215" y="218">Chennai</text><text x="325" y="218">mango</text><text x="435" y="218">2</text>
  </g>
  <rect x="378" y="58" width="114" height="174" fill="none" stroke="#1f5f5b" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- labels -->
  <g font-size="13">
    <text x="325" y="40" text-anchor="middle" fill="#8a5a00">column labels: df.columns</text>
    <text x="20" y="160" fill="#2b4c7e">row labels:</text>
    <text x="20" y="176" fill="#2b4c7e">df.index</text>
    <text x="510" y="130" fill="#1f5f5b">one column is a</text>
    <text x="510" y="146" fill="#1f5f5b">Series: df["qty"]</text>
    <text x="510" y="162" fill="#1f5f5b">(values + the index)</text>
    <text x="325" y="256" text-anchor="middle" fill="#444444">values: df.to_numpy(); each column has its own dtype</text>
    <text x="325" y="276" text-anchor="middle" fill="#444444">(here str, str and int64)</text>
  </g>
</svg>
