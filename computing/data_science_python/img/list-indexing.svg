<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" width="620" height="230" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect x="0" y="0" width="620" height="230" fill="#ffffff"/>
  <text x="20" y="28" fill="#1a1a1a" font-family="Consolas, Menlo, monospace">temps = [21.5, 23.0, 19.8, 25.1, 24.4, 22.7]</text>
  <g fill="#555555" font-size="13" text-anchor="middle">
    <text x="20" y="62" text-anchor="start">index</text>
    <text x="130" y="62">0</text><text x="210" y="62">1</text><text x="290" y="62">2</text>
    <text x="370" y="62">3</text><text x="450" y="62">4</text><text x="530" y="62">5</text>
  </g>
  <g stroke="#1f5f5b" stroke-width="2" fill="#e3f1ef">
    <rect x="90" y="72" width="80" height="44"/>
    <rect x="170" y="72" width="80" height="44" fill="#fbefd5"/>
    <rect x="250" y="72" width="80" height="44" fill="#fbefd5"/>
    <rect x="330" y="72" width="80" height="44" fill="#fbefd5"/>
    <rect x="410" y="72" width="80" height="44"/>
    <rect x="490" y="72" width="80" height="44"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="130" y="99">21.5</text><text x="210" y="99">23.0</text><text x="290" y="99">19.8</text>
    <text x="370" y="99">25.1</text><text x="450" y="99">24.4</text><text x="530" y="99">22.7</text>
  </g>
  <g fill="#555555" font-size="13" text-anchor="middle">
    <text x="20" y="138" text-anchor="start">negative</text>
    <text x="130" y="138">-6</text><text x="210" y="138">-5</text><text x="290" y="138">-4</text>
    <text x="370" y="138">-3</text><text x="450" y="138">-2</text><text x="530" y="138">-1</text>
  </g>
  <g stroke="#8a5a00" stroke-width="2" fill="none">
    <polyline points="170,160 170,170 410,170 410,160"/>
  </g>
  <g fill="#8a5a00" font-size="14" text-anchor="middle">
    <text x="290" y="192" font-family="Consolas, Menlo, monospace">temps[1:4]  gives  [23.0, 19.8, 25.1]</text>
    <text x="290" y="214" font-size="13">the slice starts at index 1 and stops before index 4</text>
  </g>
</svg>
