<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 300" width="770" height="300" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="770" height="300" fill="#ffffff"/>
  <g stroke="#1f5f5b" stroke-width="2" fill="#e3f1ef">
    <rect x="30" y="40" width="150" height="60" rx="10"/>
    <rect x="215" y="40" width="150" height="60" rx="10"/>
    <rect x="400" y="40" width="150" height="60" rx="10"/>
    <rect x="585" y="40" width="150" height="60" rx="10"/>
  </g>
  <g stroke="#8a5a00" stroke-width="2" fill="#fbefd5">
    <rect x="585" y="190" width="150" height="60" rx="10"/>
    <rect x="400" y="190" width="150" height="60" rx="10"/>
    <rect x="215" y="190" width="150" height="60" rx="10"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="105" y="66">1. Ask a</text><text x="105" y="86">question</text>
    <text x="290" y="66">2. Get the</text><text x="290" y="86">data</text>
    <text x="475" y="66">3. Clean and</text><text x="475" y="86">prepare</text>
    <text x="660" y="66">4. Explore and</text><text x="660" y="86">visualise</text>
    <text x="660" y="226">5. Model</text>
    <text x="475" y="226">6. Evaluate</text>
    <text x="290" y="216">7. Communicate</text><text x="290" y="236">and act</text>
  </g>
  <g stroke="#333333" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="180" y1="70" x2="213" y2="70"/>
    <line x1="365" y1="70" x2="398" y2="70"/>
    <line x1="550" y1="70" x2="583" y2="70"/>
    <line x1="660" y1="100" x2="660" y2="188"/>
    <line x1="585" y1="220" x2="552" y2="220"/>
    <line x1="400" y1="220" x2="367" y2="220"/>
    <polyline points="215,220 105,220 105,102"/>
  </g>
  <g stroke="#777777" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ah)">
    <line x1="475" y1="190" x2="475" y2="102"/>
  </g>
  <g fill="#444444" font-size="13" text-anchor="middle">
    <text x="105" y="270">new questions</text>
    <text x="545" y="150">back to the data</text>
    <text x="545" y="166">when results fail</text>
    <text x="385" y="24" font-size="14" fill="#1f5f5b">understanding the data</text>
    <text x="475" y="285" font-size="14" fill="#8a5a00">learning from the data and using what is learned</text>
  </g>
</svg>
